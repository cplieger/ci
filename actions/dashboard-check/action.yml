name: dashboard-check
description: >-
  Fail when a Grafana dashboard file is not a valid dashboard.grafana.app/v2
  resource meeting the dashboard standard: strict CUE vet against Grafana's
  pinned dashboard schema, element references, layout, fields Grafana 13.2
  does not render, datasource references, descriptions, no-value text,
  thresholds and prose, and every Prometheus query read by Prometheus's own
  PromQL parser after Grafana's variable substitution, with the query rules
  Q1 (no rate-like function over one $__interval), and, on an app's root
  dashboard, Q2 (every selector scoped to the instance, matched exactly as
  instance="$instance") and Q3 (no job, hostname or container matcher). A
  classic dashboard gets a notice and passes, unless the base revision's copy
  is already schema v2.

inputs:
  path:
    description: >-
      The dashboard file, relative to the repository root, or several separated
      by whitespace. Each is checked against its own base copy. A
      grafana-dashboard.json or grafana-dashboard-<suffix>.json at the root is
      an app dashboard and gets Q2 and Q3 as well as Q1; any other path gets Q1
      only.
    default: grafana-dashboard.json
  base-ref:
    description: >-
      The revision whose copy pins the dashboard identity. Empty or all zeros
      means no base. The default is the event's pull request base SHA, or the
      push's previous tip. GitHub leaves that SHA at the base branch's tip when
      the pull request opened, so on a checkout of the merge commit the base
      copy is read at the merge's first parent instead.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  token:
    description: A token that can read the repository contents.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"

    # hashFiles reads only the caller's workspace, and a `uses: cplieger/ci/...`
    # checkout of this action lies outside it, so install.sh computes the key.
    - name: Key the tools cache
      id: tools-key
      shell: bash
      run: |
        set -euo pipefail
        key=$(bash "${GITHUB_ACTION_PATH}/install.sh" --key)
        echo "key=${key}" >>"$GITHUB_OUTPUT"

    - name: Restore the tools
      id: tools-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dashboard-check
        key: dashboard-check-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-key.outputs.key }}

    # A restored directory is checked against every pin again, so a stale or
    # partial cache is rebuilt rather than trusted.
    - name: Install the tools
      shell: bash
      env:
        DASHBOARD_CHECK_TOOLS: ${{ runner.temp }}/dashboard-check
      run: |
        bash "${GITHUB_ACTION_PATH}/install.sh" "$DASHBOARD_CHECK_TOOLS" \
          || { echo "Dashboard check tools" >> /tmp/_ci_failures; exit 1; }

    # Saved before the check, so a dashboard that fails still leaves the next
    # run a built promql-check.
    - name: Save the tools
      if: ${{ steps.tools-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dashboard-check
        key: dashboard-check-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-key.outputs.key }}

    - name: Check the dashboard
      shell: bash
      env:
        DASHBOARD_PATH: ${{ inputs.path }}
        BASE_REF: ${{ inputs.base-ref }}
        EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        TOKEN: ${{ inputs.token }}
        DASHBOARD_CHECK_TOOLS: ${{ runner.temp }}/dashboard-check
      run: |
        bash "${GITHUB_ACTION_PATH}/check.sh" \
          || { echo "Dashboard check" >> /tmp/_ci_failures; exit 1; }
