name: git-cliff version
description: >-
  Install git-cliff and compute the next stable version from conventional
  commits, plus its dev-channel variant. Stable runs
  publish the next patch above the highest stable tag unless their range holds
  a pending promotion; dev builds and promotions take the next minor or, for a
  breaking range, the next major (the next minor below 1.0.0, where
  cliff-alpha reads a breaking change as a minor).

inputs:
  channel:
    description: "'dev' or 'stable'; decides which tags anchor the changed-path range (anchor_sha)."
    required: false
    default: stable
  exclude-paths:
    description: >-
      Newline-separated globs excluded from the root version compute (one
      `<dir>/**` per nested Go module lane). Ignored when `lane` is set.
    required: false
    default: ""
  lane:
    description: >-
      A nested Go module directory. Computes that lane's `<dir>/vX.Y.Z`
      version from the commits under it instead of the root version.
    required: false
    default: ""
  pending-version:
    description: >-
      Dev channel: the version of the lane's pending promotion
      (`compute.sh pending-version`), which dev builds number above. Empty
      when nothing is pending.
    required: false
    default: ""
  pending-in-range:
    description: >-
      Stable channel: 'true' when this run's range holds a pending
      promotion for the lane, so it publishes the promotion's version.
    required: false
    default: "false"

outputs:
  base:
    description: Next stable version from conventional commits (vX.Y.Z, or <lane>/vX.Y.Z).
    value: ${{ steps.compute.outputs.base }}
  dev_version:
    description: "`<base>-dev.<N>`, N being one more than the existing `<base>-dev.*` tags."
    value: ${{ steps.compute.outputs.dev_version }}
  latest:
    description: >-
      The highest stable tag of the lane over all refs; empty when there is
      none.
    value: ${{ steps.compute.outputs.latest }}
  anchor_sha:
    description: >-
      Commit of the newest reachable tag on the channel (any version tag on
      dev, stable tags only on stable); empty when there is none.
    value: ${{ steps.compute.outputs.anchor_sha }}
  version:
    description: Same as `base`.
    value: ${{ steps.compute.outputs.version }}
  release:
    description: "'true' when `base` differs from `latest`."
    value: ${{ steps.compute.outputs.release }}
  h_tag:
    description: The highest existing stable tag of the lane.
    value: ${{ steps.compute.outputs.h_tag }}
  range_from:
    description: >-
      The commit the change level was read from (`<it>..HEAD`),
      empty for the whole history or a repair run at a tagged commit.
    value: ${{ steps.compute.outputs.range_from }}
  change_level:
    description: Major, minor, patch or none over that range.
    value: ${{ steps.compute.outputs.change_level }}
  script:
    description: >-
      Path to compute.sh, for `bash <script> pending-version <commit> [lane]`
      in a later step of the same job (git-cliff stays installed).
    value: ${{ steps.compute.outputs.script }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        # Version + tarball sha256 pinned as a pair; Renovate maintains both
        # via the custom.git-cliff datasource (GitHub release-asset digest).
        # Fail-closed: a tarball that does not match the committed pin never
        # installs.
        # renovate: datasource=custom.git-cliff depName=orhun/git-cliff
        CLIFF_VERSION=v2.14.2
        CLIFF_SHA256=24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        curl -fsSL --retry 7 --retry-max-time 150 --retry-all-errors -o "$RUNNER_TEMP/git-cliff.tgz" \
          "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
        echo "${CLIFF_SHA256}  ${RUNNER_TEMP}/git-cliff.tgz" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/git-cliff.tgz" -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION#v}/git-cliff"

    - id: compute
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        LANE: ${{ inputs.lane }}
        PENDING_VERSION: ${{ inputs.pending-version }}
        PENDING_IN_RANGE: ${{ inputs.pending-in-range }}
        CLIFF_BIN: git-cliff
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/compute.sh"
        echo "script=$GITHUB_ACTION_PATH/compute.sh" >>"$GITHUB_OUTPUT"
