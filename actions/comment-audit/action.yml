name: comment-audit
description: >-
  Fail when production and test source carries more than 0.55 comment lines per
  code line, excluding documentation examples, configuration, and generated
  artifacts, or when a comment or Go test literal in a public repository names a
  private plan, review or design document.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"
    - name: Measure source comment ratio
      shell: bash
      run: |
        (
          python3 "${GITHUB_ACTION_PATH}/comment-audit.py" --check ratio --github
        ) || { echo "Comment ratio" >> /tmp/_ci_failures; exit 1; }
    # Runs whatever the ratio step answered, so one run reports both failures.
    - name: Refuse private pointers in comments
      if: ${{ success() || failure() }}
      shell: bash
      # An event whose payload has no repository object leaves REPOSITORY_PRIVATE
      # empty, and the script asks the REST API with GH_TOKEN instead.
      env:
        REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        GH_TOKEN: ${{ github.token }}
      run: |
        (
          python3 "${GITHUB_ACTION_PATH}/comment-audit.py" --check pointers --github
        ) || { echo "Private pointers" >> /tmp/_ci_failures; exit 1; }
