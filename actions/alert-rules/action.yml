name: alert-rules
description: >-
  Fail when a repository's alert rules do not check: promtool check rules on
  alerts/promql.yaml and promtool test rules on alerts/promql_test.yaml, a
  LogQL parse of a copy of alerts/logql.yaml, and an alert table in
  docs/monitoring.md that names exactly the alerts the rule files define.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"

    # alert-table.py reads the rule files; the set-up interpreter has no PyYAML.
    - name: Install PyYAML
      shell: bash
      run: |
        set -euo pipefail
        # renovate: datasource=pypi depName=PyYAML
        VERSION=6.0.3
        pip install -q --break-system-packages "PyYAML==${VERSION}"

    - name: Check the rule files
      shell: bash
      env:
        # renovate: datasource=github-releases depName=prometheus/prometheus
        PROMTOOL_VERSION: v3.16.0
        # renovate: datasource=github-releases depName=grafana/loki
        LOKITOOL_VERSION: v3.7.9
      run: |
        bash "${GITHUB_ACTION_PATH}/check.sh" \
          || { echo "Alert rules" >> /tmp/_ci_failures; exit 1; }

    - name: Check the alert table
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        python3 "${GITHUB_ACTION_PATH}/alert-table.py" \
          || { echo "Alert table" >> /tmp/_ci_failures; exit 1; }
