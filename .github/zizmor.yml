# zizmor configuration for this repo's own workflow audit (the meta ci.yaml
# `scripts` job runs `zizmor --no-online-audits .` as a soft-gated step).
# Every suppression below carries its rationale; anything NOT listed here is a
# real finding and fails the gate.

rules:
  unpinned-uses:
    config:
      policies:
        # Same-owner composite actions (cplieger/ci/actions/publish-badge) may
        # be tag-pinned: a brand-new action cannot know its own merge-commit
        # SHA in advance (chicken-and-egg), so it bootstraps as @v3 and
        # Renovate's pinDigest pass converts it to a SHA pin on its next sweep.
        # The tag is owner-controlled, so the moving-tag risk is self-contained.
        "cplieger/*": ref-pin
        # Everyone else stays hash-pinned (the repo standard).
        "*": hash-pin

  self-repository:
    ignore:
      # actionlint v1.7.12 rejects GitHub's `$/...` syntax. Keep the
      # workspace-relative form until actionlint supports the dedicated form;
      # remove this ignore with that actionlint bump.
      - ci.yaml
      - release.yaml
      - self-ci.yaml
      - self-codeql.yml
      # The workflows calling notify-failure.yaml.
      - audit.yaml
      - backfill-release-sbom-sigs.yaml
      - daily-security.yaml
      - ghcr-retention.yaml
      - move-major-tag.yaml
      - promote.yaml
      - rebuild-stale.yaml
      - release-maintenance.yaml
      - self-release.yaml
      - sync-hub-overviews.yaml
      - sync.yaml
      - trigger-renovate.yaml
      - weekly-bench.yaml
      - weekly-fuzz.yaml
      - weekly-gremlins.yaml
      - weekly-links.yaml
      - weekly-stryker.yaml

  secrets-inherit:
    ignore:
      # release.yaml forwards `secrets: inherit` to its OWN docker-release.yaml
      # via a local ./ ref — same repo, same trust domain. The only secrets in
      # play are DOCKERHUB_USERNAME/TOKEN, which docker-release genuinely needs.
      - release.yaml

  cache-poisoning:
    ignore:
      # docker-release's per-arch build jobs read/write `scope=<arch>` GHA
      # caches. GitHub's cache scoping already prevents a PR branch from
      # poisoning a long-lived branch's cache (branch caches are only readable
      # downstream), and release builds run from dev and main only.
      - docker-release.yaml

  adhoc-packages:
    ignore:
      # The scripts job installs its linters (ruff via pipx, yamllint via pip,
      # zizmor via pipx) at run time — each is version-pinned next to a
      # `# renovate:` comment, which is this repo's standard pinning pattern
      # (same class as the curl-installed binaries zizmor doesn't flag).
      - ci.yaml
      # ts-ci's deadset-ts install: one exact `# renovate:` npm pin, installed
      # with --ignore-scripts. zizmor reads no ignore comment inside a run block,
      # so this silences the rule for every step of ts-ci.yaml: review any new
      # ad-hoc install there by hand.
      - ts-ci.yaml
