name: Audit

# Daily cross-repo compliance audit. The merge-model checks read fields that
# the GitHub API only exposes to a CLASSIC PAT with the 'repo' scope — a
# fine-grained PAT does NOT serialize them, even with Administration:read.
# Set AUDIT_PAT to a classic 'repo'-scope PAT. Without it the audit aborts
# (exit 2) with a clear diagnostic rather than flagging every repo. The same
# classic 'repo' scope also reads repo webhooks, which the deploy-trigger
# webhook check needs; AUDIT_WEBHOOK_HOST supplies the orchestrator host for it
# (when unset, that one check is skipped rather than failing every repo).

on:
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC, after the other daily jobs
  workflow_dispatch:

permissions:
  contents: read

# Two runs filing at once could each create a repo's audit issue.
concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    # Room for one rate-limit wait (scripts/ghrest.py's max_wait) beside the reads.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Run cross-repo audit
        env:
          GH_TOKEN: ${{ secrets.AUDIT_PAT || github.token }}
          # Host of the self-hosted deploy-trigger orchestrator (private infra,
          # so it is a secret, not hardcoded in this public repo). When absent
          # the audit skips the per-repo webhook check instead of failing.
          AUDIT_WEBHOOK_HOST: ${{ secrets.AUDIT_WEBHOOK_HOST }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/audit.py --findings-out "$RUNNER_TEMP/audit-findings.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # A second step because the issues are written with CI_SCHEDULE while the
      # audit reads with AUDIT_PAT, and each token stays in its own step's env.
      # It runs after a red audit too: HARD findings are what it files.
      - name: File audit findings as issues
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
        run: |
          set -euo pipefail
          findings="$RUNNER_TEMP/audit-findings.json"
          if [ -f "$findings" ]; then
            python3 scripts/audit.py --file-issues "$findings"
          else
            echo "::notice::the audit stopped before grading and wrote no findings file, so no issue was opened, updated or closed"
          fi

  # `needs:` must list every other job in this workflow.
  notify:
    needs: audit
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
