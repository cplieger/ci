name: Go CI

# Reusable Go CI. Called by the meta ci.yaml's `go` job; consumers pin the
# meta workflow via `@<sha> # v2`.
# Profile is auto-detected: app-mode (deadcode, punused) activates when a
# `main` package exists. Dockerfile lint (hadolint) is NOT here: the meta
# ci.yaml dispatches shell-ci.yaml for every repo with a Dockerfile, and that
# is where hadolint runs. (fieldalignment is enforced by golangci-lint via
# `govet: enable-all` on non-test code — the synced .golangci.yaml excludes
# _test.go — not a standalone step.)

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to the go.mod that pins the Go version.
        type: string
        default: go.mod
      working-directory:
        description: Working directory for Go commands (e.g. 'web' for monorepos).
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Resolve profile
        id: profile
        run: |
          set -euo pipefail
          if go list -f '{{.Name}}' ./... 2>/dev/null | grep -qx main; then echo 'app=true' >> "$GITHUB_OUTPUT"; else echo 'app=false' >> "$GITHUB_OUTPUT"; fi

      - name: Install golangci-lint
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          VERSION=v2.13.1
          # install.sh downloads the release tarball from GitHub internally,
          # and that fetch intermittently returns HTTP 504. `curl --retry` only
          # covers downloading install.sh itself, not install.sh's own internal
          # download — so retry the whole install with exponential backoff.
          attempt=1
          max=5
          delay=5
          until curl -fsSL --retry 3 \
                  "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" \
                | sh -s -- -b /usr/local/bin "${VERSION}"; do
            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::golangci-lint install failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::golangci-lint install attempt ${attempt}/${max} failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Install tools
        run: |
          set -euo pipefail
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION=v1.7.0
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      # actionlint, zizmor and gitleaks are NOT installed here: they are
      # repo-wide checks with no Go dependency, and they run exactly once in the
      # meta ci.yaml `repo` job. They used to run here AND in shell-ci, so a
      # Docker+Go repo scanned the same tree twice.

      - name: Install app tools
        if: ${{ steps.profile.outputs.app == 'true' }}
        run: |
          set -euo pipefail
          # renovate: datasource=go depName=golang.org/x/tools
          XTOOLS_VERSION=v0.49.0
          go install "golang.org/x/tools/cmd/deadcode@${XTOOLS_VERSION}"
          # renovate: datasource=go depName=github.com/bep/punused
          PUNUSED_VERSION=v0.5.0
          go install "github.com/bep/punused@${PUNUSED_VERSION}"
          # punused drives an external gopls over LSP -- it links an LSP *client*
          # and shells out to the server -- so gopls is a hard runtime dependency
          # of the step below and has to be installed here. Its own module, hence
          # its own pin. GOTOOLCHAIN=auto only for this install: setup-go pins
          # GOTOOLCHAIN=local, and gopls tracks the Go release closely (v0.23.0
          # requires go 1.26.0), so a future Renovate bump requiring a newer Go
          # than a consumer's go.mod would fail the install. This repo has no Go
          # app, so its own CI never runs this step -- the break would surface
          # only after a tag propagated, in every consumer at once.
          # Do NOT name punused's LSP client library, nor the code-search vendor
          # it belongs to, anywhere in this file: gitleaks activates rules by
          # keyword presence, so that vendor's name turns every 40-hex action SHA
          # pin above into an access-token finding and fails the secret scan.
          # renovate: datasource=go depName=golang.org/x/tools/gopls
          GOPLS_VERSION=v0.23.0
          GOTOOLCHAIN=auto go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"

      # Soft-gate block: each step below runs to completion (continue-on-error)
      # and records its own name to /tmp/_ci_failures on failure; the final
      # "Check results" step fails the job if that file exists. CONTRACT: any
      # step added to this block MUST end with
      #   || { echo "<step name>" >> /tmp/_ci_failures; exit 1; }
      # or its failure is silently tolerated by continue-on-error.
      - name: Vet
        continue-on-error: true
        run: ( go vet ./... ) || { echo "vet" >> /tmp/_ci_failures; exit 1; }

      - name: Lint (golangci-lint)
        continue-on-error: true
        run: ( golangci-lint run --allow-parallel-runners --timeout=5m ./... ) || { echo "golangci-lint" >> /tmp/_ci_failures; exit 1; }

      - name: Test (race)
        continue-on-error: true
        run: ( go test -count=1 -race ./... ) || { echo "test" >> /tmp/_ci_failures; exit 1; }

      - name: Govulncheck
        continue-on-error: true
        run: ( govulncheck ./... ) || { echo "govulncheck" >> /tmp/_ci_failures; exit 1; }

      - name: Verify modules
        continue-on-error: true
        run: ( go mod verify ) || { echo "go mod verify" >> /tmp/_ci_failures; exit 1; }

      # Drift guard for wiregen-generated files (committed TS/Go emitted by a
      # `go run ./<gen>` command). Self-configuring: no-op unless the repo
      # actually has a generator that imports github.com/cplieger/wiregen.
      # Report-only: it regenerates into the runner's ephemeral tree and
      # fails if the committed output differs; it never writes back.
      - name: Wiregen drift
        continue-on-error: true
        run: |
          (
            # 1+3. Detect + dynamically discover generator entrypoints: any
            # `package main` directory that imports cplieger/wiregen.
            gens=$(grep -rlZ --include='*.go' 'cplieger/wiregen' . 2>/dev/null \
              | xargs -0 -r -n1 dirname | sort -u \
              | while IFS= read -r d; do
                  grep -qE '^package main$' "$d"/*.go 2>/dev/null && echo "$d" || true
                done) || true
            if [ -z "$gens" ]; then
              echo "wiregen: no generator command imports the library; skipping"
              exit 0
            fi
            # 2. Regenerate from the Go source of truth.
            for d in $gens; do
              echo "wiregen: go run ./$d"
              go run "./$d"
            done
            # Compare regenerated output against the committed tree
            # (catches modified + added files via the staged index).
            git add -A
            if ! git diff --cached --quiet; then
              echo "::error::wiregen output is stale; re-run the generator(s) above and commit the result"
              git --no-pager diff --cached --stat
              exit 1
            fi
            echo "wiregen: generated files up to date"
          ) || { echo "wiregen drift" >> /tmp/_ci_failures; exit 1; }

      - name: Dead code (deadcode)
        if: ${{ steps.profile.outputs.app == 'true' }}
        continue-on-error: true
        run: |
          (
            deadcode -test ./...
          ) || { echo "deadcode" >> /tmp/_ci_failures; exit 1; }

      # punused finds unused EXPORTED symbols. It has exactly one release, v0.5.0
      # (Jan 2022), so the pin is already latest and nothing below gets fixed
      # upstream. Read the PINNED tag's source, not the default branch: v0.5.0
      # caps a whole run at 30 SECONDS, where main.go on `main` says 2 minutes,
      # and that budget is why this step is shaped the way it is.
      #
      # Three behaviors of v0.5.0 dictate the invocation, all measured on the
      # fleet:
      #
      # 1. Its one optional argument is a gobwas glob of Go FILENAMES, compiled
      #    with no separator argument so `*` crosses `/`, matched against each
      #    file's module-relative path. The default is `**/*.go`, which requires
      #    a literal `/` and therefore never scans the module-root package --
      #    reported upstream as bep/punused#4. Worse, this step used to pass
      #    `./...`, which matches no file at all, so it reported clean fleet-wide
      #    without ever scanning a package.
      # 2. A run that exceeds the 30s context dies mid-read, and every later
      #    write fails with `close |1: file already closed`. Filtering that line
      #    (as this step used to) turns a truncated scan into a clean-looking
      #    one, so it is now an ESCALATION TRIGGER rather than noise: the
      #    directory is re-scanned one file at a time, where the budget is never
      #    in play. Measured: vibekit's internal/api takes 24-27s as one
      #    directory, i.e. it sits on the cliff edge and trips under load.
      #    That string is NOT unique to the timeout, which is why the gopls
      #    preflight below exists: punused prints the same line, instantly, for
      #    every input when it cannot reach gopls at all. Read as truncation it
      #    made a missing tool look like a fleet of files each blowing a 30s
      #    budget in 1ms, and fleet CI stayed red for 50 hours on that reading
      #    (2026-07-29 → 07-31). Check the cheap, unambiguous cause first and
      #    let the ambiguous message mean only what is left.
      # 3. run.go's handleFile does `symbols, err := DocumentSymbol(...)` and, on
      #    error, constructs an fmt.Errorf it never returns -- so a file whose
      #    symbol request fails is skipped with no message and no effect on the
      #    exit code. That one is undetectable from the output, which is the
      #    other reason to keep each request small: a single file is the least
      #    the tool can be asked to do. Accepted residual; it cannot be closed
      #    from outside the tool.
      #
      # Shards come from `git ls-files`, so untracked third-party Go is out of
      # scope. punused itself skips only dot-directories while walking, and a
      # `<dir>/*.go` glob still reaches deeper paths, hence the node_modules
      # filter (npm packages that ship a Go port, e.g. flatted).
      #
      # A finding is adjudicated once, in the repo's committed `.punused-ignore`
      # (module root; full-line `#` comments carry the reason). Entries match as
      # literal substrings of the finding line, so a file path silences a whole
      # generated file and a symbol signature silences one method. Never put
      # file:line:col in an entry -- line numbers shift and the entry goes stale.
      # An entry that matches nothing is reported as a stale warning, never a
      # failure: the scan is the thing that must not lie, and an under-reporting
      # scan would turn stale-entry detection into flaky red.
      - name: Unused exported symbols (punused)
        if: ${{ steps.profile.outputs.app == 'true' }}
        continue-on-error: true
        run: |
          (
            # Per-invocation temp files. A CI runner gets a private /tmp so a fixed
            # path was harmless there, but ci-local.sh replays this step on a
            # developer machine where several repos are linted at once (the
            # app-review skill runs concurrent reviews of different apps by
            # design). With a shared /tmp/_punused_raw those runs raced: one
            # repo's `: >` truncate landed between another's write and its read,
            # so repo A adjudicated repo B's findings against repo A's
            # .punused-ignore. Observed 2026-07: a knell run reported
            # seadex-scout's internal/anilist and internal/arrwalk symbols.
            praw="$(mktemp -t punused_raw.XXXXXX)"
            pshard="$(mktemp -t punused_shard.XXXXXX)"
            pfound="$(mktemp -t punused_found.XXXXXX)"
            trap 'rm -f "$praw" "$pshard" "$pfound"' EXIT
            truncated=0

            # Preflight: gopls is punused's LSP server, spawned per invocation.
            # Absent or unrunnable, every scan below fails identically to a
            # truncated run, so establish which world we are in before reading
            # that ambiguous signal as truncation.
            if ! gopls version >/dev/null 2>&1; then
              echo "::error::gopls is not runnable; punused cannot scan anything (it drives gopls over LSP). Install it in the app-tools step."
              exit 1
            fi

            # scan <glob> [split-target] -- run one shard, escalating on a
            # truncated run. `split-target` is the directory whose files get
            # re-scanned individually; empty means this IS a single file and
            # there is nothing left to split, so the scan is unreliable and the
            # step fails rather than reporting a number it cannot stand behind.
            scan() {
              punused "$1" > "$pshard" 2>&1 || true
              if grep -q 'file already closed' "$pshard"; then
                if [ -z "${2:-}" ]; then
                  echo "::error::punused died mid-scan on a single file ($1), which cannot be split further; this scan cannot be trusted."
                  echo "  gopls is known runnable (preflight passed), so its 30s budget is the likely cause. punused said: $(tr '\n' ' ' < "$pshard")"
                  truncated=1
                  return 0
                fi
                echo "::notice::punused truncated on $1; re-scanning its files individually"
                for pf in $(git ls-files "$2/*.go"); do
                  scan "$pf" ""
                done
                return 0
              fi
              grep -v 'file already closed' "$pshard" >> "$praw" || true
            }

            for sub in $(git ls-files '*.go' | xargs -r -n1 dirname | sort -u); do
              if [ "$sub" = "." ]; then
                for f in $(git ls-files '*.go' | grep -v /); do
                  scan "$f" ""
                done
              else
                scan "$sub/*.go" "$sub"
              fi
            done
            if [ "$truncated" -ne 0 ]; then exit 1; fi

            grep -v '/node_modules/' "$praw" | sort -u | grep . > "$pfound" || true

            pats=()
            reasons=0
            if [ -f .punused-ignore ]; then
              while IFS= read -r l; do
                case "$l" in
                  '#'*) reasons=$((reasons + 1)); continue ;;
                  '') continue ;;
                esac
                pats+=("$l")
              done < .punused-ignore
            fi
            echo "punused: $(grep -c . "$pfound" || true) findings, ${#pats[@]} ignore entries ($reasons comment lines)"

            used=()
            unexpected=0
            while IFS= read -r line; do
              hit=""
              for i in "${!pats[@]}"; do
                case "$line" in *"${pats[$i]}"*) hit=1; used[i]=1; break ;; esac
              done
              if [ -z "$hit" ]; then
                echo "::error::unused exported symbol: $line"
                unexpected=$((unexpected + 1))
              fi
            done < "$pfound"

            for i in "${!pats[@]}"; do
              if [ -z "${used[i]:-}" ]; then
                echo "::warning::stale .punused-ignore entry (matches nothing): ${pats[$i]}"
              fi
            done

            if [ "$unexpected" -gt 0 ]; then
              echo "::error::$unexpected unused exported symbol(s) not adjudicated."
              echo "Delete the symbol, wire it up, or add it to .punused-ignore with a reason comment."
              exit 1
            fi
          ) || { echo "punused" >> /tmp/_ci_failures; exit 1; }

      # PR-time dependency vulnerability review. Runs for libraries and apps
      # alike (a vulnerable dep in a library propagates to every consumer).
      # Hard step (no continue-on-error): a `uses:` step can't append to
      # /tmp/_ci_failures, so soft-gating it would silently tolerate its
      # failure. Public repos only — the dependency-review API needs the
      # dependency graph, which private repos on the free plan don't expose.
      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Check results
        if: always()
        run: |
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"
