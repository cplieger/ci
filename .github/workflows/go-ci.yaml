name: Go CI

# Reusable Go CI. Called by the meta ci.yaml's `go` job; consumers pin the
# meta workflow via `@<sha> # v2`.
# The profile sets deadset's target kind: `application` when a `main` package
# exists, `library` otherwise. Dockerfile lint (hadolint) is NOT here: the meta
# ci.yaml dispatches shell-ci.yaml for every repo with a Dockerfile, and that
# is where hadolint runs. (fieldalignment is enforced by golangci-lint via
# `govet: enable-all` on non-test code — the synced .golangci.yaml excludes
# _test.go — not a standalone step.)

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to the go.mod that pins the Go version.
        type: string
        default: go.mod
      working-directory:
        description: Working directory for Go commands (e.g. 'web' for monorepos).
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Resolve profile
        id: profile
        run: |
          set -euo pipefail
          if go list -f '{{.Name}}' ./... 2>/dev/null | grep -qx main; then echo 'app=true' >> "$GITHUB_OUTPUT"; else echo 'app=false' >> "$GITHUB_OUTPUT"; fi

      - name: Install golangci-lint
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          VERSION=v2.14.0
          # install.sh downloads the release tarball from GitHub internally,
          # and that fetch intermittently returns HTTP 504. `curl --retry` only
          # covers downloading install.sh itself, not install.sh's own internal
          # download — so retry the whole install with exponential backoff.
          attempt=1
          max=5
          delay=5
          until curl -fsSL --retry 3 \
                  "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" \
                | sh -s -- -b /usr/local/bin "${VERSION}"; do
            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::golangci-lint install failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::golangci-lint install attempt ${attempt}/${max} failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Install tools
        run: |
          set -euo pipefail
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION=v1.8.0
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # deadset refuses an analyzer whose report schema it does not accept
          # (exit 3), so a Contract major moves these two pins together, and
          # ts-ci.yaml pins the same deadset. GOTOOLCHAIN=auto because setup-go
          # pins GOTOOLCHAIN=local and either module may require a newer Go
          # than the consumer's go.mod.
          # renovate: datasource=go depName=github.com/cplieger/deadset
          DEADSET_VERSION=v1.11.0
          GOTOOLCHAIN=auto go install "github.com/cplieger/deadset/cmd/deadset@${DEADSET_VERSION}"
          # renovate: datasource=go depName=github.com/cplieger/deadset-go
          DEADSET_GO_VERSION=v1.26.0
          GOTOOLCHAIN=auto go install "github.com/cplieger/deadset-go/cmd/deadset-go@${DEADSET_GO_VERSION}"

      # actionlint, zizmor and gitleaks are NOT installed here: they are
      # repo-wide checks with no Go dependency, and they run exactly once in the
      # meta ci.yaml `repo` job. They used to run here AND in shell-ci, so a
      # Docker+Go repo scanned the same tree twice.

      # Soft-gate block: each step below runs to completion (continue-on-error)
      # and records its own name to /tmp/_ci_failures on failure; the final
      # "Check results" step fails the job if that file exists. CONTRACT: any
      # step added to this block MUST end with
      #   || { echo "<step name>" >> /tmp/_ci_failures; exit 1; }
      # or its failure is silently tolerated by continue-on-error.
      - name: Vet
        continue-on-error: true
        run: ( go vet ./... ) || { echo "vet" >> /tmp/_ci_failures; exit 1; }

      - name: Lint (golangci-lint)
        continue-on-error: true
        run: ( golangci-lint run --allow-parallel-runners --timeout=5m ./... ) || { echo "golangci-lint" >> /tmp/_ci_failures; exit 1; }

      - name: Test (race)
        continue-on-error: true
        run: ( go test -count=1 -race ./... ) || { echo "test" >> /tmp/_ci_failures; exit 1; }

      - name: Govulncheck
        continue-on-error: true
        run: ( govulncheck ./... ) || { echo "govulncheck" >> /tmp/_ci_failures; exit 1; }

      - name: Verify modules
        continue-on-error: true
        run: ( go mod verify ) || { echo "go mod verify" >> /tmp/_ci_failures; exit 1; }

      # Drift guard for wiregen-generated files (committed TS/Go emitted by a
      # `go run ./<gen>` command). Self-configuring: no-op unless the repo
      # actually has a generator that imports github.com/cplieger/wiregen.
      # Report-only: it regenerates into the runner's ephemeral tree and
      # fails if the committed output differs; it never writes back.
      #
      # `*.gen.*` is wiregen's own output naming (its writer emits
      # types/decoders/registry/constants/client.gen.ts; the endpoints emitter
      # adds a paths.gen.go), and it is used for two things here: deciding
      # whether the repo HAS generated output at all, and scoping the drift
      # diff. A generator that emits a differently-named file needs this
      # pathspec widened, or its drift goes unmeasured. The prune list matches
      # the meta ci.yaml's nested-module discovery: a golden fixture under
      # testdata/ is not shipped output, and treating it as such would fail the
      # wiregen library's own repo, which has fixtures and no generator.
      - name: Wiregen drift
        continue-on-error: true
        run: |
          (
            # 1+3. Detect + dynamically discover generator entrypoints: any
            # `package main` directory that imports cplieger/wiregen. The
            # package clause is matched with a trailing-token pattern, not
            # `^package main$`: an anchored end-of-line misses
            # `package main // wire codegen entry point`, so writing an
            # ordinary trailing comment used to disable this whole check
            # silently. `package mainly` and `package main_test` still do not
            # match.
            gens=$(grep -rlZ --include='*.go' 'cplieger/wiregen' . 2>/dev/null \
              | xargs -0 -r -n1 dirname | sort -u \
              | while IFS= read -r d; do
                  grep -qE '^package main([[:space:]]|$)' "$d"/*.go 2>/dev/null && echo "$d" || true
                done) || true
            genfiles=$(git ls-files '*.gen.*' \
              | grep -Ev '(^|/)(node_modules|vendor|testdata|static|dist)/' || true)
            if [ -z "$gens" ]; then
              # Tracked generated output with no generator to regenerate it is
              # the exact state this check exists to catch: the discovery above
              # is two greps, and either one can be defeated by an ordinary
              # edit (an import moved behind a helper package, a build tag).
              # Skipping there means the committed artifacts stop being
              # compared against their source of truth with nothing going red.
              # No generated files and no generator is the honest empty set and
              # still skips.
              if [ -n "$genfiles" ]; then
                echo "::error::wiregen: the repo tracks generated files but no generator command was discovered, so nothing regenerated them and this drift check measured nothing. Either a package main directory stopped importing github.com/cplieger/wiregen directly (check for the import moving behind a helper package or a build tag), or these files are no longer generated and should be deleted or renamed off the *.gen.* pattern."
                printf '%s\n' "$genfiles" | sed 's/^/  tracked generated file: /'
                exit 1
              fi
              echo "wiregen: no generator command imports the library and no generated files are tracked; skipping"
              exit 0
            fi
            # 2. Regenerate from the Go source of truth.
            for d in $gens; do
              echo "wiregen: go run ./$d"
              go run "./$d"
            done
            # Compare regenerated output against the committed tree
            # (catches modified + added files via the staged index). Scoped to
            # the generated-file pathspec, not the whole tree: an unscoped
            # `git add -A` reports any unrelated uncommitted edit as stale
            # generator output, naming files no generator ever wrote — noise in
            # CI only in theory (the checkout is clean) but a routine false
            # positive under the local ci-local mirror, which runs over the
            # working tree.
            git add -A -- '*.gen.*'
            if ! git diff --cached --quiet -- '*.gen.*'; then
              echo "::error::wiregen output is stale; re-run the generator(s) above and commit the result"
              git --no-pager diff --cached --stat -- '*.gen.*'
              exit 1
            fi
            echo "wiregen: generated files up to date ($(printf '%s\n' "$genfiles" | grep -c . || true) tracked)"
          ) || { echo "wiregen drift" >> /tmp/_ci_failures; exit 1; }

      # Exit 1 is findings, 2 a refused configuration, 3 no answer (an
      # analyzer missing, refused or failed). The module's own deadset.json
      # outranks the --central kind, which is how a repo overrides the profile.
      - name: Dead code (deadset)
        continue-on-error: true
        env:
          APP_PROFILE: ${{ steps.profile.outputs.app }}
        run: |
          (
            work="$(mktemp -d -t deadset.XXXXXX)" || exit 1
            trap 'rm -rf "$work"' EXIT
            kind=library
            if [ "$APP_PROFILE" = true ]; then kind=application; fi
            printf '{"target":{"kind":"%s"}}\n' "$kind" > "$work/central.json" || exit 1
            # deadset-go loads packages with GOPROXY=off, so it reads only the
            # module cache.
            go mod download || exit 1
            rc=0
            deadset analyze --target=. --languages=go \
              --central="$work/central.json" --run-dir="$work/run" || rc=$?
            case "$rc" in
              0) ;;
              1)
                echo "::error::deadset reported dead code, listed above. Delete it, wire it up, or adjudicate it with a deadset:ignore directive that names the code and the reason."
                exit 1
                ;;
              2)
                echo "::error::deadset refused the run (exit 2), so nothing was checked. The usage or configuration error is above."
                exit 1
                ;;
              3)
                echo "::error::deadset produced no answer (exit 3), so nothing was checked. An analyzer was missing, refused or failed, and its output is above."
                exit 1
                ;;
              127)
                echo "::error::deadset is not on PATH, so nothing was checked. scripts/install-local-tools.sh in cplieger/ci installs the pinned build."
                exit 1
                ;;
              *)
                echo "::error::deadset exited $rc, which is no verdict, so nothing was checked."
                exit 1
                ;;
            esac
          ) || { echo "deadset" >> /tmp/_ci_failures; exit 1; }

      # PR-time dependency vulnerability review. Runs for libraries and apps
      # alike (a vulnerable dep in a library propagates to every consumer).
      # Hard step (no continue-on-error): a `uses:` step can't append to
      # /tmp/_ci_failures, so soft-gating it would silently tolerate its
      # failure. Public repos only — the dependency-review API needs the
      # dependency graph, which private repos on the free plan don't expose.
      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Check results
        if: always()
        run: |
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"
