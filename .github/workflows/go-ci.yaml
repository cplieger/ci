name: Go CI

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to the go.mod that pins the Go version.
        type: string
        default: go.mod
      working-directory:
        description: Working directory for Go commands (e.g. 'web' for monorepos).
        type: string
        default: '.'
      runner:
        description: >-
          The runner label for the job, such as a self-hosted pool's; empty runs it
          on ubuntu-26.04. `go test -race` needs a C compiler on the runner.
        type: string
        default: ''
      go-test-timeout:
        description: >-
          The `-timeout` of the race tests and the noui tests, a Go duration such as
          `20m`, for a module whose test binaries run longer than the go command's
          default; empty keeps that default of 10 minutes per test binary.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    # A module builds against the versions its go.mod names, as its consumers do;
    # ci.yaml's go-work job tests the modules' heads together.
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # Every later step reads the workspace as the repository's own.
      - name: Move the ci source out of the workspace
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.cplieger-ci" "$RUNNER_TEMP/cplieger-ci"

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Install golangci-lint
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
        run: |
          set -euo pipefail
          . "$CI_TOOLS/gha-log.sh"
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          VERSION=v2.15.0
          bin="$RUNNER_TEMP/bin"
          # install.sh downloads the release tarball from GitHub internally,
          # and that fetch intermittently returns HTTP 504. `curl --retry` only
          # covers downloading install.sh itself, not install.sh's own internal
          # download — so retry the whole install with exponential backoff.
          attempt=1
          max=5
          delay=5
          until curl -fsSL --retry 3 \
                  "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" \
                | sh -s -- -b "${bin}" "${VERSION}"; do
            if [ "${attempt}" -ge "${max}" ]; then
              gha_annotate error 'golangci-lint install failed after %s attempts' "${max}"
              exit 1
            fi
            gha_annotate warning 'golangci-lint install attempt %s/%s failed, so it is retried in %ss' "${attempt}" "${max}" "${delay}"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Install tools
        run: |
          set -euo pipefail
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION=v1.10.0
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      # Soft-gate block: each step below runs to completion (continue-on-error)
      # and the final "Check results" step fails the job on any step's failed
      # outcome. CONTRACT (scripts/test_soft_gate.py): a step added here has an
      # `id`, without which its outcome is invisible, and ends with
      #   || { echo "<step name>" >> /tmp/_ci_failures; exit 1; }
      # to name the failure in the log.
      - name: Vet
        id: vet
        continue-on-error: true
        run: ( go vet ./... ) || { echo "vet" >> /tmp/_ci_failures; exit 1; }

      - name: Lint (golangci-lint)
        id: lint-golangci-lint
        continue-on-error: true
        run: ( golangci-lint run --allow-parallel-runners --timeout=5m ./... ) || { echo "golangci-lint" >> /tmp/_ci_failures; exit 1; }

      - name: Test (race)
        id: test-race
        continue-on-error: true
        env:
          GO_TEST_TIMEOUT: ${{ inputs.go-test-timeout }}
        run: ( go test -count=1 -race ${GO_TEST_TIMEOUT:+"-timeout=$GO_TEST_TIMEOUT"} ./... ) || { echo "test" >> /tmp/_ci_failures; exit 1; }

      # Files only the `noui` build compiles are not in the race run above.
      # They run here without -race, because a second race run can put a large
      # module past the job's 30 minutes. Go's own file selection decides
      # whether the tag changes the build: a constraint on any source file moves
      # it into or out of go list's ignored lists.
      # errexit is off left of the `||`. scripts/test_go_noui.py runs this body.
      - name: Test (noui)
        id: test-noui
        continue-on-error: true
        env:
          GO_TEST_TIMEOUT: ${{ inputs.go-test-timeout }}
        run: |
          (
            files='{{.ImportPath}}:{{range .IgnoredGoFiles}} {{.}}{{end}}{{range .IgnoredOtherFiles}} {{.}}{{end}}'
            plain=$(go list -e -f "$files" ./...) && tagged=$(go list -e -tags noui -f "$files" ./...) \
              || { echo "::error::noui: go list could not list this module's packages"; exit 1; }
            if [ "$plain" = "$tagged" ]; then
              echo "noui: the noui build tag changes no file of this module; skipping"
              exit 0
            fi
            echo "noui: the noui build tag changes the files these packages leave out (< without it, > with it):"
            diff <(printf '%s\n' "$plain") <(printf '%s\n' "$tagged") | grep '^[<>]'
            go vet -tags noui ./... \
              && golangci-lint run --allow-parallel-runners --timeout=5m --build-tags=noui ./... \
              && go test -count=1 -tags noui ${GO_TEST_TIMEOUT:+"-timeout=$GO_TEST_TIMEOUT"} ./...
          ) || { echo "noui" >> /tmp/_ci_failures; exit 1; }

      - name: Govulncheck
        id: govulncheck
        continue-on-error: true
        run: ( govulncheck ./... ) || { echo "govulncheck" >> /tmp/_ci_failures; exit 1; }

      - name: Verify modules
        id: verify-modules
        continue-on-error: true
        run: ( go mod verify ) || { echo "go mod verify" >> /tmp/_ci_failures; exit 1; }

      # Regenerates wiregen output in the runner's tree and fails when the
      # committed files differ; a repository with no wiregen generator no-ops.
      # `*.gen.*` is wiregen's output naming and scopes both the presence test and
      # the diff, so a generator emitting another name goes unmeasured. Discovery
      # is per module: each generator runs from its nearest go.mod's directory.
      # Discovery prunes testdata, fixtures, node_modules and vendor; the presence
      # list also prunes static and dist (a corpus can hold Buf's buf.gen.yaml);
      # the diff covers every `*.gen.*`. scripts/test-wiregen-drift.sh runs this body.
      - name: Wiregen drift
        id: wiregen-drift
        continue-on-error: true
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
        run: |
          (
            . "$CI_TOOLS/gha-log.sh"
            # go-nested gives a fixture module its own job, where the prune
            # below cannot match an ancestor of the job's directory.
            case $(git rev-parse --show-prefix) in
              fixtures/* | */fixtures/* | testdata/* | */testdata/* | node_modules/* | */node_modules/* | vendor/* | */vendor/*)
                echo "wiregen: this module is a fixture; skipping"
                exit 0
                ;;
            esac
            # `package main // comment` is legal, so the clause match takes a
            # trailing token; `package mainly` and `main_test` still do not match.
            # Both import paths: main branches keep the standalone module until
            # their promotion, dev branches import it from cplieger/go. A test
            # file's import never makes its package a generator: a root
            # `package main` that imports wiregen only from a _test.go is the
            # app, and running it starts the app.
            gens=$(find . \( -name .git -o -name node_modules -o -name vendor -o -name testdata -o -name fixtures \) -prune \
                -o -type f -name '*.go' ! -name '*_test.go' -print0 2>/dev/null \
              | xargs -0 -r grep -lZE 'cplieger/(go/)?wiregen' 2>/dev/null \
              | xargs -0 -r -n1 dirname | sort -u \
              | while IFS= read -r d; do
                  grep -qE '^package main([[:space:]]|$)' "$d"/*.go 2>/dev/null && echo "$d" || true
                done) || true
            genfiles=$(git ls-files '*.gen.*' \
              | grep -Ev '(^|/)(node_modules|vendor|testdata|fixtures|static|dist)/' || true)
            if [ -z "$gens" ]; then
              # Tracked generated output with no generator to regenerate it is
              # the exact state this check exists to catch: the discovery above
              # is two text matches, either defeated by an ordinary
              # edit (an import moved behind a helper package, a build tag).
              # Skipping there means the committed artifacts stop being
              # compared against their source of truth with nothing going red.
              # No generated files and no generator is the honest empty set and
              # still skips.
              if [ -n "$genfiles" ]; then
                echo "::error::wiregen: the repo tracks generated files but no generator command was discovered, so nothing regenerated them and this drift check measured nothing. Either a package main directory stopped importing github.com/cplieger/go/wiregen (or github.com/cplieger/wiregen) directly (check for the import moving behind a helper package or a build tag), or these files are no longer generated and should be deleted or renamed off the *.gen.* pattern."
                printf '%s\n' "$genfiles" | sed 's/^/  tracked generated file: /'
                exit 1
              fi
              echo "wiregen: no generator command imports the library and no generated files are tracked; skipping"
              exit 0
            fi
            # A nested module (one keeping wiregen out of its importers' module
            # graph) builds only from its own root, and its go directive may be
            # ahead of the toolchain setup-go pinned with GOTOOLCHAIN=local. The
            # explicit exits are needed because errexit is off left of the `||`
            # below, and a step that never ran or staged leaves its committed
            # output looking up to date.
            while IFS= read -r -u3 d; do
              m=$d
              while [ "$m" != . ] && [ ! -f "$m/go.mod" ]; do m=$(dirname "$m"); done
              pkg=.${d#"$m"}
              echo "wiregen: go -C $m run $pkg"
              GOTOOLCHAIN=auto go -C "$m" run "$pkg" || { gha_annotate error 'wiregen: the generator %s failed in the module at %s' "$d" "$m"; exit 1; }
            done 3<<<"$gens"
            # Compare regenerated output against the committed tree
            # (catches modified + added files via the staged index). Scoped to
            # the generated-file pathspec, not the whole tree: an unscoped
            # `git add -A` would report any unrelated uncommitted edit as stale
            # generator output, naming files no generator ever wrote. A pathspec
            # matching nothing makes `git add` fail, hence the guard.
            if [ -n "$(git ls-files -- '*.gen.*')$(git ls-files -o --exclude-standard -- '*.gen.*')" ]; then
              git add -A -- '*.gen.*' || exit 1
            fi
            if ! git diff --cached --quiet -- '*.gen.*'; then
              echo "::error::wiregen output is stale; re-run the generator(s) above and commit the result"
              git --no-pager diff --cached --stat -- '*.gen.*'
              exit 1
            fi
            echo "wiregen: generated files up to date ($(printf '%s\n' "$genfiles" | grep -c . || true) tracked)"
          ) || { echo "wiregen drift" >> /tmp/_ci_failures; exit 1; }

      # PR-time dependency vulnerability review. Runs for libraries and apps
      # alike (a vulnerable dep in a library propagates to every consumer).
      # A `uses:` step can't append to /tmp/_ci_failures, so the retry is the
      # hard step: the first attempt's continue-on-error only buys the second
      # one, for the API's intermittent "The request is taking too long to
      # process". Public repos only — the dependency-review API needs the
      # dependency graph, which private repos on the free plan don't expose.
      - name: Dependency review
        id: dependency-review-attempt
        if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
        continue-on-error: true
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Wait before retrying dependency review
        if: ${{ steps.dependency-review-attempt.outcome == 'failure' }}
        run: sleep 30

      - name: Dependency review (retry)
        if: ${{ steps.dependency-review-attempt.outcome == 'failure' }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      # A soft step's outcome is checked as well as its marker: a step killed
      # whole (the OOM killer takes its shell with the test) writes none. A
      # step whose id ends in -attempt is retried by a later step.
      - name: Check results
        if: always()
        env:
          # One `<id> <outcome>` line per soft step: never toJSON(steps), whose
          # step outputs can pass the kernel's 128 KiB limit for one variable.
          STEP_OUTCOMES: |
            vet ${{ steps.vet.outcome }}
            lint-golangci-lint ${{ steps.lint-golangci-lint.outcome }}
            test-race ${{ steps.test-race.outcome }}
            test-noui ${{ steps.test-noui.outcome }}
            govulncheck ${{ steps.govulncheck.outcome }}
            verify-modules ${{ steps.verify-modules.outcome }}
            wiregen-drift ${{ steps.wiregen-drift.outcome }}
        run: |
          set -euo pipefail
          failures="/tmp/_ci_failures"
          awk '$2 == "failure" { print "step " $1 }' <<<"$STEP_OUTCOMES" >> "$failures"
          if [ -s "$failures" ]; then
            echo "::error::Failed validation steps:"
            sort -u "$failures" >&2
            exit 1
          fi
          echo "All validation steps passed"
