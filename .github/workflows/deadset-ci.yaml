name: Dead code (deadset)

# One deadset analysis of a target root, in the languages deadset's census
# (`deadset print-languages`) puts in scope there.

on:
  workflow_call:
    inputs:
      target:
        description: The analyzed root, relative to the repository root.
        type: string
        default: '.'
      repository:
        description: Another public repository to analyze instead of the caller's (the canary).
        type: string
        default: ''
      ref:
        description: The commit of `repository` to analyze.
        type: string
        default: ''
      exit-code:
        description: deadset's --exit-code, `on` or `off`.
        type: string
        default: 'on'

permissions:
  contents: read

# deadset refuses an analyzer whose report schema it does not accept (exit 3),
# so these pins only work as a set: the meta ci.yaml's deadset-canary job runs
# this workflow over fixed repositories to prove each set before it ships.
env:
  # renovate: datasource=go depName=github.com/cplieger/deadset/v2
  DEADSET_VERSION: v2.0.0-dev.31
  # renovate: datasource=go depName=github.com/cplieger/deadset-go/v2
  DEADSET_GO_VERSION: v2.0.0-dev.36
  # renovate: datasource=npm depName=@cplieger/deadset-ts
  DEADSET_TS_VERSION: 8.0.0-dev.16

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # A nested module's central file names go alone, because deadset-ts at
      # the root already reads every tsconfig under it; its deadset.json still
      # outranks the central file.
      - name: Resolve target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/deadset.XXXXXX")"
          kind=library
          if [ -f Dockerfile ]; then kind=application; fi
          central_languages='[]'
          if [ "$TARGET" != . ]; then central_languages='["go"]'; fi
          jq -n --arg kind "$kind" --argjson languages "$central_languages" \
            '{target: {kind: $kind}} + if $languages == [] then {} else {analysis: {languages: $languages}} end' \
            > "$work/central.json"
          prefix=""
          if [ "$TARGET" != . ]; then prefix="$TARGET/"; fi
          go_mod=false
          go_sum=""
          if [ -f go.mod ]; then
            go_mod=true
            if [ -f go.sum ]; then go_sum="${prefix}go.sum"; fi
          fi
          {
            echo "work=$work"
            echo "go_mod=$go_mod"
            echo "go_sum=$go_sum"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ steps.target.outputs.go_mod == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.target }}/go.mod
          cache: ${{ steps.target.outputs.go_sum != '' }}
          cache-dependency-path: ${{ steps.target.outputs.go_sum }}

      - name: Setup Go (deadset only)
        if: ${{ steps.target.outputs.go_mod != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # setup-go exports GOTOOLCHAIN=local, and deadset and deadset-go may need
      # a newer Go than the target's go.mod or the `stable` manifest names.
      # The go command never retries a module proxy fetch, and proxy.golang.org
      # intermittently resets a download stream (HTTP/2 INTERNAL_ERROR).
      - name: Install deadset
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 max=4 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::$* failed after ${max} attempts"
                return 1
              fi
              echo "::warning::$* attempt ${attempt}/${max} failed; retrying in ${delay}s"
              sleep "${RETRY_SLEEP:-$delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          export GOTOOLCHAIN=auto
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          retry go install "github.com/cplieger/deadset/v2/cmd/deadset@${DEADSET_VERSION}"

      # The census is the plan `deadset analyze` makes from the same flags, so
      # the job installs exactly the analyzers that run invokes. Its
      # no-program failure is deadset's answer that the target holds no
      # program; any other failure fails the job, never reads as no languages.
      - name: Languages in scope (deadset)
        id: census
        env:
          TARGET: ${{ inputs.target }}
          WORK: ${{ steps.target.outputs.work }}
        run: |
          set -euo pipefail
          rc=0
          deadset print-languages --target=. --central="$WORK/central.json" \
            > "$WORK/census.json" 2> "$WORK/census.err" || rc=$?
          cat "$WORK/census.err" >&2
          if [ "$rc" -eq 3 ] && grep -q '^setup failure: no-program: ' "$WORK/census.err"; then
            echo "::notice::deadset finds no program at $TARGET, so there is nothing to check."
            echo "analyze=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::deadset print-languages exited $rc, so the languages in scope at $TARGET are unknown and nothing was checked. Its error is above."
            exit 1
          fi
          analyzers="$(jq -er '.analyzers | select(length > 0) | map(.name) | join(",")' "$WORK/census.json")" || {
            echo "::error::deadset print-languages wrote no census naming its analyzers, so nothing was checked."
            exit 1
          }
          from() {
            jq -r --arg language "$1" '.languages[] | select(.language == $language) | .provenance' "$WORK/census.json"
          }
          echo "analysis.languages $(jq -r '[.languages[] | "\(.language) (\(.provenance))"] | join(", ")' "$WORK/census.json"); analyzers $analyzers"
          go=false
          ts=false
          IFS=, read -ra names <<< "$analyzers"
          for name in "${names[@]}"; do
            case "$name" in
              deadset-go) go=true ;;
              deadset-ts) ts=true ;;
              *)
                echo "::error::deadset would run the analyzer $name at $TARGET, and this check installs only deadset-go and deadset-ts. Leave providers.analyzers out of deadset.json."
                exit 1
                ;;
            esac
          done
          # With no go.mod at the target, deadset-go analyzes every module below
          # it in one report, skipping the directories its `./...` skips.
          go_dirs=()
          if [ "$go" = true ] && [ -f go.mod ]; then
            go_dirs=(.)
          elif [ "$go" = true ]; then
            while IFS= read -r file; do
              case "/$file" in
                */node_modules/* | */testdata/* | */vendor/* | */.*/* | */_*/*) continue ;;
              esac
              go_dirs+=("$(dirname "$file")")
            done < <(git ls-files -- ':(glob)**/go.mod')
          fi
          # JavaScript with no package.json, such as a node script, has nothing
          # to install.
          npm_dirs=()
          manifests=0
          while IFS= read -r file; do
            case "/$file" in
              */node_modules/* | */testdata/* | */vendor/* | */.*/*) continue ;;
              */package.json) manifests=$((manifests + 1)) ;;
              *) if [ "$ts" = true ]; then npm_dirs+=("$(dirname "$file")"); fi ;;
            esac
          done < <(git ls-files -- ':(glob)**/package-lock.json' ':(glob)**/package.json')
          if [ "$ts" = true ] && [ "$manifests" -gt 0 ] && [ "${#npm_dirs[@]}" -eq 0 ]; then
            echo "::error::TypeScript is in scope at $TARGET ($(from ts)), but no package-lock.json is tracked under it, so its dependencies cannot be installed for deadset-ts. Commit the lockfile, or add a root deadset.json whose analysis.languages leaves ts out."
            exit 1
          fi
          prefix=""
          if [ "$TARGET" != . ]; then prefix="$TARGET/"; fi
          {
            echo "analyze=true"
            echo "go=$go"
            echo "ts=$ts"
            echo "go_dirs<<GO_DIRS_END"
            for d in "${go_dirs[@]}"; do printf '%s\n' "$d"; done
            echo "GO_DIRS_END"
            echo "npm_dirs<<NPM_DIRS_END"
            for d in "${npm_dirs[@]}"; do printf '%s\n' "$d"; done
            echo "NPM_DIRS_END"
            echo "lockfiles<<LOCKFILES_END"
            for d in "${npm_dirs[@]}"; do
              if [ "$d" = . ]; then
                printf '%spackage-lock.json\n' "$prefix"
              else
                printf '%s%s/package-lock.json\n' "$prefix" "$d"
              fi
            done
            echo "LOCKFILES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: ${{ steps.census.outputs.ts == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          # setup-node throws on a cache with no lockfile:
          # https://github.com/actions/setup-node/blob/949feb2413d6458794dcd2491c4babbbce0c15c1/src/cache-restore.ts#L84-L87
          cache: ${{ steps.census.outputs.lockfiles != '' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.census.outputs.lockfiles }}

      # deadset-go loads packages with GOPROXY=off, and deadset-ts resolves
      # imports through each project's node_modules.
      - name: Install analyzers and dependencies
        if: ${{ steps.census.outputs.analyze == 'true' }}
        env:
          GO: ${{ steps.census.outputs.go }}
          TS: ${{ steps.census.outputs.ts }}
          GO_DIRS: ${{ steps.census.outputs.go_dirs }}
          NPM_DIRS: ${{ steps.census.outputs.npm_dirs }}
        run: |
          set -euo pipefail
          # Install deadset's retry, for the same proxy resets.
          retry() {
            local attempt=1 max=4 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::$* failed after ${max} attempts"
                return 1
              fi
              echo "::warning::$* attempt ${attempt}/${max} failed; retrying in ${delay}s"
              sleep "${RETRY_SLEEP:-$delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          if [ "$GO" = true ]; then
            retry go install "github.com/cplieger/deadset-go/v2/cmd/deadset-go@${DEADSET_GO_VERSION}"
            while IFS= read -r dir; do
              if [ -z "$dir" ]; then continue; fi
              (cd "$dir" && retry go mod download)
            done < <(printf '%s\n' "$GO_DIRS")
          fi
          if [ "$TS" = true ]; then
            npm install --global --ignore-scripts --no-audit --no-fund \
              "@cplieger/deadset-ts@${DEADSET_TS_VERSION}"
          fi
          while IFS= read -r dir; do
            if [ -z "$dir" ]; then continue; fi
            echo "npm ci in $dir"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
          done < <(printf '%s\n' "$NPM_DIRS")

      # deadset reads deadset.json, deadset-ignore.json, deadset-baseline.json
      # and deadset-edges.json at the target root only.
      # Flags outrank deadset.json, so --formats, which the SARIF upload
      # needs, is the one key a repository cannot set; any other flag would
      # take a key from it.
      - name: Dead code (deadset)
        if: ${{ steps.census.outputs.analyze == 'true' }}
        env:
          TARGET: ${{ inputs.target }}
          EXIT_CODE: ${{ inputs.exit-code }}
          WORK: ${{ steps.target.outputs.work }}
          NPM_DIRS: ${{ steps.census.outputs.npm_dirs }}
        run: |
          set -euo pipefail
          misplaced=0
          while IFS= read -r dir; do
            if [ -z "$dir" ] || [ "$dir" = . ]; then continue; fi
            for name in deadset.json deadset-ignore.json deadset-baseline.json deadset-edges.json; do
              if [ -n "$(git ls-files -- "$dir/$name")" ]; then
                rel="$dir/$name"
                if [ "$TARGET" != . ]; then rel="$TARGET/$rel"; fi
                echo "::error file=$rel::$rel is never read: deadset reads $name at the target root, $TARGET, only. Move it there and make its paths relative to that root."
                misplaced=1
              fi
            done
          done < <(printf '%s\n' "$NPM_DIRS")
          deadset print-config --target=. --central="$WORK/central.json" \
            | jq -r '"target.kind \(.target.kind) (\(.provenance["target.kind"]))"' \
            || true
          rc=0
          deadset analyze --target=. --central="$WORK/central.json" --run-dir="$WORK/run" \
            --formats=text,sarif --exit-code="$EXIT_CODE" || rc=$?
          if { [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; } && [ ! -s "$WORK/run/report.json.sarif" ]; then
            echo "::error::deadset exited $rc but wrote no SARIF report to $WORK/run/report.json.sarif, though --formats=text,sarif asked for one, so its findings cannot reach code scanning."
            exit 1
          fi
          case "$rc" in
            0) ;;
            1)
              echo "::error::deadset reported dead code, listed above. Delete it, wire it up, or adjudicate it with a deadset:ignore directive that names the code and the reason."
              exit 1
              ;;
            2)
              echo "::error::deadset refused the run (exit 2), so nothing was checked. The usage or configuration error is above."
              exit 1
              ;;
            3)
              echo "::error::deadset produced no answer (exit 3), so nothing was checked. The class line above names the cause: a setup failure is fixed in the repository, a run failure in the install or the tools."
              exit 1
              ;;
            4)
              echo "::error::deadset left a cross-language finding pending (exit 4): a deadset-edges.json edge names a side no analyzer in this run reported, so the finding was neither confirmed nor cleared. Check that analysis.languages holds every language the edge spans."
              exit 1
              ;;
            127)
              echo "::error::deadset is not on PATH, so nothing was checked. Check the Install deadset step above, which installs the pinned build."
              exit 1
              ;;
            *)
              echo "::error::deadset exited $rc, which is no verdict, so nothing was checked."
              exit 1
              ;;
          esac
          if [ "$misplaced" -ne 0 ]; then exit 1; fi

      # upload-sarif applies `category:` only to a run with no automationDetails
      # (populateRunAutomationDetails in https://github.com/github/codeql-action/blob/v4.38.3/src/upload-lib.ts),
      # so deadset's per-language ids are dropped; its runs stay distinct
      # analyses by driver name. An upload replaces its category's alerts, so
      # a nested target gets its own category and repository-relative URIs.
      - name: Prepare SARIF
        id: sarif
        if: ${{ !cancelled() && steps.target.outputs.work != '' }}
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target }}
          WORK: ${{ steps.target.outputs.work }}
        run: |
          set -euo pipefail
          sarif="$WORK/run/report.json.sarif"
          if [ ! -f "$sarif" ]; then
            echo "deadset wrote no SARIF report, so there is nothing to upload."
            exit 0
          fi
          category=deadset
          dir=""
          if [ "$TARGET" != . ]; then
            category="deadset/$TARGET"
            dir="$TARGET/"
          fi
          jq --arg dir "$dir" '
            (.. | objects | select(.uriBaseId == "%SRCROOT%" and (.uri | type) == "string") | .uri) |= "\($dir)\(.)"
            | del(.runs[].automationDetails)
          ' "$sarif" > "$WORK/upload.sarif"
          {
            echo "path=$WORK/upload.sarif"
            echo "category=$category"
          } >> "$GITHUB_OUTPUT"

      # Code scanning on a private repository needs GitHub Advanced Security.
      - name: Upload SARIF (deadset)
        if: ${{ !cancelled() && steps.sarif.outputs.path != '' && inputs.repository == '' && !github.event.repository.private }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.sarif.outputs.path }}
          category: ${{ steps.sarif.outputs.category }}
