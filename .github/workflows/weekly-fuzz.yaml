# Weekly fuzz exploration across all Go-having cplieger consumer repos.
# Pattern C: matrix + max-parallel cap owned here, not via cross-repo
# workflow_dispatch. One place to manage the shared fuzz schedule and
# the issue-creation/auto-close logic for findings.
#
# Schedule:           Wednesdays 22:00 UTC (mid-week off-peak; different day
#                     from gremlins-Sunday and security-daily so they never
#                     fight for the 20-slot account budget)
# Concurrency cap:    6 jobs in parallel (>=4 slots reserved for ad-hoc work)
# Fuzz budget:        2 minutes per target. Each run starts ONLY from the
#                     committed testdata/fuzz/ seed corpus: the runner is
#                     ephemeral and setup-go runs with cache:false, so the
#                     coverage-guided corpus Go builds during the run is
#                     discarded. Exploration does NOT accumulate depth
#                     run-to-run; the only persistent growth is a failing seed
#                     a human commits (which becomes a deterministic regression
#                     in testdata/fuzz/). The 2m/target budget is fixed:
#                     large repos are SHARDED across runners rather than
#                     having their per-target time cut.
# Dynamic sharding:   fanout counts each repo's fuzz targets and computes
#                     shards = ceil(targets x 2m / SHARD_BUDGET). A repo that
#                     fits the budget runs on one runner; a repo that would
#                     overrun the 6h hosted-runner ceiling is split across N
#                     runners, each fuzzing a deterministic round-robin slice
#                     of the targets. Scales to any target count. The per-repo
#                     `report` job then consolidates every shard's findings
#                     into one issue-management pass.
# Reporting:          Per-finding GitHub issue in the consumer repo. Opens
#                     when fuzz writes a new failing seed; auto-closes when
#                     the seed gets committed to testdata/fuzz/. Idempotent
#                     across runs.
name: Weekly fuzz

on:
  schedule:
    - cron: "0 22 * * 3"   # Wednesday 22:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # Issue ops happen in CONSUMER repos via CI_SCHEDULE PAT, not GITHUB_TOKEN.

concurrency:
  group: weekly-fuzz
  cancel-in-progress: false

env:
  # Per-target fuzz budget in seconds — the single knob. The fanout job sizes
  # shards from it and the fuzz job passes it to -fuzztime, so the two can't
  # drift apart.
  FUZZ_TIME_SECONDS: "120"

jobs:
  fanout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shard_matrix: ${{ steps.fanout.outputs.shard_matrix }}
      repo_matrix: ${{ steps.fanout.outputs.repo_matrix }}
    steps:
      - name: Discover fuzz targets and compute per-repo shard counts
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Max fuzzing seconds per shard. 4h leaves ~2h headroom under the 6h
          # hosted-runner ceiling for clone + build + baseline-coverage overhead.
          SHARD_BUDGET_SECONDS: "14400"
        run: |
          set -euo pipefail
          # Forks are excluded fleet-wide (same rule as scripts/audit.py): a fork
          # carries UPSTREAM's code, so fuzzing it spends the shared runner budget
          # on targets we neither own nor can fix, and any finding would be filed
          # against a repo whose issues are typically disabled.
          repos=$(gh repo list cplieger --limit 300 --json name,isArchived,isFork --jq '
            [.[] | select(.isArchived == false and .isFork == false) | .name] | .[]
          ')

          shard_matrix='[]'
          repo_matrix='[]'
          for r in $repos; do
            gh api "/repos/cplieger/${r}/contents/go.mod" --silent 2>/dev/null || continue
            rm -rf scan
            gh repo clone "cplieger/${r}" scan -- --depth 1 2>/dev/null || continue
            sha=$(git -C scan rev-parse HEAD)
            # Count fuzz targets (proxy for `go test -list '^Fuzz'`; exact count
            # is recomputed per shard at run time, this only sizes the matrix).
            # `|| true`: grep exits 1 when a Go repo has tests but no fuzz funcs,
            # which pipefail+set -e would otherwise treat as fatal.
            count=$(grep -rhE '^func Fuzz' --include='*_test.go' scan 2>/dev/null | wc -l | tr -d ' ' || true)
            if [ "${count:-0}" -eq 0 ]; then
              echo "  skip ${r}: no fuzz targets"
              continue
            fi
            # shards = ceil(count * FUZZ_TIME_SECONDS / SHARD_BUDGET_SECONDS), >= 1
            shards=$(( (count * FUZZ_TIME_SECONDS + SHARD_BUDGET_SECONDS - 1) / SHARD_BUDGET_SECONDS ))
            [ "$shards" -lt 1 ] && shards=1
            echo "  include ${r}: ${count} target(s) -> ${shards} shard(s) @ ${sha:0:12}"
            repo_matrix=$(printf '%s' "$repo_matrix" | jq -c --arg r "$r" --arg s "$sha" '. + [{repo: $r, sha: $s}]')
            for i in $(seq 0 $((shards - 1))); do
              shard_matrix=$(printf '%s' "$shard_matrix" | jq -c \
                --arg r "$r" --arg s "$sha" --argjson sh "$i" --argjson tot "$shards" \
                '. + [{repo: $r, sha: $s, shard: $sh, shards: $tot}]')
            done
          done
          rm -rf scan

          {
            echo "shard_matrix=${shard_matrix}"
            echo "repo_matrix=${repo_matrix}"
          } >> "$GITHUB_OUTPUT"
          echo "shards: $(printf '%s' "$shard_matrix" | jq 'length'), repos: $(printf '%s' "$repo_matrix" | jq 'length')"

  fuzz:
    needs: fanout
    if: ${{ needs.fanout.outputs.shard_matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.shard_matrix) }}
    runs-on: ubuntu-24.04
    # 4h fuzz budget per shard + clone/build/baseline overhead, under the 6h cap.
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
    steps:
      - name: Clone target repo at pinned SHA
        run: |
          set -euo pipefail
          gh repo clone "cplieger/${{ matrix.repo }}" target -- --depth 1
          git -C target fetch --depth 1 origin "${{ matrix.sha }}"
          git -C target checkout --quiet "${{ matrix.sha }}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: target/go.mod
          cache: false

      - name: Run this shard's fuzz targets
        working-directory: target
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -uo pipefail
          : > "$GITHUB_WORKSPACE/findings.txt"
          : > "$GITHUB_WORKSPACE/broken.txt"
          # Deterministic global target list: `go list ./...` is import-path
          # sorted and `go test -list` order is stable for a fixed commit, so
          # every shard of this repo sees the identical ordered list and the
          # round-robin slice below partitions it without overlap or gaps.
          targets=()
          for pkg in $(go list ./...); do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep -E '^Fuzz' || true); do
              targets+=("${pkg}|${fn}")
            done
          done
          total=${#targets[@]}
          echo "repo has ${total} fuzz target(s); shard ${SHARD}/${SHARDS}, ${FUZZ_TIME_SECONDS}s/target"
          idx=0
          ran=0
          for entry in "${targets[@]}"; do
            if [ $(( idx % SHARDS )) -eq "$SHARD" ]; then
              pkg="${entry%%|*}"
              fn="${entry##*|}"
              echo "::group::fuzz ${fn} (${pkg})"
              out=$(go test -run='^$' -fuzz="^${fn}$" -fuzztime="${FUZZ_TIME_SECONDS}s" "$pkg" 2>&1) && status=0 || status=$?
              printf '%s\n' "$out"
              rel=$(printf '%s\n' "$out" | sed -nE 's@.*Failing input written to (testdata/fuzz/[^[:space:]]+).*@\1@p' | head -1)
              if [ -n "$rel" ]; then
                # The seed exists on THIS runner but not in the report job's
                # clone (it isn't committed yet), so capture its size + base64
                # preview here and carry them through the artifact. Fields:
                # fuzzname|hash|repo-relative-path|size|base64-preview.
                dir=$(go list -f '{{.Dir}}' "$pkg")
                seed="${dir}/${rel}"
                size=$(wc -c < "$seed" 2>/dev/null || echo 0)
                preview=$(head -c 500 "$seed" 2>/dev/null | base64 -w0 2>/dev/null | head -c 800 || true)
                # Repo-relative seed path. For the ROOT package dir == $PWD, so
                # the plain ${dir#"$PWD"/} prefix-strip would not match (no
                # trailing slash) and leak an absolute runner path into the
                # issue body; strip the two parts separately instead.
                rel_dir="${dir#"$PWD"}"; rel_dir="${rel_dir#/}"
                printf '%s|%s|%s|%s|%s\n' "$fn" "$(basename "$rel")" "${rel_dir:+$rel_dir/}${rel}" "$size" "$preview" \
                  >> "$GITHUB_WORKSPACE/findings.txt"
              elif [ "$status" -ne 0 ]; then
                # go test failed but wrote no reproducer, so the target never
                # explored anything: it is BROKEN, not fuzzing. Two real shapes,
                # neither of which writes testdata/fuzz/... — a committed seed or
                # f.Add entry that already fails (the seed phase aborts before
                # fuzzing starts), and a build failure in the package.
                #
                # This was silent until 2026-08: `|| true` discarded the exit
                # status and the extraction above found no path, so the leg went
                # green with no finding and no issue. vibekit's FuzzSetDebug
                # panicked on seed#0 in every weekly run for weeks with zero
                # signal anywhere. Fail the shard instead — a broken target is a
                # process defect, so it fails closed rather than filing an issue
                # that the seed-committed auto-close could never close.
                printf '%s (%s)\n' "$fn" "$pkg" >> "$GITHUB_WORKSPACE/broken.txt"
                echo "::error::${fn} (${pkg}) failed without writing a reproducer — broken seed corpus or build failure, see the group log"
              fi
              echo "::endgroup::"
              ran=$((ran + 1))
            fi
            idx=$((idx + 1))
          done
          echo "ran ${ran} target(s); findings: $(wc -l < "$GITHUB_WORKSPACE/findings.txt")"

          if [ -s "$GITHUB_WORKSPACE/broken.txt" ]; then
            echo "broken target(s) in this shard:"
            cat "$GITHUB_WORKSPACE/broken.txt"
            exit 1
          fi

      - name: Upload shard findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings-${{ matrix.repo }}-shard${{ matrix.shard }}
          path: findings.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [fanout, fuzz]
    if: ${{ always() && needs.fanout.outputs.repo_matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.repo_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
      REPO: cplieger/${{ matrix.repo }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Clone target repo at pinned SHA
        run: |
          set -euo pipefail
          gh repo clone "cplieger/${{ matrix.repo }}" target -- --depth 1
          git -C target fetch --depth 1 origin "${{ matrix.sha }}"
          git -C target checkout --quiet "${{ matrix.sha }}"

      - name: Download this repo's shard findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: shard-findings
          pattern: fuzz-findings-${{ matrix.repo }}-shard*

      - name: Checkout ci (for the tracker transport)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/tracker_issue.py
          sparse-checkout-cone-mode: false
          path: ci

      # The issues-disabled guard, label creation and the fail-closed API
      # handling are scripts/tracker_issue.py's. A failed write for one finding
      # is recorded and the loop goes on, so every finding gets its issue and
      # the step still ends red.
      - name: Open / update issues and auto-close committed seeds
        working-directory: target
        run: |
          set -uo pipefail
          tracker="$GITHUB_WORKSPACE/ci/scripts/tracker_issue.py"
          had_failure=0

          # Consolidate findings from every shard of this repo into one list.
          merged=/tmp/findings.txt
          : > "$merged"
          find "$GITHUB_WORKSPACE/shard-findings" -name findings.txt -exec cat {} + 2>/dev/null | sort -u > "$merged" || true
          echo "consolidated $(wc -l < "$merged") finding(s) for ${REPO}"

          printf 'Recurred in %s\n' "$RUN_URL" > "$RUNNER_TEMP/recurred.md"
          while IFS='|' read -r target hash path size preview; do
            [ -z "$target" ] && continue
            title="[fuzz] ${target} regression — ${hash}"
            cat > "$RUNNER_TEMP/finding.md" <<EOF
          **Target**: \`${target}\`
          **Reproducer hash**: \`${hash}\`
          **Found in**: ${RUN_URL}

          **Reproduce locally:**

          \`\`\`bash
          go test -run='^${target}\$/${hash}' ./...
          \`\`\`

          **Seed file**: \`${path}\` (${size} bytes, base64 preview):

          \`\`\`
          ${preview}
          \`\`\`

          ---

          Auto-created by the weekly fuzz run. Auto-closes when the seed file at
          \`${path}\` is committed to the repo (becomes a deterministic regression
          test in the seed corpus → exercised by every PR's \`Test (race)\` step).
          EOF
            python3 "$tracker" --repo "$REPO" --label fuzz-finding --title "$title" \
              --mode recur --body-file "$RUNNER_TEMP/finding.md" \
              --comment-file "$RUNNER_TEMP/recurred.md" || had_failure=1
          done < "$merged"

          # Auto-close fuzz issues whose seed was committed to the corpus.
          python3 "$tracker" --repo "$REPO" --label fuzz-finding --mode list \
            > "$RUNNER_TEMP/open-findings.tsv" || had_failure=1
          while IFS=$'\t' read -r _ title; do
            target=$(echo "$title" | sed -nE 's|^\[fuzz\] ([A-Za-z][A-Za-z0-9_]*) regression .+$|\1|p')
            hash=$(echo "$title" | sed -nE 's|^.+ — ([a-f0-9]+)$|\1|p')
            { [ -z "$target" ] || [ -z "$hash" ]; } && continue
            # Search the WHOLE tree: seed corpora live at the package level
            # (e.g. internal/foo/testdata/fuzz/...), not only at the repo root.
            # A root-only `find testdata/fuzz` never matched non-root packages,
            # leaving their issues open forever despite the committed seed.
            seedpath=$(find . -path "*/testdata/fuzz/${target}/${hash}" -print -quit 2>/dev/null)
            if [ -n "$seedpath" ]; then
              msg="Closed automatically: seed \`${seedpath#./}\` was committed; now part of the deterministic regression corpus."
              printf '%s\n' "$msg" > "$RUNNER_TEMP/closed.md"
              python3 "$tracker" --repo "$REPO" --label fuzz-finding --title "$title" \
                --mode close-when-clean --comment-file "$RUNNER_TEMP/closed.md" || had_failure=1
            fi
          done < "$RUNNER_TEMP/open-findings.tsv"

          if [ "$had_failure" -ne 0 ]; then
            echo "::error::one or more issue operations failed for ${REPO}"
            exit 1
          fi

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, fuzz, report]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
