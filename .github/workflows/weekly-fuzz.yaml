# Weekly fuzzing of every `func Fuzz` target in the public cplieger Go
# repositories, from the committed seed corpus only. A repo whose targets
# overrun one shard's budget is split across runners rather than given less
# time per target. The budget, the sharding and the per-finding issues are
# documented in docs/workflows.md "The scheduled runs".
name: Weekly fuzz

on:
  schedule:
    - cron: "0 22 * * 3"   # Wednesday 22:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # Issue ops happen in CONSUMER repos via CI_SCHEDULE PAT, not GITHUB_TOKEN.

concurrency:
  group: weekly-fuzz
  cancel-in-progress: false

env:
  # Per-target fuzz budget in seconds — the single knob. The fanout job sizes
  # shards from it and the fuzz job passes it to -fuzztime, so the two can't
  # drift apart.
  FUZZ_TIME_SECONDS: "120"

jobs:
  fanout:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      shard_matrix: ${{ steps.fanout.outputs.shard_matrix }}
      repo_matrix: ${{ steps.fanout.outputs.repo_matrix }}
    steps:
      - name: Checkout ci (for the module discovery)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _ci
          persist-credentials: false
          sparse-checkout: scripts/go-units.sh
          sparse-checkout-cone-mode: false

      - name: Discover fuzz targets and compute per-module shard counts
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Max fuzzing seconds per shard. 4h leaves ~2h headroom under the 6h
          # hosted-runner ceiling for clone + build + baseline-coverage overhead.
          SHARD_BUDGET_SECONDS: "14400"
        run: |
          set -euo pipefail
          # REST, not the GraphQL `gh repo list`: GraphQL shares a quota the
          # per-repo reads also draw, and this listing is every repo's single
          # point of failure. A fork carries UPSTREAM's code, whose findings we
          # cannot fix. Public only: this repository's run logs and artifacts
          # are world-readable (CONTRIBUTING.md).
          repos=$(gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq '
            .[] | select(.archived == false and .fork == false and .visibility == "public") | .name
          ')

          shard_matrix='[]'
          repo_matrix='[]'
          for r in $repos; do
            rm -rf scan
            # Plain git over HTTPS draws no API quota, so a rate-limited run can
            # still clone, where `gh repo clone` would spend GraphQL budget.
            if ! git clone --depth 1 "https://github.com/cplieger/${r}.git" scan 2>/dev/null; then
              echo "::warning::clone failed for ${r} — dropping it from the fuzz matrix this week"
              continue
            fi
            # A clone can exit 0 with no resolvable HEAD; unguarded under
            # `set -e`, rev-parse would end the fanout for every repo.
            if ! sha=$(git -C scan rev-parse HEAD 2>/dev/null); then
              echo "::warning::cannot resolve HEAD for ${r}, so it is dropped from the fuzz matrix this week"
              continue
            fi
            # One unit per Go module, the root and each nested one, since a
            # module's `go list ./...` never crosses into another. The count is a
            # proxy for `go test -list '^Fuzz'` that only sizes the shards; each
            # shard recomputes the exact list at run time.
            if ! units=$(bash _ci/scripts/go-units.sh scan '^func Fuzz'); then
              echo "::warning::module discovery failed for ${r}, so it is dropped from the fuzz matrix this week"
              continue
            fi
            artifacts=()
            while IFS=$'\t' read -r dir slug count; do
              [ -n "$dir" ] || continue
              if [ "${count:-0}" -eq 0 ]; then
                echo "  skip ${r}:${dir}: no fuzz targets"
                continue
              fi
              # shards = ceil(count * FUZZ_TIME_SECONDS / SHARD_BUDGET_SECONDS), >= 1
              shards=$(( (count * FUZZ_TIME_SECONDS + SHARD_BUDGET_SECONDS - 1) / SHARD_BUDGET_SECONDS ))
              [ "$shards" -lt 1 ] && shards=1
              echo "  include ${r}:${dir}: ${count} target(s) -> ${shards} shard(s) @ ${sha:0:12}"
              for i in $(seq 0 $((shards - 1))); do
                artifacts+=("fuzz-findings-${r}-${slug}-shard${i}")
                shard_matrix=$(printf '%s' "$shard_matrix" | jq -c \
                  --arg r "$r" --arg s "$sha" --arg d "$dir" --arg slug "$slug" \
                  --argjson sh "$i" --argjson tot "$shards" \
                  '. + [{repo: $r, sha: $s, dir: $d, slug: $slug, shard: $sh, shards: $tot}]')
              done
            done <<<"$units"
            if [ "${#artifacts[@]}" -eq 0 ]; then
              continue
            fi
            # The report job downloads exactly the names this repo's shards
            # upload (a brace list for several): a glob would also match a repo
            # whose name extends this one's, and file its findings here.
            repo_matrix=$(printf '%s' "$repo_matrix" | jq -c --arg r "$r" --arg s "$sha" \
              --args '. + [{repo: $r, sha: $s, artifacts: ($ARGS.positional
                | if length == 1 then .[0] else "{\(join(","))}" end)}]' "${artifacts[@]}")
          done
          rm -rf scan

          {
            echo "shard_matrix=${shard_matrix}"
            echo "repo_matrix=${repo_matrix}"
          } >> "$GITHUB_OUTPUT"
          echo "shards: $(printf '%s' "$shard_matrix" | jq 'length'), repos: $(printf '%s' "$repo_matrix" | jq 'length')"

  fuzz:
    needs: fanout
    if: ${{ needs.fanout.outputs.shard_matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.shard_matrix) }}
    runs-on: ubuntu-26.04
    # 4h fuzz budget per shard + clone/build/baseline overhead, under the 6h cap.
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      # Anonymous: the fanout lists only public repositories, and this job
      # runs the target's code, so it holds no secret.
      - name: Clone target repo at pinned SHA
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/cplieger/${REPO}.git" target
          git -C target fetch --depth 1 origin "${SHA}"
          git -C target checkout --quiet "${SHA}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: target/${{ matrix.dir }}/go.mod
          cache: false

      # GOWORK=off: a module builds against the versions its own go.mod pins,
      # as ci.yaml's go-nested lanes do, whatever go.work a repo commits.
      - name: Run this shard's fuzz targets
        working-directory: target/${{ matrix.dir }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          MODULE: ${{ matrix.dir }}
          GOWORK: "off"
        run: |
          set -uo pipefail
          : > "$GITHUB_WORKSPACE/findings.txt"
          : > "$GITHUB_WORKSPACE/broken.txt"
          # Deterministic global target list: `go list ./...` is import-path
          # sorted and `go test -list` order is stable for a fixed commit, so
          # every shard of this repo sees the identical ordered list and the
          # round-robin slice below partitions it without overlap or gaps.
          targets=()
          for pkg in $(go list ./...); do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep -E '^Fuzz' || true); do
              targets+=("${pkg}|${fn}")
            done
          done
          total=${#targets[@]}
          echo "module ${MODULE} has ${total} fuzz target(s); shard ${SHARD}/${SHARDS}, ${FUZZ_TIME_SECONDS}s/target"
          idx=0
          ran=0
          for entry in "${targets[@]}"; do
            if [ $(( idx % SHARDS )) -eq "$SHARD" ]; then
              pkg="${entry%%|*}"
              fn="${entry##*|}"
              echo "::group::fuzz ${fn} (${pkg})"
              out=$(go test -run='^$' -fuzz="^${fn}$" -fuzztime="${FUZZ_TIME_SECONDS}s" "$pkg" 2>&1) && status=0 || status=$?
              printf '%s\n' "$out"
              rel=$(printf '%s\n' "$out" | sed -nE 's@.*Failing input written to (testdata/fuzz/[^[:space:]]+).*@\1@p' | head -1)
              if [ -n "$rel" ]; then
                # The seed exists on THIS runner but not in the report job's
                # clone (it isn't committed yet), so capture its size + base64
                # preview here and carry them through the artifact. Fields:
                # fuzzname|hash|repo-relative-path|size|base64-preview|module.
                dir=$(go list -f '{{.Dir}}' "$pkg")
                seed="${dir}/${rel}"
                size=$(wc -c < "$seed" 2>/dev/null || echo 0)
                preview=$(head -c 500 "$seed" 2>/dev/null | base64 -w0 2>/dev/null | head -c 800 || true)
                # Repo-relative seed path. For a package at the repo root,
                # dir == the clone, so the plain ${dir#"$root"/} prefix-strip
                # would not match (no trailing slash) and leak an absolute
                # runner path into the issue body; strip the two parts
                # separately instead.
                root="$GITHUB_WORKSPACE/target"
                rel_dir="${dir#"$root"}"; rel_dir="${rel_dir#/}"
                printf '%s|%s|%s|%s|%s|%s\n' "$fn" "$(basename "$rel")" "${rel_dir:+$rel_dir/}${rel}" "$size" "$preview" "$MODULE" \
                  >> "$GITHUB_WORKSPACE/findings.txt"
              elif [ "$status" -ne 0 ]; then
                # Failed with no reproducer: a committed seed or f.Add entry that
                # already fails, or a build failure, so the target never fuzzed.
                # The shard fails rather than filing an issue, because no seed
                # commit could ever auto-close one.
                printf '%s (%s)\n' "$fn" "$pkg" >> "$GITHUB_WORKSPACE/broken.txt"
                echo "::error::${fn} (${pkg}) failed without writing a reproducer — broken seed corpus or build failure, see the group log"
              fi
              echo "::endgroup::"
              ran=$((ran + 1))
            fi
            idx=$((idx + 1))
          done
          echo "ran ${ran} target(s); findings: $(wc -l < "$GITHUB_WORKSPACE/findings.txt")"

          if [ -s "$GITHUB_WORKSPACE/broken.txt" ]; then
            echo "broken target(s) in this shard:"
            cat "$GITHUB_WORKSPACE/broken.txt"
            exit 1
          fi

      - name: Upload shard findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.repo }}-${{ matrix.slug }}-shard${{ matrix.shard }}
          path: findings.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [fanout, fuzz]
    if: ${{ always() && needs.fanout.result == 'success' && needs.fanout.outputs.repo_matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.repo_matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
      REPO: cplieger/${{ matrix.repo }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Clone target repo at pinned SHA
        env:
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${REPO}.git" target
          git -C target fetch --depth 1 origin "${SHA}"
          git -C target checkout --quiet "${SHA}"

      - name: Download this repo's shard findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shard-findings
          pattern: ${{ matrix.artifacts }}

      - name: Checkout ci (for the tracker transport)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/tracker_issue.py
            scripts/ghrest.py
          sparse-checkout-cone-mode: false
          path: ci

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The issues-disabled guard, label creation and the fail-closed API
      # handling are scripts/tracker_issue.py's. A failed write for one finding
      # is recorded and the loop goes on, so every finding gets its issue and
      # the step still ends red.
      - name: Open / update issues and auto-close committed seeds
        working-directory: target
        run: |
          set -uo pipefail
          tracker="$GITHUB_WORKSPACE/ci/scripts/tracker_issue.py"
          had_failure=0

          # Consolidate findings from every shard of this repo into one list.
          merged=/tmp/findings.txt
          : > "$merged"
          find "$GITHUB_WORKSPACE/shard-findings" -name findings.txt -exec cat {} + 2>/dev/null | sort -u > "$merged" || true
          echo "consolidated $(wc -l < "$merged") finding(s) for ${REPO}"

          printf 'Recurred in %s\n' "$RUN_URL" > "$RUNNER_TEMP/recurred.md"
          while IFS='|' read -r target hash path size preview module; do
            [ -z "$target" ] && continue
            title="[fuzz] ${target} regression — ${hash}"
            # A nested module's tests run from its own dir, never the root's.
            repro="go test -run='^${target}\$/${hash}' ./..."
            head="**Target**: \`${target}\`"
            if [ -n "${module:-}" ] && [ "$module" != . ]; then
              repro="cd ${module} && ${repro}"
              head="${head}"$'\n'"**Module**: \`${module}\`"
            fi
            cat > "$RUNNER_TEMP/finding.md" <<EOF
          ${head}
          **Reproducer hash**: \`${hash}\`
          **Found in**: ${RUN_URL}

          **Reproduce locally:**

          \`\`\`bash
          ${repro}
          \`\`\`

          **Seed file**: \`${path}\` (${size} bytes, base64 preview):

          \`\`\`
          ${preview}
          \`\`\`

          ---

          Auto-created by the weekly fuzz run. Auto-closes when the seed file at
          \`${path}\` is committed to the repo (becomes a deterministic regression
          test in the seed corpus → exercised by every PR's \`Test (race)\` step).
          EOF
            python3 "$tracker" --repo "$REPO" --label fuzz-finding --title "$title" \
              --mode recur --body-file "$RUNNER_TEMP/finding.md" \
              --comment-file "$RUNNER_TEMP/recurred.md" || had_failure=1
          done < "$merged"

          # Auto-close fuzz issues whose seed was committed to the corpus.
          python3 "$tracker" --repo "$REPO" --label fuzz-finding --mode list \
            > "$RUNNER_TEMP/open-findings.tsv" || had_failure=1
          while IFS=$'\t' read -r _ title; do
            target=$(echo "$title" | sed -nE 's|^\[fuzz\] ([A-Za-z][A-Za-z0-9_]*) regression .+$|\1|p')
            hash=$(echo "$title" | sed -nE 's|^.+ — ([a-f0-9]+)$|\1|p')
            { [ -z "$target" ] || [ -z "$hash" ]; } && continue
            # Search the WHOLE tree: seed corpora live at the package level
            # (e.g. internal/foo/testdata/fuzz/...), not only at the repo root.
            # A root-only `find testdata/fuzz` never matched non-root packages,
            # leaving their issues open forever despite the committed seed.
            seedpath=$(find . -path "*/testdata/fuzz/${target}/${hash}" -print -quit 2>/dev/null)
            if [ -n "$seedpath" ]; then
              msg="Closed automatically: seed \`${seedpath#./}\` was committed; now part of the deterministic regression corpus."
              printf '%s\n' "$msg" > "$RUNNER_TEMP/closed.md"
              python3 "$tracker" --repo "$REPO" --label fuzz-finding --title "$title" \
                --mode close-when-clean --comment-file "$RUNNER_TEMP/closed.md" || had_failure=1
            fi
          done < "$RUNNER_TEMP/open-findings.tsv"

          if [ "$had_failure" -ne 0 ]; then
            echo "::error::one or more issue operations failed for ${REPO}"
            exit 1
          fi

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, fuzz, report]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
