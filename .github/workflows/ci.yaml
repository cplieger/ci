# validate is the one required check: a job that detect skips counts as passed,
# and every other job's failure fails it. The detect step owns the surface rules
# and the web-frontend probe order.
name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      run_go: ${{ steps.detect.outputs.run_go }}
      run_go_nested: ${{ steps.detect.outputs.run_go_nested }}
      go_nested_dirs: ${{ steps.detect.outputs.go_nested_dirs }}
      run_ts_nested: ${{ steps.detect.outputs.run_ts_nested }}
      ts_nested_dirs: ${{ steps.detect.outputs.ts_nested_dirs }}
      run_go_work: ${{ steps.detect.outputs.run_go_work }}
      go_work_dirs: ${{ steps.detect.outputs.go_work_dirs }}
      run_go_os: ${{ steps.detect.outputs.run_go_os }}
      go_os_matrix: ${{ steps.detect.outputs.go_os_matrix }}
      run_ts: ${{ steps.detect.outputs.run_ts }}
      run_web: ${{ steps.detect.outputs.run_web }}
      run_shell: ${{ steps.detect.outputs.run_shell }}
      run_docker: ${{ steps.detect.outputs.run_docker }}
      run_python: ${{ steps.detect.outputs.run_python }}
      run_scripts: ${{ steps.detect.outputs.run_scripts }}
      web_dir: ${{ steps.detect.outputs.web_dir }}
      code_changed: ${{ steps.detect.outputs.code_changed }}
      deadset_targets: ${{ steps.detect.outputs.deadset_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          # Full history so we can diff against the PR base / previous push
          # tip to decide whether any code (non-docs) files changed.
          fetch-depth: 0

      - name: Detect repo surfaces
        id: detect
        run: |
          run_go=false
          run_go_nested=false
          go_nested_dirs="[]"
          run_ts_nested=false
          ts_nested_dirs="[]"
          run_go_work=false
          go_work_dirs="[]"
          run_go_os=false
          go_os_matrix="[]"
          run_ts=false
          run_web=false
          run_shell=false
          run_docker=false
          run_python=false
          run_scripts=false
          web_dir=""
          deadset_targets="[]"

          # --- Did any non-docs (code) file change? ---
          # A path filter on the caller would leave the required ci / validate pending
          # forever, so the workflow always runs and the heavy jobs gate on this.
          # Anything that cannot be diffed (a dispatch, a first push, a shallow base)
          # counts as a code change.
          code_changed=true
          changed=""
          diffed=false
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              if git cat-file -e "${base}^{commit}" 2> /dev/null; then
                changed=$(git diff --name-only "$base" HEAD)
                diffed=true
              fi
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] \
                && [ "$before" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${before}^{commit}" 2> /dev/null; then
                changed=$(git diff --name-only "$before" "${{ github.sha }}")
                diffed=true
              fi
              ;;
          esac

          # With a diff in hand, code changed only when some path is NOT a doc
          # file (or blank line). grep -qvE exits 0 iff such a line exists — no
          # subshell-scope or heredoc pitfalls. Without a diff (manual dispatch,
          # first push, shallow base) we keep the fail-safe default of true.
          if [ "$diffed" = "true" ]; then
            if printf '%s\n' "$changed" \
              | grep -qvE '(\.md$|^LICENSE$|^\.gitignore$|^[[:space:]]*$)'; then
              code_changed=true
            else
              code_changed=false
            fi
          fi

          if [ "$code_changed" = "true" ]; then
            [ -f go.mod ] && run_go=true
            [ -f jsr.json ] && run_ts=true
            [ -f Dockerfile ] && run_docker=true

            # The root `./...` never crosses a nested module, so each tracked
            # <dir>/go.mod with tracked .go files gets the battery at its own dir.
            # Vendored trees are pruned (a committed node_modules carries go.mod files)
            # and a sentinel go.mod with no .go files has nothing to validate. Unlike
            # release.yaml's lanes, internal/ modules are validated here.
            # scripts/test-lane-semantics.sh pins both filters; '*/go.mod' never matches
            # the root go.mod.
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              d=$(dirname -- "$f")
              case "$d" in
                *[!A-Za-z0-9._/-]*)
                  echo "::error::nested go.mod dir '$d' contains characters outside [A-Za-z0-9._/-]"
                  exit 1 ;;
              esac
              if [ -z "$(git ls-files -- "$d/*.go" | head -1)" ]; then
                echo "nested module '$d': no tracked .go files - skipping validation"
                continue
              fi
              go_nested_dirs=$(echo "$go_nested_dirs" | jq -c --arg v "$d" '. + [$v]')
            done < <(git ls-files '*/go.mod' | grep -Ev '(^|/)(node_modules|vendor|testdata|static|dist)/' || true)
            if [ "$go_nested_dirs" != "[]" ]; then
              run_go_nested=true
            fi

            # A module requiring a sibling by version, with no replace of it, builds
            # against the sibling's tag, so every module's head is also tested
            # together under a generated go.work.
            gomod_field() {
              awk -v want="$2" '
                { gsub(/"/, "") }
                $1 ~ /^\/\// { next }
                ($1 == "require" || $1 == "replace") && $2 == "(" { blk = $1; next }
                blk != "" && $1 == ")" { blk = ""; next }
                blk != "" { if (blk == want) print $1; next }
                $1 == want { print $2 }
              ' "$1/go.mod"
            }
            mod_dirs=$(jq -r '.[]' <<< "$go_nested_dirs")
            [ -f go.mod ] && mod_dirs=$(printf '.\n%s' "$mod_dirs")
            mod_paths=$(while IFS= read -r d; do if [ -n "$d" ]; then gomod_field "$d" module; fi; done <<< "$mod_dirs")
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              own=$(gomod_field "$d" module)
              replaced=$(gomod_field "$d" replace)
              while IFS= read -r p; do
                if [ -n "$p" ] && [ "$p" != "$own" ] && grep -qxF -- "$p" <<< "$mod_paths" \
                  && ! grep -qxF -- "$p" <<< "$replaced"; then
                  run_go_work=true
                fi
              done < <(gomod_field "$d" require)
            done <<< "$mod_dirs"
            if [ "$run_go_work" = true ]; then
              go_work_dirs=$(jq -cR '[., inputs | select(. != "")]' <<< "$mod_dirs")
            fi

            # A module tracking a Go file built for windows or darwin is also tested
            # on that OS's runner, because the Linux go-ci leg may compile none of it.
            # The rules are go/build's: the name before its first dot ends _GOOS or
            # _GOOS_GOARCH with a known GOARCH, then an optional _test; or a //go:build
            # line above the package clause names the OS as a non-negated term. A file
            # belongs to the deepest module folder above it, and Go skips it when a
            # name below that folder starts with _ or .
            # scripts/test-lane-semantics.sh runs this block, to the matrix dedup.
            go_os_files() {
              local f b e os
              local prune='(^|/)(node_modules|vendor|testdata)/'
              local arch='386|amd64|amd64p32|arm|armbe|arm64|arm64be|loong64|mips|mipsle|mips64|mips64le'
              arch+='|mips64p32|mips64p32le|ppc|ppc64|ppc64le|riscv|riscv64|s390|s390x|sparc|sparc64|wasm'
              local suffix="_(windows|darwin)(_($arch))?(_test)?\$"
              while IFS= read -r f; do
                b=${f##*/}
                if [[ ${b%%.*} =~ $suffix ]]; then
                  printf '%s\t%s\n' "${BASH_REMATCH[1]}" "$f"
                fi
              done < <(git ls-files '*.go' | grep -Ev "$prune" || true)
              while IFS= read -r f; do
                e=$(awk '/^package[[:space:]]/ { exit } /^\/\/go:build[[:space:]]/ { print; exit }' "$f")
                for os in $(go_build_positive_terms "${e#//go:build}" | grep -xE 'windows|darwin'); do
                  printf '%s\t%s\n' "$os" "$f"
                done
              done < <(git grep -lE '^//go:build[[:space:]].*(windows|darwin)' -- '*.go' | grep -Ev "$prune" || true)
            }
            # Prints each term of a //go:build expression under an even number of
            # negations, counting a ! before the term and each enclosing !( ).
            go_build_positive_terms() {
              local e=$1 c i p=0 pending=0 word="" stack=()
              for ((i = 0; i <= ${#e}; i++)); do
                c=${e:i:1}
                if [[ $c =~ [A-Za-z0-9_.] ]]; then
                  word+=$c
                  continue
                fi
                if [ -n "$word" ]; then
                  if [ $((p ^ pending)) -eq 0 ]; then
                    printf '%s\n' "$word"
                  fi
                  word=""
                  pending=0
                fi
                case "$c" in
                  '!') pending=$((pending ^ 1)) ;;
                  '(')
                    stack+=("$p")
                    p=$((p ^ pending))
                    pending=0
                    ;;
                  ')')
                    if [ "${#stack[@]}" -gt 0 ]; then
                      p=${stack[-1]}
                      unset 'stack[-1]'
                    fi
                    ;;
                esac
              done
            }
            while IFS=$'\t' read -r os f; do
              [ -z "$f" ] && continue
              case "$os" in
                windows) runner=windows-latest ;;
                *) runner=macos-latest ;;
              esac
              d=$(dirname -- "$f")
              while [ "$d" != . ] && ! grep -qxF -- "$d" <<< "$mod_dirs"; do
                d=$(dirname -- "$d")
              done
              grep -qxF -- "$d" <<< "$mod_dirs" || continue
              rel=$f
              [ "$d" = . ] || rel=${f#"$d"/}
              if [[ /$rel =~ /[_.] ]]; then
                continue
              fi
              go_os_matrix=$(jq -c --arg d "$d" --arg r "$runner" '. + [{dir: $d, runner: $r}]' <<< "$go_os_matrix")
            done < <(go_os_files)
            go_os_matrix=$(jq -c 'unique_by([.dir, .runner])' <<< "$go_os_matrix")
            if [ "$go_os_matrix" != "[]" ]; then
              run_go_os=true
            fi

            # A module's TS half at <dir>/web (release.yaml's go_halves shape) is a
            # library, so it gets ts-ci without the web job's frontend lint.
            while IFS= read -r d; do
              if [ -n "$(git ls-files -- "$d/web/package.json" "$d/web/jsr.json")" ]; then
                ts_nested_dirs=$(echo "$ts_nested_dirs" | jq -c --arg v "$d/web" '. + [$v]')
              fi
            done < <(jq -r '.[]' <<< "$go_nested_dirs")
            if [ "$ts_nested_dirs" != "[]" ]; then
              run_ts_nested=true
            fi

            # Probe known nested web-frontend locations. First hit wins.
            # Add new paths centrally if a future repo introduces a different
            # layout — no per-repo override needed. scripts/test-lane-semantics.sh
            # finds this loop by the first line of this comment and runs it, and
            # scripts/classify-repos.py's WEB_DIRS follows it.
            for d in \
              "static-src" \
              "web" \
              "internal/server/static-src" \
              "internal/webui/static-src" \
            ; do
              if [ -d "$d" ] && { [ -f "$d/package.json" ] || [ -f "$d/jsr.json" ]; }; then
                web_dir="$d"
                run_web=true
                break
              fi
            done

            # Python: any *.py → ruff lint (inline canonical config, same
            # rationale as the markdown job).
            if [ -n "$(find . -name '*.py' -not -path './.git/*' -print -quit)" ]; then
              run_python=true
            fi

            # The two branches are disjoint, so shell lint has at most one home per
            # repo: shell-ci.yaml in a Dockerfile repo, or in a Go or TypeScript repo
            # with a tracked *.sh outside the pruned trees; the scripts job in a repo
            # with no Dockerfile, go.mod or jsr.json that has shell scripts or
            # workflow files. scripts/test_shell_routing.py pins both branches.
            if [ -f Dockerfile ] || [ -f go.mod ] || [ -f jsr.json ]; then
              if [ -f Dockerfile ] \
                || [ -n "$(git ls-files '*.sh' | grep -Ev '(^|/)(node_modules|vendor|testdata|dist)/' | head -1)" ]; then
                run_shell=true
              fi
            elif [ -n "$(find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print -quit)" ] \
              || [ -n "$(find .github/workflows -name '*.y*ml' -print -quit 2> /dev/null)" ]; then
              run_scripts=true
            fi

            # deadset-ci.yaml asks deadset whether the root holds a program, so
            # the root is always a dead-code target. Under a root go.mod,
            # deadset-go's `./...` stops at a nested module, so each one is its
            # own target; with no root go.mod, deadset-go analyzes every module
            # below the root in one report (deadset-go README).
            deadset_targets='["."]'
            if [ -f go.mod ]; then
              deadset_targets=$(jq -cn --argjson b "$go_nested_dirs" '["."] + $b')
            fi
          fi

          {
            echo "run_go=$run_go"
            echo "run_go_nested=$run_go_nested"
            echo "go_nested_dirs=$go_nested_dirs"
            echo "run_ts_nested=$run_ts_nested"
            echo "ts_nested_dirs=$ts_nested_dirs"
            echo "run_go_work=$run_go_work"
            echo "go_work_dirs=$go_work_dirs"
            echo "run_go_os=$run_go_os"
            echo "go_os_matrix=$go_os_matrix"
            echo "run_ts=$run_ts"
            echo "run_web=$run_web"
            echo "run_shell=$run_shell"
            echo "run_docker=$run_docker"
            echo "run_python=$run_python"
            echo "run_scripts=$run_scripts"
            echo "web_dir=$web_dir"
            echo "code_changed=$code_changed"
            echo "deadset_targets=$deadset_targets"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## CI dispatch"
            echo ""
            echo "| Surface | Detected | Path |"
            echo "|---|---|---|"
            echo "| go       | $run_go | . |"
            echo "| go-nested | $run_go_nested | $go_nested_dirs |"
            echo "| go-work  | $run_go_work | $go_work_dirs |"
            echo "| go-os    | $run_go_os | $go_os_matrix |"
            echo "| ts       | $run_ts | . |"
            echo "| web      | $run_web | ${web_dir:-—} |"
            echo "| ts-nested | $run_ts_nested | $ts_nested_dirs |"
            echo "| shell    | $run_shell | . |"
            echo "| docker   | $run_docker | . |"
            echo "| python   | $run_python | . |"
            echo "| scripts  | $run_scripts | . |"
            echo "| deadset  | $code_changed | $deadset_targets |"
            echo "| markdown | true (always) | . |"
            echo ""
            echo "code_changed: $code_changed"
          } >> "$GITHUB_STEP_SUMMARY"

  # The four sub-CI workflows below use local refs (uses: ./...), not @sha
  # pins. GitHub resolves a local reusable-workflow ref to the SAME commit a
  # consumer pinned ci.yaml to, so a fix to go-ci/ts-ci/shell-ci reaches
  # consumers on their next ci.yaml bump — no second internal-pin bump + tag
  # cycle. (A local COMPOSITE ACTION, by contrast, resolves against the
  # consumer's checkout and 404s — those must stay owner/repo/path@sha.)
  go:
    needs: detect
    if: ${{ needs.detect.outputs.run_go == 'true' }}
    uses: ./.github/workflows/go-ci.yaml

  # Nested Go modules (independent release lanes — see release.yaml's
  # go-nested job): `go test ./...` at the root does not cross module
  # boundaries, so each nested module runs the full go-ci battery at its own
  # directory, pinned to its own go.mod's Go version.
  go-nested:
    needs: detect
    if: ${{ needs.detect.outputs.run_go_nested == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.go_nested_dirs) }}
    uses: ./.github/workflows/go-ci.yaml
    with:
      working-directory: ${{ matrix.dir }}
      go-version-file: ${{ matrix.dir }}/go.mod

  # Builds every module's head against the others' heads, so a change that breaks
  # a sibling fails before it is tagged; the go.work exists only in this checkout.
  go-work:
    needs: detect
    if: ${{ needs.detect.outputs.run_go_work == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ fromJSON(needs.detect.outputs.go_work_dirs)[0] }}/go.mod
          cache-dependency-path: '**/go.sum'

      # go.work's go line is the highest module's, which can sit above the
      # toolchain setup-go installed from the first module (setup-go exports
      # GOTOOLCHAIN=local).
      - name: Build and test every module under one go.work
        env:
          DIRS: ${{ needs.detect.outputs.go_work_dirs }}
          GOTOOLCHAIN: auto
        run: |
          mapfile -t dirs < <(jq -r '.[]' <<< "$DIRS")
          go work init
          go work use "${dirs[@]}"
          rc=0
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            if ! (cd "$d" && go build ./... && go test -count=1 -race ./...); then
              echo "::error::$d does not build or pass its tests against the other modules' heads"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

  go-os:
    needs: detect
    if: ${{ needs.detect.outputs.run_go_os == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.go_os_matrix) }}
    uses: ./.github/workflows/go-os-ci.yaml
    with:
      runner: ${{ matrix.runner }}
      working-directory: ${{ matrix.dir }}
      go-version-file: ${{ matrix.dir }}/go.mod

  ts:
    needs: detect
    if: ${{ needs.detect.outputs.run_ts == 'true' }}
    uses: ./.github/workflows/ts-ci.yaml

  web:
    needs: detect
    if: ${{ needs.detect.outputs.run_web == 'true' }}
    uses: ./.github/workflows/ts-ci.yaml
    with:
      working-directory: ${{ needs.detect.outputs.web_dir }}
      web-lint: true

  ts-nested:
    needs: detect
    if: ${{ needs.detect.outputs.run_ts_nested == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.ts_nested_dirs) }}
    uses: ./.github/workflows/ts-ci.yaml
    with:
      working-directory: ${{ matrix.dir }}

  shell:
    needs: detect
    if: ${{ needs.detect.outputs.run_shell == 'true' }}
    uses: ./.github/workflows/shell-ci.yaml
    with:
      dockerfile: ${{ needs.detect.outputs.run_docker == 'true' && './Dockerfile' || '' }}

  # deadset-ci.yaml's analyze job uploads SARIF, and a called job requesting a
  # permission its caller withholds fails the whole run at startup
  # (https://github.com/orgs/community/discussions/87459), so every caller up
  # the chain grants both scopes.
  deadset:
    needs: detect
    if: ${{ needs.detect.outputs.code_changed == 'true' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.deadset_targets) }}
    uses: ./.github/workflows/deadset-ci.yaml
    with:
      target: ${{ matrix.target }}

  # The pinned deadset tools over one Go-only, one TypeScript-only, one mixed
  # repository, one nested module, one with JavaScript but no npm project, one
  # of Go modules with no root go.mod and one with no program, so a pin set
  # that makes deadset refuse or give no answer fails here before a release
  # carries it. `off` still fails exit 2 and 3, except print-languages finding
  # no language, which skips the cplieger/docs row; findings at the frozen
  # commits do not. Refresh a ref only when its repository stops representing
  # its shape.
  deadset-canary:
    needs: detect
    if: ${{ github.repository == 'cplieger/ci' && needs.detect.outputs.code_changed == 'true' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: cplieger/toolbelt
            ref: be5ca9d079dcbf283cf78b029f17266b424fcd13
            target: '.'
          - repository: cplieger/actions
            ref: b68763ca439c55fc9c425b249c0c1c356abcb268
            target: '.'
          - repository: cplieger/keyenc
            ref: 10c129978fbaa619debc2a27ecf62c76d438cd76
            target: '.'
          - repository: cplieger/envx
            ref: 742555f1312abdb307361e4c1873fea4b02ad5be
            target: yamlenv
          - repository: cplieger/docker-renovate-scheduler
            ref: 67f927923c241d5e50ca2a1377db368b1a89e02b
            target: '.'
          - repository: cplieger/docs
            ref: 0df62b0d75ac1d8b0289e476c2b81730783e2bde
            target: '.'
          - repository: cplieger/go
            ref: 85a60345f20fdd2ebc75d4b9022cbcad9a041297
            target: '.'
    uses: ./.github/workflows/deadset-ci.yaml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      target: ${{ matrix.target }}
      exit-code: 'off'

  # go-os-ci.yaml over public modules with windows or darwin Go files, at fixed
  # commits, on each runner detect selects for them, so a change to that
  # workflow or its pins that breaks a real module's leg fails here before a
  # release carries it. Refresh a ref only when its module stops tracking such
  # files.
  go-os-canary:
    needs: detect
    if: ${{ github.repository == 'cplieger/ci' && needs.detect.outputs.code_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: cplieger/deadset-go
            ref: 2d865baf73ad431640a619e115c914098599f5ae
            dir: '.'
            runner: windows-latest
          - repository: cplieger/deadset-go
            ref: 2d865baf73ad431640a619e115c914098599f5ae
            dir: '.'
            runner: macos-latest
          - repository: cplieger/bolttable
            ref: 41fffbc67f3a87baf2d626c661b863a2ae25bdb1
            dir: '.'
            runner: macos-latest
          - repository: cplieger/grelot
            ref: 341d7a43812ac27ed4396064317a2d7eb56a00b7
            dir: '.'
            runner: windows-latest
          - repository: cplieger/grelot
            ref: 341d7a43812ac27ed4396064317a2d7eb56a00b7
            dir: '.'
            runner: macos-latest
          # cplieger/go filesafe: the Windows POSIX-rename and sharing tests.
          - repository: cplieger/go
            ref: 8a4da7700fc6413d58f7cace2cd11c48282c2510
            dir: filesafe
            runner: windows-latest
    uses: ./.github/workflows/go-os-ci.yaml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      runner: ${{ matrix.runner }}
      working-directory: ${{ matrix.dir }}
      # setup-go reads this path from the repository root.
      go-version-file: ${{ matrix.dir }}/go.mod

  # Builds the image at PR time (single-arch, no push, no scan) and runs the
  # repo's image tests against it, so a Dockerfile that does not build or an
  # image that does not work fails the required check. Vulnerability scanning
  # stays advisory in security-scan.yaml, so a base-image CVE never blocks a
  # merge or release.
  docker:
    needs: detect
    if: ${{ needs.detect.outputs.run_docker == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Keyed identically to the release build so both share cache below the
      # package layer; see docker-release.yaml's "Resolve OS package refresh
      # key" step for why the layer must not be served from cache.
      - name: Resolve OS package refresh key
        id: pkgrefresh
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*ARG[[:space:]]+PKG_REFRESH' ./Dockerfile; then
            REFRESH="PKG_REFRESH=$(date -u +%Y-%m-%d)"
          else
            REFRESH=""
          fi
          {
            echo "build-args<<EOF"
            echo "$REFRESH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (no push, no scan)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ci-smoke:latest
          build-args: ${{ steps.pkgrefresh.outputs.build-args }}
          cache-from: type=gha
          # Cache producer for the shared `buildkit` scope (the advisory
          # security scan reads from it). Keep exporting, but ignore-error so a
          # transient GHA cache-backend 504 on export can't fail the REQUIRED
          # build-ability gate — the image has already built by export time.
          cache-to: type=gha,mode=max,ignore-error=true

      # Run through sh: the harness is tracked 100644 here and in every synced
      # copy, so it cannot be executed directly.
      - name: Image smoke test
        if: ${{ hashFiles('tests/image-smoke.sh') != '' }}
        run: |
          set -euo pipefail
          sh tests/image-smoke.sh ci-smoke:latest

      # Executed directly so its shebang picks the interpreter. Runs after a
      # red harness so one run reports both verdicts; needs a built image.
      - name: Image test suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && hashFiles('tests/image-test.sh') != '' }}
        run: |
          set -euo pipefail
          if [ ! -x tests/image-test.sh ]; then
            msg="tests/image-test.sh is not executable. CI runs it directly so its shebang picks the interpreter;"
            msg="$msg commit it as mode 100755: git update-index --chmod=+x tests/image-test.sh"
            echo "::error file=tests/image-test.sh::$msg"
            exit 1
          fi
          ./tests/image-test.sh ci-smoke:latest

  # arm64 build-ability gate. Same rationale as the amd64 `docker` job: without
  # it, an arch-specific Dockerfile break (a hardcoded amd64 download URL, a
  # wrong `uname -m` case, a base image without an arm64 manifest) merges green
  # and only surfaces when Release builds the arm64 leg on a native runner.
  # Build only — the image tests run once, on amd64. Public repos only: arm
  # hosted runners are free for public repos; a free-plan private repo's job
  # would queue forever and block the required check (every Dockerfile
  # consumer is public today).
  docker-arm64:
    needs: detect
    if: ${{ needs.detect.outputs.run_docker == 'true' && github.event.repository.private == false }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # See docker-release.yaml's "Resolve OS package refresh key" step.
      - name: Resolve OS package refresh key
        id: pkgrefresh
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*ARG[[:space:]]+PKG_REFRESH' ./Dockerfile; then
            REFRESH="PKG_REFRESH=$(date -u +%Y-%m-%d)"
          else
            REFRESH=""
          fi
          {
            echo "build-args<<EOF"
            echo "$REFRESH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (arm64, no push, no scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ci-smoke-arm64:latest
          build-args: ${{ steps.pkgrefresh.outputs.build-args }}
          # Distinct cache scope: the default `buildkit` scope carries the
          # amd64 layers (docker job + security scan); mixing arches in one
          # scope would evict each other.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64,ignore-error=true

  # Repo-wide checks that depend on no language surface: actionlint, zizmor
  # and a working-tree gitleaks scan, run exactly once per repo.
  #
  # Soft-gated like the language jobs: one failing check does not hide the
  # others. CONTRACT: any step added to the block below MUST end with
  #   || { echo "<step name>" >> /tmp/_ci_failures; exit 1; }
  repo:
    needs: detect
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # Downloads write to a file before extracting: --retry-all-errors retries a
      # mid-transfer failure (curl exit 56), and curl resets partial output only for
      # -o, never for a pipe into tar. 7 retries on curl's exponential backoff span
      # about two minutes, enough to outlast a release-asset brownout; a wrong pin
      # takes that long to fail too, since a 404 is retried.
      - name: Install actionlint
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          VERSION=v1.7.12
          curl -fsSL --connect-timeout 10 --max-time 30 \
            --retry 7 --retry-max-time 150 --retry-all-errors \
            -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/${VERSION}/actionlint_${VERSION#v}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Install zizmor
        run: |
          # renovate: datasource=pypi depName=zizmor
          VERSION=1.32.0
          pipx install "zizmor==${VERSION}"

      # actionlint does not know the ubuntu-26.04 / ubuntu-26.04-arm labels
      # (rhysd/actionlint#682), and no release carries them: v1.7.12 is the
      # newest and main has been untouched since 2026-04-19, so a version bump
      # is not the fix. The regex is scoped to those two labels, so a typo in
      # any other label still fails. Delete the flag once a release ships #682.
      - name: Workflows (actionlint)
        continue-on-error: true
        run: |
          (
            actionlint -color \
              -ignore 'label "ubuntu-26\.04(-arm)?" is unknown'
          ) || { echo "Workflows (actionlint)" >> /tmp/_ci_failures; exit 1; }

      # Workflow SECURITY audit; actionlint above is a correctness linter and
      # does not overlap. Offline mode: no GitHub API calls, so no token and no
      # rate-limit flakes. A repo needing a suppression commits its own
      # .github/zizmor.yml with the rationale; none is synced, because a
      # scan of every consumer repo measured all clean at the default persona.
      - name: Audit workflows (zizmor)
        continue-on-error: true
        run: |
          (
            zizmor --no-online-audits .
          ) || { echo "Audit workflows (zizmor)" >> /tmp/_ci_failures; exit 1; }

      # Working-tree secret scan. The full-history pass is a separate advisory
      # scan in security-scan.yaml: this one gates, so it stays fast and
      # tree-scoped.
      - name: Scan for secrets (gitleaks)
        continue-on-error: true
        run: |
          (
            # renovate: datasource=github-releases depName=gitleaks/gitleaks
            VERSION=v8.30.1
            curl -fsSL --connect-timeout 10 --max-time 30 \
              --retry 7 --retry-max-time 150 --retry-all-errors \
              -o "$RUNNER_TEMP/gitleaks.tgz" \
              "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz"
            tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /tmp gitleaks
            /tmp/gitleaks dir . --no-banner --redact --exit-code 1
          ) || { echo "Scan for secrets (gitleaks)" >> /tmp/_ci_failures; exit 1; }

      # A local action is available while this repository validates the commit
      # that introduces it. Consumers use the released action because their
      # checkout does not contain cplieger/ci's action directory.
      - name: Comment ratio
        if: ${{ github.repository == 'cplieger/ci' }}
        continue-on-error: true
        uses: ./actions/comment-audit

      - name: Comment ratio
        if: ${{ github.repository != 'cplieger/ci' }}
        continue-on-error: true
        uses: cplieger/ci/actions/comment-audit@90cbc4ac97877a74fda78b9dc905e68138764da0 # v3

      # No denylist, unlike comment-audit: a NOTICE is owed by every repo.
      - name: NOTICE audit
        if: ${{ github.repository == 'cplieger/ci' }}
        continue-on-error: true
        uses: ./actions/notice-audit

      # The runner resolves every `uses:` at job setup, before any `if:`, so
      # this consumer arm must pin a tag that already contains the action.
      - name: NOTICE audit
        if: ${{ github.repository != 'cplieger/ci' }}
        continue-on-error: true
        uses: cplieger/ci/actions/notice-audit@90cbc4ac97877a74fda78b9dc905e68138764da0 # v3

      # The dashboard check comes from this workflow's own commit, so it needs
      # no pin of its own.
      - name: Check out the ci source
        if: ${{ hashFiles('grafana-dashboard.json') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Dashboard check
        if: ${{ hashFiles('grafana-dashboard.json') != '' }}
        continue-on-error: true
        uses: ./.cplieger-ci/actions/dashboard-check

      - name: Check results
        if: always()
        run: |
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"

  # Markdown lint always runs (every repo has at least a README). Inline rather
  # than a separate reusable workflow so it needs no self-referencing pinned tag
  # and no per-repo config sync — the canonical rule set for consumer repos
  # lives here (it differs from the private config repo's own
  # .markdownlint.json: MD033 here allows a curated element list instead of
  # disabling the rule).
  markdown:
    needs: detect
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Install markdownlint-cli2
        run: |
          # renovate: datasource=npm depName=markdownlint-cli2
          VERSION=0.24.0
          npm install -g "markdownlint-cli2@${VERSION}"

      - name: Write markdownlint config
        run: |
          # Single-line echo (not a heredoc): heredocs in GHA run blocks break
          # silently when YAML dedent shifts the terminator. JSON on one line is
          # valid and indentation-proof.
          echo '{"default":true,"MD003":{"style":"atx"},"MD004":{"style":"dash"},"MD007":{"indent":2},"MD010":{"code_blocks":false},"MD013":false,"MD024":{"siblings_only":true},"MD025":{"front_matter_title":""},"MD029":{"style":"ordered"},"MD033":{"allowed_elements":["br","details","summary","sub","sup","img","div","a","p","kbd","picture","source"]},"MD035":{"style":"---"},"MD040":false,"MD041":false,"MD045":true,"MD046":{"style":"fenced"},"MD048":{"style":"backtick"},"MD049":{"style":"underscore"},"MD050":{"style":"asterisk"},"MD059":true}' > "$RUNNER_TEMP/.markdownlint.json"

      - name: Lint Markdown
        run: |
          markdownlint-cli2 --config "$RUNNER_TEMP/.markdownlint.json" \
            "**/*.md" "#node_modules" "#.git" "#licenses" "#**/testdata"

      # NO spell check here. A `typos` run over four sampled repos found 30
      # findings, zero real: one class is structural (envx deliberately feeds
      # `"ture"` to its parser as a malformed-input fixture) and the rest are
      # correct English the dictionary lacks (`mis-sized`). A shared allowlist
      # would grow with every new fixture and catch nothing, and per-repo
      # `_typos.toml` files pay that cost in every repo.

      # Internal link + anchor check. OFFLINE only: this resolves relative links
      # and, with --include-fragments, heading anchors. It never touches the
      # network, so it cannot go red because a third party rotted a URL, which
      # is what qualifies it to gate. External URL checking runs weekly and
      # advisory instead (weekly-links.yaml). Measured scope across the
      # cplieger repos is ~207 fragment-bearing links, so this is a small
      # deterministic check, not a backlog.
      - name: Install lychee
        run: |
          # Tag is `lychee-vX.Y.Z` (the repo is a workspace and also tags
          # lychee-lib-*), and the ASSET name carries no version. Both differ
          # from the usual release-asset pattern; getting either wrong 404s.
          # renovate: datasource=github-releases depName=lycheeverse/lychee
          VERSION=v0.24.2
          # The archive nests the binary one level deep in a target-named
          # directory, hence --strip-components=1 rather than a bare member name.
          curl -fsSL --connect-timeout 10 --max-time 60 \
            --retry 7 --retry-max-time 150 --retry-all-errors \
            -o "$RUNNER_TEMP/lychee.tgz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C /tmp --strip-components=1 \
            lychee-x86_64-unknown-linux-gnu/lychee
          sudo mv /tmp/lychee /usr/local/bin/lychee
          lychee --version

      # Directory input + --hidden + --extensions, NOT a '**/*.md' glob, and NO
      # --exclude-path .git. Both verified empirically before shipping: the
      # glob crate never traverses hidden directories (so every .github/*.md
      # was silently unchecked - a vacuous corner in a gate), and
      # --exclude-path matches by PATH PREFIX, so excluding `.git` also
      # swallows `.github/**`. `--extensions md` already keeps .git internals
      # out of scope.
      - name: Check internal links (lychee, offline)
        run: |
          lychee --offline --include-fragments --no-progress \
            --hidden --extensions md \
            --exclude-path node_modules \
            .

  # Python lint (ruff). Inline + canonical config, same rationale as markdown:
  # no self-referencing pinned tag, no per-repo config sync. Fires on any *.py
  # (e.g. cplieger/ci's audit.py + scripts/*.py).
  python:
    needs: detect
    if: ${{ needs.detect.outputs.run_python == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Install ruff
        run: |
          # renovate: datasource=pypi depName=ruff
          VERSION=0.17.4
          pipx install "ruff==${VERSION}"

      - name: Lint Python (ruff check)
        run: ruff check --output-format github .

  # Config + tooling/docs lint for repos with no go.mod/jsr.json/Dockerfile;
  # detect owns the routing. It covers their shell (lint, format, unit tests),
  # YAML, TOML and the probes. Soft-gated like shell-ci.yaml: each step records
  # its name to /tmp/_ci_failures on failure and the final step fails the job
  # if any did.
  scripts:
    needs: detect
    if: ${{ needs.detect.outputs.run_scripts == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # actionlint, zizmor and gitleaks moved to the always-run `repo` job:
      # they are repo-wide and were duplicated across four jobs.

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install yamllint
        run: |
          # renovate: datasource=pypi depName=yamllint
          VERSION=1.38.0
          pip install -q --break-system-packages "yamllint==${VERSION}"

      - name: Install shellcheck
        run: |
          # The runner's preinstalled shellcheck false-positives SC2317 on
          # trap-invoked functions (fixed in 0.11.0). Pin it like shell-ci.yaml
          # so the gate matches local tooling and stays reproducible.
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          VERSION=v0.11.0
          curl -fsSL --connect-timeout 10 --max-time 30 \
            --retry 7 --retry-max-time 150 --retry-all-errors \
            -o "$RUNNER_TEMP/shellcheck.tgz" \
            "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/shellcheck-${VERSION}.linux.x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/shellcheck.tgz" -C /tmp "shellcheck-${VERSION}/shellcheck"
          sudo mv "/tmp/shellcheck-${VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install shfmt
        run: |
          # renovate: datasource=github-releases depName=mvdan/sh
          VERSION=v3.14.1
          sudo curl -fsSL --connect-timeout 10 --max-time 30 \
            --retry 7 --retry-max-time 150 --retry-all-errors \
            -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${VERSION}/shfmt_${VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Lint shell scripts (shellcheck)
        continue-on-error: true
        run: |
          (
            files=$(find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*')
            if [ -z "$files" ]; then
              echo "shellcheck: no *.sh found - skipping"
            else
              # shellcheck disable=SC2086
              shellcheck -x -S info $files
            fi
          ) || { echo "Lint shell scripts (shellcheck)" >> /tmp/_ci_failures; exit 1; }

      - name: Format check shell scripts (shfmt)
        continue-on-error: true
        run: |
          (
            files=$(find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*')
            if [ -z "$files" ]; then
              echo "shfmt: no *.sh found - skipping"
            else
              # shellcheck disable=SC2086
              shfmt -d -i 2 -ci -bn $files
            fi
          ) || { echo "Format check shell scripts (shfmt)" >> /tmp/_ci_failures; exit 1; }

      # shell-ci.yaml's step of the same name owns this body's shape.
      - name: Run shell unit tests
        continue-on-error: true
        run: |
          (
            if [ -f tests/shell/run.sh ]; then
              bash tests/shell/run.sh
            else
              echo "no shell unit tests in this repo - skipping"
            fi
          ) || { echo "Run shell unit tests" >> /tmp/_ci_failures; exit 1; }

      # yamllint: honour a repo-local config when present (e.g. .kiro's
      # .yamllint.yaml), else fall back to a relaxed default with a 150-char
      # line cap. Non-strict, so line-length etc. surface as warnings (exit 0),
      # not failures — matching the private repos' bespoke behaviour.
      - name: Lint YAML (yamllint)
        continue-on-error: true
        run: |
          (
            if [ -f .yamllint ] || [ -f .yamllint.yaml ] || [ -f .yamllint.yml ]; then
              yamllint .
            else
              yamllint -d "{extends: relaxed, rules: {line-length: {max: 150}}}" .
            fi
          ) || { echo "Lint YAML (yamllint)" >> /tmp/_ci_failures; exit 1; }

      - name: Validate TOML
        continue-on-error: true
        run: |
          (
            python3 -c "
          import tomllib, pathlib
          for p in pathlib.Path('.').rglob('*.toml'):
              if '.git' in p.parts:
                  continue
              tomllib.loads(p.read_text())
          "
          ) || { echo "Validate TOML" >> /tmp/_ci_failures; exit 1; }

      # git-cliff semantics probe (opt-in by file presence; today only
      # cplieger/ci ships it). Every consumer's release boolean depends on
      # UNDOCUMENTED git-cliff bump behaviors (see the probe's header); this
      # step re-verifies them against the pinned binary and the shipped
      # consumer cliff config, so a Renovate bump of the git-cliff pin (or a
      # cliff-config edit) cannot merge if the new combination breaks the
      # release-gate contract.
      - name: Probe git-cliff bump semantics
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test-cliff-bump-semantics.sh ]; then
              bash scripts/test-cliff-bump-semantics.sh
            else
              echo "no cliff semantics probe in this repo - skipping"
            fi
          ) || { echo "Probe git-cliff bump semantics" >> /tmp/_ci_failures; exit 1; }

      # Lane and web-probe shell-semantics probe (opt-in by file presence).
      # The cliff probe above pins the git-cliff side of the lane contract;
      # this one pins the SHELL side that release.yaml and the meta ci.yaml
      # embed inline (lane discovery eligibility, changed-path classification,
      # module-path verification, version guards, escaping, the web-frontend
      # probe's folder order and the go-os runner detection), so an edit to the
      # prune list, the classification loop, the probe folders or the OS file
      # rule cannot merge if it breaks the pinned contract.
      - name: Probe lane and web-probe shell semantics
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test-lane-semantics.sh ]; then
              bash scripts/test-lane-semantics.sh
            else
              echo "no lane semantics probe in this repo - skipping"
            fi
          ) || { echo "Probe lane and web-probe shell semantics" >> /tmp/_ci_failures; exit 1; }

      # verify-publish shell-semantics probe (opt-in by file presence). The
      # release gate's registry read-back is pure shell that nothing else
      # executes, and its function signatures are invisible to shellcheck: a
      # probe/probe_ts arity drift once failed every TypeScript release under
      # set -u with the linters clean. The probe EXTRACTS the step body out of
      # release.yaml at runtime and drives it against a stub curl, so what is
      # tested cannot drift away from what ships.
      - name: Probe verify-publish shell semantics
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test-verify-publish.sh ]; then
              bash scripts/test-verify-publish.sh
            else
              echo "no verify-publish probe in this repo - skipping"
            fi
          ) || { echo "Probe verify-publish shell semantics" >> /tmp/_ci_failures; exit 1; }

      # docker-release promotion-path probe (opt-in by file presence): the
      # channel tag and publish decision, the stable channel's digest walk
      # (per-commit purity, so a reverted shipped change still rebuilds) and
      # the BUILD_VERSION stamp. Same extract-and-execute shape as the probe
      # above, for the same reason.
      - name: Probe docker-release shell semantics
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-docker-release.sh ]; then
              bash scripts/test-docker-release.sh
            else
              echo "no docker-release probe in this repo - skipping"
            fi
          ) || { echo "Probe docker-release shell semantics" >> /tmp/_ci_failures; exit 1; }

      # The release path-significance script and the ci-source checkout that
      # ships it; `-f` + `bash`, so a non-executable file cannot skip silently.
      - name: Probe release path significance
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-path-significance.sh ]; then
              bash scripts/test-path-significance.sh
            else
              echo "no path-significance probe in this repo - skipping"
            fi
          ) || { echo "Probe release path significance" >> /tmp/_ci_failures; exit 1; }

      - name: Probe reconciliation recogniser
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-reconciliation.sh ]; then
              bash scripts/test-reconciliation.sh
            else
              echo "no reconciliation probe in this repo - skipping"
            fi
          ) || { echo "Probe reconciliation recogniser" >> /tmp/_ci_failures; exit 1; }

      - name: Probe release notes renderer
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-render-notes.sh ]; then
              bash scripts/test-render-notes.sh
            else
              echo "no release notes probe in this repo - skipping"
            fi
          ) || { echo "Probe release notes renderer" >> /tmp/_ci_failures; exit 1; }

      - name: Probe release detect state machine
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-release-detect.sh ]; then
              bash scripts/test-release-detect.sh
            else
              echo "no release detect probe in this repo - skipping"
            fi
          ) || { echo "Probe release detect state machine" >> /tmp/_ci_failures; exit 1; }

      - name: Probe two-branch release model end to end
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-release-model.sh ]; then
              bash scripts/test-release-model.sh
            else
              echo "no release model probe in this repo - skipping"
            fi
          ) || { echo "Probe two-branch release model end to end" >> /tmp/_ci_failures; exit 1; }

      # The docker job's two image-test steps are shell nothing else executes
      # here; the probe extracts and runs them against fixture checkouts.
      # Gated on `-f` + `bash` because an `-x` gate would skip silently.
      - name: Probe image-test slot
        continue-on-error: true
        run: |
          set -euo pipefail
          (
            if [ -f scripts/test-image-test-slot.sh ]; then
              bash scripts/test-image-test-slot.sh
            else
              echo "no image-test slot probe in this repo - skipping"
            fi
          ) || { echo "Probe image-test slot" >> /tmp/_ci_failures; exit 1; }

      # The harness (configs/shell/lib.sh) is synced into every adopting consumer,
      # so its self-test runs here at the source rather than first in N sync PRs.
      # Gated on `-f` + `bash`: the synced files are tracked 100644, so an `-x`
      # gate would skip silently and report green.
      - name: Probe shell unit-test harness
        continue-on-error: true
        run: |
          (
            if [ -f configs/shell/harness_test.sh ]; then
              bash configs/shell/harness_test.sh
            else
              echo "no shell test harness in this repo - skipping"
            fi
          ) || { echo "Probe shell unit-test harness" >> /tmp/_ci_failures; exit 1; }

      # cplieger/ci is on the comment-audit script's own denylist, so this repo's
      # "Comment ratio" step SKIPs and this probe is the scanner's only executor at
      # the source. Gated on `-f` + `python3` for the harness step's reason.
      - name: Probe comment-ratio gate
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test-comment-audit.py ]; then
              python3 scripts/test-comment-audit.py
            else
              echo "no comment-ratio probe in this repo - skipping"
            fi
          ) || { echo "Probe comment-ratio gate" >> /tmp/_ci_failures; exit 1; }

      # The NOTICE gate does run here (no denylist), but only against this
      # repo's own NOTICE; the probe is what exercises its refusals.
      - name: Probe NOTICE gate
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test-notice-audit.py ]; then
              python3 scripts/test-notice-audit.py
            else
              echo "no NOTICE probe in this repo - skipping"
            fi
          ) || { echo "Probe NOTICE gate" >> /tmp/_ci_failures; exit 1; }

      # configs/collect-licenses.sh runs in consumers' image builds and never
      # in this repo, so its fail-closed contract is measured here or nowhere.
      # Go is on the runner image; the fixture module needs no network.
      - name: Probe license collector
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test-collect-licenses.sh ]; then
              bash scripts/test-collect-licenses.sh
            else
              echo "no license-collector probe in this repo - skipping"
            fi
          ) || { echo "Probe license collector" >> /tmp/_ci_failures; exit 1; }

      # actions/dashboard-check runs only in repos that ship a dashboard, which
      # this one does not, so its rules and its CUE vet are exercised here.
      - name: Probe dashboard check
        continue-on-error: true
        run: |
          (
            if [ -f scripts/test_dashboard_check.py ]; then
              bash actions/dashboard-check/install.sh "$RUNNER_TEMP/dashboard-check" \
                && DASHBOARD_CHECK_CUE="$RUNNER_TEMP/dashboard-check/cue" \
                  DASHBOARD_CHECK_SCHEMAS="$RUNNER_TEMP/dashboard-check" \
                  python3 -m unittest -v scripts.test_dashboard_check scripts.test_dashboard_check_cli \
                    scripts.test_dashboard_publish_gate
            else
              echo "no dashboard-check probe in this repo - skipping"
            fi
          ) || { echo "Probe dashboard check" >> /tmp/_ci_failures; exit 1; }

      - name: Check results
        if: always()
        run: |
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"

  # Two-branch repositories only, so validate sees `skipped` everywhere else:
  # the PR title is the changelog line, and `main` takes machine heads only.
  # Soft-gated like the jobs above.
  pr-policy:
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.repository.default_branch == 'dev'
      && !github.event.repository.private && !github.event.repository.fork }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.base_ref == 'main' }}
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # After the head checkout, which would clear it: the intake action of
      # this workflow's own commit, as release.yaml's jobs take their scripts.
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Pull request title
        id: title
        continue-on-error: true
        uses: ./.cplieger-ci/actions/intake
        with:
          check: title
          title: ${{ github.event.pull_request.title }}

      - name: Main intake
        id: intake
        if: ${{ github.base_ref == 'main' }}
        continue-on-error: true
        uses: ./.cplieger-ci/actions/intake
        with:
          check: intake
          head-ref: ${{ github.head_ref }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      # An action that fails before its body runs, or a failed source checkout
      # that skips both, writes no marker, so each outcome is checked too.
      - name: Check results
        if: always()
        env:
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          INTAKE_OUTCOME: ${{ steps.intake.outcome }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$TITLE_OUTCOME" != success ]; then
            echo "Pull request title" >> /tmp/_ci_failures
          fi
          if [ "$INTAKE_OUTCOME" != success ] && { [ "$BASE_REF" = main ] || [ "$INTAKE_OUTCOME" != skipped ]; }; then
            echo "Pull request intake" >> /tmp/_ci_failures
          fi
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"

  # Aggregator — emits a single `ci / validate` check name that branch
  # protection rules can target (preserves the check name from the previous
  # per-type templates so existing branch-protection rules keep working
  # without per-repo updates).
  validate:
    needs: [detect, repo, go, go-nested, go-work, go-os, go-os-canary, ts, web, ts-nested, shell, deadset, deadset-canary, docker, docker-arm64, markdown, python, scripts, pr-policy]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Aggregate CI dispatch results
        env:
          DETECT: ${{ needs.detect.result }}
          REPO: ${{ needs.repo.result }}
          GO: ${{ needs.go.result }}
          GO_NESTED: ${{ needs.go-nested.result }}
          GO_WORK: ${{ needs.go-work.result }}
          GO_OS: ${{ needs.go-os.result }}
          GO_OS_CANARY: ${{ needs.go-os-canary.result }}
          TS: ${{ needs.ts.result }}
          WEB: ${{ needs.web.result }}
          TS_NESTED: ${{ needs.ts-nested.result }}
          SHELL: ${{ needs.shell.result }}
          DEADSET: ${{ needs.deadset.result }}
          DEADSET_CANARY: ${{ needs.deadset-canary.result }}
          DOCKER: ${{ needs.docker.result }}
          DOCKER_ARM64: ${{ needs.docker-arm64.result }}
          MARKDOWN: ${{ needs.markdown.result }}
          PYTHON: ${{ needs.python.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          PR_POLICY: ${{ needs.pr-policy.result }}
          TWO_BRANCH: ${{ github.event.repository.default_branch == 'dev' && !github.event.repository.private && !github.event.repository.fork }}
          CI_REPO: ${{ github.repository == 'cplieger/ci' }}
        run: |
          # detect must always succeed (it gates everything else)
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect job did not succeed: $DETECT"
            exit 1
          fi
          # Each dispatched job must succeed or be skipped by detection; repo and
          # markdown always run. success and skipped pass alike, so the summary counts
          # them, which exposes a blind detection that skipped everything.
          ran=0
          skipped=0
          set -- "repo=$REPO" "go=$GO" "go-nested=$GO_NESTED" "go-work=$GO_WORK" "go-os=$GO_OS" "ts=$TS" "web=$WEB" "ts-nested=$TS_NESTED" "shell=$SHELL" "deadset=$DEADSET" "docker=$DOCKER" "docker-arm64=$DOCKER_ARM64" "markdown=$MARKDOWN" "python=$PYTHON" "scripts=$SCRIPTS"
          # pr-policy runs on two-branch repositories only, so only there is it
          # counted and listed.
          if [ "$TWO_BRANCH" = true ]; then
            set -- "$@" "pr-policy=$PR_POLICY"
          fi
          if [ "$CI_REPO" = true ]; then
            set -- "$@" "deadset-canary=$DEADSET_CANARY" "go-os-canary=$GO_OS_CANARY"
          fi
          for pair in "$@"; do
            name="${pair%%=*}"; result="${pair##*=}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name job: $result"
              exit 1
            fi
            if [ "$result" = "skipped" ]; then
              skipped=$((skipped + 1))
            else
              ran=$((ran + 1))
            fi
            echo "  $name: $result"
          done
          echo "All dispatched CI jobs passed (or skipped per auto-detect)"
          echo "ran $ran / skipped $skipped"
          {
            echo "## CI validate"
            echo ""
            echo "**ran $ran / skipped $skipped** (of $# dispatched jobs; detect: $DETECT)"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            for pair in "$@"; do
              echo "| ${pair%%=*} | ${pair##*=} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
