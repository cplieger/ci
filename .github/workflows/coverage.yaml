name: Coverage

# Reusable coverage workflow. A consumer's synced `coverage.yml` calls this on
# push to main (+ manual dispatch). It measures real statement coverage and
# publishes a shields `endpoint` badge JSON to an orphan `badges` branch using
# the built-in GITHUB_TOKEN — no external service and no per-repo secret. The
# README badge reads it via:
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/cplieger/REPO/badges/coverage.json
#
# Go:  go test -coverpkg=./...  (cross-package attribution; includes classic,
#      rapid property, and fuzz-seed tests — everything `go test` runs).
# TS:  vitest v8 coverage (statements).
# Only synced to Go/TS repos (the sync group excludes shell/Dockerfile-only
# repos), so there is always a measurable surface.
#
# Two jobs, and the split is deliberate:
#
#   coverage            the badge. Surface detection is root-only and yields a
#                       single `kind`, so it measures exactly one surface.
#   coverage-ts-nested  a HYBRID repo's nested TypeScript surface, measured and
#                       reported but NOT gated and NOT badged. See its header.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the badge JSON to the orphan `badges` branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Detect surface
        id: d
        run: |
          if [ -f go.mod ]; then
            echo 'kind=go' >> "$GITHUB_OUTPUT"
          elif [ -f jsr.json ] || [ -f package.json ]; then
            echo 'kind=ts' >> "$GITHUB_OUTPUT"
          else
            echo 'kind=none' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: ${{ steps.d.outputs.kind == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Measure Go coverage
        if: ${{ steps.d.outputs.kind == 'go' }}
        run: |
          # -coverpkg=./... attributes coverage across packages (so integration
          # tests that exercise internal packages count). atomic mode is needed
          # with -coverpkg under -race-style instrumentation.
          go test -covermode=atomic -coverpkg=./... -coverprofile=cover.out -timeout 600s ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "PCT=${pct}" >> "$GITHUB_ENV"

      - name: Measure TS coverage
        if: ${{ steps.d.outputs.kind == 'ts' }}
        run: |
          # Strict npm ci (no npm-install fallback): a drifted lockfile should
          # fail loudly here exactly as it does in ts-ci.yaml.
          npm ci
          npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=json-summary
          pct=$(node -e "process.stdout.write(String(require('./coverage/coverage-summary.json').total.statements.pct))")
          echo "PCT=${pct}" >> "$GITHUB_ENV"

      - name: Render badge JSON
        id: badge
        if: ${{ steps.d.outputs.kind != 'none' }}
        env:
          PCT: ${{ env.PCT }}
        run: |
          # Color thresholds (integer part only).
          pct_int=${PCT%.*}
          : "${pct_int:=0}"
          if [ "$pct_int" -ge 90 ]; then color=brightgreen
          elif [ "$pct_int" -ge 80 ]; then color=green
          elif [ "$pct_int" -ge 60 ]; then color=yellow
          elif [ "$pct_int" -ge 40 ]; then color=orange
          else color=red
          fi

          # Single-line printf (NOT a heredoc): heredocs in GHA run blocks break
          # when YAML dedent shifts the terminator. JSON on one line is safe.
          # Label is lowercase "test coverage" to match the other shields
          # badges (e.g. the "mutation" endpoint), which render lowercase labels.
          printf 'json={"schemaVersion":1,"label":"test coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$color" >> "$GITHUB_OUTPUT"
          echo "coverage badge: ${PCT}% (${color})"

      # Publish via the shared sibling-preserving composite action so
      # coverage.json and mutation.json coexist on the orphan `badges` branch
      # instead of clobbering each other. GITHUB_TOKEN (contents: write) can
      # push to the same repo. Renovate bumps the SHA pin after each tag
      # move.
      - name: Publish coverage badge
        if: ${{ steps.d.outputs.kind != 'none' }}
        uses: cplieger/ci/actions/publish-badge@3dd19a697bdcf34cfebeb68154c99e1e74c99892 # v2
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          filename: coverage.json
          json: ${{ steps.badge.outputs.json }}


  # A hybrid repo — root `go.mod` plus a TypeScript package in a subdirectory —
  # has a SECOND measurable surface that the badge job structurally cannot see.
  # Its `Detect surface` step reads the repo ROOT and emits one `kind`, so a root
  # `go.mod` classifies the whole repo as Go and the nested package is never
  # measured. Consequence: subflux's coverage badge has always been a Go number,
  # and its own per-file TypeScript coverage gate has never had an executor
  # anywhere in CI — it looked configured and measured nothing.
  #
  # This job measures that surface and reports it. It deliberately does NOT gate:
  #
  #   - `continue-on-error: true` at JOB level, so nothing here can fail the
  #     workflow run. That covers what no in-body guard can — a job timeout, a
  #     runner OOM, a browser install that dies. A surface that has never been
  #     measured has never been kept green either, so some of these packages
  #     fail their own per-file thresholds on genuinely uncovered code, and a
  #     gate would redden their main branch the day it landed. The count is
  #     deliberately not recorded here: it moves as each package is worked, and
  #     a number in a comment would be wrong within the week.
  #   - its own job, so a browser-mode suite cannot eat the badge job's budget,
  #     and so the badge path above is byte-for-byte unchanged.
  #   - `contents: read`: no badge is published. The number goes to the job
  #     summary.
  #
  # Deliberately left for follow-ups, because each is a decision rather than a
  # mechanism: publishing a second `coverage-ts.json` badge (nothing reads it
  # until each README is edited), and the opt-in that turns this into a gate once
  # a package's own thresholds are green.
  coverage-ts-nested:
    runs-on: ubuntu-24.04
    # Generous on purpose: this leg pays npm ci + a Chromium install + a
    # browser-mode suite under coverage instrumentation on top of each other,
    # and a timeout here would measure nothing rather than measure something
    # slowly. Job-level continue-on-error is what makes an overrun contained
    # instead of red — no in-body guard can catch a timeout.
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in .git/config
          # (zizmor: artipacked).
          persist-credentials: false

      - name: Detect nested TS surfaces
        id: n
        run: |
          # Scoped to hybrid repos on purpose: a root `go.mod` is what makes the
          # badge job's root-only `kind` wrong. A pure-TS repo's root surface is
          # already measured there, so this job has nothing to add and exits.
          dirs=""
          if [ -f go.mod ]; then
            # A nested TS surface is a tracked vitest config below the root with
            # a package.json beside it. Both pathspecs are basename-exact: git
            # pathspecs are wildmatch WITHOUT WM_PATHNAME, so `*` crosses dots
            # and slashes and a bare '*vitest.config.*' would also match
            # `myvitest.config.ts`.
            while IFS= read -r cfg; do
              [ -n "$cfg" ] || continue
              d=$(dirname "$cfg")
              [ "$d" = "." ] && continue
              [ -f "$d/package.json" ] || continue
              case " $dirs " in *" $d "*) continue ;; esac
              dirs="${dirs:+$dirs }$d"
            done < <(git ls-files 'vitest.config.*' '*/vitest.config.*' \
              | grep -Ev '(^|/)(node_modules|vendor|dist)/' || true)
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          if [ -z "$dirs" ]; then
            echo "No nested TypeScript surface (not a hybrid repo, or no nested vitest config)."
          else
            echo "Nested TypeScript surface(s): $dirs"
          fi

      - name: Measure nested TS coverage (advisory)
        if: ${{ steps.n.outputs.dirs != '' }}
        env:
          TS_DIRS: ${{ steps.n.outputs.dirs }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          tmp="${RUNNER_TEMP:-/tmp}"
          {
            echo "## Nested TypeScript coverage (advisory)"
            echo ""
            echo "| Package dir | Statements | Per-file gate |"
            echo "| --- | --- | --- |"
          } >> "$summary"

          read -r -a dirs <<< "$TS_DIRS"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            pct=""
            gate=""
            log="$tmp/ts-cov-$(printf '%s' "$d" | tr / -).log"

            if [ ! -f "$d/package-lock.json" ]; then
              gate="not measured: no package-lock.json"
              echo "::warning::$d has a vitest config but no package-lock.json; cannot install"
            elif ! ( cd "$d" && npm ci ) > "$log" 2>&1; then
              gate="not measured: npm ci failed"
              echo "::warning::$d: npm ci failed"
              tail -40 "$log"
            else
              # Vitest Browser Mode runs DOM tests in a real Chromium, so a
              # browser-mode package measures NOTHING without one — and most of
              # the fleet's nested TS packages are browser-mode, which would have
              # made this whole leg vacuous. Enrolment is the package's own
              # `@vitest/browser-playwright` devDependency, driven through its own
              # pinned playwright CLI: the same presence-is-enrolment shape, and
              # the same `--no-install` reasoning, as ts-ci.yaml's browser step.
              browser_dep="const v=require('./package.json').devDependencies||{};"
              browser_dep="$browser_dep process.exit(v['@vitest/browser-playwright']?0:1)"
              if ( cd "$d" && node -e "$browser_dep" ); then
                ( cd "$d" && npx --no-install playwright install --with-deps chromium ) >> "$log" 2>&1 \
                  || echo "::warning::$d: browser install failed; the run below may measure nothing"
              fi

              # The exit status is captured for the GATE verdict only, never to
              # decide whether a number exists: vitest writes
              # coverage-summary.json BEFORE evaluating its thresholds, so a
              # package failing its own per-file gate still leaves a complete,
              # honest summary behind (measured on vitest 4.1.11).
              rc=0
              ( cd "$d" && npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=json-summary ) >> "$log" 2>&1 || rc=$?
              tail -60 "$log"

              read_pct="const s=require('./coverage/coverage-summary.json');"
              read_pct="$read_pct process.stdout.write(String(s.total.statements.pct))"
              if pct=$( ( cd "$d" && node -e "$read_pct" ) 2>/dev/null ) \
                && [ -n "$pct" ]; then
                # A threshold line names the offending file last:
                #   ERROR: Coverage for lines (0%) does not meet ... for src/b.ts
                below=$(awk '/does not meet/ {print $NF}' "$log" | LC_ALL=C sort -u | wc -l | tr -d ' ')
                if [ "$rc" -eq 0 ]; then
                  gate="would pass"
                elif [ "$below" -gt 0 ]; then
                  gate="would fail: $below file(s) below threshold"
                else
                  gate="suite failed (not a coverage gate)"
                  echo "::warning::$d: the vitest run failed for a reason other than a coverage threshold"
                fi
              else
                pct=""
                gate="not measured: no coverage summary produced"
                echo "::warning::$d: vitest produced no coverage summary"
              fi
            fi

            disp="—"
            [ -n "$pct" ] && disp="${pct}%"
            echo "| \`$d\` | $disp | $gate |" >> "$summary"
            echo "nested TS coverage: $d statements=${pct:-n/a} gate=$gate"
          done

          {
            echo ""
            echo "Advisory: this measurement does not gate, and the \`coverage.json\`"
            echo "badge on the \`badges\` branch is still the Go number."
          } >> "$summary"
