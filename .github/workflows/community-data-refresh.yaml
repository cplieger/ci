# Opens or updates one pull request per repository in REPOS
# (scripts/community_data_refresh.py) from the proposal its own
# community-data-refresh.yaml uploaded, and keeps its community-data issues in
# step with the proposal's notices. That workflow runs the refresh on the base
# branch with no secret; this one runs none of the repository's code and reads
# the artifact only as data, checked against the row. The pull request waits
# for its ci / validate and a human merge. docs/workflows.md has the proposal
# format and the issue rules; sync.yaml documents the App's secrets.
name: Community data refresh

on:
  schedule:
    # The 3rd of each month, three hours after the repositories' own refresh
    # at 05:17 UTC, which takes at most 20 minutes.
    - cron: "17 8 3 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space/comma-separated repo names to limit the run. Empty runs every listed repository."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Plan the repositories
        id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py plan --only "$ONLY"

  propose:
    name: propose (${{ matrix.repo }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    # One writer at a time per repository's refresh branch.
    concurrency:
      group: community-data-refresh-${{ matrix.repo }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # Another repository's artifacts need actions: read on it, and check reads
      # its community-data issues.
      - name: Mint the read token
        id: read-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: cplieger
          repositories: ${{ matrix.repo }}
          permission-actions: read
          permission-issues: read

      - name: Find the refresh run
        id: run
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py locate --repo "$REPO"

      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: community-data-refresh
          path: ${{ runner.temp }}/proposal
          github-token: ${{ steps.read-token.outputs.token }}
          repository: cplieger/${{ matrix.repo }}
          run-id: ${{ steps.run.outputs.run-id }}

      - name: Check the proposal
        id: check
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPO: ${{ matrix.repo }}
          PROPOSAL: ${{ runner.temp }}/proposal
          PLAN: ${{ runner.temp }}/issues.json
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py check --repo "$REPO" --proposal "$PROPOSAL" --plan "$PLAN"

      # The App token: a pull request the workflow token opens starts no CI run,
      # and the workflow token cannot write to another repository's issues.
      - name: Mint the App token
        if: steps.check.outputs.changed == 'true' || steps.check.outputs.notices_changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: cplieger
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Write the notices' issues
        if: steps.check.outputs.notices_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ matrix.repo }}
          PLAN: ${{ runner.temp }}/issues.json
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py issues --repo "$REPO" --plan "$PLAN"

      - name: Propose cplieger/${{ matrix.repo }}'s refresh
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ steps.run.outputs.base }}
          PROPOSAL: ${{ runner.temp }}/proposal
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py propose --repo "$REPO" --base "$BASE" --proposal "$PROPOSAL" --bot "${APP_SLUG}[bot]"

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [plan, propose]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      scope: ${{ inputs.only }}
