# Runs each repository's own refresh of the community data it ships (REPOS in
# scripts/community_data_refresh.py; langtag's CLDR tables) and proposes the
# result as one pull request against its base branch, which waits for its
# ci / validate and a human merge. The command contract is in docs/workflows.md.
#
# The refresh job runs the repository's code and holds no App token; the
# propose job holds the token, scoped to that one repository, and runs only
# this repository's script over the refresh job's artifact. sync.yaml
# documents the App's secrets.
name: Community data refresh

on:
  schedule:
    - cron: "17 5 3 * *"   # the 3rd of each month, 05:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Space/comma-separated repo names to limit the run. Empty runs every listed repository."
        type: string
        required: false
        default: ""
      args:
        description: "Space-separated arguments for the refresh command of the one repository in only, such as -release release-48 for langtag"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan the repositories
        id: plan
        env:
          ONLY: ${{ inputs.only }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py plan --only "$ONLY" --args "$ARGS"

  refresh:
    name: refresh (${{ matrix.repo }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cplieger/${{ matrix.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cplieger/${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          path: target
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: target/go.mod
          # No cache: this job's output becomes a pull request, and a restored
          # cache is a write path into it (zizmor: cache-poisoning).
          cache: false

      # The command gets this job's token for its GitHub API reads: it holds
      # contents: read on cplieger/ci, a public repository, and nothing else.
      - name: Run the refresh command
        env:
          COMMAND: ${{ matrix.command }}
          ARGS: ${{ inputs.args }}
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_OUT: ${{ runner.temp }}/refresh-out
        run: |
          set -euo pipefail
          mkdir "$REFRESH_OUT"
          read -ra args <<< "$ARGS"
          cd target
          bash -c "${COMMAND}"' "$@"' refresh "${args[@]}"

      - name: Package the proposal
        env:
          REFRESH_OUT: ${{ runner.temp }}/refresh-out
          PROPOSAL: ${{ runner.temp }}/proposal
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py package --tree target --text "$REFRESH_OUT" --out "$PROPOSAL"

      - name: Upload the proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-${{ matrix.repo }}
          path: ${{ runner.temp }}/proposal
          # upload-artifact drops dotfiles by default, and a refresh may change one.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # A failed refresh leg leaves its propose leg no artifact to download, so
  # that leg fails too while the other repositories' legs still propose.
  propose:
    name: propose (${{ matrix.repo }})
    needs: [plan, refresh]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    # One writer at a time per repository's refresh branch.
    concurrency:
      group: community-data-refresh-${{ matrix.repo }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-${{ matrix.repo }}
          path: ${{ runner.temp }}/proposal

      - name: Check the proposal
        id: check
        env:
          PROPOSAL: ${{ runner.temp }}/proposal
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py check --proposal "$PROPOSAL"

      # The App token: a pull request the workflow token opens starts no CI run.
      - name: Mint the App token
        if: steps.check.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: cplieger
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose cplieger/${{ matrix.repo }}'s refresh
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ matrix.repo }}
          PROPOSAL: ${{ runner.temp }}/proposal
        run: |
          set -euo pipefail
          python3 scripts/community_data_refresh.py propose --repo "$REPO" --proposal "$PROPOSAL" --bot "${APP_SLUG}[bot]"

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [plan, refresh, propose]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      scope: ${{ inputs.only }}
