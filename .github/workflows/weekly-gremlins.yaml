# Weekly mutation testing across all Go-having cplieger consumer repos. Runs
# happen here rather than by cross-repo workflow_dispatch, so one place bounds
# concurrency. Each repo is one call of mutation-gremlins-repo.yaml, so one
# repo's failure ends only its own call.
name: Weekly gremlins

on:
  schedule:
    - cron: "0 22 * * 0"   # Sunday 22:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma/space-separated repo names to limit the run (for testing a fix). Empty runs every public cplieger repo."
        required: false
        default: ""

permissions:
  contents: read
  # Issue ops happen in CONSUMER repos via CI_SCHEDULE PAT, not GITHUB_TOKEN.

concurrency:
  group: weekly-gremlins
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      repos: ${{ steps.fanout.outputs.repos }}
    steps:
      - name: Discover Go-having repos with non-trivial source
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Injected via env (not inline ${{ }} in the script) so a crafted
          # dispatch input can't expand into shell code (template injection).
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          # Repo discovery over REST, not the GraphQL `gh repo list`: the fanout
          # is a single point of failure for the whole run, and GraphQL shares a
          # quota the per-repo reads draw too, so a quota exhaustion there loses
          # every repo at once. Forks are excluded (same rule as
          # scripts/audit.py): a fork carries UPSTREAM's code and tests, so its
          # mutation score measures someone else's suite and its tracker issue
          # would be unactionable. Public only: this repository's run logs and
          # artifacts are world-readable (CONTRIBUTING.md).
          repos=$(gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq '
            .[] | select(.archived == false and .fork == false and .visibility == "public") | .name
          ')

          # Optional manual filter: the workflow_dispatch 'only' input limits the
          # matrix to named repos (fast iteration when validating a fix). The
          # scheduled run leaves it empty and covers all cplieger repos.
          if [ -n "${ONLY:-}" ]; then
            wanted=" $(echo "$ONLY" | tr ',' ' ') "
            filtered=""
            for r in $repos; do
              case "$wanted" in *" $r "*) filtered="$filtered $r" ;; esac
            done
            repos="$filtered"
            echo "manual 'only' filter active -> ${repos:-<none matched>}"
          fi

          # Keep repos that:
          #   - have go.mod at root
          #   - have at least 200 LOC of non-test Go (heuristic to skip tiny
          #     repos like db-dumper where mutation testing yields nothing)
          # A repo whose reads fail runs all the same: its own call then fails
          # visibly if the repo cannot be tested, and the others run on.
          GO_REPOS=()
          fault() {
            echo "::warning::$1"
            echo "### $1" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          for r in $repos; do
            if ! err=$(gh api "/repos/cplieger/${r}/contents/go.mod" --silent 2>&1); then
              case "$err" in *"(HTTP 404)"*) continue ;; esac
              fault "${r}: its go.mod lookup failed, so it runs, and its call fails if it has no Go module"
              GO_REPOS+=("$r")
              continue
            fi
            if ! loc=$(gh api "/repos/cplieger/${r}/git/trees/HEAD?recursive=1" \
              --jq 'if .truncated then "truncated" else
                [.tree[] | select(.type=="blob" and (.path | test("\\.go$") and (test("_test\\.go$") | not)))] | map(.size // 0) | add // 0
              end' 2>/dev/null); then
              fault "${r}: its source tree could not be read, so it runs whatever its size"
              GO_REPOS+=("$r")
              continue
            fi
            # A truncated tree lists only a prefix, so its byte count is no size.
            if [ "$loc" = truncated ]; then
              fault "${r}: its source tree is truncated, so it runs whatever its size"
              GO_REPOS+=("$r")
              continue
            fi
            # Bytes ~ 50/line for typical Go; 200 LOC ≈ 10000 bytes
            if [ "${loc:-0}" -ge 10000 ]; then
              GO_REPOS+=("$r")
              echo "  include: ${r} (${loc} bytes of non-test Go)"
            else
              echo "  skip:    ${r} (${loc} bytes — below 200 LOC threshold)"
            fi
          done

          # select() drops the one empty line printf gives an empty list.
          repos_json=$(printf '%s\n' "${GO_REPOS[@]}" | jq -R 'select(length > 0)' | jq -s -c .)
          echo "repos=${repos_json}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Total repos: $(echo "$repos_json" | jq 'length')"
          if [ "${#GO_REPOS[@]}" -eq 0 ]; then
            echo "::error::no Go repo was found to run, so this run tests nothing"
            echo "### no Go repo was found to run, so this run tests nothing" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

  repo:
    name: gremlins (${{ matrix.repo }})
    needs: fanout
    strategy:
      fail-fast: false
      # Each call runs up to 6 jobs at once: 12 of the account's 20, leaving
      # >=4 for ad-hoc PR work.
      max-parallel: 2
      matrix:
        repo: ${{ fromJSON(needs.fanout.outputs.repos) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/mutation-gremlins-repo.yaml
    with:
      repository: ${{ matrix.repo }}
    secrets:
      CI_SCHEDULE: ${{ secrets.CI_SCHEDULE }}

  # Reads each call's result on its own, so a missing or unreadable one is
  # named for its repo and the rest are still summarised, and fails unless
  # every call's record earned `passed` (scripts/mutation-summary.py fleet).
  # Each call names its file by its key, so the merged download keeps them apart.
  summary:
    needs: [fanout, repo]
    if: ${{ !cancelled() && needs.fanout.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download every call's result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          pattern: gremlinsresult-*
          merge-multiple: true

      # A whole-repo call's key is its repo name (scripts/mutation_cost.py entry_key).
      - name: Summarise the fleet
        env:
          REPOS: ${{ needs.fanout.outputs.repos }}
        run: python3 scripts/mutation-summary.py fleet --tool gremlins --keys "${REPOS}" --results results

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, repo, summary]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      scope: ${{ inputs.only }}
