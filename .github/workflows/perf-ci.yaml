name: Performance

# The tier 2 performance gate of a repository that carries tests/perf/plan.json:
# plan, build once, measure in shards, compare against tests/perf/budgets.json,
# re-measure a red time or memory cell on new runners, then judge it on six
# reps. scripts/perf_gate.py owns the rule; the repository owns build.sh,
# run.sh, the scenarios and the budgets.

on:
  workflow_call:
    inputs:
      repository:
        description: The measured repository; empty is the caller's.
        type: string
        default: ''
      ref:
        description: The ref to measure; empty is the event's commit.
        type: string
        default: ''
      set:
        description: >-
          The plan.json set to measure; empty measures `pr` on a pull request or a
          merge queue and nothing on any other event.
        type: string
        default: ''
      only:
        description: Comma or space separated scenarios of the set to keep; empty keeps all.
        type: string
        default: ''
      runs:
        description: How many times to measure the set; more than one only calibrates.
        type: number
        default: 1
      mode:
        description: >-
          `gate` compares and judges; `calibrate` measures only, for
          perf-calibrate.yaml to read the results.
        type: string
        default: gate
      max-parallel:
        description: The most measure jobs at once.
        type: number
        default: 20
      runner:
        description: >-
          The runner label for every job that can leave GitHub's hosted runners,
          such as a self-hosted pool's; empty runs them on ubuntu-26.04. A pool the
          budgets do not name is reported and never gated.
        type: string
        default: ''
    outputs:
      prefix:
        description: The artifact prefix of this call, `perf-results-<prefix>-measure-*` naming its results.
        value: ${{ jobs.plan.outputs.prefix }}
      sha:
        description: The measured commit.
        value: ${{ jobs.plan.outputs.sha }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4

jobs:
  # Hosted, because cosign-installer runs envsubst, which GitHub's runner image
  # lacks; compare downloads the same release and accepts it only if it matches
  # the digest the installer verified here.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      set: ${{ steps.plan.outputs.set }}
      matrix: ${{ steps.plan.outputs.matrix }}
      node: ${{ steps.plan.outputs.node }}
      prefix: ${{ steps.plan.outputs.prefix }}
      sha: ${{ steps.plan.outputs.sha }}
      cosign-sha256: ${{ steps.cosign.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Plan
        id: plan
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          EVENT: ${{ github.event_name }}
          SET: ${{ inputs.set }}
          ONLY: ${{ inputs.only }}
          RUNS: ${{ inputs.runs }}
          REPO: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "prefix=${REPO//\//-}" >> "$GITHUB_OUTPUT"
          # A push measures nothing: its pull request measured the change, and the
          # weekly run measures the default branch.
          if [ -z "$SET" ] && { [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; }; then
            SET='pr'
          fi
          if [ -z "$SET" ] || [ ! -f tests/perf/plan.json ]; then
            echo "set=" >> "$GITHUB_OUTPUT"
            echo "nothing to measure on ${EVENT}"
            exit 0
          fi
          python3 "$CI_TOOLS/perf_gate.py" --plan tests/perf/plan.json --set "$SET" \
            --only "$ONLY" --runs "$RUNS" --out "$RUNNER_TEMP/matrix.json" --outputs "$GITHUB_OUTPUT"
          echo "set=${SET}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ steps.plan.outputs.set != '' && inputs.mode == 'gate' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Record the verified cosign's digest
        id: cosign
        if: ${{ steps.plan.outputs.set != '' && inputs.mode == 'gate' }}
        run: |
          set -euo pipefail
          sum=$(sha256sum "$(command -v cosign)")
          echo "sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.set != '' }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ needs.plan.outputs.node }}/package-lock.json

      - name: Build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/perf-build"
          mkdir -p "$out"
          tests/perf/build.sh "$out"
          tar -cf "$RUNNER_TEMP/perf-build.tar" -C "$out" .

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-build-${{ needs.plan.outputs.prefix }}
          path: ${{ runner.temp }}/perf-build.tar
          if-no-files-found: error
          retention-days: 1

  measure:
    needs: [plan, build]
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/perf-measure.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ needs.plan.outputs.sha }}
      name: ${{ needs.plan.outputs.prefix }}-measure-${{ matrix.name }}
      cells: ${{ toJSON(matrix.cells) }}
      node: ${{ needs.plan.outputs.node }}
      build-artifact: perf-build-${{ needs.plan.outputs.prefix }}
      runner: ${{ inputs.runner }}

  compare:
    needs: [plan, measure]
    if: ${{ !cancelled() && inputs.mode == 'gate' && needs.plan.outputs.set != '' }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 15
    outputs:
      remeasure: ${{ steps.compare.outputs.remeasure }}
      matrix: ${{ steps.compare.outputs.matrix }}
    steps:
      # The provenance check runs `git merge-base --is-ancestor` against each
      # calibrated commit and reads the base ref's budgets.json.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install cosign
        env:
          COSIGN_SHA256: ${{ needs.plan.outputs.cosign-sha256 }}
        run: |
          set -euo pipefail
          : "${COSIGN_SHA256:?the plan job recorded no verified cosign digest}"
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL --connect-timeout 10 --max-time 300 --retry 7 --retry-max-time 150 --retry-all-errors \
            -o "$bin/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $bin/cosign" | sha256sum -c -
          chmod +x "$bin/cosign"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-results-${{ needs.plan.outputs.prefix }}-measure-*
          path: ${{ runner.temp }}/results

      - name: Compare
        id: compare
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          REPO: ${{ inputs.repository || github.repository }}
          PREFIX: ${{ needs.plan.outputs.prefix }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SET: ${{ needs.plan.outputs.set }}
          ONLY: ${{ inputs.only }}
          MEASURED: ${{ needs.measure.result }}
        run: |
          set -euo pipefail
          if [ "$MEASURED" != success ]; then
            echo "::error::a measure shard ended ${MEASURED}, so the set was not measured whole"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          base="${BASE_SHA:-$head}"
          # A base without the file is an empty budget list.
          git show "${base}:tests/perf/budgets.json" > "$RUNNER_TEMP/base-budgets.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/base-budgets.json"
          python3 "$CI_TOOLS/perf_gate.py" \
            --budgets tests/perf/budgets.json \
            --base "$RUNNER_TEMP/base-budgets.json" \
            --results "$RUNNER_TEMP/results" \
            --prefix "$PREFIX" \
            --calibrations tests/perf/calibrations \
            --repo "$REPO" \
            --head "$head" \
            --plan-doc tests/perf/plan.json --set "$SET" --only "$ONLY" \
            --remeasure-out "$RUNNER_TEMP/remeasure.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 "$CI_TOOLS/perf_gate.py" --plan tests/perf/plan.json --set "$SET" \
            --remeasure "$RUNNER_TEMP/remeasure.json" --out "$RUNNER_TEMP/remeasure-matrix.json"
          if python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["cells"] else 1)' \
            "$RUNNER_TEMP/remeasure.json"; then
            echo "remeasure=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(cat "$RUNNER_TEMP/remeasure-matrix.json")" >> "$GITHUB_OUTPUT"
          else
            echo "remeasure=false" >> "$GITHUB_OUTPUT"
          fi

  # Each shard is a new job, so a red cell re-runs on another virtual machine
  # than the one whose reps were slow.
  remeasure:
    needs: [plan, compare]
    if: ${{ needs.compare.outputs.remeasure == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.compare.outputs.matrix) }}
    uses: ./.github/workflows/perf-measure.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ needs.plan.outputs.sha }}
      name: ${{ needs.plan.outputs.prefix }}-remeasure-${{ matrix.name }}
      cells: ${{ toJSON(matrix.cells) }}
      node: ${{ needs.plan.outputs.node }}
      build-artifact: perf-build-${{ needs.plan.outputs.prefix }}
      runner: ${{ inputs.runner }}

  verdict:
    needs: [plan, compare, remeasure]
    if: ${{ !cancelled() && needs.compare.outputs.remeasure == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download the first reps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-results-${{ needs.plan.outputs.prefix }}-measure-*
          path: ${{ runner.temp }}/results

      - name: Download the re-measured reps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-results-${{ needs.plan.outputs.prefix }}-remeasure-*
          path: ${{ runner.temp }}/again

      - name: Verdict
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          PREFIX: ${{ needs.plan.outputs.prefix }}
          REMEASURED: ${{ needs.remeasure.result }}
        run: |
          set -euo pipefail
          if [ "$REMEASURED" != success ]; then
            echo "::error::a remeasure shard ended ${REMEASURED}, so no red cell can be judged on six reps"
            exit 1
          fi
          python3 "$CI_TOOLS/perf_gate.py" \
            --verdict "$RUNNER_TEMP/again" \
            --budgets tests/perf/budgets.json \
            --results "$RUNNER_TEMP/results" \
            --prefix "$PREFIX" \
            --summary "$GITHUB_STEP_SUMMARY"
