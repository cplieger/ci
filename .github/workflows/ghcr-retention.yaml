# Weekly GHCR retention for the dev channel: every significant push to a dev
# branch leaves one more image version behind, and nothing else removes them.
# scripts/ghcr_retention.py deletes dev versions older than 30 days beyond the
# newest ten, never a digest that also carries `dev`, `latest` or a stable tag,
# and never an untagged version (the per-arch manifests live indexes point at).
name: GHCR retention

on:
  schedule:
    - cron: "30 5 * * 0"   # Sundays 05:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the versions that would be deleted without deleting them."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # PACKAGES_PAT (read:packages + delete:packages) is scoped to this one
      # step, which runs only this repo's script.
      - name: Delete aged dev versions
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/ghcr_retention.py "${args[@]}"

  # `needs:` must list every other job in this workflow.
  notify:
    needs: retention
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
