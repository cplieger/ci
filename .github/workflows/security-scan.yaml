name: Security Scan

on:
  workflow_call:
    inputs:
      build-context:
        description: 'Docker build context path'
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: './Dockerfile'
      severity:
        description: 'Trivy severity levels'
        type: string
        default: 'HIGH,CRITICAL'

permissions:
  contents: read

# Trivy binary version, pinned so local scans match what CI runs:
# cplieger/ci's scripts/install-local-tools.sh reads this same pin via
# `pin_version aquasecurity/trivy`. Without an explicit version the
# trivy-action installs its own baked-in default (v0.70.0 at the pinned SHA),
# which silently drifts from the binary other workflows install directly.
env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.75.0

jobs:
  trivy:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      image: ${{ steps.profile.outputs.image }}
      published: ${{ steps.profile.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Accept documented misconfig false-positives (all repos)
        # DS-0002 (no USER): distroless images bake in nonroot UID 65534; some
        # apps legitimately require root. DS-0026 (no HEALTHCHECK): healthchecks
        # are defined in compose, not the Dockerfile. Ephemeral (not committed
        # to consumer repos); Trivy auto-loads .trivyignore from the workdir.
        run: printf '%s\n' AVD-DS-0002 AVD-DS-0026 DS-0002 DS-0026 > .trivyignore

      - name: Resolve profile
        id: profile
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          REPO_FORK: ${{ github.event.repository.fork }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then echo 'image=true' >> "$GITHUB_OUTPUT"; else echo 'image=false' >> "$GITHUB_OUTPUT"; fi
          # Published mode: a two-branch repository's main is what users run, so
          # its scan reads the published :latest instead of building the tree.
          if [ "$DEFAULT_BRANCH" = dev ] && [ "$REPO_PRIVATE" != true ] && [ "$REPO_FORK" != true ] \
            && [ "$GITHUB_REF" = refs/heads/main ] && [ "$EVENT_NAME" != pull_request ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.profile.outputs.image == 'true' && steps.profile.outputs.published != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Without this the advisory scan reports on a phantom image: the build
      # below is a pure cache consumer, so it would restore a months-old
      # package layer and publish CVE findings for versions no published image
      # actually ships (or miss ones it does). See docker-release.yaml's
      # "Resolve OS package refresh key" step.
      - name: Resolve OS package refresh key
        id: pkgrefresh
        if: ${{ steps.profile.outputs.image == 'true' && steps.profile.outputs.published != 'true' }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*ARG[[:space:]]+PKG_REFRESH' "$DOCKERFILE"; then
            REFRESH="PKG_REFRESH=$(date -u +%Y-%m-%d)"
          else
            REFRESH=""
          fi
          {
            echo "build-args<<EOF"
            echo "$REFRESH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        if: ${{ steps.profile.outputs.image == 'true' && steps.profile.outputs.published != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ci-scan:latest
          build-args: ${{ steps.pkgrefresh.outputs.build-args }}
          # Pure cache consumer — no cache-to by design. This throwaway scan
          # build reads the layers the required build-ability gate (ci.yaml
          # `docker` job) exports to the same default `buildkit` scope. It must
          # not ALSO export: a redundant mode=max push to the flaky GHA cache
          # backend clobbers the gate's cache and can 504, failing this
          # otherwise-advisory job (which is exactly what happened).
          cache-from: type=gha

      # All Trivy scans here are ADVISORY (exit-code 0): base-image CVEs are often
      # outside the maintainer's control, and build-ability is gated by the
      # required `ci / validate` check instead. `secret` is ABSENT: gitleaks runs
      # `dir .` over this checkout as a required gate and Trivy skips markdown,
      # so its fs pass saw less while duplicating alerts (the IMAGE scan below
      # keeps secrets).
      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: 'vuln'
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      # Nothing else surfaces dependency licence classifications.
      # Its own step because trivy-action drops `severity` for SARIF unless
      # limit-severities-for-sarif is set, and only licence findings want the
      # filter: Trivy maps notice/permissive/unencumbered to LOW, so dropping
      # LOW keeps forbidden, restricted, reciprocal and unknown licences
      # (https://trivy.dev/latest/docs/scanner/license/).
      - name: Trivy license scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: 'license'
          severity: 'UNKNOWN,MEDIUM,HIGH,CRITICAL'
          limit-severities-for-sarif: true
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-license.sarif'

      - name: Trivy misconfig scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: 'misconfig'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-misconfig.sarif'

      # `scanners` is set EXPLICITLY rather than inherited. Trivy's own default
      # for an image target is [vuln,secret], so omitting the key silently
      # enabled secret scanning here — which is what we want, but only by
      # accident. Image-layer secret detection is unique coverage: gitleaks
      # scans git trees, so it never sees a secret that entered via a build
      # ARG, a gitignored COPY, or the base image. Trivy also carries rule
      # families gitleaks lacks (dockerconfig-secret, azure-*, maven-settings-*).
      # Pinning the value keeps a future Trivy default change from removing it.
      - name: Trivy image scan (advisory)
        if: ${{ steps.profile.outputs.image == 'true' && steps.profile.outputs.published != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: 'ci-scan:latest'
          scanners: 'vuln,secret'
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image.sarif'

      - name: Trivy filesystem scan for the main summary
        if: ${{ steps.profile.outputs.published == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: 'vuln'
          severity: ${{ inputs.severity }}
          exit-code: '0'
          format: 'json'
          output: 'trivy-fs.json'

      - name: Upload the filesystem report
        if: ${{ always() && steps.profile.outputs.published == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-fs
          path: trivy-fs.json
          retention-days: 7

      - name: Upload SARIF — filesystem
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' && github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

      - name: Upload SARIF — license
        if: ${{ always() && hashFiles('trivy-license.sarif') != '' && github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy-license.sarif'
          category: 'trivy-license'

      - name: Upload SARIF — misconfig
        if: ${{ always() && hashFiles('trivy-misconfig.sarif') != '' && github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy-misconfig.sarif'
          category: 'trivy-misconfig'

      - name: Upload SARIF — image
        if: ${{ always() && steps.profile.outputs.image == 'true' && hashFiles('trivy-image.sarif') != '' && github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'

  # The published-mode jobs below run only on a two-branch repository's main
  # (the trivy job's `published` output) and write one security-main record.
  published-image:
    needs: trivy
    if: ${{ !cancelled() && needs.trivy.outputs.published == 'true' && needs.trivy.outputs.image == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      index: ${{ steps.resolve.outputs.index }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      error: ${{ steps.resolve.outputs.error }}
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Resolve the published stable image
        id: resolve
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          python3 "$CI_TOOLS/scan_coverage.py" platforms "${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ steps.resolve.outputs.index != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The signed release SBOM is the record of what the image ships, components
      # built from source included, so the summary reads them from it.
      - name: Read the signed SBOM of the published image
        if: ${{ steps.resolve.outputs.index != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          INDEX: ${{ steps.resolve.outputs.index }}
        run: |
          set -euo pipefail
          python3 "$CI_TOOLS/scan_coverage.py" sbom "${GITHUB_REPOSITORY#*/}" "$INDEX" --out sbom.json

      - name: Upload the SBOM report
        if: ${{ always() && hashFiles('sbom.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-sbom
          path: sbom.json
          retention-days: 7

  trivy-published:
    needs: published-image
    if: >-
      ${{ !cancelled() && needs.published-image.outputs.platforms != ''
      && needs.published-image.outputs.platforms != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.published-image.outputs.platforms) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Trivy published image scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.ref }}
          scanners: 'vuln,secret'
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image.sarif'

      - name: Trivy published image scan for the main summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.ref }}
          scanners: 'vuln'
          severity: ${{ inputs.severity }}
          exit-code: '0'
          format: 'json'
          output: 'trivy-image-${{ matrix.slug }}.json'

      - name: Upload SARIF — published image
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' && github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image-published-${{ matrix.slug }}'

      - name: Upload the image report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-image-${{ matrix.slug }}
          path: trivy-image-${{ matrix.slug }}.json
          retention-days: 7

  govulncheck:
    needs: trivy
    if: ${{ !cancelled() && needs.trivy.outputs.published == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: List the Go modules
        id: modules
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          python3 "$CI_TOOLS/scan_coverage.py" go-modules > "$RUNNER_TEMP/go-modules.tsv"
          if [ -s "$RUNNER_TEMP/go-modules.tsv" ]; then echo 'any=true' >> "$GITHUB_OUTPUT"; fi

      - name: Set up Go
        if: ${{ steps.modules.outputs.any == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # GOTOOLCHAIN=auto: each module scans under the toolchain its own go.mod
      # selects, and `stable` lags a Go patch release by hours.
      - name: Run govulncheck per module (advisory)
        if: ${{ steps.modules.outputs.any == 'true' }}
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION=v1.8.0
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          mkdir -p govulncheck-reports
          : > govulncheck-reports/govulncheck-modules.tsv
          while IFS=$'\t' read -r dir slug; do
            out="govulncheck-reports/govulncheck-${slug}"
            if govulncheck -C "$dir" -format json ./... > "$out.json" 2> "$out.err"; then status=ok; else status=error; fi
            printf '%s\t%s\t%s\n' "$dir" "$slug" "$status" >> govulncheck-reports/govulncheck-modules.tsv
          done < "$RUNNER_TEMP/go-modules.tsv"

      - name: Upload the govulncheck reports
        if: ${{ always() && steps.modules.outputs.any == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-govulncheck
          path: govulncheck-reports/
          retention-days: 7

  summary:
    needs: [trivy, published-image, trivy-published, govulncheck]
    if: ${{ always() && needs.trivy.outputs.published == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Download the scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-scan-*
          path: ${{ runner.temp }}/scan-reports
          merge-multiple: true

      # Exits 1 when an expected report is missing, after writing the record.
      - name: Summarize the scan of main
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE: ${{ needs.trivy.outputs.image }}
          PLATFORMS: ${{ needs.published-image.outputs.platforms }}
          INDEX: ${{ needs.published-image.outputs.index }}
          IMAGE_ERROR: ${{ needs.published-image.outputs.error }}
          IMAGE_JOB: ${{ needs.published-image.result }}
        run: |
          set -euo pipefail
          python3 "$CI_TOOLS/scan_coverage.py" summarize \
            --repo "${GITHUB_REPOSITORY#*/}" --commit "$GITHUB_SHA" \
            --reports "$RUNNER_TEMP/scan-reports" --dockerfile "$DOCKERFILE" \
            --image "$IMAGE" --platforms "$PLATFORMS" --index "$INDEX" \
            --image-error "$IMAGE_ERROR" --image-job "$IMAGE_JOB" \
            --out security-main.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the security-main record
        if: ${{ always() && hashFiles('security-main.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-main
          path: security-main.json
          retention-days: 14

  # Full-HISTORY secret scan (advisory). The CI gates run `gitleaks dir` on
  # the working tree only, so a secret that was committed and later removed is
  # invisible to them; this job walks every commit. Advisory like the Trivy
  # scans above (exit-code 0 + SARIF to the Security tab): a historical leak
  # needs rotation + history rewrite, not a blocked merge. GitHub's own secret
  # scanning also covers pushes on public repos; this adds the gitleaks
  # ruleset and a scheduled full-history sweep (via daily-security).
  gitleaks-history:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Scan full git history (gitleaks, advisory)
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          VERSION=v8.30.1
          # File first, then extract: plain `--retry` does not cover a
          # mid-transfer receive failure (curl exit 56), and the flag that does
          # (`--retry-all-errors`) is unsafe on a pipe, because curl resets a
          # partial `-o` write before retrying and cannot reset a pipe. The
          # archive stays out of /tmp/gitleaks* so ci-local's rewrite of that
          # literal path cannot reach it.
          curl -fsSL --connect-timeout 10 --max-time 30 \
            --retry 7 --retry-max-time 150 --retry-all-errors \
            -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 0 \
            --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload SARIF — gitleaks history
        if: ${{ always() && hashFiles('gitleaks-history.sarif') != '' && github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'gitleaks-history.sarif'
          category: 'gitleaks-history'
