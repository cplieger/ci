# Files an unwatched workflow's red result as ONE tracker issue per workflow.
# A run that nobody watches to the end has no reader otherwise: a red X in the
# Actions tab notifies no one, which is how `Weekly stryker` stayed red for
# three consecutive weeks (2026-08-29 through 09-12) with nothing announcing it.
#
# Which runs count as unwatched is a decided policy (see the verdict below):
# automated runs (schedule, and the tag push that automation fires) file on
# failure; a manual run files only when it ran at least `watched-minutes`, the
# length past which the person who started it has stopped watching; shorter
# manual runs and every push/pull-request run are assumed watched and file
# nothing. The issue closes only on a green run that covered everything on the
# default branch. Label `weekly-ci-failure`, the same one the private repos'
# inline `notify` jobs use, so one triage query reads both.
#
# This tracks the RUNNER failing. The result trackers some callers maintain
# (`bench-tracker`, `broken-links`, `gremlins-tracker`, `stryker-tracker`)
# describe the code under test, which is a different fact.
#
# Call it as the final job of a workflow with `needs:` on EVERY other job and
# `if: always()`: the verdict is read from the run's job list, so a job missing
# from `needs:` may still be running and is then invisible. The issue writes go
# through scripts/tracker_issue.py from a checkout of this repo, so the caller's
# job needs `contents: read` beside `actions: read` and `issues: write`.
name: Notify failure

on:
  workflow_call:
    inputs:
      workflow:
        description: Workflow name for the issue title (the caller's github.workflow).
        type: string
        required: true
      run-url:
        description: URL of the calling run, linked from the issue and every comment.
        type: string
        required: true
      details:
        description: >-
          Optional multi-line list of failed steps the caller collected itself
          (the private carriers' marker file); appended to the jobs-API list.
        type: string
        required: false
        default: ""
      scope:
        description: >-
          The dispatch `only` value when the run was scoped to some repos, or
          empty when it covered everything. A scoped run never closes the
          tracker, because it did not run what it left out.
        type: string
        required: false
        default: ""
      watched-minutes:
        description: >-
          A manual run at least this many minutes long is assumed unwatched and
          files on failure; a shorter one is assumed watched and files nothing.
        type: number
        required: false
        default: 30

permissions: {}

jobs:
  track:
    # Schedule, manual, and the automation-fired tag push can be unwatched. A
    # push to a branch (main CI, post-merge) has the merging agent watching the
    # post-merge run, and a pull request blocks its own merge, so both file
    # nothing and are not even reached here.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      # The jobs API needs actions:read on a private repo (anonymous on a
      # public one); the caller's job must grant at least these three scopes.
      actions: read
      contents: read
      issues: write
    steps:
      # The transport lives in this repo. `repository:` is explicit so a caller
      # in another repo still gets these scripts rather than its own tree.
      - name: Checkout the tracker transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cplieger/ci
          persist-credentials: false
          sparse-checkout: |
            scripts/tracker_issue.py
            scripts/ghrest.py
          sparse-checkout-cone-mode: false
          path: ci

      - name: Track the result in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ inputs.run-url }}
          WORKFLOW: ${{ inputs.workflow }}
          DETAILS: ${{ inputs.details }}
          SCOPE: ${{ inputs.scope }}
          WATCHED_MINUTES: ${{ inputs.watched-minutes }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # Empty on a schedule event (its payload carries no repository object);
          # a scheduled run always runs on the default branch, so the shell
          # treats schedule as on-default without comparing.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TITLE: ${{ inputs.workflow }} run is failing
        run: |
          set -euo pipefail
          label='weekly-ci-failure'
          tracker="${GITHUB_WORKSPACE}/ci/scripts/tracker_issue.py"

          jobs=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s .)
          # This job is always in its own run's list, so an empty read is a
          # failed read; acting on it would close the tracker as green.
          if [ "$(jq length <<<"$jobs")" -eq 0 ]; then
            echo "::error::the jobs API returned no jobs for run ${RUN_ID}; not touching the tracker"
            exit 1
          fi

          # A timed-out job concludes `cancelled`, not `failure` (measured on
          # a 15-minute cap), so anything but success or skipped is red.
          red=$(jq -r '.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")
            | "- \(.name): \(.conclusion)"
              + ([.steps[]? | select(.conclusion == "failure") | .name] | if length > 0 then " (" + join(", ") + ")" else "" end)' \
            <<<"$jobs")
          running=$(jq '[.[] | select(.status != "completed")] | length' <<<"$jobs")
          if [ "$running" -gt 1 ]; then
            echo "::warning::${running} jobs are still running while this one reports; list every other job in the caller's needs:"
          fi

          # Duration of THIS attempt, from the run's own start, so a rerun is
          # timed from when it started rather than from the first attempt.
          started=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.run_started_at')
          minutes=$(( ( $(date -u +%s) - $(date -u -d "$started" +%s) ) / 60 ))

          full_scope=false
          [ -z "$SCOPE" ] && full_scope=true
          tag_push=false
          [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ] && tag_push=true

          # A scheduled run always runs on the default branch (and its event
          # payload carries no repository to compare); a dispatch is on-default
          # only when its branch ref equals the repo's default branch. Keyed on
          # the DEFAULT branch, never a literal name: a v3 repo can default to
          # `dev` and advance `main` only by a manual promote, so a run on `main`
          # there is a non-default-branch run.
          on_default=false
          if [ "$EVENT" = schedule ]; then
            on_default=true
          elif [ "$REF_TYPE" = branch ] && [ -n "$DEFAULT_BRANCH" ] \
            && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            on_default=true
          fi

          # A failing run opens or comments when nobody watches it to the
          # end: an automated run, or a manual run at least WATCHED_MINUTES long.
          files_on_red=false
          if [ "$EVENT" = schedule ] || [ "$tag_push" = true ]; then
            files_on_red=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$on_default" = true ] \
            && [ "$minutes" -ge "$WATCHED_MINUTES" ]; then
            files_on_red=true
          fi

          # A green run closes only when it covered everything: an unscoped run
          # on the default branch, or a tag push (its workflow's only trigger).
          # A scoped run leaves an open issue open.
          closes_on_green=false
          if [ "$full_scope" = true ] && { [ "$tag_push" = true ] || { [ "$on_default" = true ] \
            && { [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; }; }; }; then
            closes_on_green=true
          fi

          case "$EVENT" in
            schedule) when='scheduled' ;;
            workflow_dispatch) when='manual' ;;
            push) [ "$tag_push" = true ] && when='tag push' || when='push' ;;
            *) when="$EVENT" ;;
          esac
          scope_line="full scope"
          [ -n "$SCOPE" ] && scope_line="scoped to: ${SCOPE}"
          context=$(printf '%s run on %s, %s, %d min' "$when" "${GITHUB_REF_NAME}" "$scope_line" "$minutes")

          if [ -z "$red" ]; then
            if [ "$closes_on_green" = true ]; then
              printf 'The run is green again (%s): %s\n' "$context" "$RUN_URL" >"${RUNNER_TEMP}/comment.md"
              python3 "$tracker" --repo "$GH_REPO" --label "$label" --title "$TITLE" \
                --mode close-when-clean --comment-file "${RUNNER_TEMP}/comment.md"
            else
              echo "green, ${context}; did not cover everything, so the tracker is left as-is"
            fi
            exit 0
          fi

          if [ "$files_on_red" != true ]; then
            echo "red, ${context}; assumed watched, so nothing is filed"
            exit 0
          fi

          body="${RUNNER_TEMP}/issue-body.md"
          {
            printf 'Run: %s\n\nContext: %s\n\nJobs that did not succeed:\n\n%s\n' \
              "$RUN_URL" "$context" "$red"
            if [ -n "$DETAILS" ]; then
              printf '\nFailed steps reported by the caller:\n\n%s\n' "$DETAILS"
            fi
          } >"$body"
          {
            printf 'Still failing.\n\n'
            cat "$body"
          } >"${RUNNER_TEMP}/comment.md"
          {
            printf 'The **%s** run failed and nobody was watching it to the end. ' "$WORKFLOW"
            printf 'Nothing else reports this result, so this issue tracks it until a '
            printf 'green run covers everything again.\n\n'
            cat "$body"
          } >"${RUNNER_TEMP}/new-issue.md"
          python3 "$tracker" --repo "$GH_REPO" --label "$label" --title "$TITLE" \
            --mode recur --body-file "${RUNNER_TEMP}/new-issue.md" \
            --comment-file "${RUNNER_TEMP}/comment.md"
