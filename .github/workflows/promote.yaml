# Promote a two-branch repository's dev commit to its main; scripts/promote.py holds
# every check, this file the boundaries. apply acts only on snapshot's T and M.
# preview may run the repository's cliff config, so it holds no token and nothing
# reads its output. apply re-checks with this repository's code and creates R, a
# commit no ref names. tag gives the dev image `promoted-<R>`, which retention never
# deletes, before move re-reads R and the tag and moves main.
# PACKAGES_PAT reaches tag only; PROMOTE_PAT reaches create and move only.
name: Promote
run-name: Promote ${{ inputs.repo }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository name (without the owner), e.g. knell."
        type: string
        required: true
      target:
        description: "Commit on dev's first-parent history to promote. Empty means the head of dev."
        type: string
        default: ""
      dry_run:
        description: "Run every check and render the preview, but do not move main."
        type: boolean
        default: false

permissions:
  contents: read

# Every promotion write lands in the promoted repository, so runs queue per repository;
# notify's shared tracker issue has a group of its own. Without queue: max a group keeps
# one waiting run and cancels it when another queues
# (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
concurrency:
  group: promote-${{ inputs.repo }}
  cancel-in-progress: false
  queue: max

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repo: ${{ steps.snapshot.outputs.repo }}
      target: ${{ steps.snapshot.outputs.target }}
      main: ${{ steps.snapshot.outputs.main }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python3 scripts/promote.py --work-dir "$RUNNER_TEMP/promote" snapshot --repo "$REPO" --target "$TARGET"

  preview:
    needs: snapshot
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install git-cliff
        run: |
          set -euo pipefail
          # Version + tarball sha256 pinned as a pair; Renovate maintains both
          # via the custom.git-cliff datasource (GitHub release-asset digest).
          # renovate: datasource=custom.git-cliff depName=orhun/git-cliff
          CLIFF_VERSION=v2.14.2
          CLIFF_SHA256=24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 7 --retry-max-time 150 --retry-all-errors -o "$RUNNER_TEMP/git-cliff.tgz" \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CLIFF_SHA256}  ${RUNNER_TEMP}/git-cliff.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/git-cliff.tgz" -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION#v}/git-cliff"

      - name: Preview
        env:
          REPO: ${{ needs.snapshot.outputs.repo }}
          TARGET: ${{ needs.snapshot.outputs.target }}
          MAIN: ${{ needs.snapshot.outputs.main }}
        run: |
          set -euo pipefail
          python3 scripts/promote.py --work-dir "$RUNNER_TEMP/promote" preview --repo "$REPO" --target "$TARGET" --main "$MAIN"

  # Invariant: apply reads needs.snapshot.outputs and inputs.dry_run only, and
  # restores nothing preview wrote; preview is in `needs` for ordering.
  apply:
    needs: [snapshot, preview]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      r: ${{ steps.create.outputs.r }}
      digest: ${{ steps.create.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # One binary and one database snapshot for both images of check 4.
      - name: Install Trivy and its database
        run: |
          set -euo pipefail
          tgz="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          for f in "$tgz" "$tgz.sigstore.json"; do
            curl -fsSL --connect-timeout 10 --max-time 120 --retry 7 --retry-max-time 150 --retry-all-errors \
              -o "$RUNNER_TEMP/$f" "$base/$f"
          done
          cosign verify-blob --bundle "$RUNNER_TEMP/$tgz.sigstore.json" \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/${TRIVY_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/$tgz"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/trivy-cache"
          tar xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/bin" trivy
          "$RUNNER_TEMP/bin/trivy" image --download-db-only --cache-dir "$RUNNER_TEMP/trivy-cache"
          "$RUNNER_TEMP/bin/trivy" image --download-java-db-only --cache-dir "$RUNNER_TEMP/trivy-cache"

      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.snapshot.outputs.repo }}
          TARGET: ${{ needs.snapshot.outputs.target }}
          MAIN: ${{ needs.snapshot.outputs.main }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          export TRIVY_BIN="$RUNNER_TEMP/bin/trivy" TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
          args=(--repo "$REPO" --target "$TARGET" --main "$MAIN" --plan-file "$RUNNER_TEMP/plan.json")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 scripts/promote.py --work-dir "$RUNNER_TEMP/promote" check "${args[@]}"

      - name: Create R
        id: create
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/promote.py create --plan-file "$RUNNER_TEMP/plan.json"

  tag:
    needs: [snapshot, apply]
    # A failed preview is an ancestor too, so the implicit success() must not apply.
    if: >-
      ${{ !cancelled() && needs.apply.result == 'success'
      && needs.apply.outputs.r != '' && needs.apply.outputs.digest != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag the promoted image
        env:
          GHCR_TOKEN: ${{ secrets.PACKAGES_PAT }}
          REPO: ${{ needs.snapshot.outputs.repo }}
          DIGEST: ${{ needs.apply.outputs.digest }}
          R: ${{ needs.apply.outputs.r }}
        run: |
          set -euo pipefail
          python3 scripts/promote.py tag --repo "$REPO" --digest "$DIGEST" --r "$R"

  # An image lane moves main only after its tag job succeeded.
  move:
    needs: [snapshot, apply, tag]
    if: >-
      ${{ !cancelled() && needs.apply.result == 'success' && needs.apply.outputs.r != ''
      && (needs.tag.result == 'success'
      || (needs.tag.result == 'skipped' && needs.apply.outputs.digest == '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The only step that can move a main branch.
      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          REPO: ${{ needs.snapshot.outputs.repo }}
          MAIN: ${{ needs.snapshot.outputs.main }}
          TARGET: ${{ needs.snapshot.outputs.target }}
          DIGEST: ${{ needs.apply.outputs.digest }}
          R: ${{ needs.apply.outputs.r }}
        run: |
          set -euo pipefail
          python3 scripts/promote.py move --repo "$REPO" --main "$MAIN" --target "$TARGET" --digest "$DIGEST" --r "$R"

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [snapshot, preview, apply, tag, move]
    if: always()
    # Runs that create, update or close the shared tracker issue serialize here;
    # ':' keeps this group distinct from every per-repository promotion group.
    concurrency:
      group: promote:notify
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
