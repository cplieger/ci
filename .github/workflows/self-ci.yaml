# The ci repository validates itself through its own meta workflow by local
# ref, so a change to detection takes effect in the same pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # The meta workflow's deadset jobs request it; see its `deadset` job.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yaml

  # Probes for the scripts behind each repo's weekly mutation number, which
  # nothing else executes until their own cron fires. Not part of `validate`
  # (that comes from the consumer-facing meta ci.yaml); a failure here shows as
  # a red check on the PR.
  measurement-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The gremlins probes and gremlins-aggregate.py read YAML; the set-up interpreter has no PyYAML.
      - name: Install PyYAML
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=PyYAML
          VERSION=6.0.3
          pip install -q --break-system-packages "PyYAML==${VERSION}"

      # The gremlins probes time `go test` on a scratch module; ubuntu-26.04
      # keeps Go only in the tool cache, off PATH.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Probe gremlins measurement scripts
        env:
          # setup-go exports GOTOOLCHAIN=local and lags each Go patch release.
          GOTOOLCHAIN: auto
        run: python3 scripts/test-gremlins-scripts.py

      - name: Probe stryker aggregate artifact discovery
        run: python3 scripts/test-stryker-aggregate.py

      - name: Probe shared artifact-repo discovery
        run: bash scripts/test-discover-artifact-repos.sh

  # The patches the weekly gremlins run builds into the tool, with the tests they
  # carry, against the pinned gremlins release.
  gremlins-patches:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Probe the gremlins patches
        env:
          # setup-go exports GOTOOLCHAIN=local and lags each Go patch release.
          GOTOOLCHAIN: auto
        run: bash scripts/test-gremlins-patches.sh

  # The issue transport every scheduled writer calls (scripts/tracker_issue.py)
  # and the body skeleton the three aggregators share (scripts/trackerlib.py).
  tracker-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # test-tracker-body.py runs gremlins-aggregate.py, which reads YAML; the set-up interpreter has no PyYAML.
      - name: Install PyYAML
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=PyYAML
          VERSION=6.0.3
          pip install -q --break-system-packages "PyYAML==${VERSION}"

      - name: Probe the tracker transport
        run: python3 scripts/test-tracker-issue.py

      - name: Probe the tracker bodies
        run: python3 scripts/test-tracker-body.py

  # actions/alert-rules over the fixture repositories in
  # scripts/testdata/alert-rules, with the promtool and lokitool its action.yml
  # pins: a test expecting an alert its rule never fires, rules that do not
  # parse and an alert table that disagrees with the rules must fail, a
  # correct set must pass and a repository with no alerts/ folder must skip.
  alert-rules:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The test and alert-table.py read YAML; the set-up interpreter has no PyYAML.
      - name: Install PyYAML
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=PyYAML
          VERSION=6.0.3
          pip install -q --break-system-packages "PyYAML==${VERSION}"

      - name: Probe the alert-rules check
        run: |
          set -euo pipefail
          ALERT_RULES_TOOLS="$RUNNER_TEMP/alert-rules" python3 -m unittest -v scripts.test_alert_rules

  # The two-channel release scripts:
  # release_channels.py (tag shapes and repo tables), promote.py (the
  # promotion checks), ghcr_retention.py (the dev-version selection),
  # audit.py (the ruleset and webhook grading of both branch models) and the
  # strict-mode scan of the release-channel workflows' run blocks.
  release-channel-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # test_workflow_shell.py parses the workflows, and the set-up interpreter
      # has no PyYAML.
      - name: Install PyYAML
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=PyYAML
          VERSION=6.0.3
          pip install -q --break-system-packages "PyYAML==${VERSION}"

      # The go.work and pinned-install tests run real go builds; ubuntu-26.04
      # keeps Go only in the tool cache, off PATH.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Probe the release-channel scripts
        env:
          # setup-go exports GOTOOLCHAIN=local and lags each Go patch release.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
