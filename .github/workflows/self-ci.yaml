# The ci repository validates itself through its own meta workflow by local
# ref, so a change to detection takes effect in the same pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # The meta workflow's deadset jobs request it; see its `deadset` job.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yaml

  # Probes for the scripts behind each repo's weekly mutation number, which
  # nothing else executes until their own cron fires. Not part of `validate`
  # (that comes from the consumer-facing meta ci.yaml); a failure here shows as
  # a red check on the PR.
  measurement-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # stryker-aggregate.py uses PEP 758 (`except A, B:`), which needs Python
      # 3.14, and ubuntu-24.04's own python3 is 3.12 and rejects it at PARSE
      # time. weekly-stryker.yaml's aggregate job pins the same version for the
      # same reason; without the pin here its probe fails on every case with a
      # SyntaxError rather than on anything it is testing.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Probe gremlins measurement scripts
        run: python3 scripts/test-gremlins-scripts.py

      - name: Probe the vitest-runner separator stopgap
        run: python3 scripts/test-patch-vitest-runner-separator.py

      - name: Probe the vitest browser-bail stopgap
        run: python3 scripts/test-patch-vitest-browser-bail.py

      - name: Probe stryker aggregate artifact discovery
        run: python3 scripts/test-stryker-aggregate.py

      - name: Probe shared artifact-repo discovery
        run: bash scripts/test-discover-artifact-repos.sh

  # The issue transport every scheduled writer calls (scripts/tracker_issue.py)
  # and the body skeleton the three aggregators share (scripts/trackerlib.py).
  # Both run on the runner's default python3 in most callers and under a 3.14
  # pin in weekly-bench/weekly-stryker, so the suite runs on both: the default
  # interpreter first (the stryker golden skips itself there), then 3.14.
  tracker-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Probe the tracker transport (default python3)
        run: python3 scripts/test-tracker-issue.py

      - name: Probe the tracker bodies (default python3)
        run: python3 scripts/test-tracker-body.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Probe the tracker bodies (python 3.14)
        run: python3 scripts/test-tracker-body.py

  # The two-channel release scripts, on the runner's default python3 because
  # that is what promote.yaml and ghcr-retention.yaml run them with:
  # release_channels.py (tag shapes and repo tables), promote.py (the
  # promotion checks), ghcr_retention.py (the dev-version selection),
  # audit.py (the ruleset and webhook grading of both branch models) and the
  # strict-mode scan of the release-channel workflows' run blocks.
  release-channel-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # test_workflow_shell.py parses the workflows; the runner's yamllint is a
      # pipx install, so its PyYAML is not importable from the system python3.
      - name: Install PyYAML
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=PyYAML
          VERSION=6.0.3
          pip install -q --break-system-packages "PyYAML==${VERSION}"

      - name: Probe the release-channel scripts (default python3)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
