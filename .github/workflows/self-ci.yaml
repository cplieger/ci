# Self-CI: the ci repo lints itself through its own meta workflow via a local
# ref (`./` resolves to this same commit, so detection changes take effect here
# immediately — no tag/bump cycle). For this repo the meta runs markdown +
# python (audit.py, scripts/*.py) + scripts (actionlint + shellcheck) and emits
# the `ci / validate` check. Supersedes the former lint.yaml (actionlint-only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  # The scripts that decide what mutation number a repo publishes weekly, none
  # of which anything else executes until their own cron fires. The stryker
  # aggregate script sat broken here for weeks for exactly that reason, so both
  # probes run on every push and PR:
  #   test-gremlins-scripts.py            gremlins-merge.py folds one gremlins
  #                                       result per Go module into the single
  #                                       per-attempt result the tracker/badge
  #                                       assume; gremlins-aggregate.py turns
  #                                       those into the issue body and badge.
  #   test-patch-vitest-runner-separator  the vitest-5 separator stopgap, whose
  #                                       value is entirely in refusing once
  #                                       upstream ships the real fix.
  #   test-stryker-aggregate.py           stryker-aggregate.py's artifact-layout
  #                                       contract, which had no probe at all
  #                                       until a single-entry run silently
  #                                       skipped every tracker issue.
  #   test-discover-artifact-repos.sh     the artifact discovery all three weekly
  #                                       jobs now share, whose two failure
  #                                       directions are a silent skip and a
  #                                       falsely red weekly run.
  # Not part of the `validate` check (that comes from the meta ci.yaml, which is
  # consumer-facing); a failure here shows as a red check on the PR.
  measurement-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # stryker-aggregate.py uses PEP 758 (`except A, B:`), which needs Python
      # 3.14, and ubuntu-24.04's own python3 is 3.12 and rejects it at PARSE
      # time. weekly-stryker.yaml's aggregate job pins the same version for the
      # same reason; without the pin here its probe fails on every case with a
      # SyntaxError rather than on anything it is testing.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Probe gremlins measurement scripts
        run: python3 scripts/test-gremlins-scripts.py

      - name: Probe the vitest-runner separator stopgap
        run: python3 scripts/test-patch-vitest-runner-separator.py

      - name: Probe stryker aggregate artifact discovery
        run: python3 scripts/test-stryker-aggregate.py

      - name: Probe shared artifact-repo discovery
        run: bash scripts/test-discover-artifact-repos.sh

  # The issue transport every scheduled writer calls (scripts/tracker_issue.py)
  # and the body skeleton the three aggregators share (scripts/trackerlib.py).
  # Both run on the runner's default python3 in most callers and under a 3.14
  # pin in weekly-bench/weekly-stryker, so the suite runs on both: the default
  # interpreter first (the stryker golden skips itself there), then 3.14.
  tracker-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Probe the tracker transport (default python3)
        run: python3 scripts/test-tracker-issue.py

      - name: Probe the tracker bodies (default python3)
        run: python3 scripts/test-tracker-body.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Probe the tracker bodies (python 3.14)
        run: python3 scripts/test-tracker-body.py
