name: Trigger Renovate

# Fires the orchestrator's "Trigger Renovate" procedure by asking GitHub to
# REDELIVER this repo's latest main-branch push webhook through Hookshot. A
# curl from the runner cannot work: Cloudflare blocks Actions-runner egress to
# that endpoint (HTTP 403) while allowing Hookshot source ranges.
# SCOPE: the one-shot run bumps the private infrastructure repo ONLY; every
# other repo is served by the resident Renovate container's hourly run. RENOVATE_HOOK_PAT is a fine-grained PAT on cplieger/ci
# only (Metadata: Read, Webhooks: Read and write), which GITHUB_TOKEN cannot get.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason / source repo (logged for traceability)"
        type: string
        default: "manual"

permissions:
  contents: read

concurrency:
  # Coalesce concurrent triggers — a single Renovate run picks up everything
  # already pushed by the time it scans, so back-to-back image pushes don't
  # need to fan out to back-to-back Renovate runs.
  group: trigger-renovate
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Redeliver push webhook (GitHub-native, via Hookshot)
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_HOOK_PAT }}
          REPO: ${{ github.repository }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "Reason: ${REASON}"

          # Fail fast with an actionable message when the PAT secret is missing
          # or empty. Without this, gh exits 4 with a generic "set the GH_TOKEN
          # environment variable" error that hides the real cause (the secret).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RENOVATE_HOOK_PAT secret is missing or empty on ${REPO}. Set it to a fine-grained PAT scoped to cplieger/ci with Metadata: Read + Webhooks: Read and write."
            exit 1
          fi

          # Locate the active push webhook that targets the orchestrator's
          # procedure listener. There is exactly one today, but match by URL so a future
          # extra webhook can't be picked by accident.
          hook_id=$(gh api "repos/${REPO}/hooks" --jq \
            '[.[] | select(.active and (.events | index("push")) and (.config.url | test("/listener/github/procedure/")))][0].id // empty')
          if [ -z "${hook_id}" ]; then
            echo "::error::No active push webhook found on ${REPO}."
            exit 1
          fi
          echo "hook_id=${hook_id}"

          # Redeliver the most recent main-branch push delivery. Skip tag-push
          # deliveries (move-major-tag emits refs/tags/*), which the listener's
          # /main branch guard would reject.
          delivery_id=""
          for id in $(gh api "repos/${REPO}/hooks/${hook_id}/deliveries?per_page=30" \
              --jq '.[] | select(.event=="push") | .id'); do
            ref=$(gh api "repos/${REPO}/hooks/${hook_id}/deliveries/${id}" \
              --jq '.request.payload.ref // empty')
            if [ "${ref}" = "refs/heads/main" ]; then
              delivery_id="${id}"
              break
            fi
          done
          if [ -z "${delivery_id}" ]; then
            echo "::error::No recent main-branch push delivery available to redeliver."
            exit 1
          fi
          echo "Redelivering delivery_id=${delivery_id}"

          gh api --method POST \
            "repos/${REPO}/hooks/${hook_id}/deliveries/${delivery_id}/attempts"
          echo "::notice::Requested GitHub redelivery of delivery ${delivery_id} (reason=${REASON})"

  # `needs:` must list every other job in this workflow. Dispatch-only, so a
  # failure files only when the run was long enough to be unwatched.
  notify:
    needs: trigger
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
