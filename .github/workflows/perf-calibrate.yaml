# Calibrate a repository's tier 2 performance budgets: measure its default
# branch head's tests/perf/plan.json `full` set ten times through perf-ci.yaml,
# write the calibration with scripts/perf_gate.py --calibrate, sign it keyless,
# and open the pull request that checks it in. perf_gate.py accepts a
# calibration only from a file whose bundle names this workflow at
# refs/heads/main as its signer, so a run dispatched from any other ref
# proposes numbers no budget can cite. weekly-perf-calibrate.yaml calls it
# every week; a dispatch calibrates one repository now.
name: Performance calibrate
run-name: Calibrate ${{ inputs.repo }} full x10

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository name (without the owner), e.g. marotte. It must be public."
        type: string
        required: true
  workflow_call:
    inputs:
      repo:
        description: Repository name (without the owner). It must be public.
        type: string
        required: true
    secrets:
      SYNC_APP_ID:
        required: true
      SYNC_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4

jobs:
  # github.token reaches only this repository, so a private repository could
  # neither be checked out nor have its numbers published in a public run.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.check.outputs.repository }}
      name: ${{ steps.check.outputs.name }}
      branch: ${{ steps.check.outputs.branch }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check the repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          case "${REPO}" in
            '' | *[!A-Za-z0-9._-]* | . | ..) printf "::error::not a repository name: '%s'\n" "${REPO}"; exit 1 ;;
          esac
          read -r private branch < <(gh api "repos/cplieger/${REPO}" --jq '[.private, .default_branch] | @tsv')
          if [ "${private}" != false ]; then
            echo "::error::cplieger/${REPO} is not a public repository"
            exit 1
          fi
          sha=$(gh api "repos/cplieger/${REPO}/commits/${branch}" --jq .sha)
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot read the head of cplieger/${REPO}'s ${branch}: '${sha}'"
            exit 1
          fi
          {
            echo "repository=cplieger/${REPO}"
            echo "name=${REPO}"
            echo "branch=${branch}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  measure:
    needs: check
    # perf-ci.yaml's verdict job requests an id token, which a caller must grant
    # though a calibration never runs it.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/perf-ci.yaml
    with:
      repository: ${{ needs.check.outputs.repository }}
      ref: ${{ needs.check.outputs.sha }}
      set: full
      runs: 10
      mode: calibrate
      # The account's concurrent-job limit is shared with every repository's
      # pull requests, so a calibration takes half of GitHub Free's 20.
      max-parallel: 10

  propose:
    needs: [check, measure]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.repository }}
          ref: ${{ needs.measure.outputs.sha }}
          path: measured
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-results-${{ needs.measure.outputs.prefix }}-measure-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts

      - name: Propose and sign
        env:
          REPO: ${{ needs.check.outputs.repository }}
          COMMIT: ${{ needs.measure.outputs.sha }}
          PREFIX: ${{ needs.measure.outputs.prefix }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/proposed"
          mkdir -p "$out"
          defaults=()
          [ -f measured/tests/perf/budgets.json ] && defaults=(--budgets measured/tests/perf/budgets.json)
          python3 ci/scripts/perf_gate.py --calibrate "$RUNNER_TEMP/artifacts" --prefix "$PREFIX" --runs 10 "${defaults[@]}" \
            --plan-doc measured/tests/perf/plan.json \
            --out "$out/budgets.proposed.json" --repo "$REPO" --commit "$COMMIT" \
            --runner ubuntu-26.04 --run-id "$RUN_ID" --run-url "$RUN_URL"
          # The names tests/perf/sources/ holds, so the file is checked in as
          # downloaded and its bundle verifies against those exact bytes.
          cp "$out/budgets.proposed.json" "$out/${RUN_ID}.json"
          . ci/scripts/retry.sh
          retry cosign sign-blob --yes "$out/${RUN_ID}.json" --bundle "$out/${RUN_ID}.sigstore.json"
          python3 - "$out/budgets.proposed.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          whole = doc['whole_pr']
          print(f"## Calibration of {doc['repo']} at `{doc['commit'][:12]}`\n")
          print(f"{doc['runs']} runs on `{doc['runner']}` ({', '.join(doc['cpu_models']) or 'CPU model unknown'}), "
                f"{len(doc['cells'])} cells, signed as `{doc['run_id']}.json` and `{doc['run_id']}.sigstore.json`.\n")
          print(f"Runs that tripped the first stage: {whole['first_stage_runs'] or 'none'}.\n")
          for title in ('widened', 'demoted'):
              for c in whole[title]:
                  print(f"- {title}: {c}")
          EOF

      - name: Upload the proposed budgets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-proposed
          path: ${{ runner.temp }}/proposed/
          if-no-files-found: error
          retention-days: 90

  # Rewrites the default branch's budgets from the signed calibration and opens
  # the pull request, which merges on its own ci / validate. It runs only
  # perf_gate.py and git on the checkout, never the repository's code, so the
  # App token it holds meets nothing the repository wrote.
  check-in:
    needs: [check, propose]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.repository }}
          ref: ${{ needs.check.outputs.branch }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download the proposed budgets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: budgets-proposed
          path: ${{ runner.temp }}/proposed

      # A pull request the workflow token opens starts no CI run.
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: cplieger
          repositories: ${{ needs.check.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check in the calibration
        working-directory: repo
        env:
          CI_TOOLS: ${{ github.workspace }}/ci/scripts
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ needs.check.outputs.repository }}
          NAME: ${{ needs.check.outputs.name }}
          BASE: ${{ needs.check.outputs.branch }}
          COMMIT: ${{ needs.check.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          python3 "$CI_TOOLS/perf_gate.py" --check-in "$RUNNER_TEMP/proposed/${RUN_ID}.json" \
            --budgets tests/perf/budgets.json --plan-doc tests/perf/plan.json \
            --sources tests/perf/sources --accepted tests/perf/accepted \
            --repo "$REPO" --head "$(git rev-parse HEAD)" --pr-body "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          git add tests/perf
          if git diff --cached --quiet; then
            echo "::notice::the calibration changes nothing in ${REPO}'s budgets"
            exit 0
          fi
          title="chore(perf): calibrate budgets at ${COMMIT:0:12}"
          bot="${APP_SLUG}[bot]"
          id=$(gh api "users/${bot}" --jq .id)
          git -c user.name="$bot" -c user.email="${id}+${bot}@users.noreply.github.com" \
            commit --quiet -m "$title"
          # The branch is this run's own, so a re-run replaces it.
          branch="perf/calibration-${RUN_ID}"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "+HEAD:refs/heads/${branch}"
          # GitHub refuses a body over 65,536 characters; the run summary keeps all of it.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            { head -c 60000 "$body"; printf '\n\nCut at 60,000 bytes; %s lists every change.\n' "$RUN_URL"; } > "$body.cut"
            mv "$body.cut" "$body"
          fi
          number=$(gh api "repos/${REPO}/pulls?state=open&head=cplieger:${branch}" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh api "repos/${REPO}/pulls" -f title="$title" -f head="$branch" -f base="$BASE" \
              -F body=@"$body" --jq .number)
          fi
          echo "opened https://github.com/${REPO}/pull/${number}"
          if ! gh pr merge --auto --squash --repo "$REPO" "$number"; then
            echo "::warning::${REPO}#${number}: auto-merge could not be armed, so it waits for a merge by hand"
          fi
