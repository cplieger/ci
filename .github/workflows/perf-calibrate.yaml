# Calibrate a repository's tier 2 performance budgets: measure one commit's
# tests/perf/plan.json set `runs` times through perf-ci.yaml, write
# budgets.proposed.json with scripts/perf_gate.py --calibrate, and sign it
# keyless. perf_gate.py accepts a budget only from a file whose bundle names
# this workflow at refs/heads/main as its signer, so a run dispatched from any
# other ref proposes numbers no budget can cite. Only ten runs or more decide a
# cell's tier and headroom; fewer re-measure baselines.
name: Performance calibrate
run-name: Calibrate ${{ inputs.repo }} ${{ inputs.set }} x${{ inputs.runs }}${{ inputs.only && format(' ({0})', inputs.only) || '' }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository name (without the owner), e.g. marotte. It must be public."
        type: string
        required: true
      ref:
        description: "Branch, tag or commit to measure. Empty measures the default branch's head."
        type: string
        default: ""
      set:
        description: "The tests/perf/plan.json set to measure."
        type: string
        default: pr
      only:
        description: "Comma or space separated scenarios of the set to keep. Empty keeps them all."
        type: string
        default: ""
      runs:
        description: "How many times to measure the set. At least 10 decides tiers; fewer re-measures baselines."
        type: number
        default: 10

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4

jobs:
  # github.token reaches only this repository, so a private repository could
  # neither be checked out nor have its numbers published in a public run.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.check.outputs.repository }}
    steps:
      - name: Check the repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          case "${REPO}" in
            '' | *[!A-Za-z0-9._-]* | . | ..) printf "::error::not a repository name: '%s'\n" "${REPO}"; exit 1 ;;
          esac
          case "${RUNS}" in
            '' | *[!0-9]* | 0) printf "::error::runs must be a positive integer, got '%s'\n" "${RUNS}"; exit 1 ;;
          esac
          private=$(gh api "repos/cplieger/${REPO}" --jq .private)
          if [ "${private}" != false ]; then
            echo "::error::cplieger/${REPO} is not a public repository"
            exit 1
          fi
          echo "repository=cplieger/${REPO}" >> "$GITHUB_OUTPUT"

  measure:
    needs: check
    uses: ./.github/workflows/perf-ci.yaml
    with:
      repository: ${{ needs.check.outputs.repository }}
      ref: ${{ inputs.ref }}
      set: ${{ inputs.set }}
      only: ${{ inputs.only }}
      runs: ${{ inputs.runs }}
      mode: calibrate
      # The account's concurrent-job limit is shared with every repository's
      # pull requests, so a calibration takes half of GitHub Free's 20.
      max-parallel: 10

  propose:
    needs: [check, measure]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.check.outputs.repository }}
          ref: ${{ needs.measure.outputs.sha }}
          path: measured
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-results-${{ needs.measure.outputs.prefix }}-measure-*
          path: ${{ runner.temp }}/artifacts

      - name: Propose and sign
        env:
          REPO: ${{ needs.check.outputs.repository }}
          COMMIT: ${{ needs.measure.outputs.sha }}
          PREFIX: ${{ needs.measure.outputs.prefix }}
          RUNS: ${{ inputs.runs }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # perf_gate.py --calibrate reads one directory per run, its shards
          # beneath; a single run's artifacts carry no run-NN- part.
          runs="$RUNNER_TEMP/runs"
          mkdir -p "$runs"
          shopt -s nullglob
          for d in "$RUNNER_TEMP/artifacts/perf-results-${PREFIX}-measure-"*/; do
            name=$(basename "$d")
            name=${name#"perf-results-${PREFIX}-measure-"}
            case "$name" in
              run-[0-9]*-shard-*) run=${name%%-shard-*}; shard=${name#"${run}-"} ;;
              shard-*) run='run-01'; shard=$name ;;
              *) echo "::error::unexpected results artifact ${name}"; exit 1 ;;
            esac
            mkdir -p "$runs/$run"
            mv "$d" "$runs/$run/$shard"
          done
          found=$(find "$runs" -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$found" -ne "$RUNS" ]; then
            echo "::error::found results of ${found} runs, not the ${RUNS} dispatched"
            exit 1
          fi
          out="$RUNNER_TEMP/proposed"
          mkdir -p "$out"
          defaults=()
          [ -f measured/tests/perf/budgets.json ] && defaults=(--budgets measured/tests/perf/budgets.json)
          python3 ci/scripts/perf_gate.py --calibrate "$runs" "${defaults[@]}" \
            --out "$out/budgets.proposed.json" --repo "$REPO" --commit "$COMMIT" \
            --runner ubuntu-26.04 --run-id "$RUN_ID" --run-url "$RUN_URL"
          # The names tests/perf/calibrations/ holds, so the file is checked in as
          # downloaded and its bundle verifies against those exact bytes.
          cp "$out/budgets.proposed.json" "$out/${RUN_ID}.json"
          cosign sign-blob --yes "$out/${RUN_ID}.json" --bundle "$out/${RUN_ID}.sigstore.json"
          python3 - "$out/budgets.proposed.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          print(f"## Calibration of {doc['repo']} at `{doc['commit'][:12]}`\n")
          print(f"{doc['runs']} runs on `{doc['runner']}` ({', '.join(doc['cpu_models']) or 'CPU model unknown'}), "
                f"{len(doc['cells'])} cells. Check in `{doc['run_id']}.json` and `{doc['run_id']}.sigstore.json` "
                "under tests/perf/calibrations/.\n")
          whole = doc.get('whole_pr')
          if whole is None:
              print('Fewer than ten runs: baselines only, every cell keeps its tier and headroom.')
          else:
              print(f"Runs that tripped the first stage: {whole['first_stage_runs'] or 'none'}.\n")
              for title in ('widened', 'demoted'):
                  for c in whole[title]:
                      print(f"- {title}: {c}")
          EOF

      - name: Upload the proposed budgets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-proposed
          path: ${{ runner.temp }}/proposed/
          if-no-files-found: error
          retention-days: 90
