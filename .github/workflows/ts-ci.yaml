name: TS CI

# Reusable TypeScript-library CI for build-less ESM packages. Called by the
# meta ci.yaml: `ts` at the root, `ts-nested` at each module's <dir>/web, and
# `web` at a nested frontend dir with web-lint: true. Consumers pin the meta
# workflow by SHA with a major-version comment.
# Node is pinned below to the same major release.yaml publishes with, so the
# tested and published environments match and the version doesn't drift
# silently with runner-image updates. `tsc` comes from each repo's own
# `@typescript/native` devDependency.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding package.json / tsconfig.
        type: string
        default: "."
      web-lint:
        description: Run the package's lint:web script, or stylelint + html-validate without one (libraries shipping CSS/HTML).
        type: boolean
        default: false
      runner:
        description: >-
          The runner label for every job, such as a self-hosted pool's; empty runs
          them on ubuntu-26.04. A self-hosted runner's image must carry the system
          libraries of each engine a Browser Mode package tests on, Chromium or
          those named in `cplieger.browsers`, because the job installs the
          browsers there without apt.
        type: string
        default: ''

permissions:
  contents: read


jobs:
  # A matrix or a job condition cannot read a file, so this job reads the
  # package's own settings once: its vitest shard count (`cplieger.vitestShards`,
  # which sync never writes) and its browsers (`cplieger.browsers`) for
  # `validate` and `engines-floor`, its `engines.node` floor for
  # `engines-floor`, and the Go test server both build before their tests
  # (`sseFixture`). The values are the checked-out branch's, so they are
  # untrusted: only what these scripts validated reaches the outputs.
  package:
    name: package settings
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      count: ${{ steps.read.outputs.count }}
      shards: ${{ steps.read.outputs.shards }}
      floor: ${{ steps.read.outputs.floor }}
      node: ${{ steps.read.outputs.node }}
      browsers: ${{ steps.read.outputs.browsers }}
      sse-fixture: ${{ steps.fixture.outputs.dir }}
      sse-fixture-tags: ${{ steps.fixture.outputs.tags }}
      sse-fixture-sum: ${{ steps.fixture.outputs.sum }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # The read loads the semver library npm bundles beside this Node, and a
      # runner other than GitHub's hosted image may carry no Node, so install
      # the one validate tests on.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No cache, and automatic caching off: this job installs no packages,
          # and setup-node would otherwise cache npm whenever package.json
          # names npm as its packageManager.
          package-manager-cache: false
          # Keep in step with validate's Setup Node.js.
          node-version: '26'

      - name: Read cplieger.vitestShards, cplieger.browsers and engines.node
        id: read
        env:
          PACKAGE: ${{ inputs.working-directory }}/package.json
          READ_PACKAGE: |
            const { appendFileSync, readFileSync } = require("node:fs");
            const path = process.env.PACKAGE;
            // One line only: a newline from the file (JSON.parse quotes the source)
            // would start a workflow command of the branch's choosing.
            const fail = (why) => {
              console.error(`::error::${path}: ${why.replace(/[\r\n]+/g, " ")}`);
              process.exit(1);
            };
            let pkg;
            try { pkg = JSON.parse(readFileSync(path, "utf8")); }
            catch (err) { fail(`cannot read the package settings: ${err.message}`); }
            const own = pkg?.cplieger;
            if (own !== undefined && (own === null || typeof own !== "object" || Array.isArray(own))) {
              fail('"cplieger" must be an object, such as {"vitestShards": 2}');
            }
            let count = 1;
            if (own !== undefined && Object.hasOwn(own, "vitestShards")) {
              count = own.vitestShards;
              if (!Number.isInteger(count) || count < 1 || count > 100) {
                const shown = JSON.stringify(count).slice(0, 40);
                fail(`cplieger.vitestShards is ${shown}: it must be an integer from 1 to 100`);
              }
            }
            // The engines Vitest Browser Mode runs in, in this fixed order
            // whatever order the list gives, so the install and the tests
            // never depend on how the branch spelled it.
            const engines = ["chromium", "firefox", "webkit"];
            let browsers = ["chromium"];
            if (own !== undefined && Object.hasOwn(own, "browsers")) {
              const list = own.browsers;
              if (!Array.isArray(list) || list.length === 0 || new Set(list).size !== list.length
                || !list.every((b) => engines.includes(b))) {
                const shown = JSON.stringify(list).slice(0, 60);
                fail(`cplieger.browsers is ${shown}: it must be a non-empty list of unique names from chromium, firefox and webkit`);
              }
              browsers = engines.filter((b) => list.includes(b));
            }
            // The floor is the major of the oldest version engines.node allows,
            // as the semver library npm bundles beside this Node reads it
            // (minVersion). engines-floor asks setup-node for the range kept
            // within that major (node), so the Node it installs, the newest
            // release the spec allows, is one the range allows. A floor below
            // Node 4 is 0, the floor of a range that allows any version, or a
            // major Node never released (1 to 3), so it names no Node to test.
            // An invalid range, or one no version satisfies, is a package.json
            // defect and fails the job.
            const range = pkg?.engines?.node;
            if (range != null && typeof range !== "string") {
              fail(`engines.node is ${JSON.stringify(range).slice(0, 40)}: it must be a version range string`);
            }
            const shown = JSON.stringify(range ?? "").slice(0, 60);
            let floor = "";
            let node = "";
            let major;
            if (range) {
              let semver;
              try {
                const { dirname, join } = require("node:path");
                semver = require(join(dirname(process.execPath), "..", "lib", "node_modules", "npm", "node_modules", "semver"));
              } catch (err) {
                fail(`cannot load the semver library npm bundles, to read engines.node: ${err.message}`);
              }
              if (semver.validRange(range) === null) {
                fail(`engines.node is ${shown}: it must be a valid semver range`);
              }
              const oldest = semver.minVersion(range);
              if (oldest === null) {
                fail(`engines.node is ${shown}: no version satisfies it`);
              }
              major = oldest.major;
              if (major >= 4) {
                floor = String(major);
                // Each || alternative that reaches the floor major, with that
                // major's bounds added; comparator values hold only operators
                // and version text, so no line break reaches the output.
                const within = `>=${major}.0.0 <${major + 1}.0.0-0`;
                node = new semver.Range(range).set
                  .map((set) => [...set.map((c) => c.value).filter(Boolean), within].join(" "))
                  .filter((alt) => semver.validRange(alt) !== null && semver.minVersion(alt) !== null)
                  .join(" || ");
              }
            }
            const shards = Array.from({ length: count }, (_, i) => i + 1);
            appendFileSync(process.env.GITHUB_OUTPUT, `count=${count}\nshards=${JSON.stringify(shards)}\nfloor=${floor}\nnode=${node}\nbrowsers=${browsers.join(",")}\n`);
            console.log(`vitest shards: ${count}`);
            console.log(`browsers (Vitest Browser Mode only): ${browsers.join(", ")}`);
            if (!range) {
              console.log("::notice::package.json declares no engines.node floor; nothing to test beyond the publishing Node");
            } else if (floor === "") {
              console.log(`::notice::engines.node ${shown} allows Node ${major}, older than any Node release from 4 on, so only the publishing Node tests it`);
            } else {
              console.log(`engines.node ${shown}: testing on Node ${floor}`);
            }
        run: node -e "$READ_PACKAGE"

      # The Go module of a test server the suite runs against (`sseFixture`,
      # relative to package.json) and its `-tags` (`sseFixtureTags`). The
      # directory and its go.sum (empty when absent) are output as real paths
      # relative to the checkout, where setup-go resolves its inputs, so no
      # symlink leads a later step outside.
      - name: Read sseFixture and sseFixtureTags
        id: fixture
        env:
          PACKAGE: ${{ inputs.working-directory }}/package.json
          READ_FIXTURE: |
            const { appendFileSync, readFileSync, realpathSync, statSync } = require("node:fs");
            const { dirname, isAbsolute, join, relative, resolve, sep } = require("node:path");
            const shown = process.env.PACKAGE;
            const fail = (why) => {
              console.error(`::error::${shown}: ${why.replace(/[\r\n]+/g, " ")}`);
              process.exit(1);
            };
            const root = resolve(process.env.GITHUB_WORKSPACE);
            const pkgPath = resolve(root, shown);
            let pkg;
            try { pkg = JSON.parse(readFileSync(pkgPath, "utf8")); }
            catch (err) { fail(`cannot read the package settings: ${err.message}`); }
            const own = (key) => pkg !== null && typeof pkg === "object" && Object.hasOwn(pkg, key);
            const out = (dir, tags, sum) =>
              appendFileSync(process.env.GITHUB_OUTPUT, `dir=${dir}\ntags=${tags}\nsum=${sum}\n`);
            if (!own("sseFixture")) {
              if (own("sseFixtureTags")) {
                fail("sseFixtureTags is set without sseFixture: name the Go module directory to build, or drop the tags");
              }
              out("", "", "");
              console.log("no sseFixture: no Go test server to build");
              process.exit(0);
            }
            const dir = pkg.sseFixture;
            const dirShown = JSON.stringify(dir).slice(0, 80);
            const control = /[\x00-\x1f\x7f]/;
            if (typeof dir !== "string" || dir === "" || isAbsolute(dir)) {
              fail(`sseFixture is ${dirShown}: it must be a path relative to package.json, such as ".."`);
            }
            if (control.test(dir)) {
              fail(`sseFixture is ${dirShown}: the path holds a control character`);
            }
            let tags = "";
            if (own("sseFixtureTags")) {
              tags = pkg.sseFixtureTags;
              if (typeof tags !== "string" || !/^[A-Za-z0-9_,]+$/.test(tags)) {
                const tagsShown = JSON.stringify(tags).slice(0, 60);
                fail(`sseFixtureTags is ${tagsShown}: it must be Go build tags of letters, digits and underscores, separated by commas`);
              }
            }
            const within = (base, p) => {
              const rel = relative(base, p);
              return !(rel === ".." || rel.startsWith(`..${sep}`) || isAbsolute(rel));
            };
            const wanted = resolve(dirname(pkgPath), dir);
            if (!within(root, wanted)) {
              fail(`sseFixture is ${dirShown}: it resolves outside the checkout`);
            }
            const realRoot = realpathSync(root);
            let real;
            try { real = realpathSync(wanted); }
            catch (err) {
              fail(`sseFixture is ${dirShown}: ${err.code === "ENOENT" ? "no such directory" : `cannot resolve it (${err.code})`}`);
            }
            if (!within(realRoot, real)) {
              fail(`sseFixture is ${dirShown}: a symlink takes it outside the checkout`);
            }
            if (!statSync(real).isDirectory()) {
              fail(`sseFixture is ${dirShown}: it is not a directory`);
            }
            let mod;
            try { mod = realpathSync(join(real, "go.mod")); } catch { mod = null; }
            if (mod !== null && !within(realRoot, mod)) {
              fail(`sseFixture is ${dirShown}: its go.mod is a symlink outside the checkout`);
            }
            if (mod === null || !statSync(mod).isFile()) {
              fail(`sseFixture is ${dirShown}: it holds no go.mod file`);
            }
            let sum;
            try { sum = realpathSync(join(real, "go.sum")); } catch { sum = null; }
            if (sum !== null && !within(realRoot, sum)) {
              fail(`sseFixture is ${dirShown}: its go.sum is a symlink outside the checkout`);
            }
            const sumRel = sum !== null && statSync(sum).isFile() ? relative(realRoot, sum) : "";
            const rel = relative(realRoot, real) || ".";
            if (control.test(rel) || control.test(sumRel)) {
              fail(`sseFixture is ${dirShown}: the directory's real path holds a control character`);
            }
            out(rel, tags, sumRel);
            console.log(`sseFixture: building the Go module in ${rel} with -tags "${tags}"`);
        run: node -e "$READ_FIXTURE"

  validate:
    needs: package
    # A name that is an expression gets no matrix suffix
    # (github.com/orgs/community/discussions/144467), so unsharded the check
    # stays `validate`.
    name: ${{ needs.package.outputs.count > 1 && format('validate (shard {0}/{1})', matrix.shard, needs.package.outputs.count) || 'validate' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.package.outputs.shards) }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    # The validated engines, for the install and for every vitest run (the
    # tests, their posttest and the fuzz step): comma-separated in
    # `chromium,firefox,webkit` order.
    env:
      CPLIEGER_BROWSERS: ${{ needs.package.outputs.browsers }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in step with release.yaml's Setup Node.js (same major), so CI
          # tests on the Node that publishes.
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # Strict `npm ci` — no `npm install` fallback. The fallback silently
      # papered over a package.json/package-lock.json drift, so lockfile
      # integrity was never actually asserted; a drifted lockfile should fail
      # here and be regenerated in the PR.
      - name: Install deps
        run: npm ci

      # Browser Mode enrols by the `@vitest/browser-playwright` devDependency; the
      # engines are the validated `cplieger.browsers` in CPLIEGER_BROWSERS. No library
      # install for Chromium: the image carries its libraries. The pinned `playwright`
      # (`--no-install`) picks the builds its library expects; not `--only-shell`,
      # since the configs use `channel: "chromium"`. Setup, so outside the soft-gate
      # block.
      - name: Install browsers (vitest browser mode)
        timeout-minutes: 10
        run: |
          if node -e "const d=require('./package.json').devDependencies||{}; process.exit(d['@vitest/browser-playwright']?0:1)"; then
            need_libs=()
            IFS=, read -ra engines <<< "$CPLIEGER_BROWSERS"
            for engine in "${engines[@]}"; do
              case "$engine" in
                chromium) npx --no-install playwright install chromium ;;
                firefox | webkit) need_libs+=("$engine") ;;
                *)
                  echo "::error::unknown browser engine '${engine}'"
                  exit 1
                  ;;
              esac
            done
            if [ "${#need_libs[@]}" -gt 0 ]; then
              # The system libraries need root for apt, which a self-hosted
              # runner may not grant; its image carries them. Unset reads
              # hosted. The hosted image lacks Firefox's and WebKit's, and an
              # Ubuntu mirror or DNS outage stalls apt, so the install is bounded
              # below the step timeout. They go first, so the engines' own host
              # check finds them.
              if [ "${RUNNER_ENVIRONMENT:-github-hosted}" = github-hosted ]; then
                rc=0
                timeout 300 npx --no-install playwright install-deps "${need_libs[@]}" || rc=$?
                if [ "$rc" -ne 0 ]; then
                  echo "::error::playwright install-deps for ${need_libs[*]} failed or ran past 5 minutes (exit ${rc}). An Ubuntu mirror or DNS outage is the usual cause: rerun the job once it clears."
                  exit 1
                fi
              fi
              npx --no-install playwright install "${need_libs[@]}"
            fi
          else
            echo "no @vitest/browser-playwright devDependency; skipping browser install"
          fi

      # The Go test server the package names in `sseFixture`, built for every
      # shard and handed to the tests as SSE_FIXTURE. Setup, so outside the
      # soft-gate block. setup-go's default cache key reads go.sum at the
      # checkout root, which a nested module lacks, and a module with no go.sum
      # gets no cache instead of a restore warning.
      - name: Setup Go (sseFixture)
        if: ${{ needs.package.outputs.sse-fixture != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ needs.package.outputs.sse-fixture }}/go.mod
          cache: ${{ needs.package.outputs.sse-fixture-sum != '' }}
          cache-dependency-path: ${{ needs.package.outputs.sse-fixture-sum }}

      - name: Build the sseFixture test server
        if: ${{ needs.package.outputs.sse-fixture != '' }}
        timeout-minutes: 10
        env:
          FIXTURE_DIR: ${{ needs.package.outputs.sse-fixture }}
          FIXTURE_TAGS: ${{ needs.package.outputs.sse-fixture-tags }}
        run: |
          cd "$GITHUB_WORKSPACE/$FIXTURE_DIR"
          if ! go build -tags "$FIXTURE_TAGS" -o "$RUNNER_TEMP/sse-fixture" .; then
            echo "::error::the sseFixture test server in ${FIXTURE_DIR} failed to build with -tags \"${FIXTURE_TAGS}\""
            exit 1
          fi
          echo "SSE_FIXTURE=$RUNNER_TEMP/sse-fixture" >> "$GITHUB_ENV"

      # Soft-gate block: each step below runs to completion (continue-on-error)
      # and records its own name to /tmp/_ci_failures on failure; the final
      # "Check results" step fails the job if that file exists. CONTRACT: any
      # step added to this block MUST end with
      #   || { echo "<step name>" >> /tmp/_ci_failures; exit 1; }
      # or its failure is silently tolerated by continue-on-error.
      # Every check but the tests runs once, in shard 1.
      - name: Lint (eslint)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        run: ( npx eslint . ) || { echo "eslint" >> /tmp/_ci_failures; exit 1; }

      - name: Typecheck (tsc)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        run: ( npm run typecheck && npm run typecheck:tests ) || { echo "typecheck" >> /tmp/_ci_failures; exit 1; }

      # Not dead code, which deadset owns: import cycles, imports and binaries
      # package.json does not declare, and duplicate exports. Gated on every
      # location knip loads (KNIP_CONFIG_LOCATIONS in knip/dist/constants.js, plus
      # package.json#knip), through the package's own pinned devDependency. A
      # non-namespace `--include` restricts the report to exactly these types
      # (util/get-included-issue-types.js), so an unused export never fails here.
      # --no-config-hints: every ignore entry for an unchecked type reads as unused.
      # A cycle fails only where the config sets `rules: { cycles: error }`.
      - name: Import cycles and undeclared dependencies (knip)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        run: |
          (
            enrolled=0
            for cfg in knip.json knip.jsonc .knip.json .knip.jsonc \
                       knip.ts knip.js knip.config.ts knip.config.js; do
              if [ -f "$cfg" ]; then
                enrolled=1
                break
              fi
            done
            if [ "$enrolled" -eq 0 ] &&
               node -e 'process.exit(require("./package.json").knip ? 0 : 1)'; then
              enrolled=1
            fi
            if [ "$enrolled" -eq 1 ]; then
              npx --no-install knip --include cycles,unlisted,binaries,duplicates \
                --no-config-hints
            else
              echo "no knip config; skipping"
            fi
          ) || { echo "knip" >> /tmp/_ci_failures; exit 1; }

      - name: Test (vitest)
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.package.outputs.count }}
        run: |
          (
            if [ "$SHARDS" -eq 1 ]; then
              npm test
              exit "$?"
            fi
            # npm appends `--` arguments to the script's command line, so they reach
            # its last command only (and no pre/post script): anything after vitest
            # would take --shard while every shard ran the whole suite.
            if ! node -e "const s=(require('./package.json').scripts||{}).test||''; process.exit(/\bvitest\b/.test(s) && !/[;&|#\n]/.test(s) ? 0 : 1)"; then
              echo "::error::package.json sets cplieger.vitestShards to ${SHARDS}, so this job runs 'npm test -- --shard=${SHARD}/${SHARDS}': the package.json test script must be one vitest command. Move a command that follows the tests to posttest."
              exit 1
            fi
            npm test -- --shard="${SHARD}/${SHARDS}"
          ) || { echo "test" >> /tmp/_ci_failures; exit 1; }

      - name: Fuzz (fast-check)
        # Fuzzing is intentionally non-deterministic: a push/PR failing because
        # the fuzzer found a new input is a real bug caught early. Public repos
        # fuzz on push/PR (shift-left) at the budget configured in each test;
        # private repos only on manual dispatch. (The central weekly-fuzz.yaml
        # is Go-only — there is no deep weekly TS fuzz run.)
        if: ${{ matrix.shard == 1 && (github.event.repository.private == false || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        run: |
          (
            # `.fuzz` may sit anywhere left of `.test.ts`: the suffix nearest it is the
            # vitest project matcher (`**/*.node.test.ts`), so a Node fuzz target is
            # `<stem>.fuzz.node.test.ts`. A git pathspec `*` crosses dots and slashes.
            mapfile -t files < <(git ls-files '*.fuzz*.test.ts' '*.fuzz*.test.js')

            # An empty selection is legitimate — most consumers have no fuzz
            # target — so emptiness cannot be the gate. What must fail is an
            # empty selection with a fuzz-shaped file sitting next to it: the
            # pathspec needs a literal `.` before `fuzz`, so `fuzz-corpus.test.ts`
            # selects nothing and the else-branch below then PRINTS that property
            # tests covered it and passes. Cast a wider net than the selector and
            # fail on the difference.
            missed=$(comm -13 \
              <(git ls-files '*.fuzz*.test.ts' '*.fuzz*.test.js' | LC_ALL=C sort) \
              <(git ls-files '*.test.ts' '*.test.js' | awk -F/ 'tolower($NF) ~ /fuzz/' | LC_ALL=C sort))
            if [ -n "$missed" ]; then
              echo "::error::fuzz-shaped test file(s) matched no fuzz selector and would be skipped silently:"
              # Quoted + sed rather than an unquoted `printf '  %s\n' $missed`:
              # the unquoted form relies on word splitting (SC2086, which
              # actionlint's shellcheck pass rejects) and would glob-expand a
              # filename containing `*`.
              printf '%s\n' "$missed" | sed 's/^/  /'
              echo "Rename to <stem>.fuzz.test.ts, or <stem>.fuzz.node.test.ts for a node-project target."
              exit 1
            fi

            if [ "${#files[@]}" -gt 0 ]; then
              npx vitest run "${files[@]}"
            else
              echo "No *.fuzz*.test.ts targets; fast-check property tests already ran in the test step."
            fi
          ) || { echo "fuzz" >> /tmp/_ci_failures; exit 1; }

      - name: Format (prettier)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        run: ( npx prettier --check . ) || { echo "prettier" >> /tmp/_ci_failures; exit 1; }

      # package.json and jsr.json versions are placeholders release.yaml overwrites
      # from the tag, but they must agree in-repo: a drift misleads a reader and
      # marks a manifest edit that touched one file. Scans from the git root so a
      # root library and a subpackage (web/) are both covered; no jsr.json no-ops.
      - name: Version parity (package.json == jsr.json)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        run: |
          (
            cd "$(git rev-parse --show-toplevel)"
            rc=0
            while IFS= read -r jsr; do
              pkg="${jsr%jsr.json}package.json"
              [ -f "$pkg" ] || continue
              jv=$(jq -r '.version // ""' "$jsr")
              pv=$(jq -r '.version // ""' "$pkg")
              if [ "$jv" != "$pv" ]; then
                echo "::error file=${jsr}::version mismatch: ${pkg}=${pv:-<none>} vs ${jsr}=${jv:-<none>}. The two manifests must carry the same version (it is overwritten from the git tag at publish, but must agree in-repo)."
                rc=1
              fi
            done < <(git ls-files | grep -E '(^|/)jsr\.json$')
            exit $rc
          ) || { echo "version parity" >> /tmp/_ci_failures; exit 1; }

      # Publish surface: the file set each registry would upload must equal the
      # transitive import closure of the `exports` entry points. These packages ship
      # raw TypeScript, so a published test helper breaks the consumer's compile,
      # and this job's own typecheck has the test dependencies installed. Deriving
      # the set means no hand-kept pattern list can miss a file; a package with no
      # `exports` map fails the step.
      - name: Publish surface (registries ship exactly the public API)
        id: publish_surface
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        uses: cplieger/ci/actions/publish-surface@b5d76574cd49c765d1266959b84532a794d603d5 # v3
        with:
          package-dir: ${{ inputs.working-directory }}

      # This block's contract is a trailing
      # `|| { echo "<name>" >> /tmp/_ci_failures; exit 1; }`, which a `uses:` step
      # cannot carry inline. Record the outcome in a separate step so
      # continue-on-error does not silently swallow a failure. No `exit 1` here:
      # the marker file is what the final "Check results" step fails the job on,
      # and exiting non-zero would abort the remaining soft-gate steps.
      - name: Record publish-surface result
        if: ${{ always() && steps.publish_surface.outcome == 'failure' }}
        run: echo "publish surface" >> /tmp/_ci_failures

      # Every bare-specifier value-import in shippable front-end source needs a key
      # in the page's importmap: the browser resolves bare specifiers only through
      # it, while tsc and eslint resolve through node_modules and stay green. Scans
      # from the git root; no importmap no-ops. web-lint only: a library's
      # importmap is a dev scaffold, not a shipped page contract.
      - name: Import map coverage
        if: ${{ inputs.web-lint && matrix.shard == 1 }}
        continue-on-error: true
        env:
          IMPORTMAP_CHECK: |
            const { readFileSync, readdirSync } = require("node:fs");
            const { join, relative } = require("node:path");
            const { execSync } = require("node:child_process");
            let root;
            try {
              root = execSync("git rev-parse --show-toplevel", { encoding: "utf8" }).trim();
            } catch {
              root = process.cwd();
            }
            const SKIP = new Set([
              "node_modules", ".git", "dist", "coverage", ".vitest-cache",
              "vendor", "__test-helpers__", "__snapshots__", "testdata", "test-stubs",
            ]);
            const walk = (dir, test, out = []) => {
              let entries;
              try { entries = readdirSync(dir, { withFileTypes: true }); } catch { return out; }
              for (const e of entries) {
                const p = join(dir, e.name);
                if (e.isDirectory()) { if (!SKIP.has(e.name)) walk(p, test, out); }
                else if (test(e.name)) out.push(p);
              }
              return out;
            };
            const keys = new Set();
            let mapCount = 0;
            for (const f of walk(root, (n) => n.endsWith(".html"))) {
              const m = readFileSync(f, "utf8").match(/<script type="importmap">(.*?)<\/script>/s);
              if (!m) continue;
              let parsed;
              try { parsed = JSON.parse(m[1]); }
              catch (err) {
                console.error(`::error file=${relative(root, f)}::invalid importmap JSON: ${err.message}`);
                process.exit(1);
              }
              for (const k of Object.keys(parsed.imports || {})) keys.add(k);
              mapCount++;
            }
            if (mapCount === 0) {
              console.log('No <script type="importmap"> found; skipping import-map coverage check.');
              process.exit(0);
            }
            const RELATIVE = /^[./]/;
            const bareSpecs = (src) => {
              const specs = new Set();
              const patterns = [
                /\b(?:import|export)\b(?!\s+type\b)[^'";]*?\bfrom\s*["']([^"']+)["']/g,
                /\bimport\s+["']([^"']+)["']/g,
                /\bimport\s*\(\s*["']([^"']+)["']/g,
              ];
              for (const re of patterns) {
                for (const m of src.matchAll(re)) {
                  const s = m[1];
                  if (s && !RELATIVE.test(s) && !s.endsWith(".css")) specs.add(s);
                }
              }
              return specs;
            };
            const shippable = (n) =>
              n.endsWith(".ts") && !n.endsWith(".d.ts") && !n.endsWith(".test.ts") &&
              !n.endsWith(".spec.ts") && n !== "vitest.config.ts" &&
              n !== "playwright.config.ts" && n !== "fc-strict-setup.ts";
            const tsFiles = walk(root, shippable);
            const violations = [];
            for (const f of tsFiles) {
              const src = readFileSync(f, "utf8");
              for (const spec of bareSpecs(src)) {
                if (!keys.has(spec)) {
                  const idx = src.indexOf(spec);
                  const line = idx >= 0 ? src.slice(0, idx).split("\n").length : 0;
                  violations.push(`${relative(root, f)}:${line}: "${spec}" not in any import map`);
                }
              }
            }
            if (violations.length) {
              console.error("::error::Bare import(s) missing from the page import map(s):");
              for (const v of violations) console.error("  " + v);
              console.error('Add the key to the served HTML <script type="importmap"> (and vendor the target at build).');
              process.exit(1);
            }
            console.log(`import-map coverage OK (${keys.size} keys / ${mapCount} map(s), ${tsFiles.length} source files).`);
        run: |
          (
            printf '%s' "$IMPORTMAP_CHECK" > "${RUNNER_TEMP:-/tmp}/importmap-check.cjs"
            node "${RUNNER_TEMP:-/tmp}/importmap-check.cjs"
          ) || { echo "Import map coverage" >> /tmp/_ci_failures; exit 1; }

      - name: Lint web (CSS/HTML)
        if: ${{ inputs.web-lint && matrix.shard == 1 }}
        continue-on-error: true
        run: |
          (
            # A package declaring a `lint:web` script runs it instead, so CI and a local
            # run are one command. CI then relies on it to lint every tracked CSS file
            # with stylelint and the synced root .stylelintrc.json, every tracked HTML
            # file with html-validate, and to exit non-zero when either fails.
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s['lint:web']?0:1)"; then
              npm run lint:web
              exit "$?"
            fi

            # Two gates in one step, each recording into `rc`: bash suppresses errexit
            # on the left of `||` and a nested `set -e` does not restore it, so a plain
            # list would report only its last command. Both linters always run.
            rc=0

            # The synced root .stylelintrc.json is resolved by absolute path, with
            # --config-basedir at this web dir so `extends` resolves from its
            # node_modules. A web dir with no tracked CSS skips stylelint, since `extends`
            # must resolve even for an empty glob. `git ls-files` decides that and feeds
            # html-validate, so build output cannot pass for source.
            if [ -n "$(git ls-files '*.css' | head -n 1)" ]; then
              npx stylelint "**/*.css" \
                --config "${GITHUB_WORKSPACE}/.stylelintrc.json" \
                --config-basedir . \
                --allow-empty-input || rc=1
            else
              echo "No CSS tracked under $(pwd); skipping stylelint."
            fi

            git ls-files -z '*.html' \
              | xargs -0 --no-run-if-empty npx html-validate || rc=1

            exit "$rc"
          ) || { echo "web-lint" >> /tmp/_ci_failures; exit 1; }

      # PR-time dependency vulnerability review (npm manifests). go-ci's
      # Dependency review owns why the retry is the hard step. Public repos
      # only — the dependency-review API needs the dependency graph, which
      # private repos on the free plan don't expose.
      - name: Dependency review
        id: dependency-review
        if: ${{ matrix.shard == 1 && inputs.working-directory == '.' && github.event_name == 'pull_request' && github.event.repository.private == false }}
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Wait before retrying dependency review
        if: ${{ steps.dependency-review.outcome == 'failure' }}
        run: sleep 30

      - name: Dependency review (retry)
        if: ${{ steps.dependency-review.outcome == 'failure' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Check results
        if: always()
        run: |
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"

  # The tests again on the oldest Node major the package claims, read from its
  # own `engines.node` range as npm reads it (`>=24`, `^24`, `^22 || ^20`).
  # `validate` runs on the Node that publishes, so without this a package
  # promising an older Node is never run on it and an API only a newer Node has
  # ships unnoticed. Tests only: lint, types and the published surface do not
  # depend on the runtime. The job reads no publishing version, so it stays
  # right when that version moves; a package with no floor skips it, and the
  # package job says so. It is split like validate's tests, so a suite that
  # needs shards on the publishing Node gets them on the floor too. The meta
  # workflow's validate aggregates every shard through this workflow's result.
  # It takes no expression name: GitHub does not evaluate one for a skipped
  # job, and skipping is this job's common path, so its rows read
  # `engines-floor` skipped and `engines-floor (<i>)` run.
  engines-floor:
    needs: package
    if: ${{ needs.package.outputs.floor != '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.package.outputs.shards) }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    # The same engines as validate's, for its install and tests.
    env:
      CPLIEGER_BROWSERS: ${{ needs.package.outputs.browsers }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.package.outputs.node }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install deps
        run: npm ci

      # The same install as validate's, so a browser-mode suite finds its
      # browsers on the floor too.
      - name: Install browsers (vitest browser mode)
        timeout-minutes: 10
        run: |
          if node -e "const d=require('./package.json').devDependencies||{}; process.exit(d['@vitest/browser-playwright']?0:1)"; then
            need_libs=()
            IFS=, read -ra engines <<< "$CPLIEGER_BROWSERS"
            for engine in "${engines[@]}"; do
              case "$engine" in
                chromium) npx --no-install playwright install chromium ;;
                firefox | webkit) need_libs+=("$engine") ;;
                *)
                  echo "::error::unknown browser engine '${engine}'"
                  exit 1
                  ;;
              esac
            done
            if [ "${#need_libs[@]}" -gt 0 ]; then
              # The system libraries need root for apt, which a self-hosted
              # runner may not grant; its image carries them. Unset reads
              # hosted. The hosted image lacks Firefox's and WebKit's, and an
              # Ubuntu mirror or DNS outage stalls apt, so the install is bounded
              # below the step timeout. They go first, so the engines' own host
              # check finds them.
              if [ "${RUNNER_ENVIRONMENT:-github-hosted}" = github-hosted ]; then
                rc=0
                timeout 300 npx --no-install playwright install-deps "${need_libs[@]}" || rc=$?
                if [ "$rc" -ne 0 ]; then
                  echo "::error::playwright install-deps for ${need_libs[*]} failed or ran past 5 minutes (exit ${rc}). An Ubuntu mirror or DNS outage is the usual cause: rerun the job once it clears."
                  exit 1
                fi
              fi
              npx --no-install playwright install "${need_libs[@]}"
            fi
          else
            echo "no @vitest/browser-playwright devDependency; skipping browser install"
          fi

      # The same Go test server build as validate's.
      - name: Setup Go (sseFixture)
        if: ${{ needs.package.outputs.sse-fixture != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ needs.package.outputs.sse-fixture }}/go.mod
          cache: ${{ needs.package.outputs.sse-fixture-sum != '' }}
          cache-dependency-path: ${{ needs.package.outputs.sse-fixture-sum }}

      - name: Build the sseFixture test server
        if: ${{ needs.package.outputs.sse-fixture != '' }}
        timeout-minutes: 10
        env:
          FIXTURE_DIR: ${{ needs.package.outputs.sse-fixture }}
          FIXTURE_TAGS: ${{ needs.package.outputs.sse-fixture-tags }}
        run: |
          cd "$GITHUB_WORKSPACE/$FIXTURE_DIR"
          if ! go build -tags "$FIXTURE_TAGS" -o "$RUNNER_TEMP/sse-fixture" .; then
            echo "::error::the sseFixture test server in ${FIXTURE_DIR} failed to build with -tags \"${FIXTURE_TAGS}\""
            exit 1
          fi
          echo "SSE_FIXTURE=$RUNNER_TEMP/sse-fixture" >> "$GITHUB_ENV"

      # The same hand-off as validate's test step, without its soft gate.
      - name: Test (vitest) on the engines floor
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.package.outputs.count }}
        run: |
          if [ "$SHARDS" -eq 1 ]; then
            npm test
            exit "$?"
          fi
          # npm appends `--` arguments to the script's command line, so they reach
          # its last command only (and no pre/post script): anything after vitest
          # would take --shard while every shard ran the whole suite.
          if ! node -e "const s=(require('./package.json').scripts||{}).test||''; process.exit(/\bvitest\b/.test(s) && !/[;&|#\n]/.test(s) ? 0 : 1)"; then
            echo "::error::package.json sets cplieger.vitestShards to ${SHARDS}, so this job runs 'npm test -- --shard=${SHARD}/${SHARDS}': the package.json test script must be one vitest command. Move a command that follows the tests to posttest."
            exit 1
          fi
          npm test -- --shard="${SHARD}/${SHARDS}"
