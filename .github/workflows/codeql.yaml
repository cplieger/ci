name: CodeQL

on:
  workflow_call:
    inputs:
      queries:
        type: string
        default: 'security-extended,security-and-quality'
        description: 'CodeQL query suites'
      languages:
        type: string
        default: ''
        description: 'Optional comma-separated override; empty = auto-detect'

permissions:
  contents: read

env:
  # The one place the analysis's ignore glob lives: language detection below
  # drops a language whose every tracked file sits under it, and the analysis
  # is configured with it. Fixture trees are inputs a test reads, not code that
  # runs, and a dead-code analyzer's fixtures are dead or unreachable by
  # construction; the shared eslint config skips the same glob.
  CODEQL_PATHS_IGNORE: '**/fixtures/**'

jobs:
  detect:
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.langs.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Detect languages
        id: langs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          if [ -n "${EXPLICIT}" ]; then langs=$(printf '%s' "${EXPLICIT}" | jq -cR 'split(",")|map(gsub("^ +| +$";""))|unique'); else
            langs=$(gh api "repos/${GITHUB_REPOSITORY}/languages" --jq '[ keys[] | {Go:"go",JavaScript:"javascript-typescript",TypeScript:"javascript-typescript",Python:"python",Ruby:"ruby"}[.] // empty ] + ["actions"] | unique')
            # A language whose every tracked file sits under the ignore glob
            # has nothing left to analyze, and CodeQL fails a database that
            # holds no code, so it is dropped here.
            present=$(git ls-files -z -- . ":(exclude,glob)${CODEQL_PATHS_IGNORE}" | tr '\0' '\n' \
              | jq -cRn '[inputs | (capture("\\.(?<x>[^./]+)$") | .x)? | {go:"go",js:"javascript-typescript",mjs:"javascript-typescript",cjs:"javascript-typescript",jsx:"javascript-typescript",ts:"javascript-typescript",tsx:"javascript-typescript",mts:"javascript-typescript",cts:"javascript-typescript",py:"python",rb:"ruby"}[.] // empty] + ["actions"] | unique')
            langs=$(jq -cn --argjson a "${langs}" --argjson p "${present}" '$a - ($a - $p)')
          fi
          echo "languages=${langs}" >> "$GITHUB_OUTPUT"; echo "detected: ${langs}"

  analyze:
    needs: detect
    if: needs.detect.outputs.languages != '' && needs.detect.outputs.languages != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: ${{ inputs.queries }}
          config: |
            paths-ignore:
              - '${{ env.CODEQL_PATHS_IGNORE }}'

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
