# Unified release pipeline for all cplieger consumer repos, in two channels.
# The branch is read in exactly one place, detect's `Select channel` step, and
# the channel travels as data from there: a push to `dev` publishes the dev
# channel (`vX.Y.Z-dev.N` tags, `:dev` images on GHCR, the npm `dev` dist-tag,
# no GitHub Release); any other branch publishes the stable channel (`vX.Y.Z`,
# GHCR + Docker Hub, npm + JSR, a GitHub Release). Path significance is
# scripts/path-significance.sh, so a push touching only excluded paths
# publishes nothing; per-repo policy is the "Resolve repo policy" step.
name: Release

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Top-level is read-only (least privilege); each job below
# declares the exact write scopes it needs. The docker job forwards them to the
# called docker-release.yaml, whose own jobs scope them further.
permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-26.04
    # Two-branch detect also finds and numbers pending promotions and reads receipts.
    timeout-minutes: >-
      ${{ (github.event.repository.default_branch == 'dev' && !github.event.repository.private
      && !github.event.repository.fork) && 5 || 3 }}
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      # legacy | two-branch; every two-branch step and job keys on it.
      release_model: ${{ steps.channel.outputs.release_model }}
      mode: ${{ steps.channel.outputs.mode }}
      type: ${{ steps.type.outputs.type }}
      subpackages: ${{ steps.type.outputs.subpackages }}
      subpackages_to_publish: ${{ steps.publish.outputs.subpackages_to_publish || steps.changes.outputs.subpackages_to_publish }}
      # version is the tag this run creates: the dev version on dev, the
      # stable base on stable. base and dev_version are both exposed because
      # docker-release derives vX / vX.Y from the base on either channel.
      version: ${{ steps.select.outputs.version }}
      release: ${{ steps.select.outputs.release }}
      base: ${{ steps.select.outputs.base }}
      dev_version: ${{ steps.select.outputs.dev_version }}
      latest: ${{ steps.cliff.outputs.latest }}
      exclude_re: ${{ steps.changes.outputs.exclude_re }}
      root_changed: ${{ steps.publish.outputs.root_changed || steps.changes.outputs.root_changed }}
      go_modules: ${{ steps.gomodules.outputs.go_modules }}
      go_modules_to_release: ${{ steps.publish.outputs.go_modules_to_release || steps.changes.outputs.go_modules_to_release }}
      # finalize: a prior run tagged this exact commit but died before its
      # GitHub Release; the publish jobs re-run for the tagged version and
      # create the missing Release (see the step).
      finalize: ${{ steps.finalize.outputs.finalize }}
      # The root lane's release-kind line; empty under legacy.
      release_kind_note: ${{ steps.pending.outputs.root_kind_note }}
      # Two-branch only: per-lane state keyed '.' (root) or the lane dir, the
      # lane matrix, the repairs owed (those completing TS subpackages, and
      # the image's, apart) and the Renovate security merges.
      lane_state: ${{ steps.number.outputs.state || steps.pending.outputs.state }}
      lanes: ${{ steps.pending.outputs.lanes }}
      in_range_any: ${{ steps.pending.outputs.in_range_any }}
      repairs: ${{ steps.receipts.outputs.repairs }}
      repair_publishes: ${{ steps.receipts.outputs.repair_publishes }}
      repair_images: ${{ steps.receipts.outputs.repair_images }}
      security_shas: ${{ steps.receipts.outputs.security_shas }}
      exclude_paths: ${{ steps.gomodules.outputs.exclude_paths }}
      registries: ${{ steps.policy.outputs.registries }}
      platforms: ${{ steps.policy.outputs.platforms }}
      sbom_from: ${{ steps.policy.outputs.sbom_from }}
      syft_config: ${{ steps.policy.outputs.syft_config }}
      image_licenses: ${{ steps.policy.outputs.image_licenses }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      # The only place in the release pipeline that reads a branch name.
      # Everything downstream, docker-release.yaml included, receives the
      # channel as data, so a repo that has not adopted a dev branch keeps
      # the stable behaviour on main unchanged. The release model is read
      # here too: two-branch exactly when a public, non-fork repo's default
      # branch is dev.
      - name: Select channel
        id: channel
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          REPO_FORK: ${{ github.event.repository.fork }}
          # A dispatch input read off the event: the synced caller forwards no
          # `with:`.
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            CHANNEL=dev
          else
            CHANNEL=stable
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL ($GITHUB_REF)"
          RELEASE_MODEL=legacy
          MODE=normal
          if [ "$DEFAULT_BRANCH" = dev ] && [ "$REPO_PRIVATE" != true ] && [ "$REPO_FORK" != true ]; then
            RELEASE_MODEL=two-branch
            case "$INPUT_MODE" in
              '' | normal) ;;
              renumber)
                if [ "$CHANNEL" != dev ]; then
                  echo "::error::mode=renumber renumbers dev builds. Dispatch it on dev, not on ${GITHUB_REF}."
                  exit 1
                fi
                MODE=renumber
                ;;
              *)
                echo "::error::unknown mode '${INPUT_MODE}' (normal or renumber)"
                exit 1
                ;;
            esac
          fi
          {
            echo "release_model=$RELEASE_MODEL"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"
          echo "Release model: $RELEASE_MODEL (default branch ${DEFAULT_BRANCH:-<unknown>}), mode: $MODE"

      - name: Detect type + subpackages
        id: type
        run: |
          set -euo pipefail
          # Type precedence: Dockerfile > jsr.json > go.mod. A repo that has
          # multiple of these signals (e.g., docker-age has Dockerfile + go.mod)
          # is treated as docker; the go.mod is for the binary inside the image
          # and isn't a separately released module.
          if [ -f Dockerfile ]; then
            TYPE=docker
          elif [ -f jsr.json ]; then
            TYPE=ts
          elif [ -f go.mod ]; then
            TYPE=go
          else
            TYPE=none
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

          # Find first-level subdirectories with jsr.json (subpackages).
          # Only one repo currently uses this (web-terminal-engine/web/), but the mechanism
          # is generic — any repo with a Go/Docker root + a TS lib in a subdir
          # gets unified releases via this matrix.
          SUBS="[]"
          for d in */; do
            if [ -f "${d}jsr.json" ]; then
              SUBS=$(echo "$SUBS" | jq -c --arg v "${d%/}" '. + [$v]')
            fi
          done
          echo "subpackages=$SUBS" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE  subpackages=$SUBS"

      - name: Detect nested Go modules
        id: gomodules
        run: |
          set -euo pipefail
          # Nested Go modules — a TRACKED subdirectory go.mod — each get their
          # own release lane: independent conventional-commit versioning and
          # <dir>/vX.Y.Z tags (the go-nested job below). Works for any repo
          # type; a repo without nested modules produces [] and nothing below
          # changes behavior. Discovery prunes vendored/generated trees: a
          # committed node_modules (e.g. subflux's embedded frontend deps) can
          # carry upstream go.mod files that are not release lanes. git
          # pathspec '*/go.mod' matches at any depth (git wildmatch '*'
          # crosses slashes) but never the root go.mod.
          #
          # Eligibility filters (keep in sync with ci.yaml's detect step and
          # scripts/test-lane-semantics.sh, which pins them):
          #   - module path's first element must contain a dot: Go itself
          #     never fetches a dotless path from the network, so a sentinel
          #     go.mod (e.g. web-terminal-engine's `module web-ignore`, which
          #     exists to keep root `go test ./...` out of a TS subtree) is
          #     not a lane. This filter is what keeps the feature dormant on
          #     repos that track sentinel modules.
          #   - the dir must contain tracked .go files (a module with no Go
          #     source releases nothing).
          #   - RELEASE lanes skip dirs under internal/ (unimportable outside
          #     the repo, so tags/Releases for them are noise; ci.yaml still
          #     VALIDATES internal modules).
          #   - dir names are restricted to [A-Za-z0-9._/-]: anything else is
          #     not a valid Go module path element and would mis-scope the
          #     glob/regex/tag machinery downstream — fail loud, not weird.
          #   - overlapping lanes (one dir an ancestor of another) are
          #     rejected: prefix classification would assign files to a
          #     parent lane nondeterministically.
          LANES="[]"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            d=$(dirname "$f")
            case "$d" in
              *[!A-Za-z0-9._/-]*)
                echo "::error::nested go.mod dir '$d' contains characters outside [A-Za-z0-9._/-]; not a valid Go module path element"
                exit 1 ;;
            esac
            case "/$d/" in
              */internal/*)
                echo "::notice::nested module '$d' is under internal/ — validated by CI, not released"
                continue ;;
            esac
            modpath=$(awk '$1=="module"{print $2; exit}' "$f")
            case "${modpath%%/*}" in
              *.*) : ;;
              *)
                echo "::notice::nested go.mod '$f' (module '${modpath:-<none>}') has a dotless first path element — a sentinel/local module, not a release lane"
                continue ;;
            esac
            if [ -z "$(git ls-files "$d/*.go" | head -1)" ]; then
              echo "::notice::nested module '$d' has no tracked .go files — not a release lane"
              continue
            fi
            LANES=$(echo "$LANES" | jq -c --arg v "$d" '. + [$v]')
          done < <(git ls-files '*/go.mod' | grep -Ev '(^|/)(node_modules|vendor|testdata|static|dist)/' || true)
          # Reject overlapping lanes (ancestor/descendant pairs).
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            while IFS= read -r b; do
              [ -z "$b" ] && continue
              if [ "$a" != "$b" ] && [ "${b#"$a"/}" != "$b" ]; then
                echo "::error::nested Go modules '$a' and '$b' overlap (one contains the other); restructure so lane dirs are disjoint"
                exit 1
              fi
            done < <(echo "$LANES" | jq -r '.[]')
          done < <(echo "$LANES" | jq -r '.[]')
          {
            echo "go_modules=$LANES"
            echo "exclude_paths<<EOF"
            echo "$LANES" | jq -r '.[] | . + "/**"'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "nested Go module lanes: $LANES"

      # Every job runs the scripts and actions of the commit this workflow
      # runs from, checked out beside the consumer's tree: a `uses:` ref to
      # this repository would run another commit's code under the caller's pin.
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # Two-branch only. Token-free: the steps up to Compute version run the
      # repository's cliff config.
      - name: Find pending promotions
        id: pending
        if: ${{ steps.channel.outputs.release_model == 'two-branch' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: ${{ steps.channel.outputs.channel }}
          REPO_TYPE: ${{ steps.type.outputs.type }}
          SUBPACKAGES_JSON: ${{ steps.type.outputs.subpackages }}
          GO_LANES_JSON: ${{ steps.gomodules.outputs.go_modules }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" pending

      # Numbering a promotion needs git-cliff, which the compute action
      # installs; its own version outputs are not read.
      - name: Install git-cliff for promotion numbering
        id: cliff0
        if: ${{ steps.pending.outputs.any == 'true' }}
        uses: ./.cplieger-ci/actions/git-cliff-version
        with:
          channel: ${{ steps.channel.outputs.channel }}
          exclude-paths: ${{ steps.gomodules.outputs.exclude_paths }}

      - name: Number pending promotions
        id: number
        if: ${{ steps.pending.outputs.any == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CLIFF_SCRIPT: ${{ steps.cliff0.outputs.script }}
          STATE: ${{ steps.pending.outputs.state }}
          EXCLUDE_PATHS: ${{ steps.gomodules.outputs.exclude_paths }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" number

      - name: Compute version (cliff)
        id: cliff
        uses: ./.cplieger-ci/actions/git-cliff-version
        with:
          channel: ${{ steps.channel.outputs.channel }}
          exclude-paths: ${{ steps.gomodules.outputs.exclude_paths }}
          release-model: ${{ steps.channel.outputs.release_model }}
          pending-version: ${{ steps.channel.outputs.channel == 'dev' && steps.number.outputs.root_version || '' }}
          pending-in-range: ${{ steps.pending.outputs.root_in_range || 'false' }}

      - name: Detect changed paths
        id: changes
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          ANCHOR_SHA: ${{ steps.cliff.outputs.anchor_sha }}
          SUBPACKAGES_JSON: ${{ steps.type.outputs.subpackages }}
          GO_LANES_JSON: ${{ steps.gomodules.outputs.go_modules }}
          REPO_TYPE: ${{ steps.type.outputs.type }}
          RELEASE_MODEL: ${{ steps.channel.outputs.release_model }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/path-significance.sh"

      # Two-branch stable: a pending promotion in this run's range publishes
      # its lanes whatever the triggering commit changed.
      - name: Add pending promotions to the publication
        id: publish
        if: |
          steps.channel.outputs.release_model == 'two-branch' && steps.channel.outputs.channel == 'stable'
          && steps.pending.outputs.in_range_any == 'true'
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: ${{ steps.channel.outputs.channel }}
          STATE: ${{ steps.pending.outputs.state }}
          ROOT_CHANGED: ${{ steps.changes.outputs.root_changed }}
          SUBPACKAGES_TO_PUBLISH: ${{ steps.changes.outputs.subpackages_to_publish }}
          GO_MODULES_TO_RELEASE: ${{ steps.changes.outputs.go_modules_to_release }}
          REPO_TYPE: ${{ steps.type.outputs.type }}
          SUBPACKAGES_JSON: ${{ steps.type.outputs.subpackages }}
          GO_LANES_JSON: ${{ steps.gomodules.outputs.go_modules }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" publish

      # The release decision is "a shipped path changed and this commit is
      # not already tagged on this channel"; git-cliff only decides the bump
      # level, and a level of "none" on a real change becomes a patch floor
      # (legacy only: two-branch compute never proposes the latest stable
      # version for an untagged commit). A changed TS subpackage counts: it
      # shares the root version, so its publish needs the root tag the go job
      # creates, while the root image rebuilds on root_changed alone. A
      # renumber run publishes nothing here; the renumber jobs tag it.
      - name: Select version
        id: select
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          MODE: ${{ steps.channel.outputs.mode }}
          ROOT_CHANGED: ${{ steps.publish.outputs.root_changed || steps.changes.outputs.root_changed }}
          SUBPACKAGES_TO_PUBLISH: ${{ steps.publish.outputs.subpackages_to_publish || steps.changes.outputs.subpackages_to_publish }}
          BASE: ${{ steps.cliff.outputs.base }}
          DEV_VERSION: ${{ steps.cliff.outputs.dev_version }}
          FLOOR_BASE: ${{ steps.cliff.outputs.floor_base }}
          FLOOR_DEV_VERSION: ${{ steps.cliff.outputs.floor_dev_version }}
          LATEST: ${{ steps.cliff.outputs.latest }}
          ANCHOR_SHA: ${{ steps.cliff.outputs.anchor_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            echo "::error::git-cliff-version returned no base"
            exit 1
          fi
          RELEASE=false
          if [ "$ANCHOR_SHA" != "$GITHUB_SHA" ]; then
            if [ "$ROOT_CHANGED" = "true" ] || [ "$SUBPACKAGES_TO_PUBLISH" != "[]" ]; then
              RELEASE=true
            fi
          fi
          if [ "$RELEASE" = "true" ] && [ "$BASE" = "$LATEST" ] && [ -n "$FLOOR_BASE" ]; then
            echo "::notice::git-cliff proposes no bump for a shipped change; flooring ${BASE} to ${FLOOR_BASE}"
            BASE="$FLOOR_BASE"
            DEV_VERSION="$FLOOR_DEV_VERSION"
          fi
          if [ "$MODE" = "renumber" ]; then
            echo "::notice::Renumber mode builds and publishes nothing. The renumber jobs re-tag dev's newest build."
            RELEASE=false
          fi
          if [ "$CHANNEL" = "dev" ]; then
            VERSION="$DEV_VERSION"
          else
            VERSION="$BASE"
          fi
          {
            echo "version=$VERSION"
            echo "release=$RELEASE"
            echo "base=$BASE"
            echo "dev_version=$DEV_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Selected: channel=${CHANNEL} version=${VERSION} base=${BASE} release=${RELEASE} (latest stable: ${LATEST:-<none>})"

      # Legacy, stable only: a dev build has no Release to repair. On stable a
      # prior run can tag this commit and die before the Release; the compute
      # then says release=false (anchor == HEAD) and nothing would ever repair
      # it, while moving the tag is forbidden. finalize=true re-runs the publish
      # jobs for the tagged version: the tag guard reuses the tag, npm and JSR
      # skip an existing version, the image tags move to a rebuild of the
      # same commit, and the missing Release gets --current notes (states K/L).
      # Two-branch repairs by completion receipt instead (the repair jobs).
      - name: Detect finalize state
        id: finalize
        if: ${{ steps.channel.outputs.channel == 'stable' && steps.channel.outputs.release_model == 'legacy' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EFFECTIVE_RELEASE: ${{ steps.select.outputs.release }}
          EFFECTIVE_VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          FINALIZE=false
          if [ "$EFFECTIVE_RELEASE" = "false" ] && [ -n "$EFFECTIVE_VERSION" ]; then
            TAG_SHA=$(git rev-list -n1 "$EFFECTIVE_VERSION" 2>/dev/null || echo "")
            if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
              # Status-aware absence check: only a definitive HTTP 404 means
              # "no Release" (finalize); any other failure (auth, rate limit,
              # transient 5xx) fails the job rather than guessing in either
              # direction. The by-tag endpoint returns only PUBLISHED
              # releases, so a DRAFT orphaned by a wedged asset upload (gh
              # release create drafts first when assets are attached) also
              # reads as missing; the docker create step deletes such drafts
              # before re-creating.
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${EFFECTIVE_VERSION}" >/dev/null 2>/tmp/relerr; then
                echo "::notice::tag ${EFFECTIVE_VERSION} exists at this commit and its Release is present — nothing to repair"
              elif grep -q 'HTTP 404' /tmp/relerr; then
                FINALIZE=true
                echo "::notice::tag ${EFFECTIVE_VERSION} exists at this commit without a Release: finalize republishes it and creates the Release"
              else
                echo "::error::could not determine whether Release ${EFFECTIVE_VERSION} exists:"
                cat /tmp/relerr
                exit 1
              fi
            fi
          fi
          echo "finalize=$FINALIZE" >> "$GITHUB_OUTPUT"

      # A tag alone does not prove a complete publication (tags precede the
      # Release and the readback): the repair jobs complete each lane's
      # highest stable tag that lacks its completion receipt before anything
      # newer is published.
      - name: Read release receipts
        id: receipts
        if: ${{ steps.channel.outputs.release_model == 'two-branch' && steps.channel.outputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          STATE: ${{ steps.number.outputs.state || steps.pending.outputs.state }}
          REPO_TYPE: ${{ steps.type.outputs.type }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" receipts

      - name: Resolve repo policy
        id: policy
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_SPDX_ID: ${{ github.event.repository.license.spdx_id }}
        run: |
          set -euo pipefail
          # Per-repo policy overrides. Centralized here, NOT per-repo config.
          # When you need to change a repo's release behavior, edit this step.
          #
          # Defaults:
          #   registries  = "ghcr,dockerhub" (push to both)
          #   platforms   = "linux/amd64,linux/arm64" (multi-arch)
          #   sbom_from   = "image" (scan published image)
          #   syft_config = ".syft.yaml" if file exists at root, else ""
          #                 (back-compat for repo-SPECIFIC syft needs only;
          #                 the sbom-cataloger is centrally enabled — see below)
          #   image_licenses = the repo's own SPDX id, spelled -or-later for the
          #                 GNU family (GitHub's spdx_id cannot express it)
          REGISTRIES="ghcr,dockerhub"
          PLATFORMS="linux/amd64,linux/arm64"
          SBOM_FROM="image"
          case "$REPO_SPDX_ID" in
            ''|NOASSERTION) IMAGE_LICENSES="" ;;
            GPL-*|AGPL-*|LGPL-*) IMAGE_LICENSES="${REPO_SPDX_ID}-or-later" ;;
            *) IMAGE_LICENSES="$REPO_SPDX_ID" ;;
          esac

          # org.opencontainers.image.licenses covers EVERYTHING in the image, so
          # a wrapper carries its upstream's license too; a Go app whose deps
          # are all permissive keeps its own id.
          case "$REPO_NAME" in
            docker-rsync-scheduler)
              IMAGE_LICENSES="Apache-2.0 AND GPL-3.0-or-later" ;;
            docker-keepalived)
              IMAGE_LICENSES="Apache-2.0 AND GPL-2.0-or-later" ;;
            docker-nut-upsd)
              IMAGE_LICENSES="Apache-2.0 AND GPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause AND MIT-CMU AND MIT" ;;
            docker-renovate-scheduler)
              IMAGE_LICENSES="Apache-2.0 AND AGPL-3.0-only" ;;
            docker-smtp-relay)
              IMAGE_LICENSES="Apache-2.0 AND (EPL-2.0 OR IPL-1.0)" ;;
            docker-radvd)
              IMAGE_LICENSES="Apache-2.0 AND BSD-4-Clause" ;;
            docker-caddy)
              IMAGE_LICENSES="Apache-2.0" ;;
            docker-age)
              IMAGE_LICENSES="Apache-2.0 AND BSD-3-Clause" ;;
            docker-fclones-scheduler)
              IMAGE_LICENSES="Apache-2.0 AND MIT" ;;
            subflux)
              IMAGE_LICENSES="AGPL-3.0-or-later AND GPL-2.0-or-later" ;;
            marotte)
              IMAGE_LICENSES="AGPL-3.0-or-later AND OFL-1.1" ;;
            web-terminal-kiro|web-terminal-server)
              IMAGE_LICENSES="MPL-2.0 AND OFL-1.1" ;;
          esac

          # Every image repo dual-publishes; there is no GHCR-only set. The
          # last two exemptions (subflux, marotte) were removed 2026-08-21 —
          # both had DOCKERHUB_* secrets and a README advertising a Docker Hub
          # image, while this override had frozen that registry at v0.1.x since
          # 2026-06-04. A new exemption needs a REGISTRIES="ghcr" arm here AND
          # a matching skip in scripts/audit.py's DOCKERHUB_* secrets check.

          case "$REPO_NAME" in
            # SBOM from extracted binary path (image-level scan misses static
            # Go deps for these builds).
            web-terminal-kiro|marotte)
              SBOM_FROM="path" ;;
          esac

          # Auto-detect a checked-in syft config at repo root. Back-compat
          # hook for future repo-SPECIFIC syft needs; NOT required for the
          # sbom-cataloger, which docker-release.yaml enables centrally for
          # all image scans via SYFT_SELECT_CATALOGERS (SBOM policy belongs
          # to the pipeline). Env overrides same-key config-file values in
          # syft, so a repo .syft.yaml selecting +sbom-cataloger is
          # redundant-but-harmless during the transition.
          if [ -f .syft.yaml ]; then
            SYFT_CONFIG=".syft.yaml"
          else
            SYFT_CONFIG=""
          fi

          {
            echo "registries=$REGISTRIES"
            echo "platforms=$PLATFORMS"
            echo "sbom_from=$SBOM_FROM"
            echo "syft_config=$SYFT_CONFIG"
            echo "image_licenses=$IMAGE_LICENSES"
          } >> "$GITHUB_OUTPUT"

          echo "Policy: registries=$REGISTRIES platforms=$PLATFORMS sbom_from=$SBOM_FROM syft_config='$SYFT_CONFIG' image_licenses='$IMAGE_LICENSES'"

  # ─── Two-branch: repair each lane's unreceipted stable tag first ───────────
  # A lane's tag follows its registry writes, so a failed run can leave only
  # its Release, its readback and the TS subpackages (published after the root
  # tag) missing. These jobs complete them at the tag's own commit and range in
  # this run, with no dispatch, so the per-ref concurrency group cannot
  # deadlock. A step reaches its job's later steps through GITHUB_PATH and
  # GITHUB_ENV, so the job running the cliff config holds no write scope.
  repair-notes:
    needs: detect
    if: ${{ needs.detect.outputs.repairs != '' && needs.detect.outputs.repairs != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.repairs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Check the Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" handoff-name repair-notes "$TAG" | sed 's/^/artifact=/' >> "$GITHUB_OUTPUT"
          state=$(bash "$CI_TOOLS/release-exists.sh" "$TAG")
          if [ "$state" = present ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} has its Release; reading it back"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} has no Release, so its notes are rendered at its own commit"
          fi

      # Installs the pinned git-cliff; the computed version is not read.
      - name: Install git-cliff
        if: ${{ steps.release.outputs.missing == 'true' }}
        uses: ./.cplieger-ci/actions/git-cliff-version
        with:
          lane: ${{ matrix.lane }}

      # Token-free: renders with the repository's cliff config.
      - name: Render the missing Release notes
        if: ${{ steps.release.outputs.missing == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          SITE: ${{ matrix.site }}
          LANE: ${{ matrix.lane }}
          TAG: ${{ matrix.tag }}
          COMMIT: ${{ matrix.commit }}
          KIND_NOTE: ${{ matrix.kind_note }}
          GO_LANES_JSON: ${{ needs.detect.outputs.go_modules }}
          SECURITY_SHAS: ${{ needs.detect.outputs.security_shas }}
        run: |
          set -euo pipefail
          tr ' ' '\n' <<<"$SECURITY_SHAS" > "$RUNNER_TEMP/security-shas"
          mkdir -p "$RUNNER_TEMP/notes"
          args=(--release-model two-branch --site "$SITE" --version "$TAG" --release-commit "$COMMIT"
            --kind-note "$KIND_NOTE" --repo "$GITHUB_REPOSITORY" --security-shas "$RUNNER_TEMP/security-shas"
            --out "$RUNNER_TEMP/notes/NOTES.md")
          if [ "$SITE" = lane ]; then
            args+=(--lane "$LANE")
          else
            args+=(--go-lanes "$GO_LANES_JSON")
          fi
          bash "$CI_TOOLS/render-notes.sh" "${args[@]}"

      - name: Hand the notes on
        if: ${{ steps.release.outputs.missing == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/notes/NOTES.md
          retention-days: 1
          if-no-files-found: error

  # An image's Release carries its signed SBOM and dashboard, and only
  # docker-release.yaml's identity may sign them. The caller grants what that
  # workflow's other jobs declare; the job that runs holds read and OIDC only.
  repair-assets:
    needs: detect
    if: ${{ needs.detect.outputs.repair_images != '' && needs.detect.outputs.repair_images != '[]' }}
    permissions:
      contents: write
      statuses: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.repair_images) }}
    uses: ./.github/workflows/docker-release.yaml
    with:
      channel: stable
      version: ${{ matrix.tag }}
      release-model: two-branch
      repair-tag: ${{ matrix.tag }}
      exclude-re: ${{ needs.detect.outputs.exclude_re }}
      subpackages: ${{ needs.detect.outputs.subpackages }}

  # Checks out nothing and runs nothing from the repository.
  repair-release:
    needs: [detect, repair-notes, repair-assets]
    if: |
      !cancelled() && needs.repair-notes.result == 'success'
      && (needs.repair-assets.result == 'success' || needs.repair-assets.result == 'skipped')
      && needs.detect.outputs.repairs != '' && needs.detect.outputs.repairs != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.repairs) }}
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Check the Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" handoff-name repair-notes "$TAG" | sed 's/^/artifact=/' >> "$GITHUB_OUTPUT"
          bash "$CI_TOOLS/release-state.sh" handoff-name repair-assets "$TAG" | sed 's/^/assets=/' >> "$GITHUB_OUTPUT"
          state=$(bash "$CI_TOOLS/release-exists.sh" "$TAG")
          echo "missing=$([ "$state" = absent ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fetch the notes
        if: ${{ steps.release.outputs.missing == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/notes

      - name: Fetch the assets
        if: ${{ steps.release.outputs.missing == 'true' && matrix.site == 'docker' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.release.outputs.assets }}
          path: ${{ runner.temp }}/assets

      # An image's Release is created with its assets, which gh does as a draft
      # published after the upload, so it is never public without them; an
      # immutable Release could not take them later.
      - name: Publish the missing Release
        if: ${{ steps.release.outputs.missing == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail
          if [ "$SITE" != docker ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes/NOTES.md"
            exit 0
          fi
          cd "$RUNNER_TEMP/assets"
          assets=(sbom.spdx.json sbom.spdx.json.sigstore.json)
          dashboard=(grafana-dashboard.json grafana-dashboard.json.sha256 grafana-dashboard.json.sigstore.json)
          for f in "${dashboard[@]}"; do
            if [ -e "$f" ]; then
              assets+=("${dashboard[@]}")
              break
            fi
          done
          for f in "${assets[@]}"; do
            [ -s "$f" ] || { echo "::error::${f} is missing. ${TAG} is not published without it."; exit 1; }
          done
          # A draft left by an upload that died is not a Release by tag, so it would linger.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg v "$TAG" '.[] | select(.draft and .tag_name == $v) | .id' \
            | while IFS= read -r id; do
                [ -n "$id" ] || continue
                echo "::notice::deleting orphaned draft release ${id} for ${TAG}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
              done
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes/NOTES.md" "${assets[@]}"
          have=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name')
          for f in "${assets[@]}"; do
            grep -qxF "$f" <<<"$have" || { echo "::error::Release ${TAG} is missing asset ${f}"; exit 1; }
          done

  repair-publish:
    needs: [detect, repair-release]
    if: ${{ needs.detect.outputs.repair_publishes != '' && needs.detect.outputs.repair_publishes != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.repair_publishes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # From the tag's own tree, through the subpackage job's script, so a
      # version already published is left alone.
      - name: Complete the subpackages
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          TAG: ${{ matrix.tag }}
          COMMIT: ${{ matrix.commit }}
          SUBPACKAGES: ${{ matrix.subpackages }}
          # renovate: datasource=npm depName=jsr
          JSR_VERSION: 0.14.3
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/at-tag"
          git worktree add --quiet --detach "$tree" "$COMMIT"
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            (cd "$tree/$d" && VERSION="$TAG" CHANNEL=stable bash "$CI_TOOLS/publish-subpackage.sh")
          done < <(jq -r '.[]' <<<"$SUBPACKAGES")

  # The job every publishing job waits on: skipped only when nothing is owed.
  repair:
    needs: [detect, repair-notes, repair-release, repair-publish]
    if: ${{ !cancelled() && needs.detect.outputs.repairs != '' && needs.detect.outputs.repairs != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    env:
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: v3.1.3
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.repairs) }}
    steps:
      - name: Require the Release and the subpackages
        env:
          NOTES: ${{ needs.repair-notes.result }}
          RELEASE: ${{ needs.repair-release.result }}
          PUBLISH: ${{ needs.repair-publish.result }}
        run: |
          set -euo pipefail
          if [ "$NOTES" != success ] || [ "$RELEASE" != success ] || { [ "$PUBLISH" != success ] && [ "$PUBLISH" != skipped ]; }; then
            echo "::error::repair-notes ${NOTES}, repair-release ${RELEASE}, repair-publish ${PUBLISH}: no receipt is recorded and nothing publishes"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # The image readback proves the tag's digest by its signature.
      - name: Install Cosign
        if: ${{ matrix.site == 'docker' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Read back and record the receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          SITE: ${{ matrix.site }}
          LANE: ${{ matrix.lane }}
          TAG: ${{ matrix.tag }}
          COMMIT: ${{ matrix.commit }}
          SUBPACKAGES: ${{ matrix.subpackages || '[]' }}
          IMAGE: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          REGISTRIES: ${{ needs.detect.outputs.registries }}
          EXCLUDE_RE: ${{ needs.detect.outputs.exclude_re }}
          SUBPACKAGES_JSON: ${{ needs.detect.outputs.subpackages }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" readback "$SITE" "$TAG" "$LANE"
          bash "$CI_TOOLS/release-state.sh" receipt "$TAG" "$COMMIT"

  # ─── Two-branch: hold a promotion's stable publish behind dev ──────────────
  # A stable release must never outrank newer dev content: wait for the dev
  # release runs, then renumber dev when its newest build would rank below
  # the version this run publishes. Every publishing job needs it.
  # release-state.sh barrier owns which runs it waits for and how the
  # renumber run shares dev's concurrency group.
  barrier:
    needs: detect
    if: |
      needs.detect.outputs.release_model == 'two-branch' && needs.detect.outputs.channel == 'stable'
      && needs.detect.outputs.in_range_any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 160
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Hold for dev
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          STATE: ${{ needs.detect.outputs.lane_state }}
          ROOT_VERSION: ${{ needs.detect.outputs.version }}
          REPO_TYPE: ${{ needs.detect.outputs.type }}
          IMAGE: ${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # A called workflow's GITHUB_WORKFLOW_REF names its caller, `<owner>/<repo>/<path>@<ref>`
          # (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context).
          echo "caller workflow: $GITHUB_WORKFLOW_REF"
          path="${GITHUB_WORKFLOW_REF%@*}"
          case "$path" in
            "$GITHUB_REPOSITORY"/.github/workflows/*) ;;
            *)
              echo "::error::GITHUB_WORKFLOW_REF names $GITHUB_WORKFLOW_REF, no workflow of $GITHUB_REPOSITORY, so the barrier has nothing to dispatch"
              exit 1
              ;;
          esac
          WORKFLOW="${path##*/}" bash "$CI_TOOLS/release-state.sh" barrier

  # ─── Two-branch, dev, mode=renumber: re-tag dev's newest builds ────────────
  # Dispatched by a stable run's barrier. Checks out each lane's newest dev
  # build and computes its dev version there (now above the pending
  # promotion); renumber-tag then tags that build with it, the image digest
  # on GHCR and the commit. No image builds. This job runs the cliff config,
  # so it holds no write scope. A TS root renumbers in renumber-ts and
  # renumber-npm instead.
  renumber:
    needs: detect
    if: ${{ needs.detect.outputs.mode == 'renumber' && needs.detect.outputs.lanes != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Check out the newest build
        id: target
        if: ${{ matrix.key != '.' || needs.detect.outputs.type != 'ts' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          LANE_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-target

      - name: Compute lane version (cliff)
        id: cliff
        if: ${{ steps.target.outputs.commit != '' }}
        uses: ./.cplieger-ci/actions/git-cliff-version
        with:
          channel: dev
          lane: ${{ matrix.lane }}
          exclude-paths: ${{ matrix.lane == '' && needs.detect.outputs.exclude_paths || '' }}
          release-model: two-branch
          pending-version: ${{ fromJSON(needs.detect.outputs.lane_state)[matrix.key].version }}

      - name: Hand the version on
        id: handoff
        if: ${{ steps.target.outputs.commit != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: dev
          LANE_KEY: ${{ matrix.key }}
          DEV_VERSION: ${{ steps.cliff.outputs.dev_version }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-handoff

      # Every leg writes one, empty when it has nothing to renumber, so each
      # renumber-tag leg finds its own.
      - name: Write the handoff
        id: write
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          LANE_KEY: ${{ matrix.key }}
          VERSION: ${{ steps.handoff.outputs.version }}
          COMMIT: ${{ steps.handoff.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          jq -n --arg version "$VERSION" --arg commit "$COMMIT" '{version: $version, commit: $commit}' > "$RUNNER_TEMP/handoff/handoff.json"
          bash "$CI_TOOLS/release-state.sh" handoff-name renumber "$LANE_KEY" | sed 's/^/artifact=/' >> "$GITHUB_OUTPUT"

      - name: Upload the handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.write.outputs.artifact }}
          path: ${{ runner.temp }}/handoff/handoff.json
          retention-days: 1
          if-no-files-found: error

  # Executes nothing from the repository: it reads the handoff as data and
  # re-selects the build, refusing a newer one.
  renumber-tag:
    needs: [detect, renumber]
    if: ${{ !cancelled() && needs.detect.outputs.mode == 'renumber' && needs.detect.outputs.lanes != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.lanes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Name the handoff
        id: name
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          LANE_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" handoff-name renumber "$LANE_KEY" | sed 's/^/artifact=/' >> "$GITHUB_OUTPUT"

      - name: Fetch the handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/handoff

      - name: Read the handoff
        id: handoff
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" handoff-read "$RUNNER_TEMP/handoff/handoff.json"

      - name: Check out the numbered build
        if: ${{ steps.handoff.outputs.commit != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          LANE_KEY: ${{ matrix.key }}
          EXPECT_COMMIT: ${{ steps.handoff.outputs.commit }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-target

      - name: Log in to GHCR
        if: ${{ steps.handoff.outputs.commit != '' && matrix.key == '.' && needs.detect.outputs.type == 'docker' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          registry_login ghcr.io "$REGISTRY_USERNAME"

      - name: Renumber
        if: ${{ steps.handoff.outputs.commit != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: dev
          LANE_KEY: ${{ matrix.key }}
          DEV_VERSION: ${{ steps.handoff.outputs.version }}
          REPO_TYPE: ${{ needs.detect.outputs.type }}
          IMAGE: ${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber

  # A TS root's renumber, split so the job that runs the cliff config holds no
  # OIDC and the one that publishes runs no cliff config. Not a matrix job:
  # same-named matrix outputs are last-writer-wins, so the handoff would not
  # be deterministic there.
  renumber-ts:
    needs: detect
    if: ${{ needs.detect.outputs.mode == 'renumber' && needs.detect.outputs.type == 'ts' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      npm_version: ${{ steps.handoff.outputs.version }}
      npm_commit: ${{ steps.handoff.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Check out the newest build
        id: target
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          LANE_KEY: .
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-target

      - name: Compute version (cliff)
        id: cliff
        if: ${{ steps.target.outputs.commit != '' }}
        uses: ./.cplieger-ci/actions/git-cliff-version
        with:
          channel: dev
          exclude-paths: ${{ needs.detect.outputs.exclude_paths }}
          release-model: two-branch
          pending-version: ${{ fromJSON(needs.detect.outputs.lane_state)['.'].version }}

      - name: Hand the version on
        id: handoff
        if: ${{ steps.target.outputs.commit != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: dev
          LANE_KEY: .
          DEV_VERSION: ${{ steps.cliff.outputs.dev_version }}
          REPO_TYPE: ts
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-handoff

  # Publish the package under the new pre-release, then tag. Runs no cliff
  # config; npm ci and npm publish run the package's lifecycle scripts under
  # OIDC, as the ts job's publish does. It re-selects the build and refuses a
  # newer one.
  renumber-npm:
    needs: [detect, renumber-ts]
    if: ${{ needs.renumber-ts.outputs.npm_version != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # npm publish packs the workspace root, so the ci source leaves it.
      - name: Move the ci source out of the package
        run: |
          set -euo pipefail
          mv .cplieger-ci "$RUNNER_TEMP/cplieger-ci"

      - name: Check out the numbered build
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          LANE_KEY: .
          EXPECT_COMMIT: ${{ needs.renumber-ts.outputs.npm_commit }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-target

      # npm publish runs the package's prepack: install as the ts job does.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Renumber
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          CHANNEL: dev
          LANE_KEY: .
          DEV_VERSION: ${{ needs.renumber-ts.outputs.npm_version }}
          REPO_TYPE: ts
          # The npm readback's wait (scripts/retry.sh), sized to end inside
          # this job's timeout, which the barrier's renumber reserve counts.
          REGISTRY_WAIT_SECONDS: 300
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber

  # A subpackage shares the root's dev version and publishes from the root's
  # build, so it follows the root renumber: each one the barrier would find
  # without a dev build, or below the pending promotion, is published from
  # that build under its newest dev tag. Runs no cliff config; npm publish
  # runs the package's lifecycle scripts under OIDC, as the subpackage job's.
  renumber-subpackages:
    needs: [detect, renumber-tag, renumber-npm]
    if: |
      !cancelled() && needs.detect.outputs.mode == 'renumber' && needs.detect.outputs.subpackages != '[]'
      && (needs.renumber-tag.result == 'success' || needs.renumber-tag.result == 'skipped')
      && (needs.renumber-npm.result == 'success' || needs.renumber-npm.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Check out the newest build
        id: target
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          LANE_KEY: .
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-target

      - name: Select the subpackages
        id: plan
        if: ${{ steps.target.outputs.commit != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: dev
          STATE: ${{ needs.detect.outputs.lane_state }}
          REPO_TYPE: ${{ needs.detect.outputs.type }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" renumber-subpackages

      - name: Setup Node.js
        if: ${{ steps.plan.outputs.dirs != '' && steps.plan.outputs.dirs != '[]' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish the subpackages
        if: ${{ steps.plan.outputs.dirs != '' && steps.plan.outputs.dirs != '[]' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ steps.plan.outputs.version }}
          DIRS: ${{ steps.plan.outputs.dirs }}
          CHANNEL: dev
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            (cd "$dir" && bash "$CI_TOOLS/publish-subpackage.sh")
          done < <(jq -r '.[]' <<<"$DIRS")

  # ─── Docker image build + sign + SBOM + release (delegated) ────────────────
  # On dev a build is due only when a new dev version is (root_changed and
  # this commit untagged); on stable the job also runs with nothing to publish,
  # because the Docker Hub description refreshes on every main push. Under
  # legacy a release owed to a subpackage alone (release=true,
  # root_changed=false) builds no image; under two-branch it does, so the
  # shared version has its image, tag and Release before the subpackage job.
  docker:
    needs: [detect, repair, barrier]
    if: |
      !cancelled() && needs.detect.result == 'success'
      && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
      && (needs.barrier.result == 'success' || needs.barrier.result == 'skipped')
      && needs.detect.outputs.type == 'docker'
      && (needs.detect.outputs.channel == 'stable'
          || (needs.detect.outputs.release == 'true' && needs.detect.outputs.root_changed == 'true')
          || (needs.detect.outputs.release == 'true' && needs.detect.outputs.release_model == 'two-branch'
              && needs.detect.outputs.subpackages_to_publish != '[]'))
    permissions:
      contents: write
      statuses: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # Local ref (not an @sha pin): docker-release.yaml resolves to the SAME
    # commit a consumer pinned this release.yaml to, so a fix to
    # docker-release.yaml reaches consumers on the next release.yaml bump
    # without a second internal-pin bump + tag cycle.
    uses: ./.github/workflows/docker-release.yaml
    with:
      channel: ${{ needs.detect.outputs.channel }}
      version: ${{ needs.detect.outputs.base }}
      dev-version: ${{ needs.detect.outputs.dev_version }}
      latest: ${{ needs.detect.outputs.latest }}
      exclude-re: ${{ needs.detect.outputs.exclude_re }}
      release-needed: >-
        ${{ (needs.detect.outputs.release == 'true' && (needs.detect.outputs.root_changed == 'true'
        || (needs.detect.outputs.release_model == 'two-branch' && needs.detect.outputs.subpackages_to_publish != '[]')))
        && 'true' || 'false' }}
      go-modules: ${{ needs.detect.outputs.go_modules }}
      finalize: ${{ needs.detect.outputs.finalize }}
      release-model: ${{ needs.detect.outputs.release_model }}
      subpackages: ${{ needs.detect.outputs.subpackages }}
      defer-receipt: ${{ needs.detect.outputs.subpackages_to_publish != '[]' }}
      release-kind-note: ${{ needs.detect.outputs.release_kind_note }}
      security-shas: ${{ needs.detect.outputs.security_shas }}
      registries: ${{ needs.detect.outputs.registries }}
      platforms: ${{ needs.detect.outputs.platforms }}
      sbom-from: ${{ needs.detect.outputs.sbom_from }}
      syft-config: ${{ needs.detect.outputs.syft_config }}
      image-licenses: ${{ needs.detect.outputs.image_licenses }}
    secrets: inherit

  # ─── Go module release (tag + GitHub Release; `go install` fetches by tag) ─
  go:
    needs: [detect, repair, barrier]
    # finalize widens the gate so a rerun of a run that tagged but left no
    # Release can repair it. A subpackage-only release needs this job too: the
    # subpackage shares the root version but owns no tag, so skipping here
    # publishes npm/JSR at a version with no root tag, and the next such
    # release recomputes that burned version and skips both publishes. Every
    # step is idempotent for a root-unchanged run, and the subpackage job runs
    # after this one, so the tag precedes the publish. No ts-type repo has a
    # subpackage; under two-branch the docker job carries the same rule.
    if: |
      !cancelled() && needs.detect.result == 'success'
      && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
      && (needs.barrier.result == 'success' || needs.barrier.result == 'skipped')
      && needs.detect.outputs.type == 'go'
      && (needs.detect.outputs.root_changed == 'true' || needs.detect.outputs.subpackages_to_publish != '[]')
      && (needs.detect.outputs.release == 'true' || needs.detect.outputs.finalize == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Verify root module path
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # The root module's path must be exactly github.com/<owner>/<repo>,
          # plus /vN for major >= 2 (Go semantic import versioning). Both halves
          # are invisible until a consumer runs `go get`, and neither is fixable
          # afterwards — a published module version is immutable — so both are
          # asserted before the tag is cut. The base-path rule holds at EVERY
          # version: a path naming another repository is unfetchable whatever
          # the major says, which is why there is no early exit here.
          modpath=$(awk '$1=="module"{print $2; exit}' go.mod)
          if [ -z "$modpath" ]; then
            echo "::error::no module directive found in go.mod"
            exit 1
          fi
          ver="${VERSION#v}"
          major="${ver%%.*}"
          base="github.com/${GITHUB_REPOSITORY}"
          expected="$base"
          case "$major" in
            '' | *[!0-9]*)
              echo "::notice::'$VERSION' has no numeric major — applying the base-path rule only" ;;
            *)
              if [ "$major" -ge 2 ]; then
                expected="${base}/v${major}"
                # A path that names this repo but carries the wrong major suffix
                # is the semantic-import-versioning mistake, and its fix moves
                # every internal import too, so it keeps its own message.
                case "$modpath" in
                  "$expected") : ;;
                  "$base" | "$base"/v[0-9]*)
                    echo "::error::go.mod module path '$modpath' must end in /v$major to release $VERSION (Go semantic import versioning). Add the /v$major suffix to the module directive and rewrite internal imports, then re-release."
                    exit 1 ;;
                esac
              fi ;;
          esac
          if [ "$modpath" != "$expected" ]; then
            echo "::error::go.mod module path '$modpath' must be '$expected' to release $VERSION; a module path must name its own repository or Go tooling cannot fetch it. Fix the module directive (and internal imports for a /vN major), then re-release."
            exit 1
          fi
          echo "ok: module path '$modpath' matches '$expected' ($VERSION)"

      # API-compatibility check, PRE-TAG, and it fails the release. Versions
      # come from commit messages, so a `feat:` that renames an exported symbol
      # mints a minor and breaks consumers while every other check stays green.
      # It must run before the tag exists, since the proxy serves a tag at once.
      # gorelease, not apidiff, because it judges the proposed -version against
      # the change. Skipped for apps and major bumps (a major IS the break), and
      # skipped rather than failed when the tool cannot install or run. It
      # refuses a dirty tree, so it cannot preview a release from local edits.
      - name: API compatibility (gorelease)
        env:
          # The stable base on both channels: a dev build compared against the
          # previous dev build would be refused for a legitimate minor.
          VERSION: ${{ needs.detect.outputs.base }}
        run: |
          set -uo pipefail

          if ls ./*.go >/dev/null 2>&1 && grep -qE '^package main$' ./*.go 2>/dev/null; then
            echo "::notice::root package is main (application, not a consumed module) - skipping API check"
            exit 0
          fi

          ver="${VERSION#v}"
          major="${ver%%.*}"
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$prev" ]; then
            echo "::notice::no previous stable tag - nothing to compare, skipping API check"
            exit 0
          fi
          prev_major="${prev#v}"; prev_major="${prev_major%%.*}"
          if [ "$major" != "$prev_major" ]; then
            echo "::notice::major bump ${prev} -> ${VERSION}: a break is deliberate here, so a report carries no information - skipping"
            exit 0
          fi

          # renovate: datasource=go depName=golang.org/x/exp
          XEXP_VERSION=v0.0.0-20261009195045-ca0d7ba23607
          # gorelease TYPE-CHECKS the target module, so its own binary must be
          # built with a toolchain at least as new as that module's `go`
          # directive. A bare GOTOOLCHAIN=auto resolves the minimum x/exp needs
          # (go1.26.7 at this pin), NOT what the target needs, so a module on a
          # newer Go cannot be loaded at all. `go<ver>+auto` sets that floor and
          # still upgrades when x/exp asks for more.
          #
          # Measured on cplieger/scheduler v4.0.1 (`go 1.27.0`): rejected on two
          # consecutive pushes and a dispatch, with the report reading `package
          # requires newer Go version go1.27 (application built with go1.26)` for
          # BOTH the base and the release version. It reproduced nowhere locally
          # because a workstation's toolchain already satisfies the directive.
          # Every repo here tracks the latest Go patch, so this reaches any
          # library whose directive outruns x/exp's floor.
          mod_go=$(go mod edit -json 2>/dev/null | sed -n 's/^[[:space:]]*"Go": "\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$mod_go" ]; then
            TOOLCHAIN="go${mod_go}+auto"
          else
            TOOLCHAIN=auto
          fi
          GOTOOLCHAIN="$TOOLCHAIN" go install "golang.org/x/exp/cmd/gorelease@${XEXP_VERSION}" || {
            echo "::warning::gorelease install failed - skipping API check (infrastructure fault, not an API verdict)"
            exit 0
          }

          out="$RUNNER_TEMP/gorelease.txt"
          # `|| rc=$?` rather than a bare `rc=$?` on the next line: this step
          # runs under the runner's default `bash -e`, where an unguarded
          # non-zero command exits the script IMMEDIATELY - which here would
          # skip the summary write on exactly the incompatible-change case the
          # step exists to report, leaving continue-on-error to mask a step
          # that never said anything. The vacuous-gate class, in report form.
          rc=0
          "$(go env GOPATH)/bin/gorelease" -base="$prev" -version="$VERSION" > "$out" 2>&1 || rc=$?

          # Classify the exit before reporting anything. gorelease routes THREE
          # outcomes through two non-zero codes, and the discriminator is the log
          # prefix, verified against the pinned source (cmd/gorelease/gorelease.go):
          #   - `main` sets `log.SetPrefix("gorelease: ")`, so every operational
          #     failure reaches `log.Fatal(err)` and its stderr line starts with
          #     that prefix. Module download, proxy reachability, a dirty tree, a
          #     missing base, package loading: all of these, all exit 1.
          #   - a genuine verdict is `os.Exit(1)` with NO log call: the report was
          #     already written to stdout, so no line carries the prefix.
          #   - a *usageError prints to stderr unprefixed and exits 2. That is this
          #     step calling gorelease wrongly, so it is a workflow defect.
          # Without this split a Go proxy outage failed the release while asserting
          # an exported-surface break and telling the author to add a `!`.
          #
          # A LOAD failure is the fourth outcome and it reaches none of the three
          # above: gorelease writes package errors into the REPORT and exits 1
          # with no log call, so it is prefix-less exactly like a genuine verdict.
          # Its own summary line is the discriminator. This must fail OPEN — the
          # surface was never compared, so there is no verdict to enforce, and
          # treating it as one told scheduler v4.0.1 to cut a major over a
          # toolchain mismatch. Anchored to gorelease's exact sentence rather
          # than to `errors in base version`, which also appears in the
          # per-package body of a report that DID compare.
          verdict=api
          if [ "$rc" -eq 0 ]; then
            verdict=ok
          elif [ "$rc" -eq 2 ]; then
            verdict=usage
          elif grep -q '^gorelease: ' "$out"; then
            verdict=operational
          elif grep -qx 'Errors were found in one or more packages\.' "$out"; then
            verdict=operational
          fi

          {
            echo "### API compatibility: ${prev} -> ${VERSION}"
            echo ""
            case "$verdict" in
              ok)
                echo "gorelease accepts ${VERSION} as consistent with the exported-surface changes."
                ;;
              api)
                echo "gorelease REJECTED ${VERSION} for these changes, and this FAILS the release."
                echo "It reports either an incompatible exported-surface change under a"
                echo "non-major bump or a release diagnostic (\`isSuccessful\` covers both)."
                echo "So read the report below before assuming which: if the version is"
                echo "wrong, the commit that mints it needs a \`!\` to cut a major; if the"
                echo "change is compatible and the report is wrong, investigate with apidiff."
                ;;
              operational)
                echo "**gorelease could not run, so the API surface was NOT checked.**"
                echo "This is an operational fault, not a verdict on ${VERSION} — a proxy"
                echo "or module-download failure, an unavailable base, or a load error."
                echo "The release proceeds UNVERIFIED. A repo that reports this on every"
                echo "release has a permanently disabled gate; treat a repeat as a defect."
                ;;
              usage)
                echo "**gorelease rejected this step's own arguments (exit 2).**"
                echo "That is a defect in this workflow, not a verdict on ${VERSION}."
                ;;
            esac
            echo ""
            echo '```'
            head -c 8000 "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The report also goes to the LOG: a step summary is absent from
          # `gh run view --log` and the check-run API, so a verdict would be
          # unreadable from a terminal exactly when it needs investigating.
          # Only for a non-ok verdict, since this step runs on every library release.
          if [ "$verdict" != ok ]; then
            echo "::group::gorelease report (${prev} -> ${VERSION}, verdict: ${verdict})"
            head -c 8000 "$out"
            echo "::endgroup::"
          fi

          case "$verdict" in
            api)
              echo "::error::gorelease rejected ${VERSION} for these exported-surface changes (report above, and in the run summary)"
              exit 1
              ;;
            usage)
              echo "::error::gorelease usage error - this step invoked it wrongly (report above, and in the run summary)"
              exit 1
              ;;
            operational)
              # Fail OPEN, on the same reasoning as the install failure above: an
              # unreachable checker is an infrastructure fault, and failing every
              # release on one teaches every consumer repo to ignore this step.
              echo "::warning::gorelease could not run; ${VERSION} published WITHOUT an API check (report above, and in the run summary)"
              exit 0
              ;;
          esac
          exit 0

      - name: Check out the ci source
        if: ${{ needs.detect.outputs.channel == 'stable' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Generate release notes
        # Stable only: a dev build creates no Release. Deliberately
        # token-free: this step downloads and EXECUTES git-cliff, and an
        # untrusted binary must never run with a credential in its
        # environment (persist-credentials=false keeps it out of .git/config,
        # but a step-level GH_TOKEN would still be readable by any child
        # process). The gh/tagging calls live in the next step, which runs no
        # downloaded code.
        if: ${{ needs.detect.outputs.channel == 'stable' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
          VERSION: ${{ needs.detect.outputs.version }}
          GO_LANES_JSON: ${{ needs.detect.outputs.go_modules }}
          FINALIZE: ${{ needs.detect.outputs.finalize }}
          KIND_NOTE: ${{ needs.detect.outputs.release_kind_note }}
          SECURITY_SHAS: ${{ needs.detect.outputs.security_shas }}
        run: |
          set -euo pipefail
          # Version + tarball sha256 pinned as a pair; Renovate maintains both
          # via the custom.git-cliff datasource (GitHub release-asset digest).
          # Fail-closed: a tarball that does not match the committed pin never
          # installs.
          # renovate: datasource=custom.git-cliff depName=orhun/git-cliff
          CLIFF_VERSION=v2.14.2
          CLIFF_SHA256=24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
          curl -fsSL --retry 7 --retry-max-time 150 --retry-all-errors -o "$RUNNER_TEMP/git-cliff.tgz" \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CLIFF_SHA256}  ${RUNNER_TEMP}/git-cliff.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/git-cliff.tgz" -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION#v}/git-cliff"
          args=(--release-model "$RELEASE_MODEL" --site go --version "$VERSION" --go-lanes "$GO_LANES_JSON"
            --kind-note "$KIND_NOTE" --out NOTES.md)
          if [ "$FINALIZE" = "true" ]; then
            args+=(--finalize)
          fi
          if [ "$RELEASE_MODEL" = "two-branch" ]; then
            tr ' ' '\n' <<<"$SECURITY_SHAS" > "$RUNNER_TEMP/security-shas"
            args+=(--repo "$GITHUB_REPOSITORY" --release-commit "$GITHUB_SHA" --security-shas "$RUNNER_TEMP/security-shas")
          fi
          bash "$CI_TOOLS/render-notes.sh" "${args[@]}"

      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ needs.detect.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
        run: |
          set -euo pipefail
          # Tag ref created first via the git data API, pinned to the trigger
          # commit; release then attaches to the existing tag (no --target).
          # `gh release create --target` tag-creation 403s for the integration
          # token when a mid-run push moved the branch past $GITHUB_SHA; the git
          # ref create has no head restriction. A dev build gets the tag, its
          # receipt and no Release.
          CREATED=false
          if EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq .object.sha 2>/dev/null); then
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${VERSION} exists at ${EXISTING}, not ${GITHUB_SHA}; refusing."
              exit 1
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${VERSION}" -f sha="${GITHUB_SHA}"
            CREATED=true
          fi
          if [ "$CHANNEL" != "stable" ]; then
            # The audit reads this receipt: a dev tag has no Release to show
            # that the pipeline, not a hand, created it. A tag without it would
            # make a rerun compute release=false, so the tag this attempt
            # created is deleted with the failed POST and a rerun makes both.
            if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context="release/tag/${VERSION}" \
              -f description="created by the dev release run" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
              if [ "$CREATED" = true ]; then
                echo "::error::receipt for ${VERSION} not recorded; deleting the tag this run created so a rerun recreates both"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" >/dev/null
              fi
              exit 1
            fi
            echo "dev channel: tagged ${VERSION} with its receipt, no GitHub Release"
            exit 0
          fi
          if [ "$RELEASE_MODEL" = legacy ]; then set -- --count-drafts; fi
          state=$(bash "$CI_TOOLS/release-exists.sh" "$@" "$VERSION")
          if [ "$state" = absent ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file NOTES.md
          fi

  # ─── TypeScript library release (npm + JSR + tag + GitHub Release) ─────────
  ts:
    needs: [detect, repair, barrier]
    # finalize widens the gate exactly as in the go job; the npm/JSR publish
    # steps are already idempotent version-exists skips, so a finalize rerun
    # passes through them and repairs only the missing GitHub Release.
    if: |
      !cancelled() && needs.detect.result == 'success'
      && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
      && (needs.barrier.result == 'success' || needs.barrier.result == 'skipped')
      && needs.detect.outputs.type == 'ts' && needs.detect.outputs.root_changed == 'true'
      && (needs.detect.outputs.release == 'true' || needs.detect.outputs.finalize == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # Strict `npm ci` from the lockfile, the same install ts-ci runs. Both
        # publishes below need node_modules: `npm publish` runs a package's
        # `prepack` (a package that emits JavaScript at publish compiles here,
        # with the compiler from its devDependencies), and deno's `jsr publish`
        # uses BYONM, so runtime deps (e.g. @cplieger/actions ->
        # @cplieger/reactive) must already be present. Fails closed on a
        # lockfile that disagrees with the manifest, as CI already does.
        # Same gate as the publish step: a finalize rerun publishes nothing.
        if: ${{ needs.detect.outputs.release == 'true' }}
        run: |
          set -euo pipefail
          npm ci

      - name: Publish to npm + JSR
        # release-only, never finalize: by step order a root tag can only
        # exist after both registries already published, so a finalize rerun
        # (or a hand-pushed tag at HEAD) has nothing to publish — running
        # here anyway would push a package for a version compute that said
        # release=false. The version-exists guards below stay as the
        # belt-and-suspenders for reruns of the publish path itself.
        if: ${{ needs.detect.outputs.release == 'true' }}
        env:
          # No NODE_AUTH_TOKEN — both NPM and JSR publish via GitHub OIDC.
          # NPM: trusted publisher configured at npmjs.com pointing to this
          #      workflow + repo (auto-attaches provenance attestation).
          # JSR: trusted publisher configured at jsr.io at the scope level.
          VERSION: ${{ needs.detect.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          pkg="$(npm pkg get name | tr -d '\"')"
          npm pkg set version="$ver"
          node -e "const fs=require('fs'),f='jsr.json',j=JSON.parse(fs.readFileSync(f));j.version='${ver}';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          # A dev build publishes under the `dev` dist-tag so `latest` stays
          # on the stable channel; JSR carries stable versions only.
          NPM_TAG_ARGS=()
          if [ "$CHANNEL" != "stable" ]; then
            NPM_TAG_ARGS=(--tag dev)
          fi
          # Skip NPM if version already exists (bootstrap-friendly).
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "::notice::npm: $pkg@$ver already published — skipping"
          else
            npm publish --access public "${NPM_TAG_ARGS[@]}"
          fi
          if [ "$CHANNEL" != "stable" ]; then
            echo "dev channel: JSR not published"
            exit 0
          fi
          # Skip JSR if the version already exists. JSR has no overwrite and
          # `jsr publish` errors on a duplicate, which would wedge a re-run
          # after a partial/cancelled release (npm can publish but the run
          # dies before tagging). Mirror of the npm guard above.
          if curl -fsSL "https://jsr.io/${pkg}/meta.json" \
               | jq -e --arg v "$ver" '.versions[$v]' >/dev/null 2>&1; then
            echo "::notice::jsr: $pkg@$ver already published — skipping"
          else
            # Pin the jsr CLI: a bare `npx jsr` fetches whatever is latest at
            # publish time — the one floating executable on the release path.
            # renovate: datasource=npm depName=jsr
            JSR_VERSION=0.14.3
            npx -y "jsr@${JSR_VERSION}" publish --allow-dirty
          fi

      - name: Check out the ci source
        if: ${{ needs.detect.outputs.channel == 'stable' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Generate release notes
        # Stable only; deliberately token-free — this step executes the
        # downloaded git-cliff binary; see the go job's identical split.
        if: ${{ needs.detect.outputs.channel == 'stable' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
          VERSION: ${{ needs.detect.outputs.version }}
          GO_LANES_JSON: ${{ needs.detect.outputs.go_modules }}
          FINALIZE: ${{ needs.detect.outputs.finalize }}
          KIND_NOTE: ${{ needs.detect.outputs.release_kind_note }}
          SECURITY_SHAS: ${{ needs.detect.outputs.security_shas }}
        run: |
          set -euo pipefail
          # Version + tarball sha256 pinned as a pair; Renovate maintains both
          # via the custom.git-cliff datasource (GitHub release-asset digest).
          # Fail-closed: a tarball that does not match the committed pin never
          # installs.
          # renovate: datasource=custom.git-cliff depName=orhun/git-cliff
          CLIFF_VERSION=v2.14.2
          CLIFF_SHA256=24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
          curl -fsSL --retry 7 --retry-max-time 150 --retry-all-errors -o "$RUNNER_TEMP/git-cliff.tgz" \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CLIFF_SHA256}  ${RUNNER_TEMP}/git-cliff.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/git-cliff.tgz" -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION#v}/git-cliff"
          args=(--release-model "$RELEASE_MODEL" --site ts --version "$VERSION" --go-lanes "$GO_LANES_JSON"
            --kind-note "$KIND_NOTE" --out NOTES.md)
          if [ "$FINALIZE" = "true" ]; then
            args+=(--finalize)
          fi
          if [ "$RELEASE_MODEL" = "two-branch" ]; then
            tr ' ' '\n' <<<"$SECURITY_SHAS" > "$RUNNER_TEMP/security-shas"
            args+=(--repo "$GITHUB_REPOSITORY" --release-commit "$GITHUB_SHA" --security-shas "$RUNNER_TEMP/security-shas")
          fi
          bash "$CI_TOOLS/render-notes.sh" "${args[@]}"

      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ needs.detect.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
        run: |
          set -euo pipefail
          # Tag ref created first via the git data API, pinned to the trigger
          # commit; release then attaches to the existing tag (no --target).
          # `gh release create --target` tag-creation 403s for the integration
          # token when a mid-run push moved the branch past $GITHUB_SHA; the git
          # ref create has no head restriction. A dev build gets the tag, its
          # receipt and no Release.
          CREATED=false
          if EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq .object.sha 2>/dev/null); then
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${VERSION} exists at ${EXISTING}, not ${GITHUB_SHA}; refusing."
              exit 1
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${VERSION}" -f sha="${GITHUB_SHA}"
            CREATED=true
          fi
          if [ "$CHANNEL" != "stable" ]; then
            # The audit reads this receipt: a dev tag has no Release to show
            # that the pipeline, not a hand, created it. A tag without it would
            # make a rerun compute release=false, so the tag this attempt
            # created is deleted with the failed POST and a rerun makes both.
            if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context="release/tag/${VERSION}" \
              -f description="created by the dev release run" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
              if [ "$CREATED" = true ]; then
                echo "::error::receipt for ${VERSION} not recorded; deleting the tag this run created so a rerun recreates both"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" >/dev/null
              fi
              exit 1
            fi
            echo "dev channel: tagged ${VERSION} with its receipt, no GitHub Release"
            exit 0
          fi
          if [ "$RELEASE_MODEL" = legacy ]; then set -- --count-drafts; fi
          state=$(bash "$CI_TOOLS/release-exists.sh" "$@" "$VERSION")
          if [ "$state" = absent ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file NOTES.md
          fi

  # ─── Subpackage publish (matrix over `*/jsr.json` dirs that changed) ───────
  subpackage:
    needs: [detect, repair, barrier, docker, ts, go]
    # finalize widens this gate too — the OPPOSITE asymmetry of the root ts
    # job. Root ts registries publish BEFORE the root tag, so an existing
    # tag proves they published and the finalize path skips them. This job
    # publishes AFTER the root go/ts/docker job (needs-ordered), so a run
    # that died between the root tag and here leaves the subpackage
    # registries genuinely unpublished; a finalize rerun must pass through
    # (the version-exists guards inside skip anything that did land). A
    # failed repair or barrier skips the root jobs, so it is read directly.
    if: |
      always()
      && needs.detect.outputs.subpackages_to_publish != '[]'
      && (needs.detect.outputs.release == 'true' || needs.detect.outputs.finalize == 'true')
      && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
      && (needs.barrier.result == 'success' || needs.barrier.result == 'skipped')
      && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
      && (needs.ts.result == 'success' || needs.ts.result == 'skipped')
      && (needs.go.result == 'success' || needs.go.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.subpackages_to_publish) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Publish subpackage to npm + JSR
        working-directory: ${{ matrix.dir }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ needs.detect.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          # Pin the jsr CLI: a bare `npx jsr` fetches whatever is latest at
          # publish time.
          # renovate: datasource=npm depName=jsr
          JSR_VERSION: 0.14.3
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/publish-subpackage.sh"

  # ─── Nested Go module lanes (matrix; independent <dir>/vX.Y.Z versions) ────
  # Each tracked nested go.mod is its own release lane: its version is
  # computed from ITS commits (conventional commits touching the lane dir)
  # against ITS tag universe (<dir>/vX.Y.Z), fully independent of the root
  # version — so a yaml-dep bump in a nested module never mints a root
  # release, and a root release never re-tags an unchanged nested module.
  # Only needs detect (nothing is shared with the root/docker/ts jobs; the
  # lane has its own version). Consumers require the BARE semver
  # (`go get repo/<dir>@vX.Y.Z`); the Go tooling maps it to this lane's
  # `<dir>/vX.Y.Z` git tag (standard Go subdirectory-module tagging). Lane
  # versions are computed here, not in detect: the matrix job checks out
  # full history anyway, and this avoids plumbing a dir->version map through
  # job outputs.
  go-nested:
    needs: [detect, repair, barrier]
    if: |
      !cancelled() && needs.detect.result == 'success'
      && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
      && (needs.barrier.result == 'success' || needs.barrier.result == 'skipped')
      && needs.detect.outputs.mode != 'renumber'
      && needs.detect.outputs.go_modules_to_release != '' && needs.detect.outputs.go_modules_to_release != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.go_modules_to_release) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Compute lane version (cliff)
        id: lanecliff
        uses: ./.cplieger-ci/actions/git-cliff-version
        with:
          channel: ${{ needs.detect.outputs.channel }}
          lane: ${{ matrix.dir }}
          release-model: ${{ needs.detect.outputs.release_model }}
          pending-version: ${{ needs.detect.outputs.channel == 'dev' && fromJSON(needs.detect.outputs.lane_state || '{}')[matrix.dir].version || '' }}
          pending-in-range: ${{ fromJSON(needs.detect.outputs.lane_state || '{}')[matrix.dir].in_range && 'true' || 'false' }}

      # The lane's copy of detect's "Select version": detect emits the lane
      # only when a shipped path under it changed since its own channel tag,
      # so the anchor test alone decides the release here. On a legacy stable
      # run a lane tag already at HEAD without a Release is repaired
      # (finalize), as for the root; two-branch repairs in the repair jobs, and
      # a dev lane build has no Release to repair.
      - name: Select lane version
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ matrix.dir }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
          BASE: ${{ steps.lanecliff.outputs.base }}
          DEV_VERSION: ${{ steps.lanecliff.outputs.dev_version }}
          FLOOR_BASE: ${{ steps.lanecliff.outputs.floor_base }}
          FLOOR_DEV_VERSION: ${{ steps.lanecliff.outputs.floor_dev_version }}
          LATEST: ${{ steps.lanecliff.outputs.latest }}
          ANCHOR_SHA: ${{ steps.lanecliff.outputs.anchor_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            echo "::error::git-cliff-version returned no base"
            exit 1
          fi
          RELEASE=false
          if [ "$ANCHOR_SHA" != "$GITHUB_SHA" ]; then
            RELEASE=true
          fi
          if [ "$RELEASE" = "true" ] && [ "$BASE" = "$LATEST" ] && [ -n "$FLOOR_BASE" ]; then
            echo "::notice::lane ${DIR}: git-cliff proposes no bump for a shipped change; flooring ${BASE} to ${FLOOR_BASE}"
            BASE="$FLOOR_BASE"
            DEV_VERSION="$FLOOR_DEV_VERSION"
          fi
          if [ "$CHANNEL" = "dev" ]; then
            VERSION="$DEV_VERSION"
          else
            VERSION="$BASE"
          fi
          FINALIZE=false
          if [ "$RELEASE" = "false" ] && [ "$CHANNEL" = "stable" ] && [ "$RELEASE_MODEL" != "two-branch" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" >/dev/null 2>/tmp/relerr; then
              echo "::notice::lane ${DIR}: ${VERSION} is tagged at this commit and its Release exists — nothing to do"
            elif grep -q 'HTTP 404' /tmp/relerr; then
              FINALIZE=true
              echo "::notice::lane ${DIR}: ${VERSION} is tagged at this commit without a Release — finalize mode"
            else
              echo "::error::lane ${DIR}: could not determine whether Release ${VERSION} exists:"
              cat /tmp/relerr
              exit 1
            fi
          fi
          if [ "$RELEASE" = "true" ] || [ "$FINALIZE" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "finalize=$FINALIZE"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Lane ${DIR}: channel=${CHANNEL} version=${VERSION} release=${RELEASE} finalize=${FINALIZE} (latest lane tag: ${LATEST:-<none>})"

      - name: Verify lane module path
        if: ${{ steps.lane.outputs.release == 'true' }}
        env:
          DIR: ${{ matrix.dir }}
          VERSION: ${{ steps.lane.outputs.version }}
        run: |
          set -euo pipefail
          # The nested module's path must be exactly
          # github.com/<owner>/<repo>/<dir> (+ /vN for major >= 2, Go semantic
          # import versioning — the root job's check, extended with the exact
          # path assertion: a copy-pasted module directive would mint a tag
          # the Go proxy can never serve for this import path.
          modpath=$(awk '$1=="module"{print $2; exit}' "$DIR/go.mod")
          if [ -z "$modpath" ]; then
            echo "::error::no module directive found in ${DIR}/go.mod"
            exit 1
          fi
          ver="${VERSION#"$DIR"/v}"
          major="${ver%%.*}"
          expected="github.com/${GITHUB_REPOSITORY}/${DIR}"
          case "$major" in
            '' | *[!0-9]*)
              echo "::notice::'$VERSION' has no numeric major — applying the base-path rule only" ;;
            *)
              if [ "$major" -ge 2 ]; then
                expected="${expected}/v${major}"
              fi ;;
          esac
          if [ "$modpath" != "$expected" ]; then
            echo "::error::${DIR}/go.mod module path '$modpath' must be '$expected' to release ${VERSION} (nested Go module lane). Fix the module directive (and internal imports for a /vN major), then re-release."
            exit 1
          fi
          echo "ok: module path '$modpath' matches lane ${DIR} ($VERSION)"

      - name: Generate lane release notes
        # Stable only. Deliberately token-free — this step executes the
        # git-cliff binary the compute action installed; see the go job's
        # identical split.
        if: ${{ steps.lane.outputs.release == 'true' && needs.detect.outputs.channel == 'stable' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
          DIR: ${{ matrix.dir }}
          VERSION: ${{ steps.lane.outputs.version }}
          FINALIZE: ${{ steps.lane.outputs.finalize }}
          KIND_NOTE: ${{ fromJSON(needs.detect.outputs.lane_state || '{}')[matrix.dir].kind_note }}
          SECURITY_SHAS: ${{ needs.detect.outputs.security_shas }}
        run: |
          set -euo pipefail
          args=(--release-model "$RELEASE_MODEL" --site lane --lane "$DIR" --version "$VERSION"
            --kind-note "$KIND_NOTE" --out NOTES.md)
          if [ "$FINALIZE" = "true" ]; then
            args+=(--finalize)
          fi
          if [ "$RELEASE_MODEL" = "two-branch" ]; then
            tr ' ' '\n' <<<"$SECURITY_SHAS" > "$RUNNER_TEMP/security-shas"
            args+=(--repo "$GITHUB_REPOSITORY" --release-commit "$GITHUB_SHA" --security-shas "$RUNNER_TEMP/security-shas")
          fi
          bash "$CI_TOOLS/render-notes.sh" "${args[@]}"

      - name: Tag + GitHub Release (lane)
        if: ${{ steps.lane.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ steps.lane.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          RELEASE_MODEL: ${{ needs.detect.outputs.release_model }}
        run: |
          set -euo pipefail
          # Tag ref via the git data API pinned to the trigger commit, with
          # the exists-at-different-SHA refuse guard (mirrors the root go
          # job; slash tags are ordinary multi-segment refs). A dev lane
          # build gets the tag, its receipt and no Release.
          CREATED=false
          if EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq .object.sha 2>/dev/null); then
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${VERSION} exists at ${EXISTING}, not ${GITHUB_SHA}; refusing."
              exit 1
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${VERSION}" -f sha="${GITHUB_SHA}"
            CREATED=true
          fi
          if [ "$CHANNEL" != "stable" ]; then
            # The audit reads this receipt: a dev tag has no Release to show
            # that the pipeline, not a hand, created it. A tag without it would
            # make a rerun compute release=false, so the tag this attempt
            # created is deleted with the failed POST and a rerun makes both.
            if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context="release/tag/${VERSION}" \
              -f description="created by the dev release run" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
              if [ "$CREATED" = true ]; then
                echo "::error::receipt for ${VERSION} not recorded; deleting the tag this run created so a rerun recreates both"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" >/dev/null
              fi
              exit 1
            fi
            echo "dev channel: tagged ${VERSION} with its receipt, no GitHub Release"
            exit 0
          fi
          if [ "$RELEASE_MODEL" = legacy ]; then set -- --count-drafts; fi
          state=$(bash "$CI_TOOLS/release-exists.sh" "$@" "$VERSION")
          if [ "$state" = absent ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file NOTES.md
          fi

  # ─── Verify every registry this run published to ──────────────────────────
  # A green publish job is not proof the artifact is fetchable. Each lane that
  # ran is read back at the released version: the Go proxy for the root module
  # and each nested lane, npm (and JSR on stable) for the root package and
  # each subpackage. The docker lane is verified inside docker-release.yaml,
  # which holds the manifest digest.
  verify-publish:
    needs: [detect, docker, go, ts, subpackage, go-nested]
    # A skipped dependency skips this job under the default success(), and a
    # repo is one type so most lanes skip: run when none failed and at least
    # one registry lane published.
    if: |
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.go.result == 'success'
          || needs.ts.result == 'success'
          || needs.subpackage.result == 'success'
          || needs.go-nested.result == 'success')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Verify published artifacts
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: ${{ needs.detect.outputs.channel }}
          VERSION: ${{ needs.detect.outputs.version }}
          SUBPACKAGES_JSON: ${{ needs.detect.outputs.subpackages_to_publish }}
          GO_LANES_JSON: ${{ needs.detect.outputs.go_modules_to_release }}
          GO_RESULT: ${{ needs.go.result }}
          TS_RESULT: ${{ needs.ts.result }}
          SUBPACKAGE_RESULT: ${{ needs.subpackage.result }}
          GO_NESTED_RESULT: ${{ needs.go-nested.result }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          ver="${VERSION#v}"
          rc=0

          probe() { # <label> <url>
            if await_registry "$1" curl -fsSL --connect-timeout 10 --max-time 30 -o /dev/null "$2"; then
              echo "ok: $1"
              return 0
            fi
            echo "::error::$1 is not published: $2"
            return 1
          }
          # The proxy is lazy, so this GET is also what makes the module
          # resolvable. Uppercase in a module path is `!lowercase` on the proxy.
          #
          # Nothing is pushed here — a Go module is published by its git tag and
          # the proxy mirrors it on request — so absence has two causes and the
          # body says which. `unknown revision` means the proxy answered before
          # it could see the tag and caches that for up to ~30 min, which can
          # outlast the wait, so it warns. Anything else is permanent: a module
          # path disagreeing with the repo, or a module it cannot fetch.
          proxy_body=$(mktemp)
          # Called through await_registry, which the linter cannot follow.
          # shellcheck disable=SC2329
          proxy_get() { # <url>: the proxy's last answer, body and error, lands in $proxy_body
            curl -sSL --fail-with-body --connect-timeout 10 --max-time 30 "$1" >"$proxy_body" 2>&1
          }
          probe_go() { # <go.mod> <vX.Y.Z>
            local modpath url body
            modpath=$(awk '$1=="module"{print $2; exit}' "$1" | tr -d '"' | sed 's/[A-Z]/!\L&/g')
            url="https://proxy.golang.org/${modpath}/@v/$2.info"
            if await_registry "proxy.golang.org ${modpath}@$2" proxy_get "$url"; then
              echo "ok: proxy.golang.org ${modpath}@$2"
              return 0
            fi
            body=$(cat "$proxy_body")
            case $body in
              *"unknown revision"*)
                echo "::warning::proxy.golang.org ${modpath}@$2 is not mirrored yet: ${url}"
                return 0
                ;;
            esac
            echo "::error::proxy.golang.org ${modpath}@$2 is not resolvable: ${body}"
            return 1
          }
          # JSR receives the stable channel only, so a dev version is never
          # there to read back.
          probe_ts() { # <package.json>
            local pkg
            pkg=$(jq -r .name "$1")
            probe "npm ${pkg}@${ver}" "https://registry.npmjs.org/${pkg}/${ver}" || rc=1
            if [ "$CHANNEL" = "stable" ]; then
              probe "jsr ${pkg}@${ver}" "https://jsr.io/${pkg}/${ver}_meta.json" || rc=1
            fi
          }
          # Only tags of this channel's shape: a stable and a dev lane tag can
          # sit on one commit (a promotion of the commit the dev build tagged).
          lane_tags_at_head() { # <dir>
            if [ "$CHANNEL" = "stable" ]; then
              git tag --points-at HEAD --list "$1/v[0-9]*" | grep -E "^$1/v[0-9]+\.[0-9]+\.[0-9]+\$" || true
            else
              git tag --points-at HEAD --list "$1/v[0-9]*-dev.*"
            fi
          }

          if [ "$GO_RESULT" = "success" ]; then
            probe_go go.mod "$VERSION" || rc=1
          fi
          if [ "$GO_NESTED_RESULT" = "success" ]; then
            # A lane tags only when its own version moved, and the matrix
            # cannot report per-lane versions; the lane tags at this commit
            # say which lanes published and at what version.
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                probe_go "$d/go.mod" "${tag#"$d"/}" || rc=1
              done < <(lane_tags_at_head "$d")
            done < <(jq -r '.[]' <<<"$GO_LANES_JSON")
          fi
          if [ "$TS_RESULT" = "success" ]; then
            probe_ts package.json
          fi
          if [ "$SUBPACKAGE_RESULT" = "success" ]; then
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              probe_ts "$d/package.json"
            done < <(jq -r '.[]' <<<"$SUBPACKAGES_JSON")
          fi
          exit "$rc"

  # ─── Two-branch: record each stable lane's completion receipt ─────────────
  # A stable publication is complete once its Release exists and
  # verify-publish read it back; the next run's repair reads the receipt. Its
  # own job, so the statuses scope never reaches a legacy run. The image
  # lane's receipt is docker-release.yaml's, unless subpackages share its
  # version: then it lands here, after they are read back too.
  receipts:
    needs: [detect, docker, go, ts, subpackage, go-nested, verify-publish]
    if: |
      always() && needs.verify-publish.result == 'success'
      && needs.detect.outputs.release_model == 'two-branch' && needs.detect.outputs.channel == 'stable'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Record completion receipts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ needs.detect.outputs.version }}
          GO_LANES_JSON: ${{ needs.detect.outputs.go_modules_to_release }}
          GO_RESULT: ${{ needs.go.result }}
          TS_RESULT: ${{ needs.ts.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SUBPACKAGE_RESULT: ${{ needs.subpackage.result }}
          GO_NESTED_RESULT: ${{ needs.go-nested.result }}
        run: |
          set -euo pipefail
          if [ "$GO_RESULT" = "success" ] || [ "$TS_RESULT" = "success" ]; then
            bash "$CI_TOOLS/release-state.sh" receipt "$VERSION" "$(git rev-list -n1 "$VERSION")"
          elif [ "$DOCKER_RESULT" = "success" ] && [ "$SUBPACKAGE_RESULT" = "success" ] \
            && [ "$(git rev-list -n1 "$VERSION" 2>/dev/null)" = "$GITHUB_SHA" ]; then
            bash "$CI_TOOLS/release-state.sh" receipt "$VERSION" "$GITHUB_SHA"
          fi
          if [ "$GO_NESTED_RESULT" = "success" ]; then
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                bash "$CI_TOOLS/release-state.sh" receipt "$tag" "$(git rev-list -n1 "$tag")"
              done < <(git tag --points-at HEAD --list "$d/v[0-9]*" | grep -E "^$d/v[0-9]+\.[0-9]+\.[0-9]+\$" || true)
            done < <(jq -r '.[]' <<<"$GO_LANES_JSON")
          fi
