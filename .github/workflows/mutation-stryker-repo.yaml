# Mutation-tests the TS package dirs of one public cplieger repository that
# commit a stryker config: plans each dir, shards it by measured cost, merges
# the shards into one report, records the costs next week prices from, and
# publishes the badge and tracker issue. weekly-stryker.yaml calls it once per
# repository; docs/workflows.md "The scheduled runs" documents the contract.
name: Stryker one repository

on:
  workflow_call:
    inputs:
      repository:
        description: "A public cplieger repository name."
        required: true
        type: string
      dir:
        description: "One package dir ('.' for the root) to test alone; empty tests every dir and publishes the badge and tracker."
        required: false
        type: string
        default: ""
      honour-opt-out:
        description: "Skip a dir whose stryker.weekly.json is exactly {\"weekly\": false}."
        required: false
        type: boolean
        default: false
    secrets:
      CI_SCHEDULE:
        description: "Pushes the badge and writes the tracker issue; only the badge and aggregate jobs see it. A one-target call needs none."
        required: false

permissions:
  contents: read

env:
  # Keep in step with ts-ci.yaml / release.yaml (same major).
  NODE_MAJOR: "26"

jobs:
  # The repository's entries at its HEAD, each keyed by
  # scripts/mutation_cost.py entry_key: all calls of one caller run share its
  # artifact namespace. Clones and reads the target, but runs none of its code.
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      entries: ${{ steps.entries.outputs.entries }}
      refused: ${{ steps.entries.outputs.refused }}
      opted_out: ${{ steps.entries.outputs.opted_out }}
      plans: ${{ steps.entries.outputs.plans }}
      # A job's timeout-minutes cannot read env
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
      run_timeout_minutes: "350"
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Key this repository and dir
        id: key
        env:
          REPO: ${{ inputs.repository }}
          DIR: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          key=$(python3 scripts/mutation_cost.py key --repo "$REPO" --dir "$DIR")
          echo "key=${key}" >>"$GITHUB_OUTPUT"

      # Plain git over HTTPS draws no API quota, and the clone is anonymous:
      # the callers name public repositories.
      - name: Find the stryker configs
        id: entries
        env:
          REPO: ${{ inputs.repository }}
          DIR: ${{ inputs.dir }}
          OPT_OUT: ${{ inputs.honour-opt-out }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/cplieger/${REPO}.git" scan
          sha=$(git -C scan rev-parse HEAD)
          args=(--repo "$REPO" --sha "$sha" --root scan --dir "$DIR")
          if [ "$OPT_OUT" = true ]; then args+=(--honour-opt-out); fi
          found=$(python3 scripts/stryker-shard.py discover "${args[@]}")
          # The shard job downloads exactly these names, so no other call's plan reaches it.
          plans=$(jq -r '.entries | map("strykerplan-\(.key)") | if length == 1 then .[0] else "{\(join(","))}" end' <<<"$found")
          {
            echo "entries=$(jq -c .entries <<<"$found")"
            echo "refused=$(jq -c .refused <<<"$found")"
            echo "opted_out=$(jq -c .opted_out <<<"$found")"
            echo "plans=${plans}"
          } >>"$GITHUB_OUTPUT"

  # Per entry: a Stryker pass that stops once its mutation testing plan is
  # ready, so the plan knows each file's mutants to run and the netTime of
  # their tests (scripts/stryker-ci-reporter.mjs).
  plan:
    needs: discover
    if: ${{ needs.discover.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.entries) }}
    runs-on: ubuntu-26.04
    # 30 min on marotte (run 43153701425); 120 leaves a 1.8x slower runner
    # (mutation_cost.SLOWDOWN) room. Stryker ends a dry run at the config's
    # dryRunTimeoutMinutes on any runner.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Checkout FIRST: actions/checkout cleans the workspace, so it must not
      # run after the target clone below.
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # Anonymous: the callers name public repositories, and this job runs
      # the target's code, so it holds no secret.
      - name: Clone target repo at pinned SHA
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/cplieger/${REPO}.git" target
          git -C target fetch --depth 1 origin "${SHA}"
          git -C target -c advice.detachedHead=false checkout --quiet "${SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Automatic caching off: this step restores no npm cache.
          package-manager-cache: false
          node-version: ${{ env.NODE_MAJOR }}

      # DIR passed entry_key in the discover job, so it holds none of a
      # workflow command's characters.
      - name: Plan the mutation run
        working-directory: target/${{ matrix.dir }}
        env:
          REPO: ${{ matrix.repo }}
          DIR: ${{ matrix.dir }}
          SHA: ${{ matrix.sha }}
          KEY: ${{ matrix.key }}
        run: |
          set -uo pipefail
          ci="${GITHUB_WORKSPACE}"
          plan_args=(--repo "${REPO}" --dir "${DIR}" --sha "${SHA}"
            --config stryker.config.json --out "${ci}/plan/${KEY}.json")
          rc=0
          ENTRY="${REPO}:${DIR}" REPORTER="${ci}/scripts/stryker-ci-reporter.mjs" \
            CI_STRYKER_PLAN="${RUNNER_TEMP}/pass.json" bash "${ci}/scripts/stryker-run.sh" || rc=$?
          case "${rc}" in
            0) python3 "${ci}/scripts/stryker-shard.py" plan "${plan_args[@]}" --pass "${RUNNER_TEMP}/pass.json" ;;
            3) python3 "${ci}/scripts/stryker-shard.py" plan "${plan_args[@]}" --skipped ;;
            *)
              echo "::error::${REPO}:${DIR}: the plan pass failed (exit ${rc}), so the entry runs in one job"
              exit "${rc}"
              ;;
          esac

      # One file named by the entry's key, so the shard job's merged download
      # holds each entry's plan under its own name.
      - name: Upload the plan
        if: ${{ !cancelled() && hashFiles(format('plan/{0}.json', matrix.key)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strykerplan-${{ matrix.key }}
          path: plan/${{ matrix.key }}.json
          if-no-files-found: error
          retention-days: 7

  # The run and merge matrices: entry x shard from each entry's plan, priced by
  # its last cost history, one shard for an entry with no usable plan, none for
  # one that is not enrolled or whose plan cannot keep every job within the
  # bound (its failed list, which the result names). Runs no target code, so it
  # alone fetches an earlier run's artifact (the cost history).
  shard:
    needs: [discover, plan]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.entries != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.matrix.outputs.run }}
      merge: ${{ steps.matrix.outputs.merge }}
      failed: ${{ steps.matrix.outputs.failed }}
      reports: ${{ steps.matrix.outputs.reports }}
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # An entry whose plan job failed before its upload runs in one job.
      - name: Download the plans
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: plans
          pattern: ${{ needs.discover.outputs.plans }}
          merge-multiple: true

      # An entry with no history is priced from its plan pass, so a fetch that
      # fails or runs out of time costs only the prices it did not reach.
      - name: Fetch each entry's cost history
        timeout-minutes: 4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRIES: ${{ needs.discover.outputs.entries }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          for key in $(jq -r '.[].key' <<<"${ENTRIES}"); do
            bash scripts/mutation-history.sh "strykercosts-${key}" "${REF}" "history/${key}" costs.json
            if [ -f "history/${key}/costs.json" ]; then mv "history/${key}/costs.json" "history/${key}.json"; fi
          done

      - name: Build the run and merge matrices
        id: matrix
        env:
          ENTRIES: ${{ needs.discover.outputs.entries }}
        run: |
          set -euo pipefail
          out=$(python3 scripts/stryker-shard.py matrix --entries "${ENTRIES}" --plans plans \
            --history history --out-plans run-plans)
          # The aggregate job downloads exactly these names.
          reports=$(jq -r '.merge | map("stryker-\(.key)") | if length == 1 then .[0] else "{\(join(","))}" end' <<<"$out")
          {
            echo "run=$(jq -c .run <<<"${out}")"
            echo "merge=$(jq -c .merge <<<"${out}")"
            echo "failed=$(jq -c .failed <<<"${out}")"
            echo "reports=${reports}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the run plans
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strykerrunplans-${{ needs.discover.outputs.key }}
          path: run-plans
          if-no-files-found: ignore
          retention-days: 7

  run:
    name: run (${{ matrix.dir }}${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
    needs: [discover, shard]
    # The shard job runs after a failed plan, which would skip this job by
    # default (https://github.com/actions/runner/issues/2205).
    if: ${{ !cancelled() && needs.shard.result == 'success' && needs.shard.outputs.run != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 3   # CPU-heavy; weekly-stryker.yaml runs 2 repos at once
      matrix:
        include: ${{ fromJSON(needs.shard.outputs.run) }}
    runs-on: ubuntu-26.04
    # 360 is the hosted-runner ceiling. An entry that outgrows one job shards;
    # each shard's Stryker stops 25 min before this cap, counted from the job's
    # first script step (RUN_DEADLINE below), and gets 5 more to stop
    # (stryker-run.sh's KILL_GRACE).
    timeout-minutes: ${{ fromJSON(needs.discover.outputs.run_timeout_minutes) }}
    permissions:
      contents: read
    steps:
      # Checkout FIRST: actions/checkout cleans the workspace, so it must not
      # run after the target clone below.
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download the run plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: strykerrunplans-${{ needs.discover.outputs.key }}
          path: plan

      # Before the target's code runs, which could rewrite this checkout.
      - name: Read this shard's files
        id: shard
        env:
          KEY: ${{ matrix.key }}
          SHARD: ${{ matrix.shard }}
          CAP_MINUTES: ${{ needs.discover.outputs.run_timeout_minutes }}
        run: |
          set -euo pipefail
          deadline=$(($(date +%s) + (CAP_MINUTES - 25) * 60))
          mutate=$(python3 scripts/stryker-shard.py mutate --plan "plan/${KEY}.json" --shard "${SHARD}")
          printf 'mutate=%s\ndeadline=%s\n' "${mutate}" "${deadline}" >> "$GITHUB_OUTPUT"

      # Anonymous: the callers name public repositories, and this job runs
      # the target's code, so it holds no secret.
      - name: Clone target repo at pinned SHA
        env:
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/cplieger/${REPO}.git" target
          git -C target fetch --depth 1 origin "${SHA}"
          git -C target -c advice.detachedHead=false checkout --quiet "${SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Automatic caching off: this step restores no npm cache.
          package-manager-cache: false
          node-version: ${{ env.NODE_MAJOR }}

      - name: Run stryker
        id: stryker
        working-directory: target/${{ matrix.dir }}
        env:
          ENTRY: ${{ matrix.repo }}:${{ matrix.dir }}
          MUTATE: ${{ steps.shard.outputs.mutate }}
          RUN_DEADLINE: ${{ steps.shard.outputs.deadline }}
        # The sampler logs a line a minute, which the log keeps when the runner
        # is shut down, and keeps the same series for the upload below.
        run: |
          set -uo pipefail
          ci="${GITHUB_WORKSPACE}"
          python3 "${ci}/scripts/runner-sample.py" --out "${RUNNER_TEMP}/samples.tsv" \
            --disk "${GITHUB_WORKSPACE}" &
          sampler=$!
          trap 'kill "${sampler}" 2>/dev/null || true' EXIT
          rc=0
          REPORTER="${ci}/scripts/stryker-ci-reporter.mjs" CI_STRYKER_TIMES="${RUNNER_TEMP}/times.tsv" \
            CI_STRYKER_RESULT="${RUNNER_TEMP}/result.json" bash "${ci}/scripts/stryker-run.sh" || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      # The merge job reads the result, its costs and meta.json; it takes the
      # repo and dir from its own matrix and checks them against meta.json.
      - name: Stage this shard's result
        id: stage
        if: ${{ !cancelled() && steps.stryker.outputs.rc != '' }}
        env:
          REPO: ${{ matrix.repo }}
          DIR: ${{ matrix.dir }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          RC: ${{ steps.stryker.outputs.rc }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage
          if [ -f "${RUNNER_TEMP}/result.json" ]; then
            cp "${RUNNER_TEMP}/result.json" /tmp/stage/result.json
          fi
          complete=false
          if [ -f "${RUNNER_TEMP}/times.tsv" ]; then
            grep -qx '#done' "${RUNNER_TEMP}/times.tsv" && complete=true
            python3 scripts/stryker-shard.py costs --times "${RUNNER_TEMP}/times.tsv" --out /tmp/stage/costs.json \
              || echo "::warning::no cost record for this shard, so next week prices it from its plan pass"
          fi
          jq -n --arg repo "$REPO" --arg dir "$DIR" --argjson shard "$SHARD" --argjson shards "$SHARDS" \
            --argjson complete "$complete" --argjson skipped "$([ "$RC" = 3 ] && echo true || echo false)" \
            '{repo: $repo, dir: $dir, shard: $shard, shards: $shards, complete: $complete, skipped: $skipped}' \
            > /tmp/stage/meta.json
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"

      - name: Upload this shard's runner samples
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strykersamples-${{ matrix.key }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/samples.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Upload this shard's result
        if: ${{ !cancelled() && steps.stryker.outputs.rc != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strykershard-${{ matrix.key }}-${{ matrix.shard }}
          path: /tmp/stage
          if-no-files-found: error
          retention-days: 7

      # A complete shard can exit 1 on its own part's score against
      # thresholds.break; the merge job judges the whole entry's score.
      - name: Fail a shard that did not finish
        if: ${{ !cancelled() && steps.stage.outputs.complete != 'true' && steps.stryker.outputs.rc != '3' }}
        env:
          RC: ${{ steps.stryker.outputs.rc }}
          ENTRY: ${{ matrix.repo }}:${{ matrix.dir }}
        run: |
          echo "::error::${ENTRY}: stryker exited ${RC:-before it ran} without finishing"
          exit 1

  # Per entry, running no target code: its shards' results as one run's report
  # and score, staged as stryker-<key> for the badge and tracker jobs,
  # and the cost history next week's plan prices from (scripts/stryker-shard.py merge).
  merge:
    needs: [discover, shard, run]
    if: ${{ !cancelled() && needs.shard.result == 'success' && needs.shard.outputs.merge != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.shard.outputs.merge) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download the run plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: strykerrunplans-${{ needs.discover.outputs.key }}
          path: plan

      - name: Download this entry's shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shards
          pattern: ${{ matrix.artifacts }}

      - name: Merge the shards
        id: merge
        env:
          KEY: ${{ matrix.key }}
        run: |
          python3 scripts/stryker-shard.py merge --plan "plan/${KEY}.json" --shards shards \
            --stage stage --costs costs
          echo "below=$(cat stage/below.txt 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload the report (artifact, 90-day retention)
        if: ${{ !cancelled() && hashFiles('stage/meta.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-${{ matrix.key }}
          path: |
            stage/mutation.json
            stage/meta.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload this entry's cost history (90-day retention)
        if: ${{ !cancelled() && hashFiles('costs/costs.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strykercosts-${{ matrix.key }}
          path: costs/costs.json
          if-no-files-found: error
          retention-days: 90

      - name: Surface below-threshold score
        if: ${{ steps.merge.outputs.below == 'true' }}
        env:
          ENTRY: ${{ matrix.repo }}:${{ matrix.dir }}
        run: |
          echo "::error::${ENTRY}: mutation score fell below the config's thresholds.break"
          exit 1

  # Publish each entry's mutation-ts badge from the score its run staged. The
  # push token lives in this job, which runs no target code: a step after the
  # target's `npm ci` in `run` could reach it through GITHUB_ENV, GITHUB_PATH
  # or the workspace. That code also writes meta.json, so the repo comes from
  # this matrix and the artifact from its name, never from meta.json. A
  # one-dir call publishes neither badge nor tracker, which describe the repo.
  badge:
    needs: [discover, shard, merge]
    if: ${{ !cancelled() && needs.shard.result == 'success' && needs.shard.outputs.merge != '[]' && inputs.dir == '' }}
    strategy:
      fail-fast: false
      # One at a time in the order the jobs are created, the matrix's own
      # (docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations),
      # so a repo with several package dirs ends on the same dir's badge.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.shard.outputs.merge) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the CI_SCHEDULE secret
        env:
          TOKEN: ${{ secrets.CI_SCHEDULE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::a whole-repository call publishes the badge, so the caller must pass CI_SCHEDULE"
            exit 1
          fi

      - name: Checkout ci (for the badge publisher)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # the badge push authenticates via CI_SCHEDULE inside the script.
          persist-credentials: false

      # A pattern matching nothing downloads nothing and succeeds: the entry
      # was skipped or failed before it staged a report. One match extracts
      # straight into `path`.
      - name: Download this entry's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifact
          pattern: stryker-${{ matrix.key }}

      - name: Publish this entry's mutation-ts badge
        env:
          TOKEN: ${{ secrets.CI_SCHEDULE }}
          REPO: ${{ matrix.repo }}
          ENTRY: ${{ matrix.repo }}:${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ ! -f artifact/meta.json ]; then
            echo "${ENTRY}: no report was staged, so no badge is published"
            exit 0
          fi
          score=$(jq -r '.score // ""' artifact/meta.json 2>/dev/null) || score=""
          if ! [[ $score =~ ^[0-9]{1,3}(\.[0-9]+)?$ ]]; then
            echo "::error::${ENTRY}: the staged score is not a number, so no badge was published"
            exit 1
          fi
          # Colour bands match the Go mutation badge (gremlins-aggregate.py).
          int=${score%.*}
          if [ "$int" -ge 85 ]; then color=brightgreen
          elif [ "$int" -ge 75 ]; then color=green
          elif [ "$int" -ge 50 ]; then color=yellow
          elif [ "$int" -ge 30 ]; then color=orange
          else color=red
          fi
          json=$(printf '{"schemaVersion":1,"label":"mutation (TS)","message":"%s%%","color":"%s"}' "$score" "$color")
          bash actions/publish-badge/publish-badge.sh "cplieger/${REPO}" "$TOKEN" mutation-ts.json "$json"

  # Update the repo's tracker issue, the TS twin of mutation-gremlins-repo.yaml's
  # aggregate job, independent of the badge job so neither failure blocks the
  # other. A repo with no parseable report this week is left untouched (its red
  # run or merge job is the signal).
  aggregate:
    needs: [discover, shard, merge]
    if: ${{ always() && needs.shard.result == 'success' && needs.shard.outputs.merge != '[]' && inputs.dir == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
    steps:
      - name: Require the CI_SCHEDULE secret
        env:
          TOKEN: ${{ secrets.CI_SCHEDULE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::a whole-repository call writes the tracker issue, so the caller must pass CI_SCHEDULE"
            exit 1
          fi

      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Download this repo's reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: ${{ needs.shard.outputs.reports }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Aggregate + update this repo's tracker issue
        env:
          REPO: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          # Target code wrote meta.json, so an artifact naming another repo is
          # warned and skipped; stryker-aggregate.py reads only this repo's.
          found=$(bash scripts/discover-artifact-repos.sh --allow "$REPO" artifacts)
          if [ -z "$found" ]; then
            echo "no report names ${REPO} this week, so its tracker issue is left untouched"
            exit 0
          fi
          R="cplieger/${REPO}"
          title="Stryker mutation testing tracker"
          python3 scripts/tracker_issue.py --repo "$R" --label stryker-tracker --title "$title" \
            --mode fetch --body-file "$RUNNER_TEMP/existing.md"
          python3 scripts/stryker-aggregate.py \
            --repo "$REPO" --artifacts-dir artifacts --week "$(date -u +'%Y-%m-%d %H:%M')" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --regression-marker-file "$RUNNER_TEMP/regression.txt" \
            --entries-marker-file "$RUNNER_TEMP/entries.txt" \
            --existing-body-file "$RUNNER_TEMP/existing.md" > "$RUNNER_TEMP/body.md"
          if [ "$(cat "$RUNNER_TEMP/entries.txt" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "no parseable reports for ${REPO}, so its tracker issue is left untouched"
            exit 0
          fi
          flag=off
          if [ "$(cat "$RUNNER_TEMP/regression.txt" 2>/dev/null)" = "true" ]; then
            flag=on
          fi
          python3 scripts/tracker_issue.py --repo "$R" --label stryker-tracker --title "$title" \
            --mode upsert --body-file "$RUNNER_TEMP/body.md" \
            --flag-label mutation-regression --flag "$flag"

  # The call's positive record, which the caller's fleet summary reads because
  # a matrix call's outputs keep only the last call's values. Built from every
  # job's result and the discover and shard jobs' outputs, never from a file
  # target code wrote; scripts/mutation-summary.py record owns the outcome, and
  # this job fails unless the call passed or every dir opted out.
  result:
    needs: [discover, plan, shard, run, merge, badge, aggregate]
    if: ${{ always() && needs.discover.outputs.key != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # A tested entry is counted from these; a lost download leaves its
      # entries not run, which the record names.
      - name: Download this call's merged results
        if: ${{ needs.shard.outputs.reports != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
          pattern: ${{ needs.shard.outputs.reports }}

      - name: Write this call's result
        env:
          REPO: ${{ inputs.repository }}
          DIR: ${{ inputs.dir }}
          KEY: ${{ needs.discover.outputs.key }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/mutation-summary.py record --tool stryker --repo "$REPO" --target "$DIR" \
            --key "$KEY" --needs "$NEEDS" --out "result/${KEY}.json" --reports reports

      - name: Upload this call's result
        if: ${{ always() && hashFiles('result/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strykerresult-${{ needs.discover.outputs.key }}
          path: result
          if-no-files-found: error
          retention-days: 7
