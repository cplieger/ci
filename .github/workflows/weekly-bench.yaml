# Weekly Go benchmark regression tracking across cplieger consumer repos.
# Pattern C, like weekly-gremlins / weekly-fuzz / weekly-stryker: this workflow
# owns the matrix and the max-parallel cap; runs happen here, not via cross-repo
# dispatch.
#
# WHY THIS EXISTS
# The fleet already had ~155 `func Benchmark` across 16 repos and NOTHING
# executed any of them: a grep for -bench/-benchmem/benchstat across every
# workflow in ci and all 55 repos returned zero. So a performance regression in
# subflux's subsync aligner or vibekit's ACP translator landed silently. The
# benchmarks were well built (size-parameterised, ReportAllocs, ResetTimer);
# they were simply dead.
#
# THE STATISTICS, AND WHY THE REDUCER IS NOT OPTIONAL
# github-action-benchmark performs NO aggregation: its Go extractor emits one
# entry per output line and its alert comparator resolves the baseline by
# first-match-on-name. Handing it raw `-count=10` output compares one arbitrary
# sample against one arbitrary previous sample, ten times, which multiplies
# false-alert odds by ten and writes ten duplicate-named points per benchmark.
# scripts/bench-reduce.py therefore reduces to ONE median entry per benchmark
# per metric first, and the action is used via its custom-tool path. It keeps
# the chart and the branch history it is good at; it is not the estimator.
#
# Schedule:     Tuesdays 22:00 UTC. Own slot by design: gremlins Sun, fuzz Wed,
#               stryker Sat, security daily 03:00, rebuild-stale daily 04:00.
#               Two new runners (this and weekly-links) took the two free days
#               so the 20-job account cap is never contested.
# Threshold:    150%, report-only (fail-on-alert: false). Deliberately loose.
#               Hosted-runner amplitude is documented at 10-20% and the target
#               is an algorithmic regression (an O(n log n) aligner becoming
#               O(n squared)), which shows up as multiples. A tight threshold on
#               a non-gating check just trains everyone to ignore the tracker.
#               Medians shrink the noise the threshold must clear, so this is
#               conservative; tighten only against measured tracker history.
# Storage:      each consumer's orphan `benchmarks` branch, written by the
#               action's own git mode. NOT the `badges` branch: publish-badge.sh
#               rebuilds that from root *.json only and force-pushes a squashed
#               commit, so it would delete both a raw baseline and the action's
#               chart files. `badges` stays Shields-JSON-only.
# First run:    TWO bootstrap facts, verified against the action's v1.22.1 dist
#               rather than its README. (1) The action does NOT create a missing
#               data branch: its gh-repository path is clone + plain
#               `git checkout <branch>`, no orphan fallback, so the run fails on
#               a repo that has never enrolled. The "Ensure benchmarks branch"
#               step below therefore creates the empty orphan branch, once,
#               idempotently. (2) Alert comparison skips when the branch carries
#               no previous suite, so the first data point publishes a baseline
#               and alerts nothing - that part needs no bootstrap.
# Scope:        starts at the four repos that SELL a cost bound (xmlx, jsonx,
#               ssrf, httpx). xmlx and jsonx bound what untrusted input can cost
#               and had no benchmarks at all until this landed, so their
#               allocation-free claims were unverified by anything. Widen to all
#               16 benchmark-carrying repos once the tracker is trusted.
name: Weekly bench

on:
  schedule:
    - cron: "0 22 * * 2"   # Tuesday 22:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma/space-separated repo names to limit the run. Empty uses the enrolled set."
        required: false
        default: ""
      count:
        description: "Samples per benchmark (default 10; lower only for smoke-testing the runner)."
        required: false
        default: "10"

permissions:
  contents: read
  # Chart pushes happen in CONSUMER repos via the CI_SCHEDULE PAT.

concurrency:
  group: weekly-bench
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.fanout.outputs.matrix }}
    steps:
      - name: Discover Go repos carrying benchmarks
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Injected via env (never inline ${{ }} in the body) so a crafted
          # dispatch input cannot expand into shell code.
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail

          # The enrolled set. Deliberately narrower than "every repo with a
          # benchmark": prove the tracker is trusted on the cost-contract
          # libraries before fanning out to subflux (49) and vibekit (40).
          ENROLLED="xmlx jsonx ssrf httpx"

          # Forks are excluded fleet-wide (same rule as scripts/audit.py): a
          # fork's tree is UPSTREAM's, so its benchmarks measure someone else's
          # code and its tracker issue would be unactionable.
          # `tr` is load-bearing: jq emits one name per LINE, and the liveness
          # test below is a space-delimited substring match. Without the
          # flattening, `*" $r "*` never matches (a newline is not a space), so
          # every enrolled repo was rejected as "not live", the matrix came out
          # empty, the `run` job skipped, and the whole leg reported SUCCESS.
          # It did that from the guard landing until 2026-08-21, which is why no
          # repo ever grew a `benchmarks` branch.
          live=$(gh repo list cplieger --limit 300 --json name,isArchived,isFork --jq '
            [.[] | select(.isArchived == false and .isFork == false) | .name] | .[]
          ' | tr '\n' ' ')

          repos=""
          for r in $ENROLLED; do
            case " $live " in *" $r "*) repos="$repos $r" ;; *)
              echo "::warning::enrolled repo '$r' is not live (archived, fork, or renamed) - skipping" ;;
            esac
          done

          # Fail closed when the whole enrolled set fails to resolve. ENROLLED
          # is hardcoded, so "none of them are live" is a defect in this
          # workflow or in discovery, never a legitimate weekly state - and it
          # is the exact shape that made this leg vacuously green for weeks.
          if [ -z "$repos" ]; then
            echo "::error::no enrolled repo resolved against live discovery" \
                 "(enrolled: ${ENROLLED}) - refusing to report a green leg"
            exit 1
          fi

          if [ -n "${ONLY:-}" ]; then
            wanted=" $(echo "$ONLY" | tr ',' ' ') "
            filtered=""
            for r in $repos; do
              case "$wanted" in *" $r "*) filtered="$filtered $r" ;; esac
            done
            repos="$filtered"
            echo "manual 'only' filter active -> ${repos:-<none matched>}"
          fi

          matrix='[]'
          for r in $repos; do
            rm -rf scan
            gh repo clone "cplieger/${r}" scan -- --depth 1 2>/dev/null || {
              echo "::warning::clone failed for ${r} - skipping"
              continue
            }
            if [ ! -f scan/go.mod ]; then
              echo "  skip ${r}: no go.mod"
              continue
            fi
            # Only enrol a repo that actually has a benchmark to run. Without
            # this the reducer would fail the leg on empty input, which is
            # correct behaviour for a repo that SHOULD have benchmarks and a
            # false alarm for one that never did.
            n=$(grep -rl --include='*_test.go' 'func Benchmark' scan 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "  skip ${r}: no benchmark functions"
              continue
            fi
            # Guarded for the same reason as weekly-stryker's copy: a clone that
            # exits 0 with no resolvable HEAD makes rev-parse exit 128, and
            # under `bash -e` that kills the fanout and every other repo's
            # matrix entry with it. One skipped repo is the right blast radius.
            if ! sha=$(git -C scan rev-parse HEAD 2>/dev/null); then
              echo "::warning::cannot resolve HEAD for ${r} - skipping"
              continue
            fi
            echo "  include ${r} @ ${sha:0:12} (${n} files with benchmarks)"
            matrix=$(printf '%s' "$matrix" | jq -c \
              --arg r "$r" --arg s "$sha" '. + [{repo: $r, sha: $s}]')
          done
          rm -rf scan

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Total entries: $(printf '%s' "$matrix" | jq 'length')"

          # An empty matrix skips the `run` job, which reports the leg green
          # with nothing measured. Every remaining cause is worth a red run: a
          # clone that failed, a repo that lost its benchmarks, or an `only`
          # filter that matched no enrolled repo.
          if [ "$(printf '%s' "$matrix" | jq 'length')" -eq 0 ]; then
            echo "::error::matrix is empty after probing '${repos}'" \
                 "- nothing would be benchmarked, failing instead of skipping"
            exit 1
          fi

  run:
    needs: fanout
    if: ${{ needs.fanout.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4   # Own day; 4 leaves 16 of the 20-job cap free
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
    steps:
      # Checkout ci FIRST (actions/checkout cleans the workspace): this brings
      # scripts/bench-reduce.py, which the consumer repo does not carry.
      - name: Checkout ci (for the reducer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # the chart push authenticates via CI_SCHEDULE below.
          persist-credentials: false
          path: _ci

      - name: Checkout consumer at the discovered SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cplieger/${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          persist-credentials: false
          path: app

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # `-run='^$'` keeps the unit suite out of the timing. `-count` is the
      # sample size the reducer takes a median over; 10 is benchstat's own
      # documented minimum for a statistically meaningful sample.
      - name: Run benchmarks
        working-directory: app
        env:
          COUNT: ${{ github.event.inputs.count || '10' }}
        run: |
          set -euo pipefail
          case "$COUNT" in
            ''|*[!0-9]*) echo "::error::count must be a positive integer"; exit 1 ;;
          esac
          go test -run='^$' -bench=. -benchmem -count="$COUNT" ./... \
            | tee "$RUNNER_TEMP/bench-raw.txt"

      - name: Reduce to medians
        run: |
          set -euo pipefail
          python3 _ci/scripts/bench-reduce.py "$RUNNER_TEMP/bench-raw.txt" \
            > "$RUNNER_TEMP/bench.json"
          echo "Entries: $(jq 'length' "$RUNNER_TEMP/bench.json")"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.repo }} benchmarks"
            echo ""
            echo "| Benchmark | Value | Unit | Spread |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.name) | \(.value) | \(.unit) | \(.range // "-") |"' \
              "$RUNNER_TEMP/bench.json"
          } >> "$GITHUB_STEP_SUMMARY"

      # The action cannot bootstrap a missing data branch (verified in its
      # v1.22.1 dist: gh-repository mode is clone + plain checkout, which fails
      # on a branch that does not exist). Create the empty orphan branch once;
      # every later run sees it and this becomes a no-op. Same bot identity the
      # fleet's publish-badge composite uses for its orphan `badges` branch.
      - name: Ensure benchmarks branch exists
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads \
            "https://github.com/cplieger/${REPO}.git" benchmarks >/dev/null 2>&1; then
            echo "benchmarks branch exists in ${REPO}"
            exit 0
          fi
          tmp=$(mktemp -d)
          git -C "$tmp" init -q -b benchmarks
          git -C "$tmp" config user.name 'github-actions[bot]'
          git -C "$tmp" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$tmp" commit -q --allow-empty -m 'ci: bootstrap benchmark data branch'
          git -C "$tmp" push -q \
            "https://x-access-token:${GH_TOKEN}@github.com/cplieger/${REPO}.git" \
            benchmarks:benchmarks
          rm -rf "$tmp"
          echo "created empty benchmarks branch in ${REPO}"

      # Publishes the median series to the consumer's orphan `benchmarks` branch
      # and comments on a regression beyond the threshold. Report-only:
      # fail-on-alert stays false, because a wall-clock regression on a shared
      # runner is evidence to investigate, not proof the code got slower.
      - name: Publish + compare
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/bench.json
          github-token: ${{ secrets.CI_SCHEDULE }}
          gh-repository: github.com/cplieger/${{ matrix.repo }}
          gh-pages-branch: benchmarks
          benchmark-data-dir-path: .
          auto-push: true
          alert-threshold: "150%"
          # comment-on-alert is OFF because the action cannot be told which repo
          # to comment on: leaveComment resolves the target from
          # github.context.repo (dist/src/write.js:136), which is cplieger/ci
          # under Pattern C and is not overridable, since GitHub reserves the
          # default GITHUB_* variables. So an alert about a consumer's
          # performance would be filed as a commit comment on a cplieger/ci
          # commit, where it is both misfiled and unread. summary-always puts
          # the same comparison in this job's summary instead, which is where
          # the run is already being looked at. Unlike the data point's commit,
          # this one cannot be repaired afterwards - the comment is an API call,
          # not a file.
          comment-on-alert: false
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      # The action stamps every data point with a cplieger/ci commit, because it
      # resolves the repo it is acting on from github.context.repo and this
      # workflow runs in ci while measuring a consumer. A chart whose points
      # link to ci cannot attribute a regression to the change that caused it,
      # which is the only reason the tracker exists, so the record is repaired
      # here. Verified against the pinned v1.22.1 dist, not the README.
      #
      # Overriding GITHUB_REPOSITORY was tried first and CANNOT work (#494,
      # reverted): GitHub reserves the default GITHUB_* variables, the runner's
      # value wins at process level, and the step's rendered env block prints
      # the override anyway, which makes the approach look verified when it is
      # not. Passing the consumer's SHA as the action's `ref` without that
      # redirect just asks ci for an object it does not have.
      #
      # bench-fix-attribution.py refuses to write unless the file is exactly the
      # action's format and the newest entry carries this run's ci SHA, so a
      # future format change fails this leg loudly instead of corrupting the
      # series. Its round-trip is byte-identical, so a run that changes nothing
      # produces no commit.
      - name: Re-point the data point at the benchmarked commit
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          git clone --quiet --depth 1 --branch benchmarks \
            "https://x-access-token:${GH_TOKEN}@github.com/cplieger/${REPO}.git" \
            "$work/data"
          gh api "repos/cplieger/${REPO}/commits/${SHA}" > "$work/commit.json"

          python3 _ci/scripts/bench-fix-attribution.py \
            --data-file "$work/data/data.js" \
            --expect-commit "$GITHUB_SHA" \
            --commit-json "$work/commit.json" \
            --repo-url "https://github.com/cplieger/${REPO}"

          if git -C "$work/data" diff --quiet -- data.js; then
            echo "data.js already correct - nothing to push"
            exit 0
          fi

          git -C "$work/data" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "ci: attribute benchmark data to ${SHA}" -- data.js
          git -C "$work/data" push --quiet origin benchmarks
          echo "re-pointed ${REPO} benchmark data at ${SHA}"

  # ─── Tracker issue per consumer (Pattern C, same shape as the siblings) ─────
  # Before this job, a 1.5x regression reached a job summary and nothing else:
  # the action's own alert comment had to be turned off, because it resolves the
  # repo to comment on from github.context.repo, which is cplieger/ci here and is
  # not overridable. The other four weekly workflows all surface findings as a
  # per-repo tracker issue, and that is the difference between a tracker that is
  # correct and one that is noticed.
  #
  # The TRACKER shape (gremlins, stryker, links) is right for benchmarks and the
  # per-finding shape (fuzz) is not. A fuzz finding is a discrete defect closed
  # by committing the seed that proves the fix; a benchmark is a continuous
  # series with no such artifact, it re-measures to a different value every week,
  # and fuzz already paid for hash-keyed titles minting duplicate issues for one
  # defect. Nothing here would ever auto-close.
  #
  # Unlike its siblings this job re-reads each consumer's `benchmarks` branch
  # rather than run-job artifacts, because for benchmarks a durable store already
  # exists and holds the full series. bench-aggregate.py therefore REGENERATES
  # the trend table from the data every week instead of rolling its own rendered
  # markdown forward, which is how the stryker tracker once fused two columns.
  aggregate:
    needs: [fanout, run]
    if: ${{ always() && needs.fanout.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Issue writes land in CONSUMER repos, so GITHUB_TOKEN cannot do them.
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
      MATRIX: ${{ needs.fanout.outputs.matrix }}
    steps:
      - name: Checkout ci (for the aggregator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every write below authenticates via CI_SCHEDULE, never via
          # checkout-persisted credentials.
          persist-credentials: false

      # Pinned deliberately. The runner's system python3 is 3.12, and the
      # stryker aggregate job failed for every repo for weeks because its script
      # used 3.14 syntax that 3.12 rejects at PARSE time, so no tracker issue had
      # ever been created. Author against 3.14, pin 3.14.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Update the tracker issue in each consumer
        run: |
          # NOT `set -e`: errexit is neutered inside the `if ! process_repo`
          # form, and an earlier sibling reported success while every repo failed.
          set -uo pipefail

          WEEK=$(date -u +'%Y-%m-%d %H:%M')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE='Benchmark regression tracker'

          ensure_label() {
            local name="$1" repo="$2" color="$3" desc="$4" err
            err=$(gh label create "$name" -R "$repo" -c "$color" -d "$desc" 2>&1) && return 0
            printf '%s' "$err" | grep -qi "already exists" && return 0
            echo "  label create failed for ${name}: ${err}" >&2
            return 1
          }

          process_repo() {
            local repo="$1" R="cplieger/$1" issue_num existing_args=() work

            # `issues` is only a warn-level governance setting, so a first-party
            # repo can legitimately have them off; that must not redden the run.
            # Fail OPEN on an unreadable setting - a loud failure beats a
            # silently dropped finding.
            local issues_enabled
            issues_enabled=$(gh repo view "$R" --json hasIssuesEnabled --jq '.hasIssuesEnabled') || {
              echo "  could not read the issue setting for ${repo}; trying anyway" >&2
              issues_enabled=true
            }
            if [ "$issues_enabled" != "true" ]; then
              echo "::notice::${repo} has issues disabled; skipped tracker update"
              return 0
            fi

            work=$(mktemp -d)
            if ! git clone --quiet --depth "$((12 + 1))" --branch benchmarks \
                 "https://x-access-token:${GH_TOKEN}@github.com/${R}.git" "$work/data"; then
              echo "  ${repo} has no benchmarks branch yet - nothing to track"
              rm -rf "$work"
              return 0
            fi

            issue_num=$(gh issue list -R "$R" --state open --label bench-tracker \
              --search "$TITLE in:title" --json number,title \
              --jq '.[] | select(.title == "'"$TITLE"'") | .number' 2>/dev/null | head -1) || true

            if [ -n "$issue_num" ]; then
              gh issue view "$issue_num" -R "$R" --json body --jq .body \
                > "/tmp/existing-${repo}.md" || { rm -rf "$work"; return 1; }
              existing_args=(--existing-body-file "/tmp/existing-${repo}.md")
            fi

            python3 scripts/bench-aggregate.py \
              --repo "$repo" --data-file "$work/data/data.js" \
              --week "$WEEK" --run-url "$RUN_URL" \
              --regression-marker-file "/tmp/regression-${repo}.txt" \
              --entries-marker-file "/tmp/entries-${repo}.txt" \
              "${existing_args[@]}" > "/tmp/body-${repo}.md" || { rm -rf "$work"; return 1; }
            rm -rf "$work"

            # No parseable series means no honest tracker body. Leave the issue
            # exactly as it was rather than publishing an empty one; the red run
            # leg is the signal for that.
            local ent
            ent=$(cat "/tmp/entries-${repo}.txt" 2>/dev/null || echo 0)
            if [ "$ent" -eq 0 ]; then
              echo "  no benchmarks in ${repo}'s newest point - leaving the issue untouched"
              return 0
            fi

            if [ -z "$issue_num" ]; then
              ensure_label bench-tracker "$R" 0e8a16 "Weekly benchmark tracker" || return 1
              ensure_label auto-generated "$R" ededed "Maintained by automation" || return 1
              ensure_label bench-regression "$R" b60205 "Benchmark regression" || return 1
              local url
              url=$(gh issue create -R "$R" --title "$TITLE" \
                --label bench-tracker,auto-generated \
                --body-file "/tmp/body-${repo}.md") || return 1
              issue_num="${url##*/}"
              echo "  created tracker issue #${issue_num}"
            else
              gh issue edit "$issue_num" -R "$R" \
                --body-file "/tmp/body-${repo}.md" >/dev/null || return 1
              echo "  updated tracker issue #${issue_num}"
            fi

            # Re-ensure: an issue can predate the label.
            ensure_label bench-regression "$R" b60205 "Benchmark regression" || return 1
            if [ "$(cat "/tmp/regression-${repo}.txt" 2>/dev/null)" = "true" ]; then
              gh issue edit "$issue_num" -R "$R" --add-label bench-regression >/dev/null || return 1
              echo "  flagged bench-regression"
            else
              # Removing an absent label is not a failure.
              gh issue edit "$issue_num" -R "$R" \
                --remove-label bench-regression >/dev/null 2>&1 || true
            fi
            return 0
          }

          repos=$(printf '%s' "$MATRIX" | jq -r '.[].repo' | sort -u)
          if [ -z "$repos" ]; then
            echo "::error::fanout produced no repo names; nothing to track"
            exit 1
          fi

          had_failure=0
          for repo in $repos; do
            echo "::group::$repo"
            if ! process_repo "$repo"; then
              echo "::warning::tracker update failed for ${repo} - continuing"
              had_failure=1
            fi
            echo "::endgroup::"
          done
          if [ "$had_failure" -ne 0 ]; then
            echo "::error::one or more tracker-issue updates failed"
            exit 1
          fi
