name: Performance measure

# One measure shard of perf-ci.yaml: the cells plan gave it, measured by the
# repository's tests/perf/run.sh against the build job's artifact. A reusable
# workflow so measure and remeasure run the same steps on new runners.

on:
  workflow_call:
    inputs:
      repository:
        description: The measured repository; empty is the caller's.
        type: string
        default: ''
      ref:
        description: The commit to check out, the one the build artifact was built from.
        type: string
        required: true
      name:
        description: The shard's name, which names its results artifact.
        type: string
        required: true
      cells:
        description: The shard's cells, a JSON list of {scenario, scale, engine, width, seconds} and optional windows, the only ones to measure.
        type: string
        required: true
      node:
        description: The npm package directory that pins Playwright (plan.json `node`).
        type: string
        required: true
      build-artifact:
        description: The artifact holding perf-build.tar, the build job's output.
        type: string
        required: true
      runner:
        description: >-
          The runner label for the job, such as a self-hosted pool's; empty runs it
          on ubuntu-26.04.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Move the ci source out of the workspace
        run: mv "$GITHUB_WORKSPACE/.cplieger-ci" "$RUNNER_TEMP/cplieger-ci"

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.build-artifact }}
          path: ${{ runner.temp }}/perf-artifact

      # The tarball keeps the binary's mode, which an artifact does not.
      - name: Unpack the build
        run: |
          mkdir -p "$RUNNER_TEMP/perf-build"
          tar -xf "$RUNNER_TEMP/perf-artifact/perf-build.tar" -C "$RUNNER_TEMP/perf-build"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ inputs.node }}/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install deps
        working-directory: ${{ inputs.node }}
        run: npm ci

      # Keyed as ts-ci.yaml's: the restored prefix, then playwright-deps.sh's .deb set hash.
      - name: Restore the browser libraries
        id: debs
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: playwright-debs-${{ inputs.runner || 'ubuntu-26.04' }}-chromium-webkit-${{ hashFiles(format('{0}/node_modules/playwright-core/package.json', inputs.node)) }}-
          restore-keys: playwright-debs-${{ inputs.runner || 'ubuntu-26.04' }}-chromium-webkit-${{ hashFiles(format('{0}/node_modules/playwright-core/package.json', inputs.node)) }}-

      - name: Install browsers
        id: browsers
        timeout-minutes: 15
        working-directory: ${{ inputs.node }}
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          PLAYWRIGHT_DEPS_CACHE: ${{ runner.temp }}/playwright-debs
          PLAYWRIGHT_DEPS_CACHE_KEY: ${{ steps.debs.outputs.cache-primary-key }}
        run: |
          bash "$CI_TOOLS/playwright-deps.sh" chromium webkit
          npx --no-install playwright install chromium webkit

      - name: Save the browser libraries
        if: ${{ steps.browsers.outputs.key != '' && steps.browsers.outputs.key != steps.debs.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: ${{ steps.browsers.outputs.key }}

      - name: Measure
        env:
          CELLS: ${{ inputs.cells }}
          PERF_BUILD: ${{ runner.temp }}/perf-build
          RUNNER_LABEL: ${{ inputs.runner || 'ubuntu-26.04' }}
          ARTIFACT: perf-results-${{ inputs.name }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/perf-results"
          mkdir -p "$out"
          printf '%s\n' "$CELLS" > "$RUNNER_TEMP/cells.json"
          tests/perf/run.sh "$RUNNER_TEMP/cells.json" "$out"
          if [ ! -s "$out/results.json" ]; then
            echo "::error::tests/perf/run.sh wrote no ${out}/results.json"
            exit 1
          fi
          # perf_gate.py gates only results whose runner the budgets name, so the
          # label the job ran on is stamped here rather than trusted from run.sh.
          cpu=$(sed -n '/^model name/{s/^model name[[:space:]]*:[[:space:]]*//p;q}' /proc/cpuinfo)
          python3 - "$out/results.json" "$RUNNER_LABEL" "$cpu" <<'EOF'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          doc = json.loads(path.read_text())
          doc['runner'], doc['cpu_model'] = sys.argv[2], sys.argv[3]
          path.write_text(json.dumps(doc) + '\n')
          EOF
          # The artifact holds a folder named after it, so a merged download lays
          # out one artifact as it does many.
          mkdir -p "$RUNNER_TEMP/perf-upload/$ARTIFACT"
          cp "$out/results.json" "$RUNNER_TEMP/perf-upload/$ARTIFACT/results.json"

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results-${{ inputs.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/perf-upload
          if-no-files-found: error
          retention-days: 7
