# Self-release: cut a vX.Y.Z tag so move-major-tag.yaml moves `vX`/`vX.Y` and
# Renovate bumps the SHA-pinned reusable workflows in consumer repos.
#
# The PATH GATE, not the commit type, decides a release: only a change to a
# reusable workflow or composite action cuts a tag, forcing a patch when
# git-cliff would skip a `ci:`/`chore:` edit. Files sync.yaml propagates must
# not tag, or every consumer gets a no-op digest PR. The gate is a directory
# include minus INTERNAL_WORKFLOWS, so a new reusable workflow fails safe.
name: Self-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Cut a tag even if the path gate finds no propagatable change (version still computed by cliff, patch-bumped if cliff declines)."
        type: boolean
        default: false

# Top-level read-only (least privilege). The tag push and
# GitHub Release use RELEASE_PAT, not GITHUB_TOKEN, because a tag pushed with
# GITHUB_TOKEN does NOT trigger move-major-tag.yaml (GitHub suppresses workflow
# runs from events created by the default token) and GITHUB_TOKEN cannot carry
# the `workflows` permission a workflow-touching ref push requires.
permissions:
  contents: read

# Serialize so two quick pushes can't race to compute/push the same tag.
concurrency:
  group: self-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify release token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::RELEASE_PAT secret is missing or empty. Set it to a fine-grained PAT scoped to cplieger/ci with Contents: write + Workflows: write (the tag commit touches .github/workflows/, and the push must trigger move-major-tag.yaml — neither is possible with GITHUB_TOKEN)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Read-only default token, and do NOT persist it: the untrusted
          # git-cliff binary downloaded below must never run with a write-capable
          # credential in git config. RELEASE_PAT is materialized only in the
          # push step's env (one-shot auth header), after the binary has run.
          persist-credentials: false

      # The reusable workflows and actions run scripts/ at the commit a
      # consumer pins, so those scripts are Channel 2: each `$CI_TOOLS/<file>`
      # a workflow runs, each `../../scripts/<file>` an action runs, and every
      # scripts/ file one of them names (shell), imports or loads by path.
      - name: List the scripts consumers run
        id: tools
        run: |
          set -euo pipefail
          seen=" "
          add_tool() {
            local m
            local -a refs
            case "$seen" in *" $1 "*) return 0 ;; esac
            seen="$seen$1 "
            case "$1" in
              *.py)
                mapfile -t refs < <(
                  awk '$1 == "import" || $1 == "from" { print $2 ".py" }' "scripts/$1"
                  { grep -oE "/ '[A-Za-z0-9_.-]+[.]py'" "scripts/$1" || true; } | tr -d "/' "
                )
                ;;
              *) mapfile -t refs < <(grep -oE '[A-Za-z0-9_-]+\.(sh|py)' "scripts/$1" | sort -u || true) ;;
            esac
            for m in "${refs[@]}"; do
              if [ -f "scripts/$m" ]; then add_tool "$m"; fi
            done
          }
          seeds=$(
            { grep -ohE '[$]CI_TOOLS/[A-Za-z0-9_.-]+' .github/workflows/*.y*ml || true; } | sed 's#^[$]CI_TOOLS/##'
            { grep -rohE '\.\./\.\./scripts/[A-Za-z0-9_.-]+' actions --include='*.yml' --include='*.sh' || true; } \
              | sed 's#^\.\./\.\./scripts/##'
          )
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "scripts/$f" ]; then
              echo "::error::a workflow or action runs scripts/$f, which does not exist"
              exit 1
            fi
            add_tool "$f"
          done < <(sort -u <<<"$seeds")
          if [ "$seen" = " " ]; then
            echo "::error::no workflow or action runs a script under scripts/"
            exit 1
          fi
          echo "Scripts consumers run:$seen"
          echo "scripts=$seen" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        env:
          # Version + tarball sha256 pinned as a pair; Renovate maintains
          # both via the custom.git-cliff datasource (GitHub release-asset
          # digest). Fail-closed — see the checkout comment above: this
          # binary is deliberately treated as untrusted, and the pin is what
          # freezes WHICH binary that is.
          # renovate: datasource=custom.git-cliff depName=orhun/git-cliff
          CLIFF_VERSION: v2.14.2
          CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          set -euo pipefail
          curl -fsSL --retry 7 --retry-max-time 150 --retry-all-errors -o "$RUNNER_TEMP/git-cliff.tgz" \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CLIFF_SHA256}  ${RUNNER_TEMP}/git-cliff.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/git-cliff.tgz" -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION#v}/git-cliff"
          git-cliff --version

      - name: Decide whether to cut a tag
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
          CLIFF_CONFIG: .github/cliff-ci.toml
          TOOL_SCRIPTS: ${{ steps.tools.outputs.scripts }}
        run: |
          set -euo pipefail

          # Latest FULL semver tag. The --match glob mirrors the dedicated
          # config's tag_pattern: it ignores the moving vX / vX.Y tags that
          # move-major-tag.yaml keeps co-located on the release commit.
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")"

          # A non-zero exit or empty output is a hard failure, never a silent
          # skip. --unreleased anchors cliff's base at the actual latest tag:
          # without it, a tag whose entire window is skip-typed (what the
          # force-patch fallback below mints for ci:/chore: fixes) vanishes
          # from cliff's post-filter release model, the base regresses, and
          # NEXT comes back BELOW LAST_TAG, failing the strictly-greater guard
          # on every later propagatable release.
          if ! NEXT="$(git cliff --unreleased --bumped-version --config "$CLIFF_CONFIG" 2>/tmp/cliff.err)"; then
            echo "::error::git cliff --bumped-version failed:"
            sed 's/^/  /' /tmp/cliff.err >&2 || true
            exit 1
          fi
          if [ -z "$NEXT" ]; then
            echo "::error::git cliff returned an empty version with no error"
            exit 1
          fi

          # Bootstrap: no prior release tag => release whatever cliff computed.
          if [ -z "$LAST_TAG" ]; then
            echo "No prior vX.Y.Z tag found; bootstrapping first release (${NEXT})."
            echo "cut=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Path gate: did any PROPAGATABLE (Channel 2) file change since the
          # last release? Channel 2 = the reusable workflows + composite actions
          # consumers reference by SHA. Channel 1 (templates, configs) reaches
          # consumers via sync.yaml independently and must NOT cut a tag. The gate
          # is the AUTHORITATIVE release decision for this repo (not the commit
          # type), so a skip-typed but propagatable change still propagates. ---
          PROPAGATABLE=false
          MATCHED=""
          if [ "${FORCE:-false}" = "true" ]; then
            PROPAGATABLE=true
            MATCHED="(workflow_dispatch force)"
            echo "Manual force=true; bypassing path gate."
          else
            # Internal-only workflows live under .github/workflows/ but are NOT
            # consumed by SHA from any consumer (they run inside the ci repo).
            # Editing them must NOT cut a tag. The gate is a directory-include
            # MINUS this list, so it fails SAFE: a NEW reusable workflow
            # auto-propagates, while a forgotten new internal one only costs one
            # harmless extra bump (noticed via the needless PRs, then added here).
            INTERNAL_WORKFLOWS="audit.yaml daily-security.yaml ghcr-retention.yaml move-major-tag.yaml notify-failure.yaml promote.yaml rebuild-stale.yaml release-maintenance.yaml self-ci.yaml self-codeql.yml self-release.yaml sync.yaml sync-hub-overviews.yaml trigger-renovate.yaml weekly-bench.yaml weekly-fuzz.yaml weekly-gremlins.yaml weekly-links.yaml weekly-stryker.yaml backfill-release-sbom-sigs.yaml"

            is_internal() {
              local base="$1"
              for w in $INTERNAL_WORKFLOWS; do
                [ "$base" = "$w" ] && return 0
              done
              return 1
            }

            # Renovate periodically rewrites this repo's OWN SHA self-pins
            # (`uses: cplieger/ci/...@<40-hex> # vN`) when the moving major tag
            # advances. Nine such pins exist: four under workflow-templates/
            # (Channel 1, propagated by sync.yaml and NOT matched by this gate's
            # globs) and five composite-action pins in consumed workflows (ci.yaml,
            # docker-release.yaml, ts-ci.yaml). Those edit a Channel-2 file yet
            # change no behaviour; cutting a tag for one advances vN,
            # which makes Renovate bump the self-pin again, an unbounded
            # tag -> sync -> digest loop across every consumer (~99% of all cplieger-repo
            # CI runs were this churn). So a propagatable file counts as changed
            # ONLY if it differs beyond its cplieger/ci self-pin digest: compare
            # the file at the last tag against HEAD with those SHAs normalised to
            # a placeholder. Fails SAFE: an unreadable revision (file added or
            # removed since the tag, or any git error) is treated as a real
            # change so a genuine release still propagates.
            has_real_change() {
              local f="$1" old new
              if ! old="$(git show "${LAST_TAG}:$f" 2>/dev/null)"; then return 0; fi
              if ! new="$(git show "HEAD:$f" 2>/dev/null)"; then return 0; fi
              old="$(printf '%s' "$old" | sed -E 's#(cplieger/ci/[^@[:space:]]+)@[0-9a-f]{7,40}#\1@PIN#g')"
              new="$(printf '%s' "$new" | sed -E 's#(cplieger/ci/[^@[:space:]]+)@[0-9a-f]{7,40}#\1@PIN#g')"
              [ "$old" != "$new" ]
            }

            CHANGED="$(git diff --name-only "${LAST_TAG}..HEAD")"
            echo "Changed files since ${LAST_TAG}:"
            echo "$CHANGED" | awk '{ print "  " $0 }'

            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                actions/*)
                  if has_real_change "$f"; then
                    PROPAGATABLE=true; MATCHED="$f"; break
                  fi
                  echo "  skip: $f changed only its cplieger/ci self-pin digest" ;;
                scripts/*)
                  case " $TOOL_SCRIPTS " in
                    *" ${f#scripts/} "*)
                      if has_real_change "$f"; then
                        PROPAGATABLE=true; MATCHED="$f"; break
                      fi
                      ;;
                  esac
                  ;;
                .github/workflows/*)
                  base="${f#.github/workflows/}"
                  if ! is_internal "$base"; then
                    if has_real_change "$f"; then
                      PROPAGATABLE=true; MATCHED="$f"; break
                    fi
                    echo "  skip: $f changed only its cplieger/ci self-pin digest"
                  fi
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          if [ "$PROPAGATABLE" != "true" ]; then
            echo "Only Channel-1 / internal / docs changes since ${LAST_TAG}; these reach consumers via sync.yaml (or not at all). No tag needed."
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Propagatable. If cliff declined to bump (all commits since the tag are
          # skip-typed, e.g. ci:/chore:), force a patch bump so the propagatable
          # change still reaches consumers — the path gate, not the commit type,
          # is authoritative here. (Strip any pre-release suffix defensively.)
          if [ "$NEXT" = "$LAST_TAG" ]; then
            base="${LAST_TAG#v}"
            IFS=. read -r MA MI PA <<< "$base"
            PA_NUM="${PA%%[!0-9]*}"
            NEXT="v${MA}.${MI}.$((PA_NUM + 1))"
            echo "cliff declined to bump (skip-typed commits) but ${MATCHED} is propagatable; forcing patch bump to ${NEXT}."
          else
            echo "Propagatable change (${MATCHED}); cliff bumped ${LAST_TAG} -> ${NEXT}."
          fi

          # Defensive: cliff bases off the same tag the gate diffs from, so a
          # non-forward version should be unreachable — but never move a tag
          # backward (move-major-tag would drag vX/vX.Y down with it).
          if [ "$NEXT" = "$LAST_TAG" ] || \
             [ "$(printf '%s\n%s\n' "$LAST_TAG" "$NEXT" | sort -V | tail -1)" != "$NEXT" ]; then
            echo "::error::Computed version ${NEXT} is not strictly greater than ${LAST_TAG}; refusing to cut."
            exit 1
          fi

          # A MAJOR bump cuts vN+1; consumers pinned to the old major's digest
          # do NOT auto-follow and stay frozen until manually repointed.
          if [ "${NEXT%%.*}" != "${LAST_TAG%%.*}" ]; then
            echo "::warning::${NEXT} is a MAJOR bump over ${LAST_TAG}. Consumers pinned to ${LAST_TAG%%.*} will NOT auto-update — repoint their '# v' pins manually."
          fi

          echo "cut=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: steps.gate.outputs.cut == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::notice::Tag ${VERSION} already exists; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          # Scope the write-capable PAT to just this push: set the auth header in
          # local git config (kept out of process args and the remote URL), push,
          # then remove it. Mirrors actions/checkout's own credential mechanism.
          AUTH="$(printf 'x-access-token:%s' "$RELEASE_PAT" | base64 | tr -d '\n')"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH}"
          trap 'git config --unset-all "http.https://github.com/.extraheader" || true' EXIT
          git push origin "refs/tags/${VERSION}"
          echo "Pushed ${VERSION}; move-major-tag.yaml will propagate vX / vX.Y."

      - name: Render release notes
        # Deliberately token-free: this step EXECUTES the downloaded
        # git-cliff binary, which must never run with a credential in its
        # environment (the same split as release.yaml's notes steps — and
        # doubly so here, where the credential is a write-capable PAT).
        # Runs after the tag push so --latest renders the new tag's window.
        if: steps.gate.outputs.cut == 'true'
        run: |
          set -euo pipefail
          # git-cliff was installed earlier; use the same CI-dedicated config.
          git cliff --latest --strip header --config .github/cliff-ci.toml > /tmp/RELEASE_NOTES.md || true
          if [ ! -s /tmp/RELEASE_NOTES.md ]; then
            echo "Automated release of reusable workflows + composite actions." > /tmp/RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        if: steps.gate.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Only a 404 means no release yet; a rate limit or an outage fails the
          # step rather than reading as a missing release.
          if err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" 2>&1 >/dev/null); then
            echo "::notice::Release ${VERSION} already exists; skipping."
            exit 0
          fi
          case "${err}" in
            *"(HTTP 404)"*) ;;
            *)
              echo "::error::could not read release ${VERSION}: ${err}"
              exit 1
              ;;
          esac
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file /tmp/RELEASE_NOTES.md

  # `needs:` must list every other job in this workflow. The push-to-main
  # trigger is a branch push, which notify-failure.yaml's track gate never
  # reaches (the merging agent watches the post-merge run); a workflow_dispatch
  # run gets the duration policy, so a short manual run files nothing.
  notify:
    needs: release
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
