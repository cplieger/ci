# Calibration of every public cplieger repository that carries
# tests/perf/plan.json, on dispatch only: perf-calibrate.yaml measures its
# default branch's `full` set ten times and opens the pull request that checks
# the signed calibration in, which also deletes the accepted slowdowns it
# absorbed. A full x10 takes about ten hours and 4,900 runner-minutes.
name: Weekly perf calibrate

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma/space-separated repo names to limit the run. Empty calibrates every enrolled repository."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-perf-calibrate
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.fanout.outputs.matrix }}
      unread: ${{ steps.fanout.outputs.unread }}
    steps:
      - name: Discover repositories carrying tests/perf/plan.json
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Injected via env (never inline ${{ }} in the body) so a crafted
          # dispatch input cannot expand into shell code.
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail

          # REST, not the GraphQL `gh repo list`. Public only: perf-calibrate.yaml
          # refuses a private repository.
          live=$(gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq '
            .[] | select(.archived == false and .fork == false and .visibility == "public") | .name
          ' | tr '\n' ' ')
          repos=${live% }
          if [ -z "$repos" ]; then
            echo "::error::the listing returned no public live repository - refusing to report a green run"
            exit 1
          fi

          if [ -n "${ONLY:-}" ]; then
            wanted=" $(echo "$ONLY" | tr ',' ' ') "
            filtered=""
            for r in $repos; do
              case "$wanted" in *" $r "*) filtered="$filtered $r" ;; esac
            done
            repos=${filtered# }
            echo "manual 'only' filter active -> ${repos:-<none matched>}"
          fi

          # weekly-perf.yaml's enrolment read: a tree-only clone answers ls-tree,
          # and a repository that cannot be read is named in `unread`.
          matrix='[]'
          unread=""
          for r in $repos; do
            rm -rf scan
            if ! timeout 120 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 \
              clone --quiet --depth 1 --filter=blob:none --no-checkout "https://github.com/cplieger/${r}.git" scan 2>/dev/null; then
              echo "::warning::clone failed or timed out for ${r}"
              unread="$unread $r"
              continue
            fi
            if ! sha=$(git -C scan rev-parse HEAD 2>/dev/null) \
              || ! found=$(git -C scan ls-tree --name-only "$sha" -- tests/perf/plan.json 2>/dev/null); then
              echo "::warning::cannot read the default branch of ${r}"
              unread="$unread $r"
              continue
            fi
            [ -n "$found" ] || continue
            echo "  include ${r}"
            matrix=$(printf '%s' "$matrix" | jq -c --arg r "$r" '. + [{repo: $r}]')
          done
          rm -rf scan

          {
            echo "matrix=${matrix}"
            echo "unread=${unread# }"
          } >> "$GITHUB_OUTPUT"
          echo "Total entries: $(printf '%s' "$matrix" | jq 'length')"

          if [ "$(printf '%s' "$matrix" | jq 'length')" -eq 0 ]; then
            if [ -n "${ONLY:-}" ]; then
              echo "::error::'only' named no readable repository carrying tests/perf/plan.json"
              exit 1
            fi
            echo "::notice::no public repository carries tests/perf/plan.json"
          fi

  unread:
    needs: fanout
    if: ${{ needs.fanout.outputs.unread != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail on an unread repository
        env:
          UNREAD: ${{ needs.fanout.outputs.unread }}
        run: |
          echo "::error::could not read ${UNREAD}, so a repository carrying tests/perf/plan.json may have gone uncalibrated"
          exit 1

  # One repository at a time: each calibration holds ten measure jobs, half the
  # account's 20-job cap. GitHub hands a called workflow's secret only to the
  # job that references it, perf-calibrate.yaml's check-in, which runs no
  # repository code.
  calibrate:
    needs: fanout
    if: ${{ needs.fanout.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/perf-calibrate.yaml
    with:
      repo: ${{ matrix.repo }}
    secrets:
      SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, unread, calibrate]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      scope: ${{ inputs.only }}
