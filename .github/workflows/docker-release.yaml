# Reusable Docker publish workflow, called only by release.yaml, which passes
# the channel, the version and whether a release is due. dev: build once on
# native amd64 and arm64 runners, push to GHCR as `:<dev-version>`, `:dev` and
# `:sha-<commit>`, sign, attest the SBOM, scan, create the dev git tag. stable:
# tag `:vX.Y.Z`, `:vX.Y`, `:vX`, `:latest` on a promotion commit's trailer
# digest (never a build), else on the dev digest promote-digest.sh picks, else
# on a source build; copy to Docker Hub with referrers, re-scan, GitHub Release.
# A range whose only release reason is a rebuild request builds its amd64 image
# unpushed first and publishes nothing when its packages equal the release it
# follows. Every vulnerability scan is advisory. Like release.yaml, it refuses,
# in both modes, a caller that is not a public, non-fork repository whose
# default branch is `dev`.
name: Docker Release

on:
  workflow_call:
    inputs:
      channel:
        description: "'dev' or 'stable', selected by the caller from the branch. Required."
        type: string
        required: true
      version:
        description: "Stable SemVer version computed by the caller (e.g. v1.2.3), on both channels. Required."
        type: string
        required: true
      dev-version:
        description: "The dev-channel tag for this build (e.g. v1.2.3-dev.4). Required on the dev channel."
        type: string
        default: ""
      exclude-re:
        description: >-
          The caller's joined exclusion regex (grep -E). The stable channel
          walks first-parent ancestors for a dev build to promote and accepts
          one only when no commit since changed a path
          scripts/path-significance.sh counts. Empty accepts an exact
          `sha-<commit>` hit only.
        type: string
        default: ""
      release-needed:
        description: "'true' when a new version is due (a dev tag on dev, a Release on stable)."
        type: string
        default: "false"
      go-modules:
        description: >-
          JSON array of nested Go module release-lane dirs discovered by the
          caller (release.yaml's detect job). Lane commits are excluded from
          this image release's notes — they belong to the lane's own
          <dir>/vX.Y.Z release. The default '[]' leaves rendering unchanged
          for single-module repos. Operational note: a lane Release still
          fires the repo's release webhook (GitHub hooks cannot filter by
          tag pattern), so a direct deploy hook on a repo with lanes must
          ignore a `release` payload whose tag_name contains `/`.
        type: string
        default: "[]"
      image-name:
        description: "Image name (without registry prefix). Defaults to repo name."
        type: string
        default: ${{ github.event.repository.name }}
      registries:
        description: "Comma-separated registries to push to (ghcr,dockerhub)."
        type: string
        default: "ghcr,dockerhub"
      platforms:
        description: "Platforms to build for (linux/amd64,linux/arm64)."
        type: string
        default: "linux/amd64,linux/arm64"
      dockerfile:
        description: "Path to the Dockerfile."
        type: string
        default: "./Dockerfile"
      syft-config:
        description: >-
          Path to a .syft.yaml config for anchore/sbom-action. Empty = none.
          Back-compat hook for repo-SPECIFIC syft needs only — the
          sbom-cataloger is enabled centrally for every scan via the
          SYFT_SELECT_CATALOGERS env below and needs no per-repo config.
        type: string
        default: ""
      release-kind-note:
        description: >-
          The sentence saying how this stable release was made (release.yaml's
          release_kind_note), handed to the notes renderer. Empty adds nothing.
        type: string
        default: ""
      subpackages:
        description: >-
          JSON array of the declared TS subpackage dirs (release.yaml's
          subpackages). A commit changing a subpackage's shipped manifest owes a
          release, so its image is built from it rather than inherited.
        type: string
        default: "[]"
      defer-receipt:
        description: >-
          Leave the completion receipt to the caller, which records
          it once the TS subpackages sharing this version are published too.
        type: boolean
        default: false
      repair-tag:
        description: >-
          Repair: the stable tag whose missing Release needs its
          assets. The call then builds and publishes nothing, and hands on the
          tag's attested SBOM, the dashboard at its commit, and their signatures.
        type: string
        default: ""
      security-shas:
        description: >-
          Space-separated merge commits of Renovate security pull requests
          (release.yaml's security_shas), marked in the notes.
        type: string
        default: ""
      image-licenses:
        description: >-
          SPDX expression for org.opencontainers.image.licenses, covering
          everything the image ships (the caller's policy step resolves it per
          repo). Empty keeps metadata-action's default, the repository's own
          spdx_id. Set here, at build time, because a build-time --label
          overrides a Dockerfile LABEL of the same key.
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.image-name }}
  REGISTRY: ghcr.io
  # Held one patch behind on purpose. setup-buildx-action resolves the version
  # from docker/actions-toolkit's .github/buildx-releases.json, which a bot
  # regenerates AFTER each buildx release, so a same-day pin fails every docker
  # release with "Cannot find Buildx release <v> in releases JSON". The
  # durable guard is a minimumReleaseAge for docker/buildx in the shared preset
  # (cplieger/.github default.json). ci.yaml's build-ability job passes NO
  # version input, so PRs stay green while releases fail.
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.38.1
  # A cosign MAJOR is a breaking change even when the bump looks routine
  # (v2→v3 flipped sign-blob defaults and broke release SBOM signing) — majors
  # are not auto-merged; read the changelog before approving.
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.1
  # Central SBOM cataloger policy: syft's sbom-cataloger is NOT in its default
  # image cataloger set, and a CycloneDX fragment embedded by a source-compiling
  # image (docker-nut-upsd) is inventoried only with it. The action spawns syft
  # with the step's process env; env outranks a `select-catalogers` key in a
  # repo .syft.yaml (anchore precedence: CLI > env > config file).
  SYFT_SELECT_CATALOGERS: "+sbom-cataloger"

# Top-level read-only (least privilege); each job below
# declares the write scopes it needs (build/finalize push, sign, attest, release).
permissions:
  contents: read

jobs:
  # A release (prepare) and a repair (repair-assets) both need this job, so no
  # mode reads, signs or publishes for a refused caller.
  caller:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse a caller outside the two-branch model
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          REPO_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          if [ "$DEFAULT_BRANCH" != dev ] || [ "$REPO_PRIVATE" = true ] || [ "$REPO_FORK" = true ]; then
            echo "::error::docker-release.yaml publishes only from a public, non-fork repository whose default branch is dev (this one: default branch ${DEFAULT_BRANCH:-<unknown>}, private ${REPO_PRIVATE:-<unknown>}, fork ${REPO_FORK:-<unknown>}). Make dev the default branch, or remove the release.yaml caller and publish from the repository's own workflow."
            exit 1
          fi
          case "${GITHUB_REF:-}" in
            refs/heads/dev | refs/heads/main) ;;
            *)
              echo "::error::docker-release.yaml publishes only from refs/heads/dev or refs/heads/main, not ${GITHUB_REF:-<unknown>}."
              exit 1
              ;;
          esac

  prepare:
    needs: caller
    if: ${{ inputs.repair-tag == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      meta-json: ${{ steps.meta.outputs.json }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.tags.outputs.version }}
      major: ${{ steps.tags.outputs.major }}
      minor: ${{ steps.tags.outputs.minor }}
      tag: ${{ steps.tags.outputs.tag }}
      publish: ${{ steps.tags.outputs.publish }}
      promote_digest: ${{ steps.promote.outputs.promote_digest }}
      promote_source: ${{ steps.promote.outputs.promote_source }}
      build-args: ${{ steps.buildargs.outputs.build-args }}
      rebuild_only: ${{ steps.rebuild.outputs.rebuild_only }}
      compare_tag: ${{ steps.rebuild.outputs.compare_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Derive version tags
        id: tags
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_INPUT: ${{ inputs.version }}
          DEV_VERSION: ${{ inputs.dev-version }}
          RELEASE_NEEDED: ${{ inputs.release-needed }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            dev | stable) ;;
            *)
              echo "::error::channel must be 'dev' or 'stable', got '${CHANNEL}'"
              exit 1
              ;;
          esac
          # Strip leading 'v' for arithmetic, then re-emit each tier with 'v' prefix.
          VERSION="${VERSION_INPUT#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          # `tag` is the one tag this run owns on its channel; `publish` is
          # whether any registry write happens at all. On dev nothing is
          # published unless a new dev version is due, so a rerun at an
          # already-tagged commit cannot mint a second dev version for it.
          if [ "$CHANNEL" = "dev" ]; then
            if [ -z "$DEV_VERSION" ]; then
              echo "::error::the dev channel needs the dev-version input"
              exit 1
            fi
            TAG="$DEV_VERSION"
          else
            TAG="v${VERSION}"
          fi
          PUBLISH=false
          [ "$RELEASE_NEEDED" != "true" ] || PUBLISH=true
          # metadata-action tag rules per channel; the highest priority one
          # becomes org.opencontainers.image.version, so the channel's own
          # version tag leads on both channels.
          if [ "$CHANNEL" = "dev" ]; then
            META_TAGS=$(printf '%s\n' \
              "type=raw,value=${TAG},priority=500" \
              "type=raw,value=dev,priority=400" \
              "type=sha,format=long,priority=100")
          else
            META_TAGS=$(printf '%s\n' \
              "type=raw,value=v${VERSION},priority=500" \
              "type=raw,value=latest,priority=400" \
              "type=raw,value=v${MAJOR},priority=300" \
              "type=raw,value=v${MINOR},priority=200" \
              "type=sha,format=long,priority=100")
          fi
          {
            echo "version=v${VERSION}"
            echo "major=v${MAJOR}"
            echo "minor=v${MINOR}"
            echo "tag=${TAG}"
            echo "publish=${PUBLISH}"
            echo "meta_tags<<EOF"
            echo "$META_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL} tag=${TAG} publish=${PUBLISH}"

      # An image app's root module keeps the plain repository path at every
      # major: nothing imports an app, so a /vN suffix only moves its internal
      # imports. Libraries take /vN, asserted by release.yaml's go job.
      # Checked before any registry write or tag, on both channels.
      - name: Verify root module path
        if: ${{ steps.tags.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          if [ ! -f go.mod ]; then
            echo "no root go.mod; not a Go app, nothing to check"
            exit 0
          fi
          modpath=$(awk '$1=="module"{print $2; exit}' go.mod)
          expected="github.com/${GITHUB_REPOSITORY}"
          case "$modpath" in
            "$expected")
              echo "ok: module path '$modpath' is the plain repository path"
              ;;
            '')
              echo "::error::no module directive found in go.mod"
              exit 1
              ;;
            "$expected"/v[0-9]*)
              echo "::error::go.mod module path '$modpath' must be '$expected': drop the /vN suffix from go.mod and rewrite internal imports; apps use the plain module path at every major."
              exit 1
              ;;
            *)
              echo "::error::go.mod module path '$modpath' must be '$expected'; a module path must name its own repository or Go tooling cannot fetch it. Fix the module directive and internal imports, then re-release."
              exit 1
              ;;
          esac

      - name: Compute build matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          # Map each platform to a native GitHub-hosted runner.
          # linux/arm* → ubuntu-24.04-arm; everything else → ubuntu-24.04.
          # Emit a JSON array consumed by the build job's strategy.matrix.
          matrix='[]'
          IFS=','
          for p in $PLATFORMS; do
            p=$(echo "$p" | xargs)
            case "$p" in
              linux/arm*) runner="ubuntu-24.04-arm" ;;
              *)          runner="ubuntu-24.04" ;;
            esac
            name="${p//\//-}"
            matrix=$(jq -c --arg p "$p" --arg r "$runner" --arg n "$name" \
              '. + [{platform: $p, runner: $r, name: $n}]' <<<"$matrix")
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

      # BuildKit restores a cached RUN layer verbatim, so a package layer keeps
      # shipping the packages current when it was FIRST built; PKG_REFRESH is
      # today's UTC date, so it rebuilds at most once a day. A Dockerfile opts
      # in by declaring the ARG in the stage that needs it: BuildKit puts a stage
      # ARG's value in the environment and cache key of every later RUN of that
      # stage, while a global ARG reaches FROM lines only. BUILD_VERSION is this
      # run's tag on its channel (vX.Y.Z-dev.N on dev), never a dev build's
      # future stable.
      - name: Resolve build args
        id: buildargs
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          set -euo pipefail
          declares() { grep -qE "^[[:space:]]*ARG[[:space:]]+$1([[:space:]=]|\$)" "$DOCKERFILE"; }
          args=()
          if declares PKG_REFRESH; then
            args+=("PKG_REFRESH=$(date -u +%Y-%m-%d)")
          fi
          if declares BUILD_VERSION; then
            args+=("BUILD_VERSION=${TAG}")
          fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "No opted-in ARG in ${DOCKERFILE}; passing no build-args."
          else
            printf 'Passing %s\n' "${args[@]}"
          fi
          {
            echo "build-args<<EOF"
            if [ "${#args[@]}" -gt 0 ]; then
              printf '%s\n' "${args[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The stable channel re-tags what the dev channel already built rather
      # than rebuild it; promote-digest.sh decides which build that is. GHCR is
      # read anonymously (the images are public), so no registry login happens
      # before anything is written. The rebuild scope step reads the same source
      # on both channels.
      - name: Check out the ci source
        if: ${{ steps.tags.outputs.publish == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # An image is reused only once its build signed and attested it.
      - name: Install Cosign
        if: ${{ inputs.channel == 'stable' && steps.tags.outputs.publish == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Resolve promoted digest
        id: promote
        if: ${{ inputs.channel == 'stable' && steps.tags.outputs.publish == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          EXCLUDE_RE: ${{ inputs.exclude-re }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/promote-digest.sh" "$GITHUB_SHA" > "$RUNNER_TEMP/promote.out"
          cat "$RUNNER_TEMP/promote.out" >> "$GITHUB_OUTPUT"
          DIGEST=$(sed -n 's/^promote_digest=//p' "$RUNNER_TEMP/promote.out")
          SOURCE=$(sed -n 's/^promote_source=//p' "$RUNNER_TEMP/promote.out")
          VIA=$(sed -n 's/^promote_via=//p' "$RUNNER_TEMP/promote.out")
          {
            echo "## Promotion"
            echo ""
            if [ "$VIA" = "trailer" ]; then
              echo "Promoting the dev build this promotion commit records (digest \`${DIGEST}\`, promoted commit \`${SOURCE}\`); nothing is rebuilt."
            elif [ -n "$DIGEST" ]; then
              echo "Promoting the image the dev channel built for \`${SOURCE}\` (digest \`${DIGEST}\`); nothing is rebuilt."
            else
              echo "No dev build could be reused for \`${GITHUB_SHA}\`; the image builds from source."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "promote_digest=${DIGEST:-<none>} source=${SOURCE}"

      - name: Scope a rebuild-only release
        id: rebuild
        if: ${{ steps.tags.outputs.publish == 'true' && steps.promote.outputs.promote_digest == '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
          GO_LANES_JSON: ${{ inputs.go-modules }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/rebuild-gate.sh" scope >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        if: ${{ steps.tags.outputs.publish == 'true' && steps.promote.outputs.promote_digest == '' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.meta_tags }}
          labels: |
            ${{ inputs.image-licenses && format('org.opencontainers.image.licenses={0}', inputs.image-licenses) || '' }}

  # The publish decision of a rebuild-only range (prepare's scope step). It
  # precedes every job that writes: build pushes by digest, so skip gates build,
  # finalize's PUBLISH and verify-publish. Its writes are build state only: the
  # GHA cache, which build's amd64 leg can reuse, and buildx's build record
  # artifact.
  rebuild-gate:
    needs: prepare
    if: ${{ needs.prepare.outputs.rebuild_only == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The signing window attested-sbom.sh reads walks tags and history.
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # The build context is the workspace root, so the ci source leaves it.
      - name: Move the ci source out of the build context
        run: |
          set -euo pipefail
          mv .cplieger-ci "$RUNNER_TEMP/cplieger-ci"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Build the candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          labels: ${{ needs.prepare.outputs.labels }}
          build-args: ${{ needs.prepare.outputs.build-args }}
          push: false
          load: true
          tags: rebuild-gate.invalid/candidate:latest
          provenance: false
          sbom: false
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64,ignore-error=true

      - name: Generate the candidate's SBOM
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker:rebuild-gate.invalid/candidate:latest
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-new.spdx.json
          upload-artifact: false
          upload-release-assets: false
          config: ${{ inputs.syft-config }}

      - name: Verify the compared release's attestation
        id: prev
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          COMPARE_TAG: ${{ needs.prepare.outputs.compare_tag }}
          EXCLUDE_RE: ${{ inputs.exclude-re }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
        run: |
          set -euo pipefail
          if ref=$(bash "$CI_TOOLS/release-sbom.sh" "$COMPARE_TAG" "$RUNNER_TEMP/sbom-attested.spdx.json"); then
            echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "unreadable=${ref}" >> "$GITHUB_OUTPUT"
          fi

      # Both sides are scans by this run's syft, so an attestation made by an
      # older syft or from another source never reads as a package change. The
      # attestation verified above only proves the digest is this repository's.
      - name: Scan the compared release's image
        if: ${{ steps.prev.outputs.ref != '' }}
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: registry:${{ steps.prev.outputs.ref }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-scanned.spdx.json
          upload-artifact: false
          upload-release-assets: false
          config: ${{ inputs.syft-config }}

      - name: Compare the package sets
        id: compare
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          PREV_REF: ${{ steps.prev.outputs.ref }}
          UNREADABLE: ${{ steps.prev.outputs.unreadable }}
          COMPARE_TAG: ${{ needs.prepare.outputs.compare_tag }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/rebuild-gate.sh" compare "$RUNNER_TEMP/sbom-new.spdx.json" "$RUNNER_TEMP/sbom-scanned.spdx.json"

  # Builds only when something is published, no dev digest is promoted in its
  # place, and the rebuild gate, when it ran, did not find the package set
  # unchanged. A failed or inconclusive gate leaves skip unset or false, so the
  # image publishes.
  build:
    needs: [prepare, rebuild-gate]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
        && needs.prepare.outputs.promote_digest == '' && needs.rebuild-gate.outputs.skip != 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # The build context is the workspace root, so the ci source leaves it.
      - name: Move the ci source out of the build context
        run: |
          set -euo pipefail
          mv .cplieger-ci "$RUNNER_TEMP/cplieger-ci"

      - name: Log in to GHCR
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          registry_login "$REGISTRY" "$REGISTRY_USERNAME"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          # One key=value per line for the args the Dockerfile opted in to,
          # empty otherwise. See prepare's "Resolve build args" step.
          build-args: ${{ needs.prepare.outputs.build-args }}
          # mode=max records the full build definition + base64 Dockerfile for
          # richer SLSA provenance on these public images (min omits the build
          # steps/source). mode=max embeds build-arg VALUES into the published
          # attestation — secret mounts (RUN --mount=type=secret) are never
          # included, so never pass secrets via build-args. The two this
          # workflow passes are PKG_REFRESH, a date, and BUILD_VERSION, the
          # release tag; both are as public as the image they describe.
          provenance: mode=max
          # push-by-digest writes the per-arch image under a digest-only ref, with
          # no human-readable tags at this stage. The finalize job assembles the
          # multi-arch manifest at the user-facing tags by referencing these
          # digests. The destination is GHCR ONLY: Docker Hub receives a copy of
          # the finished index at promotion, never a build.
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}
          # ignore-error: the per-arch image is already pushed by digest (see
          # `outputs` above) before the cache export runs, so a transient GHA
          # cache-backend 504 on export must not fail the release. The cache is
          # a build-speed optimization, never a release deliverable. Per-arch
          # scope keeps the amd64/arm64 builds from clobbering each other.
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

      - name: Export digest
        env:
          # Via env, never inline ${{ }} in the script body (template injection).
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # Filename = matrix.name (e.g. linux-amd64); content = the digest.
          echo "$DIGEST" > "/tmp/digests/${ARCH_NAME}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}
          path: /tmp/digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  # The meta ci.yaml docker job's two image tests, against the amd64 digest build
  # pushed and before finalize tags anything, so a red test leaves it untagged.
  # A rebuild-only range changes no file, so its pull request skipped that job,
  # and the base packages it refreshes are tested only here. A job of its own,
  # so the repository's test scripts run beside a read-only package token, never
  # build's write token and OIDC authority. amd64 only, like that job.
  image-test:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(needs.prepare.outputs.matrix, '"linux/amd64"') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # The tests run from the workspace root, so the ci source leaves it.
      - name: Move the ci source out of the workspace
        run: |
          set -euo pipefail
          mv .cplieger-ci "$RUNNER_TEMP/cplieger-ci"

      - name: Download the amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digests

      - name: Log in to GHCR
        env:
          CI_TOOLS: ${{ runner.temp }}/cplieger-ci/scripts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          registry_login "$REGISTRY" "$REGISTRY_USERNAME"

      - name: Resolve the image reference
        id: image
        run: |
          set -euo pipefail
          digest=$(cat "$RUNNER_TEMP/digests/linux-amd64")
          case "$digest" in
            sha256:*) ;;
            *)
              echo "::error::the amd64 digest artifact holds '${digest}', not a sha256 digest"
              exit 1
              ;;
          esac
          echo "ref=${REGISTRY}/${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Image smoke test
        if: ${{ hashFiles('tests/image-smoke.sh') != '' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          sh tests/image-smoke.sh "$IMAGE_REF"

      # Runs after a red harness so one run reports both verdicts.
      - name: Image test suite
        if: ${{ !cancelled() && steps.image.outcome == 'success' && hashFiles('tests/image-test.sh') != '' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if [ ! -x tests/image-test.sh ]; then
            echo "::error file=tests/image-test.sh::tests/image-test.sh is not executable. Commit it as mode 100755: git update-index --chmod=+x tests/image-test.sh"
            exit 1
          fi
          ./tests/image-test.sh "$IMAGE_REF"

  # Runs whether or not `build` did (a promotion has no build; a stable push
  # with nothing to publish still refreshes the Docker Hub description).
  finalize:
    needs: [prepare, rebuild-gate, build, image-test]
    # A run cancelled before build starts (while the gate builds, say) leaves build
    # skipped, not cancelled, so cancelled() names that cancel. A timed-out gate is
    # no run cancel, so its build still publishes through here. image-test is
    # skipped with no build or no amd64 leg, and by a cancel; only the cancel
    # holds a pushed build back untested.
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled' && (needs.build.result != 'skipped' || !cancelled()) && (needs.image-test.result == 'success' || (needs.image-test.result == 'skipped' && !cancelled())) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      PUBLISH: ${{ needs.prepare.outputs.publish == 'true' && needs.rebuild-gate.outputs.skip != 'true' }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PROMOTE_DIGEST: ${{ needs.prepare.outputs.promote_digest }}
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      dashboard-digest: ${{ steps.dashboard-oci.outputs.digest }}
      released: ${{ steps.release.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      # Refuse a BACKWARD publish: a rerun of an older run rejoins after its
      # successor released, `prepare` is not re-attempted, and every publish
      # step would push the channel's whole tag set from the older commit and
      # sign it at the released version (measured 2026-09-04, docker-renovate-
      # scheduler: a rerun republished v3.3.13 on both registries from the
      # parent commit before the end-of-job tag guard refused). Direction is
      # the test: equal, absent and forward proceed; backward, diverged and an
      # unanswerable compare are refused, and each has nothing left to publish.
      - name: Version ownership gate
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq .object.sha 2>/dev/null); then
            echo "::notice::${VERSION} is not tagged yet; publishing."
            exit 0
          fi
          if [ "$EXISTING" = "$GITHUB_SHA" ]; then
            echo "::notice::${VERSION} already names this commit; publishing."
            exit 0
          fi
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${EXISTING}" \
            --jq .status 2>/dev/null || echo "unknown")
          if [ "$STATUS" = "behind" ]; then
            echo "::notice::${VERSION} names ${EXISTING}, an ancestor of ${GITHUB_SHA}; publishing forward."
            exit 0
          fi
          MSG="refusing to publish ${VERSION}: its tag names ${EXISTING} and this run built ${GITHUB_SHA}"
          MSG="${MSG} (compare status: ${STATUS}). Publishing would overwrite the released image with an"
          MSG="${MSG} older build and sign it at that version. The commit at ${EXISTING} already carries"
          MSG="${MSG} this version, so a rerun has nothing to publish."
          echo "::error::${MSG}"
          exit 1

      - name: Download digests
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          registry_login "$REGISTRY" "$REGISTRY_USERNAME"

      - name: Install Cosign
        if: ${{ env.PUBLISH == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Before any stable write: a re-tagged digest is never signed or attested
      # again, so the build it promotes must have done both (release-state.sh).
      - name: Verify the promoted build's signature and SBOM
        if: ${{ env.PUBLISH == 'true' && env.PROMOTE_DIGEST != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          EXCLUDE_RE: ${{ inputs.exclude-re }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
          PROMOTE_SOURCE: ${{ needs.prepare.outputs.promote_source }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" provenance "${REGISTRY}/${IMAGE_NAME}@${PROMOTE_DIGEST}" "$PROMOTE_SOURCE"

      # A promotion's release SBOM is the one its build attested, never a fresh
      # scan, so the Release and the image list the same packages. The repair
      # job reads it through the same script, so both write the same bytes.
      - name: Read the promoted build's SBOM
        if: ${{ env.PUBLISH == 'true' && env.PROMOTE_DIGEST != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          EXCLUDE_RE: ${{ inputs.exclude-re }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
        run: |
          set -euo pipefail
          if ! why=$(bash "$CI_TOOLS/attested-sbom.sh" "${REGISTRY}/${IMAGE_NAME}@${PROMOTE_DIGEST}" "$GITHUB_SHA" sbom.spdx.json); then
            echo "::error::sbom.spdx.json is missing, because ${why}. A promotion publishes the SBOM its build attested, so nothing is published without it."
            exit 1
          fi

      # Build arm: assemble the multi-arch index at the channel tags from the
      # per-arch digests. Promote arm: `imagetools create` with a single
      # source is a carbon copy, so the stable tags point at the dev digest
      # unchanged and the assertion below is what proves it.
      - name: Publish channel tags on GHCR
        if: ${{ env.PUBLISH == 'true' }}
        id: manifest
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          MINOR: ${{ needs.prepare.outputs.minor }}
        run: |
          set -euo pipefail
          tag_args=()
          if [ -n "$PROMOTE_DIGEST" ]; then
            for tg in "$VERSION" "$MINOR" "$MAJOR" latest; do
              tag_args+=(-t "${REGISTRY}/${IMAGE_NAME}:${tg}")
            done
            src_args=("${REGISTRY}/${IMAGE_NAME}@${PROMOTE_DIGEST}")
            BUILT=false
          else
            while IFS= read -r tg; do
              [ -z "$tg" ] && continue
              tag_args+=(-t "$tg")
            done <<<"$TAGS"
            src_args=()
            for f in /tmp/digests/*; do
              src_args+=("${REGISTRY}/${IMAGE_NAME}@$(cat "$f")")
            done
            BUILT=true
          fi
          # --metadata-file captures the index digest deterministically:
          # { "containerimage.descriptor": { "digest": "sha256:..." }, ... }
          docker buildx imagetools create --metadata-file /tmp/manifest-meta.json "${tag_args[@]}" "${src_args[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' /tmp/manifest-meta.json)
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::Failed to extract manifest digest from imagetools metadata"
            cat /tmp/manifest-meta.json
            exit 1
          fi
          if [ -n "$PROMOTE_DIGEST" ] && [ "$digest" != "$PROMOTE_DIGEST" ]; then
            echo "::error::promotion changed the digest: dev build ${PROMOTE_DIGEST}, stable tags ${digest}; a promoted image must be byte-identical"
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "built=$BUILT"
          } >> "$GITHUB_OUTPUT"
          echo "Manifest digest: $digest (built=${BUILT})"

      - name: Render image-size badge JSON
        # Self-published size badge: sum the linux/amd64 compressed (download)
        # layer sizes of the published index and write a shields `endpoint`
        # JSON to the orphan `badges` branch (the publish-badge action
        # preserves siblings). Best-effort: a badge hiccup never fails a
        # release.
        id: sizebadge
        if: ${{ env.PUBLISH == 'true' }}
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          # imagetools reads the registry directly (no pull); buildx is already
          # logged in to GHCR. The repo path is IMAGE_REF minus its @digest.
          base="${IMAGE_REF%@*}"
          amd64=$(docker buildx imagetools inspect --raw "$IMAGE_REF" \
            | jq -r 'first(.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest) // empty')
          if [ -z "$amd64" ]; then
            echo "::warning::no linux/amd64 sub-manifest found; skipping size badge"
            exit 0
          fi
          bytes=$(docker buildx imagetools inspect --raw "${base}@${amd64}" \
            | jq '[.layers[].size] | add // 0')
          if [ -z "$bytes" ] || [ "$bytes" = "0" ] || [ "$bytes" = "null" ]; then
            echo "::warning::could not sum layer sizes; skipping size badge"
            exit 0
          fi
          mb=$(awk "BEGIN { printf \"%.1f\", ${bytes} / 1048576 }")
          # Single-line JSON (never a heredoc — GHA YAML dedent breaks heredoc
          # terminators). Neutral blue: a size is informational, not good/bad.
          printf 'json={"schemaVersion":1,"label":"image size","message":"%s MB","color":"blue"}\n' \
            "$mb" >> "$GITHUB_OUTPUT"
          echo "image-size badge: ${mb} MB"

      # Renovate bumps the SHA pin after each tag move.
      - name: Publish image-size badge
        if: ${{ steps.sizebadge.outputs.json != '' }}
        continue-on-error: true
        uses: cplieger/ci/actions/publish-badge@a00f6a5e8124eb98c625ac86083900dcadc22c00 # v3
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          filename: size.json
          json: ${{ steps.sizebadge.outputs.json }}

      # ADVISORY, and the only CVE layer; a promotion re-scans the dev digest
      # so a stable release carries a scan of its own date. A fixable HIGH in a
      # base image is answered by a base-digest bump or `PKG_REFRESH`, never by
      # failing this run. `scanners` is pinned explicitly: Trivy's image default
      # is [vuln,secret], and image-layer secret detection (a build ARG, a
      # gitignored COPY, the base image) is coverage gitleaks' git-tree scan
      # cannot provide, so a Trivy default change must not silently drop it.
      - name: Trivy scan published image
        if: ${{ env.PUBLISH == 'true' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          scanners: 'vuln,secret'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # Skipped when the scan wrote nothing (it never ran, or died first), so an
      # earlier failure is not followed by a missing-file error that reads as
      # a second one.
      - name: Upload Trivy SARIF
        if: ${{ always() && env.PUBLISH == 'true' && hashFiles('trivy-image.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image-build'

      - name: Generate SBOM (from image)
        if: ${{ env.PUBLISH == 'true' && steps.manifest.outputs.built == 'true' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          config: ${{ inputs.syft-config }}

      # A shipped-package-versions table in the job summary on every publish.
      # Informational and best-effort (a summary hiccup never fails a release).
      - name: Shipped package versions summary
        if: ${{ env.PUBLISH == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          SBOM=sbom.spdx.json
          {
            echo "## Shipped package versions"
            echo ""
            echo "| Package | Version |"
            echo "|---|---|"
            # Exclude the SPDX document root (the image itself; syft links it
            # via a DESCRIBES relationship), sort, dedupe. Capped at 400 rows
            # to keep the summary bounded for module-heavy Go images.
            jq -r '
              ( [ .documentDescribes // [] | .[] ]
                + [ .relationships[]?
                    | select(.relationshipType == "DESCRIBES"
                             and .spdxElementId == "SPDXRef-DOCUMENT")
                    | .relatedSpdxElement ] ) as $roots
              | [ .packages[]?
                  | select(.SPDXID as $id | ($roots | index($id)) == null)
                  | "| \(.name) | \(.versionInfo // "(none)") |" ]
              | sort | unique
              | if length > 400 then
                  .[0:400] + ["", "(+ \(length - 400) more; the full inventory ships in sbom.spdx.json as registry attestation and release asset)"]
                else . end
              | .[]' "$SBOM"
          } >> "$GITHUB_STEP_SUMMARY"

      # A promoted digest already carries the dev build's signature and
      # attestations (they are referrers of the digest, not of a tag), so only
      # a fresh build signs.
      - name: Sign GHCR manifest (recursive — covers per-arch images too)
        if: ${{ env.PUBLISH == 'true' && steps.manifest.outputs.built == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          retry cosign sign --yes --recursive "$IMAGE_REF"

      - name: Attest SBOM to GHCR
        # NOTE: cosign attest does not support --recursive (that's a sign-only
        # flag). The attestation is scoped to the manifest list digest;
        # verifiers resolve through the index to find the attestation.
        if: ${{ env.PUBLISH == 'true' && steps.manifest.outputs.built == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          retry cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "$IMAGE_REF"

      # ─── OpenVEX attestations (opt-in per repo) ────────────────────────────
      # Convention: a repo opts in by committing OpenVEX documents as
      # vex/*.openvex.json; each is attested with --type openvex (predicate
      # type https://openvex.dev/ns) using the same keyless/OIDC signing the
      # SBOM attestation above uses, and — like the SBOM — scoped to the
      # multi-arch manifest-list digest, never the per-arch digests (cosign
      # attest has no --recursive; verifiers resolve through the index). No
      # vex/ documents (the common case) = these steps skip.
      - name: Attest OpenVEX to GHCR
        if: ${{ env.PUBLISH == 'true' && steps.manifest.outputs.built == 'true' && hashFiles('vex/*.openvex.json') != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          for f in vex/*.openvex.json; do
            retry cosign attest --yes \
              --predicate "$f" \
              --type openvex \
              "$IMAGE_REF"
          done

      # Two hard-fail checks that the OpenVEX attestations landed: cosign
      # verify-attestation against this pipeline's keyless identity (a regexp,
      # because the @ref varies with the consumer's pinned SHA), then every
      # vulnerability id in the source vex/ documents must appear in the
      # downloaded predicates (both envelope shapes: the sigstore bundle cosign
      # v3 writes and the legacy DSSE envelope), so a dropped or truncated
      # statement fails loudly. GHCR only: Docker Hub receives a copy of the
      # same referrers at promotion.
      - name: Verify OpenVEX attestations on GHCR
        if: ${{ env.PUBLISH == 'true' && steps.manifest.outputs.built == 'true' && hashFiles('vex/*.openvex.json') != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          retry cosign verify-attestation --type openvex \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/cplieger/ci/\.github/workflows/docker-release\.yaml@' \
            "$IMAGE_REF" > /dev/null
          # OpenVEX statements carry the vulnerability as an object with a
          # `name` (spec >= v0.2.0) or a bare string (v0.0.1); handle both.
          extract_ids() {
            jq -r '.statements[]?.vulnerability
                   | if type == "object" then (.name // ."@id") else . end
                   | select(. != null)' "$@" | sort -u
          }
          extract_ids vex/*.openvex.json > /tmp/vex-want
          if [ ! -s /tmp/vex-want ]; then
            echo "::error::vex/ documents contain no vulnerability statements; refusing to pass an empty gate"
            exit 1
          fi
          # Redirect INSIDE a wrapper, not on the retry call: the outer `>`
          # truncates once, so a partial attempt's bytes would otherwise stay
          # in the file ahead of the next attempt's output.
          fetch_vex_attestations() {
            cosign download attestation \
              --predicate-type https://openvex.dev/ns \
              "$IMAGE_REF" > /tmp/vex-attestations.jsonl
          }
          retry fetch_vex_attestations
          : > /tmp/vex-predicates.json
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '%s' "$line" | jq -r '.dsseEnvelope.payload // .payload' \
              | base64 -d | jq '.predicate' >> /tmp/vex-predicates.json
          done < /tmp/vex-attestations.jsonl
          extract_ids /tmp/vex-predicates.json > /tmp/vex-got
          MISSING=$(comm -23 /tmp/vex-want /tmp/vex-got)
          if [ -n "$MISSING" ]; then
            echo "::error::uploaded OpenVEX attestations are missing vulnerability ids: $(echo "$MISSING" | tr '\n' ' ')"
            exit 1
          fi
          echo "verified OpenVEX attestations cover: $(tr '\n' ' ' < /tmp/vex-want)"

      - name: Install oras
        if: >-
          ${{ env.PUBLISH == 'true'
            && (hashFiles('grafana-dashboard.json') != ''
                || (inputs.channel == 'stable' && contains(inputs.registries, 'dockerhub'))) }}
        run: |
          set -euo pipefail
          # Version + tarball sha256 pinned as a pair; sha256sum -c refuses a tarball
          # that does not match. Move both literals together: no manager bumps the
          # sha alone.
          # renovate: datasource=custom.oras depName=oras-project/oras
          ORAS_VERSION=v1.3.4
          ORAS_SHA256=f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 7 --retry-max-time 150 --retry-all-errors \
            -o "$RUNNER_TEMP/oras.tgz" \
            "https://github.com/oras-project/oras/releases/download/${ORAS_VERSION}/oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  ${RUNNER_TEMP}/oras.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tgz" -C /usr/local/bin oras
          oras version

      - name: Log in to Docker Hub
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' && contains(inputs.registries, 'dockerhub') }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          registry_login docker.io "$REGISTRY_USERNAME"

      - name: Ensure Docker Hub repository exists
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' && contains(inputs.registries, 'dockerhub') }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          # Docker Hub does not create a repository for every push path: the
          # first-ever `imagetools create` to a brand-new repo failed with HTTP
          # 400 ("unexpected status from PUT ... blobs/uploads") where `docker
          # push` would have created it. Pre-create it (public, idempotent) so
          # the first copy succeeds.
          namespace="${IMAGE_NAME%%/*}"
          name="${IMAGE_NAME#*/}"
          hub_jwt() {
            curl -fsS --retry 3 -H 'Content-Type: application/json' \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              https://hub.docker.com/v2/users/login/ | jq -er '.token | strings | select(length > 0)' >"$RUNNER_TEMP/hub-jwt"
          }
          if ! retry hub_jwt; then
            echo "::error::Docker Hub login failed during repository pre-create"; exit 1
          fi
          jwt=$(cat "$RUNNER_TEMP/hub-jwt")
          create_repo() {
            curl -sS -o /tmp/dhrepo.json -w '%{http_code}' -X POST \
              -H "Authorization: JWT ${jwt}" -H 'Content-Type: application/json' \
              -d "{\"namespace\":\"${namespace}\",\"name\":\"${name}\",\"is_private\":false}" \
              https://hub.docker.com/v2/repositories/ >"$RUNNER_TEMP/hub-create-code"
          }
          retry create_repo
          code=$(cat "$RUNNER_TEMP/hub-create-code")
          case "$code" in
            201) echo "Created docker.io/${namespace}/${name}" ;;
            400|409) echo "docker.io/${namespace}/${name} already exists (HTTP ${code})" ;;
            *) echo "::warning::Unexpected HTTP ${code} for docker.io/${namespace}/${name}"; cat /tmp/dhrepo.json 2>/dev/null || true ;;
          esac

      # Docker Hub gets the finished GHCR index by digest-preserving copy, with
      # its signatures and attestations as referrers (`oras copy --recursive`;
      # `cosign copy` is deprecated at the pinned cosign and does not carry
      # v3 bundle referrers). Nothing is ever built or signed against Docker
      # Hub, so its digest equals GHCR's by construction.
      - name: Copy image to Docker Hub
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' && contains(inputs.registries, 'dockerhub') }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          MINOR: ${{ needs.prepare.outputs.minor }}
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          retry oras copy --recursive \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}" "docker.io/${IMAGE_NAME}:${VERSION}"
          retry oras tag "docker.io/${IMAGE_NAME}:${VERSION}" "$MINOR" "$MAJOR" latest
          echo "docker.io/${IMAGE_NAME}: ${VERSION}, ${MINOR}, ${MAJOR}, latest"

      - name: Publish dashboard OCI artifact
        id: dashboard-oci
        if: ${{ env.PUBLISH == 'true' && hashFiles('grafana-dashboard.json') != '' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          # Via env, never inline ${{ }} in the script body (template injection).
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          DASHBOARD_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"
          # Consumers re-import by identity: a classic dashboard's uid, a schema
          # v2 resource's metadata.name. A file with neither is not published.
          format=$(jq -r '
            if type != "object" then "none"
            elif (has("apiVersion") | not) and (.uid | type) == "string" and (.uid | length) > 0 then "v1"
            elif (keys == ["apiVersion", "kind", "metadata", "spec"])
              and .apiVersion == "dashboard.grafana.app/v2" and .kind == "Dashboard"
              and (.metadata | type) == "object" and (.metadata | keys) == ["name"]
              and (.metadata.name | type) == "string" and (.metadata.name | length) > 0
              and (.spec | type) == "object" then "v2"
            else "none" end' grafana-dashboard.json) || format=none
          if [ "$format" = none ]; then
            msg="grafana-dashboard.json is neither a classic dashboard (a string uid, no apiVersion)"
            msg="$msg nor a schema v2 resource (exactly apiVersion dashboard.grafana.app/v2, kind Dashboard,"
            msg="$msg a metadata holding only a name, and a spec object)"
            echo "::error file=grafana-dashboard.json::$msg"
            exit 1
          fi
          artifact_type="application/vnd.grafana.dashboard.${format}+json"
          # oras-go stamps org.opencontainers.image.created=now unless the caller sets
          # it, so without a fixed value every push (a rerun included) mints a
          # new manifest digest and moves both tags off the signed one. The commit
          # time makes the manifest a pure function of its inputs.
          created=$(git show -s --format=%cI "$GITHUB_SHA")
          # dev: the dev version only; stable: the version and its major.
          if [ "$CHANNEL" = "dev" ]; then
            REFS="${DASHBOARD_REF}:${TAG}"
            SHOWN="\`${DASHBOARD_REF}:${TAG}\`"
          else
            REFS="${DASHBOARD_REF}:${VERSION},${MAJOR}"
            SHOWN="\`${DASHBOARD_REF}:${VERSION}\` (also \`:${MAJOR}\`)"
          fi
          oras push --export-manifest "$RUNNER_TEMP/dashboard-manifest.json" \
            --artifact-type "$artifact_type" \
            --annotation "org.opencontainers.image.created=${created}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${TAG}" \
            "$REFS" \
            grafana-dashboard.json:application/json
          digest="sha256:$(sha256sum "$RUNNER_TEMP/dashboard-manifest.json" | cut -d' ' -f1)"
          retry cosign sign --yes "${DASHBOARD_REF}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Grafana dashboard"
            echo ""
            echo "OCI artifact ${SHOWN}, digest \`${digest}\`, cosign-signed (keyless)."
            echo ""
            echo "Artifact type \`${artifact_type}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The System packages part diffs this release's SBOM against the one
      # attested on the previous stable release's image, read only once its
      # signature verifies as this repository's run of this workflow. Best-
      # effort: a previous SBOM that cannot be read or verified leaves the part
      # out.
      - name: Fetch the previous release's SBOM
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          EXCLUDE_RE: ${{ inputs.exclude-re }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PREV=$(bash "$CI_TOOLS/render-notes.sh" --site docker --version "$VERSION" --print-previous)
          if [ -z "$PREV" ]; then
            echo "::notice::No earlier stable release exists, so the notes carry no system-package diff."
            exit 0
          fi
          if ! ref=$(bash "$CI_TOOLS/release-sbom.sh" "$PREV" "$RUNNER_TEMP/sbom-prev.spdx.json"); then
            echo "::warning::The notes carry no system-package diff, because ${ref}."
            exit 0
          fi
          echo "previous SBOM: ${PREV} (${ref})"

      - name: Generate release notes
        # Stable only (a dev build has no Release). Deliberately token-free:
        # this step downloads and EXECUTES git-cliff, and an untrusted binary
        # must never run with a credential in its environment; the gh/tagging
        # calls live in the Create release step, which runs no downloaded code.
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ inputs.version }}
          GO_LANES_JSON: ${{ inputs.go-modules }}
          KIND_NOTE: ${{ inputs.release-kind-note }}
          SECURITY_SHAS: ${{ inputs.security-shas }}
        run: |
          set -euo pipefail
          # Version + tarball sha256 pinned as a pair; Renovate maintains both
          # via the custom.git-cliff datasource (GitHub release-asset digest).
          # Fail-closed: a tarball that does not match the committed pin never
          # installs.
          # renovate: datasource=custom.git-cliff depName=orhun/git-cliff
          CLIFF_VERSION=v2.14.2
          CLIFF_SHA256=24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
          curl -fsSL --retry 7 --retry-max-time 150 --retry-all-errors -o "$RUNNER_TEMP/git-cliff.tgz" \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CLIFF_SHA256}  ${RUNNER_TEMP}/git-cliff.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/git-cliff.tgz" -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION#v}/git-cliff"
          tr ' ' '\n' <<<"$SECURITY_SHAS" > "$RUNNER_TEMP/security-shas"
          args=(--site docker --version "$VERSION" --go-lanes "$GO_LANES_JSON" --kind-note "$KIND_NOTE"
            --repo "$GITHUB_REPOSITORY" --release-commit "$GITHUB_SHA" --security-shas "$RUNNER_TEMP/security-shas"
            --out RELEASE_NOTES.md)
          if [ -s "$RUNNER_TEMP/sbom-prev.spdx.json" ]; then
            args+=(--sbom-prev "$RUNNER_TEMP/sbom-prev.spdx.json" --sbom-new sbom.spdx.json)
          fi
          bash "$CI_TOOLS/render-notes.sh" "${args[@]}"

      # A cosign bundle beside the SBOM and each tree file lets a consumer
      # verify it without pulling the image, whose signatures live in the registry.
      - name: Stage and sign the release assets
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$dir"
          cp sbom.spdx.json "$dir/"
          bash "$CI_TOOLS/release-assets.sh" stage "$GITHUB_SHA" "$dir"
          bash "$CI_TOOLS/release-assets.sh" sign "$VERSION" "$dir"

      # The tag ref is created via the git data API pinned to $GITHUB_SHA
      # (`gh release create --target` 403s once the branch moved on); a tag at
      # the same SHA is reused, one elsewhere refuses. Handoff: after a push
      # carrying workflow-file changes lands past this commit, the integration token
      # loses ref-create entirely, so when tag-create fails AND the branch head
      # has moved on, the run exits 0 and the head run's anchor range
      # re-releases this content. Failing while still at head stays hard.
      - name: Prepare tag-create helper
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/create-tag.sh" <<'SH'
          . "$CI_TOOLS/retry.sh"
          . "$CI_TOOLS/tag-ref.sh"
          CREATED_TAG=""
          create_tag() { # <tag> -> 0 created (CREATED_TAG set) or reused, 2 handed off, 1 refused
            local rc=0
            tag_ref "$GITHUB_REPOSITORY" "$1" "$GITHUB_SHA" || rc=$?
            if [ "$rc" -eq 0 ]; then
              [ "$TAG_CREATED" = false ] || CREATED_TAG="$1"
              return 0
            fi
            [ "$rc" -eq 2 ] || return 1
            BRANCH_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha 2>/dev/null || echo "")
            if [ -n "$BRANCH_HEAD" ] && [ "$BRANCH_HEAD" != "$GITHUB_SHA" ]; then
              MSG="tag $1 not created: ${GITHUB_REF_NAME} advanced past ${GITHUB_SHA} (now ${BRANCH_HEAD})"
              MSG="${MSG} and the superseded run lost ref-create; handing off, the head run re-releases this content."
              echo "::warning::${MSG}"
              return 2
            fi
            MSG="tag create for $1 failed while this run is still ${GITHUB_REF_NAME}'s head"
            MSG="${MSG}; not the supersession race, investigate token permissions/API state."
            echo "::error::${MSG}"
            return 1
          }
          SH

      - name: Create dev tag
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/create-tag.sh"
          rc=0
          create_tag "$TAG" || rc=$?
          [ "$rc" -eq 2 ] && exit 0
          [ "$rc" -eq 0 ] || exit "$rc"
          # The audit reads this receipt: a dev tag has no Release to show
          # that the pipeline, not a hand, created it. A tag without it would
          # make a rerun compute release=false, so the tag this attempt
          # created is deleted with the failed POST and a rerun makes both.
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context="release/tag/${TAG}" \
            -f description="created by the dev release run" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
            if [ "$CREATED_TAG" = "$TAG" ]; then
              echo "::error::receipt for ${TAG} not recorded; deleting the tag this run created so a rerun recreates both"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null
            fi
            exit 1
          fi

      - name: Create release
        id: release
        if: ${{ env.PUBLISH == 'true' && inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-assets"
          names=$(bash "$CI_TOOLS/release-assets.sh" names "$VERSION" "$dir")
          mapfile -t assets <<<"$names"
          . "$RUNNER_TEMP/create-tag.sh"
          rc=0
          create_tag "$VERSION" || rc=$?
          [ "$rc" -eq 2 ] && exit 0
          [ "$rc" -eq 0 ] || exit "$rc"
          # Release presence, status-aware: only a definitive HTTP 404
          # proceeds to create; any other API failure fails the step
          # (retryable) instead of risking a duplicate-create. The by-tag
          # endpoint returns only PUBLISHED releases, so a draft orphaned by
          # a wedged asset upload reads as absent; cleanup-drafts deletes it.
          if immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq .immutable 2>/tmp/relerr); then
            echo "::notice::Release ${VERSION} already exists; skipping creation."
            {
              echo "reused=true"
              echo "immutable=${immutable}"
              echo "published=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q 'HTTP 404' /tmp/relerr; then
            echo "::error::could not determine whether Release ${VERSION} exists:"
            cat /tmp/relerr
            exit 1
          fi
          bash "$CI_TOOLS/release-assets.sh" cleanup-drafts "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]/#/$dir/}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify the release assets
        if: ${{ env.PUBLISH == 'true' && steps.release.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ inputs.version }}
          REUSED: ${{ steps.release.outputs.reused }}
          IMMUTABLE: ${{ steps.release.outputs.immutable }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-assets"
          names=$(bash "$CI_TOOLS/release-assets.sh" names "$VERSION" "$dir")
          mapfile -t assets <<<"$names"
          # A rerun that found its Release already present moves the image tags
          # to the fresh build; the assets follow for the same reason. An
          # immutable Release refuses uploads, so its assets stay.
          if [ "$REUSED" = "true" ] && [ "$IMMUTABLE" = "true" ]; then
            echo "::notice::Release ${VERSION} is immutable, so its assets stay as first published."
          elif [ "$REUSED" = "true" ]; then
            gh release upload --clobber "$VERSION" "${assets[@]/#/$dir/}"
          fi
          bash "$CI_TOOLS/release-assets.sh" check "$VERSION" "${assets[@]}"
          list=""
          for f in "${assets[@]}"; do list+="${list:+, }\`${f}\`"; done
          printf '\nRelease assets: %s.\n' "$list" >> "$GITHUB_STEP_SUMMARY"

      # The two Docker Hub description steps run on every stable-channel run,
      # published or not, so a docs-only promotion still refreshes the page.
      # Docker Hub caps a full description at 25,000 bytes and the publish step
      # below truncates anything longer, which cut the end of the document. So
      # the Hub gets a short generated overview (summary, pull, compose, links)
      # instead of the whole README, and the README carries no byte budget.
      # Bounded by construction: its two variable inputs are the README's marked
      # summary region and compose.yaml, neither of which grows with the README.
      - name: Render Docker Hub overview
        id: hub-overview
        if: ${{ inputs.channel == 'stable' && contains(inputs.registries, 'dockerhub') }}
        # Non-blocking, matching the push step below: syncing Hub docs has never
        # gated a release, and this step runs AFTER the images are published, so
        # failing the job here would strand a release over a documentation page.
        # The renderer's own failures are already caught inside the action (empty
        # `path` output); this covers the action itself failing to resolve.
        continue-on-error: true
        uses: cplieger/ci/actions/render-hub-overview@a00f6a5e8124eb98c625ac86083900dcadc22c00 # v3
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          ref: ${{ github.ref_name }}
          output: ${{ runner.temp }}/hub-overview.md

      - name: Push README to Docker Hub
        # Gated on the render producing a file: a README with no summary markers
        # fails the render closed, and skipping the push leaves the previous Hub
        # page in place rather than replacing it with a broken one.
        if: ${{ inputs.channel == 'stable' && contains(inputs.registries, 'dockerhub') && steps.hub-overview.outputs.path != '' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          readme-filepath: ${{ steps.hub-overview.outputs.path }}
          # The GitHub About line. The action omits the field when this is
          # empty and truncates it to Hub's 100-byte limit with a warning.
          short-description: ${{ github.event.repository.description }}
          # Off deliberately: the renderer already emits absolute GitHub URLs,
          # and this option would resolve each anchor against the generated file
          # as though it were README.md, which is the wrong target.
          enable-url-completion: false

  # ─── Verify every registry written serves this run's manifest at its tag ─
  # A green finalize is not proof the artifact is fetchable: the 2026-09-04
  # rerun republished two registries and went red only at the Release step.
  # The channel tag must exist and carry this run's index digest
  # (content-addressed, so identical on both registries). GHCR on both
  # channels; Docker Hub on stable only, which is the only channel that
  # writes it.
  verify-publish:
    needs: [prepare, rebuild-gate, finalize]
    if: >-
      ${{ always() && needs.prepare.outputs.publish == 'true' && needs.rebuild-gate.outputs.skip != 'true'
        && needs.finalize.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # The ci source checkout only; every registry read is anonymous.
    permissions:
      contents: read
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.tag }}
      DIGEST: ${{ needs.finalize.outputs.digest }}
      REGISTRIES: ${{ inputs.registries }}
      DASHBOARD_DIGEST: ${{ needs.finalize.outputs.dashboard-digest }}
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Verify published image
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          . "$CI_TOOLS/retry.sh"

          # Both registries are read through the distribution API with an
          # anonymous pull token: every image here is public. Docker Hub's
          # web API (hub.docker.com/v2/repositories) is an index that lagged
          # the registry by over an hour on 2026-09-14 and failed five
          # releases whose tags were already pullable, so it is not consulted.
          pull_token() { # <name> <token url>
            curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors \
              -o "$RUNNER_TEMP/$1-token.json" "$2"
            jq -r .token "$RUNNER_TEMP/$1-token.json"
          }
          ghcr_token=$(pull_token ghcr "https://${REGISTRY}/token?scope=repository:${IMAGE_NAME}:pull")
          hub_token=
          if [[ "$CHANNEL" == stable && "$REGISTRIES" == *dockerhub* ]]; then
            hub_token=$(pull_token hub "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE_NAME}:pull")
          fi

          # digest_of and serves are called through await_registry, which the
          # linter cannot follow.
          # shellcheck disable=SC2329
          digest_of() { # <registry host> <bearer token> <repository> <accept>
            curl -fsSI --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $2" -H "Accept: $4" \
              "https://$1/v2/$3/manifests/${VERSION}" |
              tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          }
          served="$RUNNER_TEMP/served-digest"
          # shellcheck disable=SC2329
          serves() { # <want, empty for any> <digest_of args...>; the digest read lands in $served
            digest_of "${@:2}" >"$served" 2>/dev/null || true
            [ -s "$served" ] && { [ -z "$1" ] || [ "$(cat "$served")" = "$1" ]; }
          }
          verify() { # <label> <want, empty for any> <digest_of args...>
            local label=$1 want=$2 got
            shift 2
            if await_registry "$label" serves "$want" "$@"; then
              echo "ok: ${label} -> $(cat "$served")"
              return 0
            fi
            got=$(cat "$served")
            echo "::error::${label}: expected ${want:-any digest}, registry answered '${got:-nothing}'"
            return 1
          }

          INDEX='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          rc=0
          verify "${REGISTRY}/${IMAGE_NAME}:${VERSION}" "$DIGEST" "$REGISTRY" "$ghcr_token" "$IMAGE_NAME" "$INDEX" || rc=1
          if [ -n "$hub_token" ]; then
            verify "docker.io/${IMAGE_NAME}:${VERSION}" "$DIGEST" registry-1.docker.io "$hub_token" "$IMAGE_NAME" "$INDEX" || rc=1
          fi
          # A single OCI image manifest, so its own Accept, and never the
          # any-digest arm: an empty dashboard digest means nothing was pushed.
          if [ -n "$DASHBOARD_DIGEST" ]; then
            dash_token=$(pull_token dash "https://${REGISTRY}/token?scope=repository:${IMAGE_NAME}/dashboard:pull")
            verify "${REGISTRY}/${IMAGE_NAME}/dashboard:${VERSION}" "$DASHBOARD_DIGEST" \
              "$REGISTRY" "$dash_token" "${IMAGE_NAME}/dashboard" application/vnd.oci.image.manifest.v1+json || rc=1
          fi
          exit "$rc"

  # ─── The assets of a repaired Release ─────────────────────────────────────
  # release.yaml's repair publishes the Release; the signatures are made here
  # because consumers verify them against this workflow's identity. The
  # SBOM is the one attested to the published image, not a regeneration.
  repair-assets:
    needs: caller
    if: ${{ inputs.repair-tag != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Check the Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          TAG: ${{ inputs.repair-tag }}
        run: |
          set -euo pipefail
          state=$(bash "$CI_TOOLS/release-exists.sh" "$TAG")
          echo "missing=$([ "$state" = absent ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          bash "$CI_TOOLS/release-state.sh" handoff-name repair-assets "$TAG" | sed 's/^/artifact=/' >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: ${{ steps.release.outputs.missing == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the release assets
        if: ${{ steps.release.outputs.missing == 'true' }}
        env:
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          TAG: ${{ inputs.repair-tag }}
          EXCLUDE_RE: ${{ inputs.exclude-re }}
          SUBPACKAGES_JSON: ${{ inputs.subpackages }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          if ! digest=$(IMAGE="$IMAGE_NAME" bash "$CI_TOOLS/release-state.sh" release-digest "$TAG"); then
            echo "::error::sbom.spdx.json is missing, because the image digest that ${TAG} published is unknown. ${TAG} is not published without it."
            exit 1
          fi
          if ! why=$(bash "$CI_TOOLS/attested-sbom.sh" "${REGISTRY}/${IMAGE_NAME}@${digest}" "$TAG" "$out/sbom.spdx.json"); then
            echo "::error::sbom.spdx.json is missing, because ${why}. ${TAG} is not published without it."
            exit 1
          fi
          bash "$CI_TOOLS/release-assets.sh" stage "$TAG" "$out"
          bash "$CI_TOOLS/release-assets.sh" sign "$TAG" "$out"

      - name: Hand the assets on
        if: ${{ steps.release.outputs.missing == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/assets/
          retention-days: 1
          if-no-files-found: error

  # ─── The image lane's completion receipt ──────────────────────────────────
  # Complete once its Release exists and verify-publish read every registry
  # back; release.yaml's next run repairs any stable tag that lacks this
  # receipt before publishing anything newer.
  receipt:
    needs: [prepare, finalize, verify-publish]
    if: |
      always() && needs.verify-publish.result == 'success' && !inputs.defer-receipt
      && inputs.channel == 'stable' && needs.finalize.outputs.released == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Record the completion receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          bash "$CI_TOOLS/release-state.sh" receipt "$VERSION" "$GITHUB_SHA"
