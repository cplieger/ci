name: Shell CI

# Reusable shell/Docker CI. Called by the meta ci.yaml's `shell` job for every
# repo with a Dockerfile (the single home of hadolint — go-ci deliberately does
# not duplicate it); consumers pin the meta workflow via `@<sha> # v2`.

on:
  workflow_call:
    inputs:
      shellcheck-paths:
        description: >-
          Shell files to lint. "auto" (default) discovers every *.sh in the repo
          (nested included) via find, matching the ci.yaml `scripts` job. Pass an
          explicit glob to override, or "/dev/null" to skip shellcheck.
        type: string
        default: "auto"
      # Default ignores, and why each one is off:
      #   DL3018 — demands apk version pins. This fleet deliberately does not use
      #     them: the base image's SHA digest is the reproducibility guarantee,
      #     and an apk pin drifts independently of it and breaks on base bumps
      #     (see docker-builds.md "Don't pin distro (apk) package versions").
      #   DL3066 — demands a numeric uid in USER. Its premise is false for the
      #     distroless bases we use, which ship an /etc/passwd containing
      #     `nonroot`. The failure it guards against is Kubernetes
      #     `runAsNonRoot`, where the kubelet cannot resolve a name from the
      #     image; nothing here deploys to Kubernetes, and our compose files
      #     already pass a numeric user. Upstream enabled it by default in
      #     v2.15.0 against its own requester's suggestion, its author calls the
      #     implementation "needs further work", and `USER ${ARG}` is an open
      #     false positive (hadolint#1222) whose documented workaround is to
      #     disable the rule. It also fires on every USER instruction, not just
      #     the last, so a builder-stage `USER root` trips it. Revisit once
      #     upstream settles.
      hadolint-ignores:
        description: Comma-separated hadolint rules to ignore (each passed as --ignore).
        type: string
        default: "DL3018,DL3066"
      dockerfile:
        description: Path to the Dockerfile to lint.
        type: string
        default: "./Dockerfile"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false
          # fetch-depth defaults to 1 again: the full clone existed only for the
          # gitleaks step, which moved to the meta ci.yaml `repo` job. Nothing
          # left in this job reads git history.

      # actionlint, zizmor and gitleaks are NOT installed here: they are
      # repo-wide checks with no shell dependency, and they run exactly once in
      # the meta ci.yaml `repo` job. They used to run here AND in go-ci, so a
      # Docker+Go repo checked the same workflows and tree twice.

      - name: Install shfmt
        run: |
          # renovate: datasource=github-releases depName=mvdan/sh
          VERSION=v3.13.1
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${VERSION}/shfmt_${VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Install shellcheck
        run: |
          # The runner's preinstalled shellcheck false-positives SC2317 on
          # trap-invoked functions (fixed in 0.11.0: SC2317 is "less spammy for
          # nested ones"). Pin it like the linters above so the gate matches
          # local tooling and stays reproducible.
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          VERSION=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/shellcheck-${VERSION}.linux.x86_64.tar.gz" \
            | tar -xzf - -C /tmp "shellcheck-${VERSION}/shellcheck"
          sudo mv "/tmp/shellcheck-${VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Soft-gate block: each step below runs to completion (continue-on-error)
      # and records its own name to /tmp/_ci_failures on failure; the final
      # "Check results" step fails the job if that file exists. CONTRACT: any
      # step added to this block MUST end with
      #   || { echo "<step name>" >> /tmp/_ci_failures; exit 1; }
      # or its failure is silently tolerated by continue-on-error.
      - name: Lint shell scripts
        continue-on-error: true
        env:
          # Via env, never inline ${{ }} in the script body, so the input can't
          # expand into shell code (template injection).
          SHELLCHECK_PATHS: ${{ inputs.shellcheck-paths }}
        run: |
          (
            if [ "$SHELLCHECK_PATHS" = "/dev/null" ]; then
              echo "shellcheck: skipped (no shell scripts)"
            elif [ "$SHELLCHECK_PATHS" = "auto" ]; then
              # Discover every *.sh in the repo (nested included), matching the
              # ci.yaml `scripts` job. -x follows `source`d files.
              files=$(find . -name '*.sh' -not -path './.git/*')
              if [ -z "$files" ]; then
                echo "shellcheck: no *.sh found — skipping"
              else
                # shellcheck disable=SC2086
                shellcheck -x -S info $files
              fi
            else
              # Explicit override glob. Expand safely (deliberate word-split +
              # glob); if it matches no real files, skip (avoids
              # 'openBinaryFile: does not exist').
              shopt -s nullglob
              # shellcheck disable=SC2206
              files=( $SHELLCHECK_PATHS )
              shopt -u nullglob
              if [ ${#files[@]} -eq 0 ]; then
                echo "shellcheck: no files matched ${SHELLCHECK_PATHS} — skipping"
              else
                shellcheck -x -S info "${files[@]}"
              fi
            fi
          ) || { echo "Lint shell scripts" >> /tmp/_ci_failures; exit 1; }

      - name: Format check shell scripts (shfmt)
        continue-on-error: true
        run: |
          (
            # Every *.sh (nested included), matching the ci.yaml `scripts` job.
            # Flags per shell.md: 2-space indent, indent switch cases, binary
            # ops may start a line. NOT -sr (the gate does not enforce it).
            files=$(find . -name '*.sh' -not -path './.git/*')
            if [ -z "$files" ]; then
              echo "shfmt: no *.sh found — skipping"
            else
              # shellcheck disable=SC2086
              shfmt -d -i 2 -ci -bn $files
            fi
          ) || { echo "Format check shell scripts (shfmt)" >> /tmp/_ci_failures; exit 1; }

      - name: Validate Dockerfile
        continue-on-error: true
        env:
          # Via env, never inline ${{ }} in the script body (template injection).
          HADOLINT_IGNORES: ${{ inputs.hadolint-ignores }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          (
            # renovate: datasource=docker depName=hadolint/hadolint
            HADOLINT_VERSION=v2.15.1
            IGNORE_FLAGS=""
            IFS=',' read -ra RULES <<< "$HADOLINT_IGNORES"
            for rule in "${RULES[@]}"; do
              IGNORE_FLAGS="${IGNORE_FLAGS} --ignore ${rule}"
            done
            # Pre-pull with retry: anonymous Docker Hub pulls on shared runner
            # IPs intermittently time out ("context deadline exceeded").
            for attempt in 1 2 3; do
              docker pull -q "hadolint/hadolint:${HADOLINT_VERSION}" && break
              echo "hadolint pull ${attempt}/3 failed; retrying" >&2; sleep $((attempt * 5))
            done
            # shellcheck disable=SC2086
            docker run --rm -i "hadolint/hadolint:${HADOLINT_VERSION}" \
              hadolint ${IGNORE_FLAGS} - < "$DOCKERFILE"
          ) || { echo "Validate Dockerfile" >> /tmp/_ci_failures; exit 1; }

      # Repo-provided shell unit tests (opt-in by file presence). Generalises the
      # pattern the meta ci.yaml already uses for its own two probes
      # (scripts/test-cliff-bump-semantics.sh, scripts/test-lane-semantics.sh),
      # which are keyed to those exact filenames and so only ever run in
      # cplieger/ci itself. A repo opts in by adding tests/shell/run.sh; every
      # other repo skips, so this is inert until used.
      #
      # Presence is tested with -f and the runner is invoked through `bash`, NOT
      # -x plus ./script as the two older probes do. Deliberate: those live in the
      # repo that owns them, where a lost exec bit is noticed immediately, while
      # this hook fans out to consumer repos where a file committed 100644 would
      # make the whole suite skip SILENTLY and report the job green — a green run
      # that tested nothing is the worst outcome available here, and the exec bit
      # is an easy thing for a consumer to lose (it already happened once while
      # this was being written). Nothing about running the suite needs it.
      #
      # It fills a real gap rather than adding ceremony. The shell-heavy images in
      # this fleet carry their product logic in shell — an entrypoint plus its
      # helpers — and the only shell testing that existed was tests/image-smoke.sh,
      # which needs a built image and a running daemon and therefore cannot
      # cheaply assert one function's edge cases. Boot paths that fail CLOSED are
      # exactly what that gap hides: they are the branches a smoke test never
      # reaches, because a healthy image never takes them.
      #
      # The suite runs BEFORE the secret scan and after the linters, so a test
      # file is held to the same shellcheck/shfmt bar as the code it tests.
      - name: Run shell unit tests
        continue-on-error: true
        run: |
          (
            if [ -f tests/shell/run.sh ]; then
              bash tests/shell/run.sh
            else
              echo "no shell unit tests in this repo - skipping"
            fi
          ) || { echo "Run shell unit tests" >> /tmp/_ci_failures; exit 1; }

      - name: Check results
        if: always()
        run: |
          if [ -f /tmp/_ci_failures ]; then
            echo "::error::Failed validation steps:"
            sort -u /tmp/_ci_failures >&2
            exit 1
          fi
          echo "All validation steps passed"
