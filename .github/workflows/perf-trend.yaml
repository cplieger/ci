name: Performance trend

# One point of the performance trend of a repository that carries
# tests/perf/plan.json: measure its `full` set at a branch's head, judge the
# point against each cell's trailing baseline, store it on the repository's
# perf-trend branch, and open, update or close one issue per regressed
# scenario. scripts/perf_trend.py owns the rule and the branch's layout.
# Called by the synced .github/workflows/perf-trend.yaml on a schedule; the
# caller grants contents: write, issues: write and actions: read, and each job
# keeps only what it needs.

on:
  workflow_call:
    inputs:
      ref:
        description: The branch to measure; empty is the default branch.
        type: string
        default: ''
      series:
        description: >-
          The series the point joins; empty is `dev`, which only the default
          branch joins. Another series is stored and judged on its own, against
          dev's points while it has fewer than seven.
        type: string
        default: ''
      only:
        description: >-
          Comma or space separated scenarios of the full set to keep, for a series
          other than dev; empty keeps all.
        type: string
        default: ''
      runner:
        description: >-
          The runner label for every job, such as a self-hosted pool's; empty runs
          them on ubuntu-26.04. The pull request guard judges only results from the
          runner of its baselines, which moves to a new runner once dev holds five
          runs of it.
        type: string
        default: ''
      seed:
        description: >-
          Start the perf-trend branch with this point of the dev series. Refused
          while the branch exists or an issue is marked with dev; without it a
          missing branch fails the run.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      series: ${{ steps.resolve.outputs.series }}
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
      date: ${{ steps.resolve.outputs.date }}
      repair: ${{ steps.resolve.outputs.repair }}
      attempt: ${{ steps.resolve.outputs.attempt }}
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          SERIES: ${{ inputs.series }}
          ONLY: ${{ inputs.only }}
          RUNNER: ${{ inputs.runner || 'ubuntu-26.04' }}
          SEED: ${{ inputs.seed }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          default=$(gh api "repos/${REPO}" --jq .default_branch)
          ref=${REF:-$default}
          series=${SERIES:-dev}
          if ! [[ $series =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]]; then
            echo "::error::series ${series} must match ^[a-z0-9][a-z0-9-]{0,30}\$"
            exit 1
          fi
          if ! git check-ref-format --branch "$ref" > /dev/null 2>&1; then
            echo "::error::${ref} is not a branch name"
            exit 1
          fi
          # The guard and dev's issues read only the dev series, so it holds the
          # whole set of the default branch and nothing else.
          if [ "$series" = dev ] && [ "$ref" != "$default" ]; then
            echo "::error::only ${default} joins the dev series: dispatch ${ref} with a series of its own"
            exit 1
          fi
          if [ "$series" = dev ] && [ -n "$ONLY" ]; then
            echo "::error::only a series other than dev measures part of the set (only: ${ONLY})"
            exit 1
          fi
          sha=$(gh api "repos/${REPO}/git/ref/heads/${ref}" --jq .object.sha)
          python3 "$CI_TOOLS/perf_trend.py" fetch-issues --repo "$REPO" --out "$RUNNER_TEMP/issues.json"
          # The branch holds every series' history and the guard's baseline, so its
          # loss fails the run rather than starting a new history.
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0
          rc=0
          git ls-remote --exit-code --heads "https://github.com/${REPO}.git" perf-trend > /dev/null || rc=$?
          case "${rc}:${SEED}" in
            0:true)
              echo "::error::the perf-trend branch of ${REPO} already holds the trend's history, so there is nothing to seed"
              exit 1
              ;;
            0:*) ;;
            2:true)
              # Only dev starts the branch: every other series is judged against it.
              if [ "$series" != dev ]; then
                echo "::error::the perf-trend branch of ${REPO} is missing: restore it from a clone that holds it, or dispatch the dev series with seed to start a new history"
                exit 1
              fi
              python3 "$CI_TOOLS/perf_trend.py" seedable --issues "$RUNNER_TEMP/issues.json" --series "$series"
              ;;
            2:*)
              echo "::error::the perf-trend branch of ${REPO} is missing: restore it from a clone that holds it, or dispatch with seed to start a new history"
              exit 1
              ;;
            *)
              echo "::error::could not read the perf-trend branch of ${REPO} (git ls-remote exit ${rc})"
              exit 1
              ;;
          esac
          state="$RUNNER_TEMP/state.json"
          # No branch or no state yet is a series never measured.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${REPO}/contents/series/${series}/state.json?ref=perf-trend" > "$state" 2> /dev/null \
            || rm -f "$state"
          skip=$(python3 "$CI_TOOLS/perf_trend.py" skip --state "$state" --commit "$sha" --runner "$RUNNER")
          run=true repair=false
          if [ "$skip" = true ]; then
            run=false
            echo "the ${series} series already holds a point of ${sha} on ${RUNNER} and waits on none"
            # A skipped run still sends the issue writes an earlier run lost.
            repair=$(python3 "$CI_TOOLS/perf_trend.py" repair --state "$state" \
              --issues "$RUNNER_TEMP/issues.json" --out "$RUNNER_TEMP/actions.json")
            if [ "$repair" = true ]; then
              echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            fi
          fi
          {
            echo "run=${run}"
            echo "repair=${repair}"
            echo "series=${series}"
            echo "ref=${ref}"
            echo "sha=${sha}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the repair
        if: ${{ steps.resolve.outputs.repair == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-trend-actions-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions.json
          if-no-files-found: error
          retention-days: 7

  measure:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/perf-ci.yaml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      set: full
      only: ${{ inputs.only }}
      mode: measure
      # The account runs 20 jobs at once; eight leave the rest to pull requests.
      max-parallel: 8
      runner: ${{ inputs.runner }}

  # Reads the measure artifacts as data and runs none of the measured code, so
  # it is the one job that holds contents: write, to push the perf-trend branch.
  record:
    needs: [plan, measure]
    if: ${{ !cancelled() && needs.measure.result == 'success' }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: write
      issues: read
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-results-${{ needs.measure.outputs.prefix }}-measure-*
          merge-multiple: true
          path: ${{ runner.temp }}/results

      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERIES: ${{ needs.plan.outputs.series }}
          REF: ${{ needs.plan.outputs.ref }}
          SHA: ${{ needs.plan.outputs.sha }}
          DATE: ${{ needs.plan.outputs.date }}
          PREFIX: ${{ needs.measure.outputs.prefix }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEED: ${{ inputs.seed }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}.git"
          # Through the environment, so the credential is in no command's argv.
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0
          work="$RUNNER_TEMP/perf-trend"
          point="$RUNNER_TEMP/point.json"
          python3 "$CI_TOOLS/perf_trend.py" point --results "$RUNNER_TEMP/results" --prefix "$PREFIX" \
            --repo "$REPO" --series "$SERIES" --ref "$REF" --commit "$SHA" --date "$DATE" \
            --run-id "$RUN_ID" --run-url "$RUN_URL" --out "$point"
          # Read as data: the pr set it names and each unit's planned seconds.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${REPO}/contents/tests/perf/plan.json?ref=${SHA}" > "$RUNNER_TEMP/plan.json"
          python3 "$CI_TOOLS/perf_trend.py" fetch-issues --repo "$REPO" --out "$RUNNER_TEMP/issues.json"
          # The branch only moves forward: a push another run got in first is
          # refused, and this point is judged again on top of it.
          for attempt in 1 2 3 4 5; do
            rm -rf "$work"
            rc=0
            git ls-remote --exit-code --heads "$url" perf-trend > /dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              # Points accumulate, so only the state and the points judging this
              # one are checked out (perf_trend.py needs).
              git clone -q --filter=blob:none --no-checkout --depth 1 \
                --branch perf-trend "$url" "$work"
              git -C "$work" ls-tree -r --name-only HEAD > "$RUNNER_TEMP/listing.txt"
              python3 "$CI_TOOLS/perf_trend.py" needs --listing "$RUNNER_TEMP/listing.txt" --series "$SERIES" \
                > "$RUNNER_TEMP/needs.txt"
              git -C "$work" sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/needs.txt"
              git -C "$work" checkout -q perf-trend
            elif [ "$rc" -eq 2 ] && [ "$SEED" = true ] && [ "$SERIES" = dev ]; then
              git init -q -b perf-trend "$work"
              git -C "$work" remote add origin "$url"
            elif [ "$rc" -eq 2 ] && [ "$SEED" = true ]; then
              echo "::error::the perf-trend branch of ${REPO} is missing: restore it from a clone that holds it, or dispatch the dev series with seed to start a new history"
              exit 1
            elif [ "$rc" -eq 2 ]; then
              echo "::error::the perf-trend branch of ${REPO} is missing: restore it from a clone that holds it, or dispatch with seed to start a new history"
              exit 1
            else
              echo "::error::could not read the perf-trend branch of ${REPO} (git ls-remote exit ${rc})"
              exit 1
            fi
            : > "$RUNNER_TEMP/summary.md"
            python3 "$CI_TOOLS/perf_trend.py" judge --root "$work" --point "$point" --series "$SERIES" \
              --repo "$REPO" --issues "$RUNNER_TEMP/issues.json" \
              --actions "$RUNNER_TEMP/actions.json" --summary "$RUNNER_TEMP/summary.md" \
              --plan "$RUNNER_TEMP/plan.json"
            git -C "$work" add --sparse -- "series/${SERIES}"
            # A re-run of a run whose point is on the branch writes only its issues.
            if git -C "$work" diff --cached --quiet; then
              cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C "$work" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "perf: ${SERIES} point at ${SHA:0:12}"
            if git -C "$work" push -q origin HEAD:refs/heads/perf-trend; then
              cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::the push of the ${SERIES} point was refused (attempt ${attempt}), judging it again on the branch's new head"
            sleep $((attempt * 3))
          done
          echo "::error::could not push the ${SERIES} point to perf-trend after 5 attempts"
          exit 1

      - name: Upload the actions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-trend-actions-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions.json
          if-no-files-found: error
          retention-days: 7

  # Sends the record job's actions, or on a skipped run the plan job's repair.
  issues:
    needs: [plan, record]
    if: >-
      ${{ !cancelled() && (needs.record.result == 'success'
      || (needs.plan.result == 'success' && needs.plan.outputs.repair == 'true')) }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the ci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cplieger-ci
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download the actions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-trend-actions-attempt-${{ needs.record.outputs.attempt || needs.plan.outputs.attempt }}
          path: ${{ runner.temp }}/trend

      - name: Open, update and close the issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_TOOLS: ${{ github.workspace }}/.cplieger-ci/scripts
        run: python3 "$CI_TOOLS/perf_trend.py" issues --actions "$RUNNER_TEMP/trend/actions.json" --repo "$REPO"

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [plan, measure, record, issues]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      scope: ${{ inputs.only }}
