# Daily security scan across the public cplieger consumer repos, 03:00 UTC.
# Dispatches each repo's synced `security.yml` (Trivy fs scan, plus an image
# scan on Dockerfile repos). Private repos are excluded: they run their own
# security CI weekly, and only they spend the account's included minutes.
# `gh workflow run` is fire-and-forget, so max-parallel paces only the
# dispatches and the scans burst against the 20-job account cap. The scans
# must run in each repo because SARIF uploads target the repo they run in.
name: Daily security scan

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-security
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.fanout.outputs.matrix }}
    steps:
      - name: Discover public repos with security.yml
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
        run: |
          set -euo pipefail
          # Public only (visibility rule, not a repo-name list): private repos
          # draw the account's included minutes and own their scan cadence —
          # see the "Private repos" note in the header.
          # Forks are excluded org-wide (same rule as scripts/audit.py): a fork
          # carries UPSTREAM's code, so scanning it reports findings only upstream
          # can fix while spending our daily budget.
          # REST rather than `gh repo list`: GraphQL quota is shared with every
          # other token of the account owner and can be exhausted by unrelated load.
          repos=$(gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq '
            .[] | select(.archived == false and .fork == false and .visibility == "public") | .name
          ')
          REPOS=()
          for r in $repos; do
            if gh workflow view security.yml -R "cplieger/${r}" >/dev/null 2>&1; then
              REPOS+=("$r")
            fi
          done
          matrix=$(printf '%s\n' "${REPOS[@]}" | jq -R . | jq -s -c '[.[] | {repo: .}]')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Total repos: $(echo "$matrix" | jq 'length')"

  dispatch:
    needs: fanout
    if: ${{ needs.fanout.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4   # security scan is brief; cap low to free slots for ad-hoc work
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
    steps:
      - name: Trigger security.yml on cplieger/${{ matrix.repo }}
        run: |
          gh workflow run security.yml -R "cplieger/${{ matrix.repo }}"

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, dispatch]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
