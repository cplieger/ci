# Weekly Stryker mutation testing of every TS package dir that commits a
# stryker config, in the public cplieger repositories; the Go twin is
# weekly-gremlins.yaml. Each repo is one call of mutation-stryker-repo.yaml, so
# one repo's failure ends only its own call. The opt-in contract, the opt-out,
# the badge and the tracker are documented in docs/workflows.md "The scheduled runs".
name: Weekly stryker

on:
  schedule:
    - cron: "0 22 * * 6"   # Saturday 22:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma/space-separated repo names to limit the run (for testing). Empty runs every public cplieger repo."
        required: false
        default: ""

permissions:
  contents: read
  # Badge pushes happen in CONSUMER repos via the CI_SCHEDULE PAT.

concurrency:
  group: weekly-stryker
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      repos: ${{ steps.fanout.outputs.repos }}
    steps:
      - name: Discover repos with a stryker config
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Injected via env (not inline ${{ }} in the script) so a crafted
          # dispatch input can't expand into shell code (template injection).
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          # Repo discovery over REST, not the GraphQL `gh repo list`: the fanout
          # is a single point of failure for the whole run, and the GraphQL
          # budget is shared by every session on the account, so its exhaustion
          # would lose every repo at once. Forks are excluded (same rule as
          # scripts/audit.py): a fork carries UPSTREAM's code and tests, so its
          # mutation score measures someone else's suite and its tracker issue
          # would be unactionable. Public only: this repository's run logs and
          # artifacts are world-readable (CONTRIBUTING.md).
          repos=$(gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq '
            .[] | select(.archived == false and .fork == false and .visibility == "public") | .name
          ')

          if [ -n "${ONLY:-}" ]; then
            wanted=" $(echo "$ONLY" | tr ',' ' ') "
            filtered=""
            for r in $repos; do
              case "$wanted" in *" $r "*) filtered="$filtered $r" ;; esac
            done
            repos="$filtered"
            echo "manual 'only' filter active -> ${repos:-<none matched>}"
          fi

          # A config up to three dirs down, outside node_modules, as the call's
          # discover job scans (scripts/stryker-shard.py config_dirs). A repo
          # whose tree cannot be read whole runs all the same: its call finds
          # its configs from a clone, or finds none.
          found=()
          for r in $repos; do
            if ! hit=$(gh api "/repos/cplieger/${r}/git/trees/HEAD?recursive=1" --jq '
              if .truncated then "truncated" else
                [.tree[] | select(.type == "blob") | .path
                 | select(test("(^|/)node_modules/") | not)
                 | select(test("^([^/]+/){0,3}stryker\\.config\\.[^/]+$"))] | length | tostring
              end' 2>/dev/null); then
              echo "::warning::${r}: its source tree could not be read, so it runs and its call looks for configs"
              found+=("$r")
            elif [ "$hit" = truncated ]; then
              echo "::warning::${r}: its source tree is truncated, so it runs and its call looks for configs"
              found+=("$r")
            elif [ "$hit" -gt 0 ]; then
              echo "  include: ${r}"
              found+=("$r")
            fi
          done
          # select() drops the one empty line printf gives an empty list.
          repos_json=$(printf '%s\n' "${found[@]}" | jq -R 'select(length > 0)' | jq -s -c .)
          echo "repos=${repos_json}" >> "$GITHUB_OUTPUT"
          echo "Total repos: $(jq 'length' <<<"$repos_json")"
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::no repo with a stryker config was found to run, so this run tests nothing"
            echo "### no repo with a stryker config was found to run, so this run tests nothing" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

  repo:
    name: stryker (${{ matrix.repo }})
    needs: fanout
    strategy:
      fail-fast: false
      # Each call runs up to 3 Stryker jobs at once; 2 calls keep the account's
      # budget for the other schedulers and ad-hoc PR work.
      max-parallel: 2
      matrix:
        repo: ${{ fromJSON(needs.fanout.outputs.repos) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/mutation-stryker-repo.yaml
    with:
      repository: ${{ matrix.repo }}
      # Only the scheduled run honours a dir's opt-out; a dispatch tests it.
      honour-opt-out: ${{ github.event_name == 'schedule' }}
    secrets:
      CI_SCHEDULE: ${{ secrets.CI_SCHEDULE }}

  # Reads each call's result on its own, so a missing or unreadable one is
  # named for its repo and the rest are still summarised, and fails unless
  # every call's record earned `passed` (scripts/mutation-summary.py fleet).
  # Each call names its file by its key, so the merged download keeps them apart.
  summary:
    needs: [fanout, repo]
    if: ${{ !cancelled() && needs.fanout.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Download every call's result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          pattern: strykerresult-*
          merge-multiple: true

      # A whole-repo call's key is its repo name (scripts/mutation_cost.py entry_key).
      - name: Summarise the fleet
        env:
          REPOS: ${{ needs.fanout.outputs.repos }}
        run: python3 scripts/mutation-summary.py fleet --tool stryker --keys "${REPOS}" --results results

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, repo, summary]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      scope: ${{ inputs.only }}
