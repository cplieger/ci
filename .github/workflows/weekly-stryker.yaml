# Weekly TS mutation testing across cplieger consumer repos — the Stryker
# counterpart to weekly-gremlins.yaml (Go). Pattern C: this workflow owns the
# matrix and the max-parallel cap; runs happen here, not via cross-repo
# dispatch.
#
# Opt-in contract (per TS package dir, e.g. repo root or static-src/):
#   1. commit a stryker.config.json (mutate globs, thresholds, vitest runner)
#   2. add the devDependencies the config needs:
#        @stryker-mutator/core + @stryker-mutator/vitest-runner
#        (+ @stryker-mutator/typescript-checker when `checkers` is used)
# The fanout discovers configs automatically; a dir whose devDeps are missing
# is SKIPPED with an actionable notice instead of failing, so the runner can
# ship ahead of repo enrollment and light up as repos opt in.
#
# Schedule:     Saturdays 22:00 UTC (own slot: gremlins Sun 22:00, fuzz
#               Wed 22:00, security daily 03:00 — never fighting the same
#               20-slot budget window)
# Runs:         1 per package dir (no 3-attempt averaging: Stryker+vitest on
#               these small TS surfaces is far more deterministic than Go
#               mutants under -race; revisit if flakiness appears)
# Reporting:    mutation score to the run summary + a `mutation-ts.json`
#               shields endpoint on the consumer's orphan `badges` branch
#               (sibling-preserving publisher, coexists with coverage.json /
#               mutation.json). Colour bands match the Go mutation badge.
#               Stryker itself exits non-zero when the score drops below the
#               config's `thresholds.break`, which fails that matrix entry —
#               red is a real regression signal, but nothing blocks consumer
#               merges (internal weekly job, not a required check).
# Tracker:      Per-repo `Stryker mutation testing tracker` issue (label
#               stryker-tracker), the TS twin of the gremlins tracker:
#               rolling 12-week score table inside <!-- stryker-data -->
#               sentinels, surviving mutants bucketed Survived vs NoCoverage,
#               free-form notes preserved. The `mutation-regression` label is
#               toggled when this week's score drops >5% below the rolling
#               mean. A repo whose run produced no parseable report is left
#               untouched (no misleading 0% rows — the red matrix entry is
#               the signal).
name: Weekly stryker

on:
  schedule:
    - cron: "0 22 * * 6"   # Saturday 22:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma/space-separated repo names to limit the run (for testing). Empty runs against all cplieger repos."
        required: false
        default: ""

permissions:
  contents: read
  # Badge pushes happen in CONSUMER repos via the CI_SCHEDULE PAT.

concurrency:
  group: weekly-stryker
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.fanout.outputs.matrix }}
    steps:
      - name: Discover TS package dirs with a stryker config
        id: fanout
        env:
          GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
          # Injected via env (not inline ${{ }} in the script) so a crafted
          # dispatch input can't expand into shell code (template injection).
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          # Forks are excluded fleet-wide (same rule as scripts/audit.py): a fork
          # carries UPSTREAM's code and tests, so its mutation score measures
          # someone else's suite and its tracker issue would be unactionable.
          repos=$(gh repo list cplieger --limit 300 --json name,isArchived,isFork --jq '
            [.[] | select(.isArchived == false and .isFork == false) | .name] | .[]
          ')

          if [ -n "${ONLY:-}" ]; then
            wanted=" $(echo "$ONLY" | tr ',' ' ') "
            filtered=""
            for r in $repos; do
              case "$wanted" in *" $r "*) filtered="$filtered $r" ;; esac
            done
            repos="$filtered"
            echo "manual 'only' filter active -> ${repos:-<none matched>}"
          fi

          matrix='[]'
          for r in $repos; do
            rm -rf scan
            gh repo clone "cplieger/${r}" scan -- --depth 1 2>/dev/null || continue
            # `|| continue` above only catches a clone that EXITS non-zero. A
            # clone that exits 0 leaving no resolvable HEAD reaches rev-parse,
            # which exits 128 under `set -e` and kills the whole job — taking
            # every other repo's matrix entry with it (2026-08-15: died one repo
            # after web-terminal-engine, `run` skipped entirely, no repo
            # mutation-tested that week). Replaying this loop over all 57 repos
            # found no repo that reproduces it, so it is a transient clone and
            # the right blast radius is one skipped repo, not the fleet.
            if ! sha=$(git -C scan rev-parse HEAD 2>/dev/null); then
              echo "::warning::${r}: clone left no resolvable HEAD — skipping this repo"
              continue
            fi
            while IFS= read -r cfg; do
              dir=$(dirname "${cfg#scan/}")
              echo "  include ${r}:${dir} @ ${sha:0:12}"
              matrix=$(printf '%s' "$matrix" | jq -c \
                --arg r "$r" --arg s "$sha" --arg d "$dir" \
                '. + [{repo: $r, sha: $s, dir: $d}]')
            done < <(find scan -maxdepth 4 -name 'stryker.config.*' -not -path '*/node_modules/*' | sort)
          done
          rm -rf scan

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Total entries: $(printf '%s' "$matrix" | jq 'length')"

  run:
    needs: fanout
    if: ${{ needs.fanout.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 3   # CPU-heavy; small fleet today — leaves the budget free
      matrix:
        include: ${{ fromJSON(needs.fanout.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
    steps:
      # Checkout FIRST (actions/checkout cleans the workspace): brings the
      # sibling-preserving badge publisher bundled with actions/publish-badge.
      - name: Checkout ci (for the badge publisher)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # the badge push authenticates via CI_SCHEDULE inside the script.
          persist-credentials: false

      - name: Clone target repo at pinned SHA
        run: |
          set -euo pipefail
          gh repo clone "cplieger/${{ matrix.repo }}" target -- --depth 1
          git -C target fetch --depth 1 origin "${{ matrix.sha }}"
          git -C target checkout --quiet "${{ matrix.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in step with ts-ci.yaml / release.yaml (same major).
          node-version: '24'

      - name: Compute artifact slug for this package dir
        id: slug
        env:
          DIR: ${{ matrix.dir }}
        run: |
          # Artifact names cannot contain '/'; meta.json (below) is the
          # authoritative repo/dir mapping — the slug is only for uniqueness.
          if [ "$DIR" = "." ]; then slug=root; else slug=${DIR//\//_}; fi
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Run stryker
        id: stryker
        working-directory: target/${{ matrix.dir }}
        env:
          ENTRY: ${{ matrix.repo }}:${{ matrix.dir }}
        run: |
          set -uo pipefail

          # Explicit, because this block runs WITHOUT `set -e`: a failed
          # `npm ci` otherwise falls through to the enrollment gate below,
          # which finds no stryker binary, reports the dir as un-enrolled and
          # exits 0 — a green matrix entry that mutation-tested nothing and
          # blamed the repo for it. The two causes want opposite outcomes, so
          # they are separated here rather than conflated one gate later.
          if ! npm ci; then
            echo "::error::${ENTRY}: npm ci failed"
            exit 1
          fi

          # Enrollment gate: config present but the Stryker devDeps missing →
          # skip with an actionable notice (the runner ships ahead of repo
          # enrollment), never a red herring failure.
          if ! npx --no-install stryker --version >/dev/null 2>&1; then
            msg="${ENTRY}: stryker.config.* present but @stryker-mutator/core is not a devDependency — skipping."
            echo "::notice::${msg} Enroll: npm i -D @stryker-mutator/core @stryker-mutator/vitest-runner"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Vitest Browser Mode needs a real Chromium, and the fleet migrated
          # its DOM suites to it on 2026-08-23 — which is the last time this
          # workflow was green. Presence of the `@vitest/browser-playwright`
          # devDependency is the enrolment marker (same shape as ts-ci.yaml),
          # driven through the repo's OWN pinned `playwright`
          # CLI (`--no-install`) so the browser build number it downloads is the
          # one the library looks for. NOT `--with-deps`: ubuntu-24.04 already
          # carries every shared library Chromium links, and that apt
          # transaction is an unbounded-latency fetch on the critical path.
          #
          # Placed after the enrollment gate on purpose — a dir that skips
          # stryker runs no tests, so it needs no browser. It is setup rather
          # than a check, so a failed install fails the job here instead of
          # surfacing as a stryker dry-run error against the wrong name.
          if node -e "const d=require('./package.json').devDependencies||{}; process.exit(d['@vitest/browser-playwright']?0:1)"; then
            if ! npx --no-install playwright install chromium; then
              echo "::error::${ENTRY}: playwright chromium install failed"
              exit 1
            fi
          else
            echo "no @vitest/browser-playwright devDependency; skipping browser install"
          fi

          # STOPGAP (2026-09-13), and it is built to delete itself. Under vitest 5
          # the runner filters each mutant's test run with a name pattern joined
          # by a space while vitest matches on " > ", so zero tests run per
          # mutant, every mutant survives trivially, and a suite that killed
          # 91.67% publishes 0.00%. Patching the two joins restores the vitest 4
          # number exactly; the script's docstring carries the measurement and the
          # upstream PRs. It exits 3 once its anchor is gone, so the first run
          # after upstream ships the fix goes RED HERE — that red is the signal to
          # delete the script, this block, and the probe in self-ci.yaml, not to
          # re-anchor anything. The zero-kill guard below stays the backstop.
          if ! python3 "${GITHUB_WORKSPACE}/scripts/patch-vitest-runner-separator.py"; then
            echo "::error::${ENTRY}: the vitest-5 separator stopgap refused to apply; upstream probably fixed it — delete the stopgap"
            exit 1
          fi

          # --reporters json overrides the config's html/clear-text reporters
          # for CI; progress keeps the log alive under the job timeout.
          rc=0
          npx --no-install stryker run --reporters json,progress || rc=$?

          # Locate the schema report (jsonReporter default:
          # reports/mutation/mutation.json; tolerate overridden fileNames).
          report=$(grep -rls '"schemaVersion"' reports/ 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "::error::${ENTRY}: stryker produced no JSON report (exit ${rc})"
            exit "${rc:-1}"
          fi

          # Mutation score per mutation-testing-elements metrics:
          # detected (Killed+Timeout) / valid (detected + Survived+NoCoverage).
          # python -c, never a heredoc — heredoc terminators break under GHA
          # YAML dedent (repo-wide convention).
          # Emits "<score> <detected> <valid>" so the zero-kill guard below can
          # read the counts without a second parse of an 8 MB report. Split with
          # a here-STRING, never a heredoc: a heredoc terminator breaks under
          # GHA's YAML dedent (the convention this file already follows above).
          metrics=$(python3 -c "
          import json, sys
          from collections import Counter
          data = json.load(open(sys.argv[1]))
          c = Counter(m['status'] for f in data.get('files', {}).values() for m in f.get('mutants', []))
          detected = c['Killed'] + c['Timeout']
          valid = detected + c['Survived'] + c['NoCoverage']
          print(f'{detected / valid * 100:.1f}' if valid else '0.0', detected, valid)
          " "$report")
          read -r score detected valid <<< "$metrics"

          # A run that killed NOTHING measured nothing, so it is a defect rather
          # than a score. Refuse before publishing: a real suite kills some of
          # its mutants, so 0 detected against thousands of valid ones means the
          # harness never activated a mutant — and only vibekit sets
          # `thresholds.break`, so everywhere else that sails through as a green
          # run, a red 0.0% badge and a `mutation-regression` label on the
          # tracker. Measured 2026-09-13 across 7 repos the moment the browser
          # install let the dry run through: Killed=0 on every one of them,
          # against real baselines of 74-100%, with `NoCoverage` in the tens —
          # so coverage collection worked and only detection was dead.
          #
          # ROOT CAUSE, found 2026-09-13 after this guard landed: the runner
          # runs ZERO tests per mutant under vitest 5, so every mutant survives
          # trivially. Same repo, same file, same command, only vitest differing
          # — 4.1.11 killed 33 of 36 (91.67%, 1.00 tests per mutant), 5.0.0
          # killed 0 of 36 (0.00%, 0.00 tests per mutant). It is NOT browser
          # specific: keyenc's node-mode suite scores 0.0% too. The fleet took
          # vitest 5 on 2026-09-06 (a `chore(devdeps)` bump), and
          # `@stryker-mutator/vitest-runner@10.0.0` — still the newest — declares
          # `vitest: ">=2.0.0"`, so npm accepted it with no warning. The stopgap
          # above patches that separator, so a 0-detected run now means EITHER the
          # stopgap silently did nothing (read its output first) or a second cause
          # exists; do not read it as the same known defect.
          #
          # Guarded on `valid > 0` so a package that legitimately produces no
          # mutants still reports 0.0% rather than failing.
          if [ "${detected}" = "0" ] && [ "${valid}" -gt 0 ]; then
            echo "${ENTRY}: no mutant was detected, so the harness never activated one." \
              "vitest 5 + @stryker-mutator/vitest-runner 10 runs 0 tests per mutant; see this step's comment."
            echo "::error::${ENTRY}: killed 0 of ${valid} mutants — measured nothing, no score published"
            exit 1
          fi

          echo "score=${score}" >> "$GITHUB_OUTPUT"
          echo "report=${report}" >> "$GITHUB_OUTPUT"
          echo "### ${ENTRY}: mutation score ${score}% (stryker exit ${rc})" >> "$GITHUB_STEP_SUMMARY"

          # Propagate a below-break-threshold failure AFTER capturing the
          # score, so the badge step below still publishes the (low) number.
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Stage report for the tracker aggregate
        if: ${{ steps.stryker.outputs.report != '' }}
        env:
          REPORT: ${{ steps.stryker.outputs.report }}
          REPO: ${{ matrix.repo }}
          DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage
          cp "target/${DIR}/${REPORT}" /tmp/stage/mutation.json
          jq -n --arg repo "$REPO" --arg dir "$DIR" '{repo: $repo, dir: $dir}' > /tmp/stage/meta.json

      - name: Upload report (artifact, 90-day retention)
        if: ${{ steps.stryker.outputs.report != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-${{ matrix.repo }}-${{ steps.slug.outputs.slug }}
          path: /tmp/stage
          if-no-files-found: warn
          retention-days: 90

      - name: Publish mutation-ts badge
        if: ${{ steps.stryker.outputs.skipped != 'true' && steps.stryker.outputs.score != '' }}
        env:
          TOKEN: ${{ secrets.CI_SCHEDULE }}
          SCORE: ${{ steps.stryker.outputs.score }}
          REPO: cplieger/${{ matrix.repo }}
        run: |
          set -euo pipefail
          # Colour bands match the Go mutation badge (gremlins-aggregate.py).
          int=${SCORE%.*}; : "${int:=0}"
          if [ "$int" -ge 85 ]; then color=brightgreen
          elif [ "$int" -ge 75 ]; then color=green
          elif [ "$int" -ge 50 ]; then color=yellow
          elif [ "$int" -ge 30 ]; then color=orange
          else color=red
          fi
          json=$(printf '{"schemaVersion":1,"label":"mutation (TS)","message":"%s%%","color":"%s"}' "$SCORE" "$color")
          bash actions/publish-badge/publish-badge.sh "$REPO" "$TOKEN" mutation-ts.json "$json"

      - name: Surface below-threshold score
        if: ${{ steps.stryker.outputs.rc != '' && steps.stryker.outputs.rc != '0' }}
        env:
          RC: ${{ steps.stryker.outputs.rc }}
          ENTRY: ${{ matrix.repo }}:${{ matrix.dir }}
        run: |
          echo "::error::${ENTRY}: mutation score fell below the config's thresholds.break (stryker exit ${RC})"
          exit 1

  # Update the per-repo tracker issue — the TS twin of weekly-gremlins.yaml's
  # aggregate job. Independent of the badge publish (which happens per matrix
  # entry in `run`), so a tracker failure never blocks the badge and vice
  # versa. Reads the staged report artifacts; a repo with no parseable report
  # this week is left untouched (its red matrix entry is the signal).
  aggregate:
    needs: [fanout, run]
    if: always() && needs.fanout.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CI_SCHEDULE }}
    steps:
      - name: Checkout ci (for scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      - name: Download all report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: stryker-*

      # stryker-aggregate.py is written against the release-current Python the
      # scripts are authored on, and uses PEP 758 (`except A, B:`) which needs
      # 3.14. ubuntu-24.04's own `python3` is 3.12, which rejects it at PARSE
      # time — so every repo failed with `SyntaxError: multiple exception types
      # must be parenthesized`, the job exited 1, and no repo ever received a
      # tracker issue. Pin the interpreter rather than downgrading the script
      # (same call weekly-bench.yaml makes for bench-reduce.py).
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Aggregate + update tracker issue per repo
        run: |
          # Delegate stats + body generation to scripts/stryker-aggregate.py.
          # It groups the staged reports by the repo named in each meta.json
          # (artifact-name parsing is ambiguous — repo names and dir slugs
          # both contain hyphens), aggregates multi-dir repos into one score,
          # rolls the 12-week history forward (preserving free-form notes),
          # renders the Survived/NoCoverage buckets, and writes regression +
          # entries markers. The issue reads and writes go through
          # scripts/tracker_issue.py. Explicit per-command error handling (NOT
          # `set -e` in a `( … ) || …` subshell, which bash neuters): each repo
          # is isolated, failures warn and set had_failure, and the job exits
          # red at the end if anything failed.
          set -uo pipefail
          # Repos come from the meta.json each artifact carries; the script owns
          # why that is not a glob, and goes red on the layout defect itself.
          REPOS=$(bash scripts/discover-artifact-repos.sh artifacts) || exit 1
          if [ -z "$REPOS" ]; then
            echo "no report artifacts this week — nothing to aggregate"
            exit 0
          fi
          WEEK_ENDING=$(date -u +'%Y-%m-%d %H:%M')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="Stryker mutation testing tracker"

          process_repo() {
            local repo="$1" R="cplieger/$1" ent flag=off

            python3 scripts/tracker_issue.py --repo "$R" --label stryker-tracker --title "$title" \
              --mode fetch --body-file "/tmp/existing-${repo}.md" || return 1

            python3 scripts/stryker-aggregate.py \
              --repo "$repo" --artifacts-dir artifacts --week "$WEEK_ENDING" --run-url "$RUN_URL" \
              --regression-marker-file "/tmp/regression-${repo}.txt" \
              --entries-marker-file "/tmp/entries-${repo}.txt" \
              --existing-body-file "/tmp/existing-${repo}.md" > "/tmp/body-${repo}.md" || return 1

            ent=$(cat "/tmp/entries-${repo}.txt" 2>/dev/null || echo 0)
            if [ "$ent" -eq 0 ]; then
              echo "  no parseable reports for ${repo} — leaving the tracker issue untouched"
              return 0
            fi

            if [ "$(cat "/tmp/regression-${repo}.txt" 2>/dev/null)" = "true" ]; then
              flag=on
            fi
            python3 scripts/tracker_issue.py --repo "$R" --label stryker-tracker --title "$title" \
              --mode upsert --body-file "/tmp/body-${repo}.md" \
              --flag-label mutation-regression --flag "$flag" || return 1
          }

          had_failure=0
          for repo in $REPOS; do
            echo "::group::$repo"
            if ! process_repo "$repo"; then
              echo "::warning::aggregate failed for ${repo} — continuing"
              had_failure=1
            fi
            echo "::endgroup::"
          done
          if [ "$had_failure" -ne 0 ]; then
            echo "::error::one or more tracker-issue updates failed"
            exit 1
          fi

  # `needs:` must list every other job in this workflow.
  notify:
    needs: [fanout, run, aggregate]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
