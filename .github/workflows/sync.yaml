name: Sync shared files

# Propagates the canonical configs and workflow templates here to consumer
# repos as auto-merging chore(sync) PRs (scripts/sync-files.py owns the
# branch names): repo-sync/ci/default for a main-default repo, and
# repo-sync/ci/dev plus repo-sync/ci/main for a dev-default one, which also
# receives the two-branch renovate.json.
#
# Requires a SYNC_PAT secret: a fine-grained PAT with Contents:write +
# Pull-requests:write on the target repos.

on:
  push:
    branches: [main]
    paths:
      - ".golangci.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - "configs/**"
      - "scripts/classify-repos.py"
      - "scripts/ghrest.py"
      - "scripts/release_channels.py"
      - "scripts/sync-files.py"
      - ".github/workflow-templates/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The sync engine force-pushes the same repo-sync/ci/* branches across
# every consumer repo. Two overlapping runs (e.g. two pushes to main within
# seconds of each other) would race on that branch and duplicate PRs partway
# through the repo list. Queue instead of running in parallel;
# cancel-in-progress is unsafe here since a cancelled mid-loop run leaves
# partial state, so let each run finish before the next starts.
concurrency:
  group: sync-shared-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-files.py reads older majors' synced files from their commits.
          fetch-depth: 0
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # Regenerate the repo↔file manifest fresh on every run, then hand it
      # straight to scripts/sync-files.py below via --manifest. The file is
      # gitignored and never committed: it's a build artifact, and a committed
      # copy only drifts against the live repo set (auto-discovered here over
      # REST). classify-repos.py is the source of truth.
      - name: Auto-classify repos
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: python3 scripts/classify-repos.py > .github/sync.yml
        timeout-minutes: 5

      # In-house engine: shallow-clones each target, copies the mapped files,
      # commits `chore(sync): …` on its repo-sync/ci/* branch, force-pushes,
      # and ensures an open labelled PR (closing stale empty ones). Failure
      # isolation per target; exits non-zero at the end if any target failed.
      - name: Sync files to consumer repos
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: python3 scripts/sync-files.py --manifest .github/sync.yml
        timeout-minutes: 15

      - name: Enable auto-merge on sync PRs
        # Sync PRs auto-merge once the consumer's required checks pass (at
        # once with none). always() plus a fresh REST sweep, rather than the
        # sync step's output, so a partial sync failure does not strand the
        # PRs it did open without auto-merge.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          # The branch delete `gh pr merge --delete-branch` makes: only this
          # repository's own head, and 422 means the merge already deleted it.
          delete_head() { # <repo> <pr> <head>
            local owner err
            if ! owner=$(gh api "repos/cplieger/$1/pulls/$2" --jq '.head.repo.full_name // ""'); then
              echo "  WARN: merged cplieger/$1#$2 but could not read its head to delete it"
              return 0
            fi
            [ "${owner}" = "cplieger/$1" ] || return 0
            if ! err=$(gh api -X DELETE "repos/cplieger/$1/git/refs/heads/$3" 2>&1 >/dev/null); then
              case "${err}" in
                *"(HTTP 422)"*) ;;
                *) echo "  WARN: merged cplieger/$1#$2 but could not delete $3: ${err}" ;;
              esac
            fi
          }
          prs=$(python3 scripts/sync-files.py --manifest .github/sync.yml --print-open-prs)
          refused=0
          # fd 3, so no command in the loop can consume the list from stdin.
          while read -r repo pr head base <&3; do
            [ -n "${repo}" ] || continue
            echo "Enabling auto-merge on cplieger/${repo}#${pr}"
            # A base target's pull request is armed or merged only after a fresh
            # read of its base and head: main's ruleset lets this owner credential
            # bypass ci / validate.
            if [ "${base}" = main ]; then
              python3 scripts/release_maintenance.py merge-checked "${repo}" "${pr}" --base main --head "${head}" || refused=1
              continue
            fi
            if [ "${base}" = dev ]; then
              python3 scripts/release_maintenance.py merge-checked "${repo}" "${pr}" --base dev --head "${head}" || \
                echo "  WARN: failed to merge cplieger/${repo}#${pr}"
              continue
            fi
            # gh pr merge needs --repo plus a bare PR number: it reads the
            # OWNER/REPO#NUMBER shorthand as a branch name. Fall back to a
            # direct squash-merge because GitHub refuses --auto on a PR that
            # is already in a clean, merge-ready state.
            gh pr merge --auto --squash --delete-branch --repo "cplieger/${repo}" "${pr}" && continue
            if gh api -X PUT "repos/cplieger/${repo}/pulls/${pr}/merge" -f merge_method=squash >/dev/null; then
              delete_head "${repo}" "${pr}" "${head}"
            else
              echo "  WARN: failed to merge cplieger/${repo}#${pr}"
            fi
          done 3<<< "${prs}"
          if [ "${refused}" != 0 ]; then
            echo "::error::a sync pull request into main was left open, as the lines above show"
            exit 1
          fi

  # `needs:` must list every other job in this workflow.
  notify:
    needs: sync
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
