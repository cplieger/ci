name: Sync shared files

# Propagates the canonical configs and workflow templates here to consumer
# repos as auto-merging chore(sync) PRs (scripts/sync-files.py owns the
# branch names): repo-sync/ci/default for a main-default repo, and
# repo-sync/ci/dev plus repo-sync/ci/main for a dev-default one, which also
# receives the two-branch renovate.json.
#
# Authenticates as the tribble-trouble GitHub App, installed on every repo of
# the account: secrets SYNC_APP_ID (the App ID) and SYNC_APP_PRIVATE_KEY. Its
# pushes and merges start the consumers' workflows, which GITHUB_TOKEN's do not.

on:
  push:
    branches: [main]
    paths:
      - ".golangci.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - "configs/**"
      - "scripts/classify-repos.py"
      - "scripts/fanout.py"
      - "scripts/ghrest.py"
      - "scripts/release_channels.py"
      - "scripts/release_maintenance.py"
      - "scripts/sync-files.py"
      - ".github/workflow-templates/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The sync engine force-pushes the same repo-sync/ci/* branches across
# every consumer repo. Two overlapping runs (e.g. two pushes to main within
# seconds of each other) would race on that branch and duplicate PRs partway
# through the repo list. Queue instead of running in parallel;
# cancel-in-progress is unsafe here since a cancelled mid-loop run leaves
# partial state, so let each run finish before the next starts.
concurrency:
  group: sync-shared-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes with checkout-persisted credentials;
          # do not leave the token in .git/config (zizmor: artipacked).
          persist-credentials: false

      # One token for the whole job: it lives an hour and the job is capped at
      # 15 minutes. If minting fails, classify and sync are skipped and the
      # always() sweep fails on the missing manifest, so the run goes red.
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id also takes the numeric App ID (the action's lib/main.js
          # hands it to @octokit/auth-app as appId); app-id is deprecated.
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: cplieger
          permission-checks: read
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
          permission-workflows: write

      # Regenerate the repo↔file manifest fresh on every run, then hand it
      # straight to scripts/sync-files.py below via --manifest. The file is
      # gitignored and never committed: it's a build artifact, and a committed
      # copy only drifts against the live repo set (auto-discovered here over
      # REST). classify-repos.py is the source of truth.
      - name: Auto-classify repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/classify-repos.py > .github/sync.yml
        timeout-minutes: 5

      # In-house engine: shallow-clones each target, copies the mapped files,
      # commits `chore(sync): …` on its repo-sync/ci/* branch, force-pushes,
      # and ensures an open labelled PR (closing stale empty ones). Targets run
      # concurrently with failure isolation per target; exits non-zero at the
      # end if any target failed.
      - name: Sync files to consumer repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/sync-files.py --manifest .github/sync.yml
        timeout-minutes: 15

      - name: Enable auto-merge on sync PRs
        # Sync PRs auto-merge once the consumer's required checks pass (at
        # once with none). always() plus a fresh REST sweep, rather than the
        # sync step's output, so a partial sync failure does not strand the
        # PRs it did open without auto-merge. Fails when a found two-branch
        # sync PR into main was left open, or when the repo list the fork skip
        # needs is unreadable; a failed PR lookup only warns.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/sync-files.py --manifest .github/sync.yml --arm-open-prs

  # `needs:` must list every other job in this workflow.
  notify:
    needs: sync
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
