# On-demand backfill: sign the SBOM asset on existing GitHub releases that
# predate the cosign-v3 signing fix, so every release carries a verifiable
# signature (.sigstore.json) next to sbom.spdx.json.
#
# This does NOT rebuild or touch any container image — it signs the
# already-published sbom.spdx.json bytes and uploads the .sigstore.json
# bundle beside it. Registry images already carry cosign manifest signatures
# and SBOM/provenance attestations from their original build.
#
# Keyless (Fulcio) signing uses this workflow's GitHub Actions OIDC identity.
# Cross-repo release-asset reads/uploads use the App token sync.yaml documents
# (Contents:write); GITHUB_TOKEN is scoped to this repo only.
name: Backfill release SBOM signatures

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated repo names (owner cplieger), or 'all' for the docker-image repos."
        required: false
        default: "all"
      limit:
        description: "Max releases per repo to scan (newest first)."
        required: false
        default: "10"
      dry_run:
        description: "Report what would be signed without uploading."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: backfill-sbom-sigs
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3
  # HISTORICAL snapshot: the docker-image repos that had already released via
  # docker-release.yaml when the backfill ran (2026-06). Deliberately frozen —
  # repos released after the sign-blob fix (e.g. github-scout, seadex-scout)
  # ship signed SBOMs from their first release and never need backfilling.
  FLEET: >-
    docker-age docker-caddy docker-keepalived docker-nut-upsd docker-radvd
    docker-smtp-relay docker-static-web docker-fclones-scheduler
    docker-rsync-scheduler docker-renovate-scheduler cert-converter
    plex-language-sync plex-exporter tautulli-remap registry-stats subflux
    marotte web-terminal-kiro pg-autodump

jobs:
  backfill:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Resolved before the mint, which scopes its token to exactly these. An
      # empty list would mint for every repo of the account, so it fails here.
      - name: Resolve the repositories
        id: targets
        env:
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          set -euf -o pipefail
          if [ "${INPUT_REPOS}" = "all" ]; then
            names="${FLEET}"
          else
            names="$(printf '%s' "${INPUT_REPOS}" | tr ',' ' ')"
          fi
          repos=""
          for repo in ${names}; do
            case "${repo}" in
              *[!A-Za-z0-9._-]* | . | ..) printf "::error::not a repository name: '%s'\n" "${repo}"; exit 1 ;;
            esac
            repos="${repos:+${repos},}${repo}"
          done
          if [ -z "${repos}" ]; then
            echo "::error::no repository to backfill"
            exit 1
          fi
          echo "repos=${repos}" >> "${GITHUB_OUTPUT}"

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: cplieger
          repositories: ${{ steps.targets.outputs.repos }}
          permission-contents: write
          permission-metadata: read

      - name: Sign and upload missing SBOM signatures
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOS: ${{ steps.targets.outputs.repos }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "${INPUT_LIMIT}" in
            '' | *[!0-9]* | 0) echo "::error::limit must be a positive integer, got '${INPUT_LIMIT}'"; exit 1 ;;
          esac
          # Over REST, newest first: the App installation's GraphQL quota is shared
          # with Renovate, which runs as the same App. A listing carries each
          # release's assets, so one read per page.
          per_page=$(( INPUT_LIMIT < 100 ? INPUT_LIMIT : 100 ))
          paginate=()
          [ "${INPUT_LIMIT}" -le 100 ] || paginate=(--paginate)
          work="$(mktemp -d)"
          signed=0
          skipped=0
          for repo in ${REPOS//,/ }; do
            echo "::group::cplieger/${repo}"
            listing="$(gh api "${paginate[@]}" "repos/cplieger/${repo}/releases?per_page=${per_page}" \
              --jq '.[] | {tag: .tag_name, immutable: (.immutable == true), assets: [.assets[] | {id, name}]} | @json' 2>/dev/null \
              | head -n "${INPUT_LIMIT}" || true)"
            if [ -z "${listing}" ]; then
              echo "no releases found"
              echo "::endgroup::"
              continue
            fi
            # fd 3, so no command in the loop can consume the list from stdin.
            while read -r release <&3; do
              tag="$(jq -r .tag <<< "${release}")"
              assets="$(jq -r '.assets[].name' <<< "${release}")"
              case "${assets}" in
                *sbom.spdx.json*) : ;;
                *)
                  echo "${tag}: no sbom.spdx.json asset, skip"
                  skipped=$((skipped + 1))
                  continue
                  ;;
              esac
              if printf '%s\n' "${assets}" | grep -qE '\.(sig|pem|sigstore\.json)$'; then
                echo "${tag}: already has a signature asset, skip"
                skipped=$((skipped + 1))
                continue
              fi
              if [ "$(jq -r .immutable <<< "${release}")" = "true" ]; then
                echo "${tag}: immutable release, assets cannot be added"
                skipped=$((skipped + 1))
                continue
              fi
              d="${work}/${repo}/${tag}"
              mkdir -p "${d}"
              id="$(jq -r '.assets[] | select(.name == "sbom.spdx.json") | .id' <<< "${release}")"
              gh api -H 'Accept: application/octet-stream' \
                "repos/cplieger/${repo}/releases/assets/${id}" > "${d}/sbom.spdx.json"
              if [ "${INPUT_DRY_RUN}" = "true" ]; then
                echo "${tag}: WOULD sign + upload sbom.spdx.json.sigstore.json"
                signed=$((signed + 1))
                continue
              fi
              cosign sign-blob --yes "${d}/sbom.spdx.json" \
                --bundle "${d}/sbom.spdx.json.sigstore.json"
              gh release upload "${tag}" -R "cplieger/${repo}" \
                "${d}/sbom.spdx.json.sigstore.json"
              echo "${tag}: signed + uploaded sbom.spdx.json.sigstore.json"
              signed=$((signed + 1))
            done 3<<< "${listing}"
            echo "::endgroup::"
          done
          echo "Done. signed=${signed} skipped=${skipped} dry_run=${INPUT_DRY_RUN}"

  # `needs:` must list every other job in this workflow. Dispatch-only, so a
  # failure files only when the run was long enough to be unwatched.
  notify:
    needs: backfill
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yaml
    with:
      workflow: ${{ github.workflow }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
